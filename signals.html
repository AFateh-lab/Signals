/* =========================================================================
   MODULES  —  and, more importantly, measuring which of them are worth having.

   The temptation with a list of sixty-five modules is to build all of them and
   assume the pile is better than the parts. It usually is not. Most context
   filters sound obviously right and do nothing measurable; a few do a lot; and
   one or two make results worse while feeling clever. The only way to tell
   them apart is to record what each module said at the moment a signal fired,
   wait for that signal to resolve, and compare.

   So every module here answers one question with a number between 0 and 1 —
   how much this module likes the trade — and nothing is weighted by opinion.
   The weights come from measured lift: the difference in average R between
   the trades a module liked and the trades it did not. A module with no
   measurable lift ends up with no influence, whatever its reputation.

   Modules that need data this app cannot get from a static page — order-book
   depth, trade flow, liquidations — are declared here with `needs` set, so
   they are visible as unbuilt rather than silently missing. Pretending a
   module exists is worse than not having it.
   ========================================================================= */

const MODULES = [
  // ---- market context -----------------------------------------------------
  { id: "regime", group: "Context", label: "Market regime",
    why: "Trend rules pay in trends and bleed in ranges. This scores how well "
       + "the coin's current state fits the kind of strategy that fired.",
    fn: (c) => {
      const trending = Math.min(1, Math.max(0, (c.adx - 12) / 20));
      const fam = STRAT_FAMILY[c.strat] || "trend";
      return fam === "revert" ? 1 - trending : trending;
    } },

  { id: "htf", group: "Context", label: "Higher timeframe agrees",
    why: "The slower chart's trend pointing the same way as the trade.",
    fn: (c) => c.htfSide == null ? null : (c.htfSide === c.side ? 1 : 0) },

  { id: "btc", group: "Context", label: "BTC context",
    why: "An altcoin long while Bitcoin is falling hard is a bet against the "
       + "tide. Scores the trade's direction against BTC's own trend.",
    fn: (c) => {
      if (c.btcTrend == null) return null;
      if (c.sym === "BTCUSDT") return null;
      const with_ = (c.side === "LONG") === (c.btcTrend > 0);
      return with_ ? 1 : Math.max(0, 1 - Math.abs(c.btcTrend) / 3);
    } },

  { id: "rs", group: "Context", label: "Relative strength vs BTC",
    why: "Coins outperforming Bitcoin over the last day, for longs; "
       + "underperforming, for shorts.",
    fn: (c) => {
      if (c.change == null || c.btcChange == null) return null;
      const rel = c.change - c.btcChange;
      const good = c.side === "LONG" ? rel : -rel;
      return Math.min(1, Math.max(0, (good + 3) / 8));
    } },

  // ---- confirmation -------------------------------------------------------
  { id: "volume", group: "Confirmation", label: "Volume confirmation",
    why: "A move on thin volume is a move nobody agreed with.",
    fn: (c) => c.volRatio == null ? null
             : Math.min(1, Math.max(0, (c.volRatio - 0.6) / 1.4)) },

  { id: "agree", group: "Confirmation", label: "Independent agreement",
    why: "How many of the four independent direction reads back this side.",
    fn: (c) => c.agree == null ? null : c.agree / (c.agreeOf || 4) },

  { id: "vola", group: "Confirmation", label: "Volatility quality",
    why: "Too quiet and the targets are unreachable; too wild and the stop is "
       + "hit by noise. Scores how close ATR is to the useful middle.",
    fn: (c) => {
      if (c.atrPct == null) return null;
      const x = c.atrPct;
      return x < 0.4 ? x / 0.4 : x > 6 ? Math.max(0, 1 - (x - 6) / 6) : 1;
    } },

  { id: "squeeze", group: "Confirmation", label: "Volatility expansion",
    why: "A range that has been compressing and is now opening up. Breakouts "
       + "out of compression behave differently from breakouts out of chaos.",
    fn: (c) => c.bbExpand == null ? null
             : Math.min(1, Math.max(0, c.bbExpand)) },

  // ---- execution ----------------------------------------------------------
  { id: "liquid", group: "Execution", label: "Liquidity",
    why: "A coin nobody trades can show a perfect setup you cannot get filled "
       + "on at anything like the price on the card.",
    fn: (c) => c.vol24 == null ? null
             : Math.min(1, Math.log10(Math.max(1, c.vol24) / 1e6) / 2.5) },

  { id: "risk", group: "Execution", label: "Stop distance sanity",
    why: "A stop so tight the coin's normal noise takes it out, or so wide "
       + "the leverage collapses to nothing.",
    fn: (c) => {
      if (c.stopAtr == null) return null;
      const x = c.stopAtr;
      return x < 0.5 ? x / 0.5 : x > 4 ? Math.max(0, 1 - (x - 4) / 4) : 1;
    } },

  { id: "cost", group: "Execution", label: "Cost vs target",
    why: "Fees and slippage as a share of the first target. A signal whose "
       + "round trip eats a third of TP1 is not really a signal.",
    fn: (c) => {
      if (c.tp1Pct == null || !(c.tp1Pct > 0)) return null;
      const share = tradeCostPct(c.leverage) / c.tp1Pct;
      return Math.max(0, 1 - share * 2.5);
    } },

  // ---- evidence -----------------------------------------------------------
  { id: "record", group: "Evidence", label: "Record on this coin",
    why: "How often this strategy has reached its first target on this coin.",
    fn: (c) => c.recRate == null ? null : Math.min(1, c.recRate / 70) },

  { id: "fresh", group: "Evidence", label: "Freshness",
    why: "How far into its life the setup already is. An entry price from "
       + "forty candles ago is not an entry price.",
    fn: (c) => c.ageBars == null ? null
             : Math.max(0, 1 - c.ageBars / Math.max(1, CFG.maxAgeBars || 24)) },

  { id: "cell", group: "Evidence", label: "Matrix cell score",
    why: "What the 100-bot matrix scored this exact strategy-and-period "
       + "combination on this exact coin, on held-back history.",
    fn: (c) => c.cellScore == null ? null : Math.min(1, c.cellScore / 50) },

  // ---- smart money --------------------------------------------------------
  { id: "whale", group: "Smart money", label: "Large-trader footprint",
    bots: 16,
    why: "Unusually large executions, which side was the aggressor, book "
       + "depth, and open interest against price — sixteen independent checks "
       + "across five readings. Scores whether the footprint of size points "
       + "the same way as the trade.",
    fn: (c) => {
      if (!c.whale || c.whale.score == null) return null;
      if (!c.whale.side) return 0.5;                 // present but undecided
      return c.whale.side === c.side
        ? 0.5 + c.whale.score / 200 : 0.5 - c.whale.score / 200;
    } },

  { id: "crowd", group: "Smart money", label: "Crowding (funding & positioning)",
    bots: 6,
    why: "Funding and the long/short ratio. Read as a fade, not a follow: "
       + "heavy positive funding means longs are paying to stay long, which "
       + "is a reason for caution on a long, not enthusiasm.",
    fn: (c) => {
      if (!c.crowdSide) return null;
      return c.crowdSide === c.side ? 0.85 : 0.15;
    } },

  // ---- declared but not built --------------------------------------------
  { id: "flow", group: "Not built", label: "Trade flow / CVD",
    needs: "the aggregate-trade stream — a websocket per coin.",
    why: "Whether aggressive buyers or sellers are in control." },
  { id: "liq", group: "Not built", label: "Liquidations",
    needs: "the forceOrder websocket.",
    why: "Liquidation clusters and squeezes." },
  { id: "news", group: "Not built", label: "Event risk",
    needs: "a news feed with an API key — a static page cannot hold one.",
    why: "Suppress signals around scheduled high-impact events." },
];

const STRAT_FAMILY = {
  confluence: "trend", occ: "trend", ut: "trend", tt: "trend",
  brk: "breakout", mom: "momentum", pat: "breakout",
  sr: "revert", mr: "revert", rsi: "revert",
};

const LIVE_MODULES = MODULES.filter((m) => !m.needs);

/* Build the context one signal is judged in. Everything here comes from data
   already loaded for the scan — no module is allowed to cost an extra request
   without being declared as such. */
/** A whale reading, but only if it is recent enough to mean anything. */
function whaleFresh(sym) {
  const w = WHALE.by.get(sym);
  if (!w) return null;
  return (Date.now() - w.at) <= CFG.whaleTtlMin * 60000 ? w : null;
}

function moduleCtx(sym, d, i, sig, h) {
  const vol = d.vol[i], vma = d.volMa[i];
  const n = 20;
  let bb = null;
  if (i > n * 2) {
    const w = (from) => {
      let m = 0; for (let k = from - n; k < from; k++) m += d.close[k];
      m /= n;
      let v = 0; for (let k = from - n; k < from; k++) v += (d.close[k] - m) ** 2;
      return Math.sqrt(v / n) / m;
    };
    const now = w(i), was = w(i - n);
    bb = was > 0 ? (now / was - 0.8) / 1.2 : null;
  }
  const btc = TICK["BTCUSDT"];
  const tk = TICK[sym];
  const cell = MATRIX.cell.get(mkey(sym, sig.strat, sig.stf + ">" + CFG.trendTf));
  return {
    sym, side: sig.side, strat: sig.strat, leverage: sig.leverage,
    adx: d.adx[i], atrPct: d.atrPct[i],
    volRatio: vma > 0 ? vol / vma : null,
    bbExpand: bb,
    htfSide: h ? htfBias(h, d.c[i].t) : null,
    agree: sig.agree, agreeOf: sig.agreeOf,
    change: tk ? tk.change : null,
    btcChange: btc ? btc.change : null,
    btcTrend: btc ? btc.change : null,
    vol24: tk ? tk.vol : null,
    stopAtr: d.atr[i] > 0
      ? Math.abs(sig.entry - (sig.initialStop != null ? sig.initialStop : sig.stop))
        / d.atr[i] : null,
    tp1Pct: sig.targets && sig.targets[0]
      ? Math.abs(sig.targets[0].price - sig.entry) / sig.entry * 100 * sig.leverage
      : null,
    recRate: sig.rec && sig.rec.n >= 4 ? sig.rec.rate : null,
    ageBars: Math.max(0, (d.c.length - 2) - i),
    cellScore: cell && !cell.why ? cell.score : null,
    whale: whaleFresh(sym),
    crowdSide: (() => {
      const w = whaleFresh(sym);
      if (!w) return null;
      const f = w.funding && w.funding.side, c2 = w.crowd && w.crowd.side;
      // Only when funding and positioning point the same way. One of them
      // alone is a weak read, and averaging two disagreeing reads into
      // "neutral" would hide that they disagreed.
      return f && c2 && f === c2 ? f : null;
    })(),
  };
}

/** Run every live module over one signal and stick the readings on it. */
function moduleRead(sym, d, i, sig, h) {
  let ctx;
  try { ctx = moduleCtx(sym, d, i, sig, h); } catch (e) { return; }
  const out = {};
  for (const m of LIVE_MODULES) {
    if (CFG.modOff && CFG.modOff.includes(m.id)) continue;
    let v = null;
    try { v = m.fn(ctx); } catch (e) { v = null; }
    if (v != null && isFinite(v)) out[m.id] = +Math.min(1, Math.max(0, v)).toFixed(3);
  }
  sig.mods = out;
  const base = confidenceOf(out);
  // Contradiction costs confidence. Two modules being confidently opposite is
  // strictly worse information than both being unsure, and averaging them
  // into a calm middle number would say the opposite.
  const coh = coherenceOf({ mods: out });
  sig.clash = coh.clashes;
  sig.split = coh.split;
  sig.confidence = base == null ? null
    : Math.max(0, Math.round(base * (1 - coh.penalty)));
  sig.confRaw = base;
}

/* ------------------------------------------------------------------ lift
   The measurement. For every resolved signal, each module's reading is put in
   one of two buckets — it liked the trade, or it did not — and the average R
   of each bucket is compared. The gap is the module's lift.

   Shrunk by sample size for the same reason the matrix score is: with fifteen
   modules and a few dozen trades, something will look brilliant by accident. */
const MODSTAT = { by: {}, n: 0 };
const MODKEY = "signals.modules.v1";

function modLearn(list) {
  for (const s of list) {
    if (!s.closedAt || !s.mods || s._learned) continue;
    const r = rOf(s);
    if (r == null) continue;
    s._learned = true;
    MODSTAT.n++;
    for (const id in s.mods) {
      const b = MODSTAT.by[id] || (MODSTAT.by[id] = { hi: 0, hiR: 0, lo: 0, loR: 0 });
      if (s.mods[id] >= 0.5) { b.hi++; b.hiR += r; } else { b.lo++; b.loR += r; }
    }
  }
  saveModules();
}

function modLift() {
  const rows = [];
  for (const m of LIVE_MODULES) {
    const b = MODSTAT.by[m.id];
    if (!b || (!b.hi && !b.lo)) {
      rows.push({ m, n: 0, lift: 0, shrunk: 0, hi: 0, lo: 0, verdict: "no data yet" });
      continue;
    }
    const hiR = b.hi ? b.hiR / b.hi : 0, loR = b.lo ? b.loR / b.lo : 0;
    const n = Math.min(b.hi, b.lo);
    const lift = (b.hi && b.lo) ? hiR - loR : 0;
    // With only one bucket filled there is nothing to compare, so the module
    // is not credited — a filter that has never said no has proved nothing.
    const shrunk = lift * (n / (n + 12));
    rows.push({
      m, n: b.hi + b.lo, hi: b.hi, lo: b.lo, hiR: +hiR.toFixed(2),
      loR: +loR.toFixed(2), lift: +lift.toFixed(2), shrunk: +shrunk.toFixed(3),
      verdict: !b.hi || !b.lo ? "never disagreed — nothing to compare"
             : n < 8 ? "too few to judge"
             : shrunk > 0.12 ? "helping"
             : shrunk < -0.12 ? "hurting — worth turning off"
             : "no measurable difference",
    });
  }
  rows.sort((a, b) => b.shrunk - a.shrunk);
  return rows;
}

/* The weights are measured, not chosen. Until there is enough evidence every
   module counts the same, which is the honest prior: we do not yet know. */
function modWeights() {
  const w = {}, rows = modLift();
  let any = 0;
  for (const r of rows) if (r.shrunk > 0) any += r.shrunk;
  for (const r of rows) {
    w[r.m.id] = any > 0.05 ? Math.max(0, r.shrunk) / any : 1 / rows.length;
  }
  return w;
}

/** One number, 0–100, and it can say what it is made of. */
function confidenceOf(mods) {
  const w = modWeights();
  let sum = 0, tot = 0;
  for (const id in mods) {
    const ww = w[id] || 0;
    sum += ww * mods[id]; tot += ww;
  }
  return tot > 0 ? Math.round(sum / tot * 100) : null;
}

/** Why a signal scored what it scored, biggest contributors first. */
function confidenceWhy(sig, top) {
  if (!sig.mods) return [];
  const w = modWeights();
  return Object.keys(sig.mods)
    .map((id) => ({ id, v: sig.mods[id], w: w[id] || 0,
                    label: (LIVE_MODULES.find((m) => m.id === id) || {}).label || id }))
    .sort((a, b) => (b.w * b.v) - (a.w * a.v))
    .slice(0, top || 5);
}

function saveModules() {
  try { localStorage.setItem(MODKEY, JSON.stringify(MODSTAT)); } catch (e) {}
}
function loadModules() {
  try {
    const o = JSON.parse(localStorage.getItem(MODKEY) || "null");
    if (o && o.by) { MODSTAT.by = o.by; MODSTAT.n = o.n || 0; }
  } catch (e) {}
}

/* =========================================================================
   BOT FACTORY, TOURNAMENT AND EVOLUTION

   The matrix answers "which strategy on which period on which coin". This
   answers the harder one: where do the candidates come from, and who gets
   retired.

   A generation works like this. Every champion spawns mutations — the same
   strategy with one or two settings nudged. Every mutation is scored on
   held-back history exactly as the matrix scores a cell. Mutations that beat
   their parent by a clear margin take its place; the rest are discarded. A
   champion whose live results have decayed is retired whether or not anything
   beat it, because "still the best of a bad set" is not a reason to keep
   trading something.

   Two rules keep this from being a random-number generator with good PR:

   * A mutation must beat its parent by a margin, not by a nose. Without that,
     champions churn constantly on noise and nothing ever accumulates a record
     long enough to judge.

   * Diversity is enforced at selection. Twenty bots that are technically
     different but fire on the same bar are one bot wearing twenty hats, and
     an ensemble built from them will feel confident and be wrong together.
   ========================================================================= */

const EVO = {
  gen: 0, running: false, cancel: false, step: "",
  pool: [],            // candidates this generation
  champs: [],          // what is live
  retired: [],
  log: [],
  at: 0,
};

const EVOKEY = "signals.evo.v1";

/** One nudge to one setting, drawn from that strategy's own search space. */
function mutateCfg(cfg, n) {
  const space = optSpace(cfg.strategy);
  const keys = Object.keys(space).filter((k) => k !== "tfPair" && k in cfg);
  const next = { ...cfg };
  const picks = Math.max(1, n || 1);
  for (let i = 0; i < picks; i++) {
    if (!keys.length) break;
    // Walk the key list, one step per generation, so successive mutations
    // explore different settings. This was `(gen * 7 + i * 3 + len) % len`,
    // which for a seven-key strategy is zero every single time — six
    // generations all nudged the same setting and the factory was searching
    // one dimension of a seven-dimensional space.
    const k = keys[(EVO.gen + i) % keys.length];
    const opts = space[k];
    const cur = opts.indexOf(cfg[k]);
    // A neighbouring value, not a random one. A parameter that works at 20
    // and also at 21 is a real setting; one that works only at 20 is a fluke,
    // and stepping one notch at a time is how you tell them apart.
    const step = (EVO.gen % 2 ? 1 : -1) * (1 + (i % 2));
    const idx = cur < 0 ? Math.floor(opts.length / 2)
              : Math.min(opts.length - 1, Math.max(0, cur + step));
    next[k] = opts[idx];
  }
  return next;
}

/** Score one candidate config on one coin's held-back history. */
function evoScore(sym, d, h, ltf, cfg) {
  const keep = snapshotSetup();
  try {
    for (const k in cfg) if (k in CFG) CFG[k] = cfg[k];
    const hold = Math.floor(d.c.length * 0.5);
    let sigs = [];
    try { sigs = autoSignals(sym, d, h, ltf); } catch (e) { return null; }
    return matrixScore(sigs, hold, Date.now());
  } finally {
    for (const k in keep) CFG[k] = keep[k];
  }
}

/* Two configs are "the same bot" if they fire together. Comparing settings
   would call 20 and 21 different; comparing the bars they fire on tells the
   truth. */
function evoOverlap(a, b) {
  if (!a || !b || !a.bars || !b.bars) return 0;
  const A = new Set(a.bars);
  let hit = 0;
  for (const x of b.bars) if (A.has(x)) hit++;
  return hit / Math.max(1, Math.min(A.size, b.bars.length));
}

/** One generation over one coin: mutate the champions, score, replace. */
async function evoGeneration(sym) {
  const [ltfRows, htfRows] = await Promise.all([
    btKlines(sym, CFG.signalTf, CFG.matrixBars),
    btKlines(sym, CFG.trendTf, Math.min(1000, CFG.matrixBars)),
  ]);
  const d = enrich(ltfRows), h = enrich(htfRows);

  // Seed the champion list on the first run from the best matrix cells.
  if (!EVO.champs.length) {
    const seed = matrixRanked(null).slice(0, CFG.evoChamps);
    EVO.champs = seed.map((c) => ({
      id: "c" + (++EVO.gen) + "-" + c.strat + "-" + c.tf,
      strat: c.strat, tf: c.tf, cfg: null, score: c.score, n: c.n,
      born: Date.now(), wins: 0, sym: c.sym,
    }));
    // Nothing in the matrix yet: start from the lineup so evolution has
    // somewhere to begin rather than sitting idle.
    if (!EVO.champs.length) {
      EVO.champs = BOT_LINEUP.slice(0, CFG.evoChamps).map((l, i) => ({
        id: "c0-" + i + "-" + l.cfg.strategy,
        strat: l.cfg.strategy, tf: l.cfg.signalTf + ">" + l.cfg.trendTf,
        cfg: { ...snapshotSetup(), ...l.cfg }, score: 0, n: 0,
        born: Date.now(), wins: 0, sym,
      }));
    }
  }

  EVO.gen++;
  let replaced = 0, tested = 0;
  for (const champ of EVO.champs) {
    if (EVO.cancel) break;
    const base = champ.cfg || { ...snapshotSetup(), strategy: champ.strat,
      signalTf: champ.tf.split(">")[0], trendTf: champ.tf.split(">")[1] };
    // Re-score the parent on this coin, so parent and child are judged on
    // exactly the same candles. Comparing a child here against a parent's
    // score from a different coin would be meaningless.
    const parent = evoScore(sym, d, h, ltfRows, base);
    let best = null, bestCfg = null;
    for (let k = 0; k < CFG.evoMutations; k++) {
      if (EVO.cancel) break;
      const cand = mutateCfg(base, 1 + (k % 2));
      const m = evoScore(sym, d, h, ltfRows, cand);
      tested++;
      if (m && !matrixReject(m) && (!best || m.score > best.score)) {
        best = m; bestCfg = cand;
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    EVO.step = champ.strat + " · gen " + EVO.gen + " · " + tested + " tested";
    render();

    const pScore = parent && !matrixReject(parent) ? parent.score : 0;
    // The margin. A child that is 3% better is noise wearing a rosette.
    if (best && best.score > pScore * CFG.evoMargin && best.score > 0) {
      EVO.log.unshift({ at: Date.now(), text: champ.strat + " on "
        + sym.replace("USDT", "") + " improved "
        + Math.round(pScore) + " → " + Math.round(best.score) });
      champ.cfg = bestCfg; champ.score = best.score; champ.n = best.n;
      champ.wins++; champ.evolved = Date.now();
      replaced++;
    } else if (parent) {
      champ.score = pScore; champ.n = parent.n;
    }
  }

  // Retirement. A champion that has stopped clearing the wall, or whose live
  // record has gone negative over enough trades, is dropped — being the least
  // bad of a bad set is not a reason to keep trading it.
  const before = EVO.champs.length;
  // Retiring on one bad generation wiped the entire roster on the first run —
  // a coin whose held-back window happens to suit nothing left the factory
  // with no champions at all and nothing to mutate from. A champion has to
  // fail repeatedly, and the best of them are kept regardless so evolution
  // always has parents.
  const keepBest = new Set(EVO.champs.slice()
    .sort((a, b) => b.score - a.score)
    .slice(0, Math.max(2, Math.ceil(CFG.evoChamps / 3))).map((c) => c.id));
  EVO.champs = EVO.champs.filter((c) => {
    const live = botStats(c.id);
    const deadLive = live.n >= CFG.evoRetireAfter && live.exp < 0;
    c.fails = c.score <= 0 ? (c.fails || 0) + 1 : 0;
    const deadTest = c.fails >= CFG.evoPatience;
    if (!deadLive && !deadTest) return true;
    if (keepBest.has(c.id) && !deadLive) return true;
    EVO.retired.unshift({ ...c, why: deadLive ? "live record went negative"
      : "failed " + c.fails + " generations running", at: Date.now() });
    return false;
  });
  EVO.retired = EVO.retired.slice(0, 20);
  if (EVO.champs.length < before) {
    EVO.log.unshift({ at: Date.now(),
      text: (before - EVO.champs.length) + " retired" });
  }
  EVO.champs.sort((a, b) => b.score - a.score);
  EVO.log = EVO.log.slice(0, 12);
  return { tested, replaced };
}

async function evoRun(sym) {
  if (EVO.running || BUSY || BEST.running || MATRIX.running) return;
  EVO.running = true; EVO.cancel = false;
  const coin = sym || (UNIVERSE.length ? UNIVERSE[0] : CFG.focus[0]);
  try {
    await evoGeneration(coin);
    EVO.at = Date.now();
  } catch (e) {
    EVO.log.unshift({ at: Date.now(), text: "failed: " + (e.message || e) });
  } finally {
    EVO.running = false; EVO.step = "";
    saveEvo(); render(true);
  }
}

function saveEvo() {
  try {
    localStorage.setItem(EVOKEY, JSON.stringify({
      gen: EVO.gen, champs: EVO.champs, retired: EVO.retired,
      log: EVO.log, at: EVO.at }));
  } catch (e) {}
}
function loadEvo() {
  try {
    const o = JSON.parse(localStorage.getItem(EVOKEY) || "null");
    if (!o) return;
    EVO.gen = o.gen || 0; EVO.champs = o.champs || []; EVO.retired = o.retired || [];
    EVO.log = o.log || []; EVO.at = o.at || 0;
  } catch (e) {}
}

/* =========================================================================
   SIGNAL LIFECYCLE

   A signal is not a moment, it is a life. Treating it as a single event is
   why the old list could show something that had already run 4% past its
   entry as though you could still take it.

     watching   — the conditions are forming, nothing has fired
     candidate  — it fired, but has not cleared the filters
     confirmed  — cleared everything; this is a signal
     entry      — price is still inside the entry zone; actionable now
     active     — you would be in it; price has moved on but it is alive
     tp         — at least one target hit
     closed     — stopped, or all targets hit
     invalid    — the setup broke before it could be taken
   ========================================================================= */

const LIFE = ["watching", "candidate", "confirmed", "entry", "active",
              "tp", "closed", "invalid"];
const LIFE_LABEL = {
  watching: "Watching", candidate: "Candidate", confirmed: "Confirmed",
  entry: "Entry zone", active: "Running", tp: "In profit",
  closed: "Closed", invalid: "Invalidated",
};

/** Where in its life is this signal, right now? */
function lifeOf(s) {
  if (!s) return "watching";
  if (s.closedAt) return s.status === "stopped" ? "closed"
                        : s.hits ? "tp" : "closed";
  if (s.hits) return "tp";
  if (s.belowBar) return "candidate";
  const px = s.price != null ? s.price : s.entry;
  const risk = Math.abs(s.entry - (s.initialStop != null ? s.initialStop : s.stop));
  if (!(risk > 0)) return "confirmed";
  const drift = Math.abs(px - s.entry) / risk;
  // Past the stop without ever being takeable: the setup broke.
  const wrongWay = (s.side === "LONG" ? px < s.entry : px > s.entry);
  if (wrongWay && drift >= 1) return "invalid";
  // Still within a third of the risk of the entry — you can take this now at
  // something close to the price on the card.
  if (drift <= CFG.entryZoneR) return "entry";
  return "active";
}

/* The radar: coins where the conditions are forming but nothing has fired.
   Built from the near-misses the scan already collects, so it costs nothing
   extra — and it is honest about what it is, which is not a signal. */
function radarRows() {
  const rows = [];
  for (const w of WATCH) {
    rows.push({ symbol: w.symbol, side: w.side,
                gap: Number.isFinite(w.gap) ? w.gap : null,
                pts: w.pts != null ? w.pts : null });
  }
  for (const s of SPARE) {
    if (s.closedAt) continue;
    if (rows.some((r) => r.symbol === s.symbol)) continue;
    rows.push({ symbol: s.symbol, side: s.side, why: s.belowBar,
                conf: s.confidence, gap: null });
  }
  return rows.slice(0, 14);
}

/* =========================================================================
   ENSEMBLE BRAIN

   "Three bots agree" counts heads. This weighs them: a bot with a positive
   live record counts for more than one that has been wrong all week, and a
   bot with no record at all counts for very little rather than for one.

   The weight is shrunk by sample size for the same reason everything else
   here is — a bot that is 3-for-3 has told you almost nothing.
   ========================================================================= */

function botWeight(id) {
  const st = botStats(id);
  // No record is not the same as a bad record. An unproven bot sits at the
  // prior; a bot measured as losing has to be allowed to fall below it, or
  // "one good bot plus one unproven" and "one good bot plus one known loser"
  // come out identical — which is the opposite of what the ensemble is for.
  const PRIOR = 0.15;
  if (!st.n) return PRIOR;
  const conf = st.n / (st.n + 15);
  const edge = Math.max(0, Math.min(1, (st.exp + 0.5) / 1.5));
  const floor = PRIOR * (1 - conf);            // the more we know, the less benefit
  return +(floor + conf * edge * 0.85).toFixed(3);
}

/** Weighted agreement across the bots that found the same trade. */
function ensembleOf(sig) {
  const names = sig.by && sig.by.length ? sig.by : [sig.setupName].filter(Boolean);
  if (!names.length) return null;
  const ids = BOTS.filter((b) => names.includes(b.name)).map((b) => b.id);
  if (!ids.length) return { n: names.length, weight: 0.15 * names.length,
                            share: 0.15, names };
  let w = 0;
  for (const id of ids) w += botWeight(id);
  const all = enabledBots().reduce((a, b) => a + botWeight(b.id), 0);
  return { n: ids.length, weight: +w.toFixed(2),
           share: all > 0 ? +(w / all).toFixed(2) : 0, names };
}

/* =========================================================================
   RISK GATE  —  the part that says no.

   Every rule here exists because of a specific way a signal list turns into
   a bad month: five correlated altcoin longs that are really one leveraged
   BTC bet; a losing day answered by trading more; a drawdown answered by
   trading bigger.
   ========================================================================= */

function riskState() {
  const dayAgo = Date.now() - 86400000;
  const today = CLOSED.filter((s) => s.closedAt >= dayAgo);
  let dayR = 0;
  for (const s of today) { const r = rOf(s); if (r != null) dayR += r; }
  const all = CLOSED.slice().sort((a, b) => a.closedAt - b.closedAt);
  let eq = 0, peak = 0, dd = 0;
  for (const s of all) {
    const r = rOf(s); if (r == null) continue;
    eq += r; peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq);
  }
  return { dayR: +dayR.toFixed(2), dayTrades: today.length,
           ddR: +dd.toFixed(2), openLongs: OPEN.filter((s) => s.side === "LONG").length,
           openShorts: OPEN.filter((s) => s.side === "SHORT").length };
}

/** Why this trade is not allowed, or "" if it is. */
function riskBlock(sig, state, taken) {
  const st = state || riskState();
  if (CFG.dayLossR && st.dayR <= -CFG.dayLossR) {
    return "daily loss limit reached (" + st.dayR + "R today)";
  }
  if (CFG.ddStopR && st.ddR >= CFG.ddStopR) {
    return "drawdown guard (" + st.ddR + "R off the peak)";
  }
  const same = (taken || []).filter((t) => t.side === sig.side).length;
  if (CFG.maxSameSide && same >= CFG.maxSameSide) {
    return CFG.maxSameSide + " " + sig.side.toLowerCase() + "s already — that is "
         + "one market bet, not " + (same + 1) + " trades";
  }
  return "";
}

/* The message, in the shape a channel posts it. Everything on it is a number
   the app can defend. */
function telegramCard(s) {
  const coin = s.symbol.replace("USDT", "");
  const dot = s.side === "LONG" ? "\u{1F7E2}" : "\u{1F534}";
  const ens = ensembleOf(s);
  const risk = Math.abs(s.entry - (s.initialStop != null ? s.initialStop : s.stop));
  const rr = risk > 0 && s.targets && s.targets.length
    ? (Math.abs(s.targets[s.targets.length - 1].price - s.entry) / risk).toFixed(1)
    : "—";
  const zone = risk > 0
    ? [round(s.entry - (s.side === "LONG" ? risk * CFG.entryZoneR : 0), s.entry),
       round(s.entry + (s.side === "LONG" ? 0 : risk * CFG.entryZoneR), s.entry)]
    : [s.entry, s.entry];
  const why = confidenceWhy(s, 6)
    .filter((x) => x.v >= 0.5)
    .map((x) => "\u2713 " + x.label);
  const L = [];
  L.push(`${dot} ${coin}/USDT \u2014 ${s.side}`);
  L.push("");
  L.push("Confidence      " + (s.confidence != null ? s.confidence : "—") + " / 100");
  L.push("Bot agreement   " + (ens ? ens.n + " bot" + (ens.n === 1 ? "" : "s")
    + " (weighted " + ens.weight + ")" : "—"));
  L.push("Confirmation    " + (s.agree != null ? s.agree + " / " + s.agreeOf : "—"));
  L.push("");
  L.push("Entry");
  L.push(zone[0] === zone[1] ? String(s.entry) : zone[0] + " \u2013 " + zone[1]);
  L.push("");
  L.push("Stop loss");
  L.push(String(s.stop));
  L.push("");
  L.push("Targets");
  s.targets.forEach((t) => L.push("TP" + t.index + "   " + t.price
    + "   " + t.roi.toFixed(1) + "%"));
  L.push("");
  L.push("Risk / reward   1 : " + rr);
  L.push("Leverage        " + (s.spot ? "spot" : s.leverage + "x")
    + "   (stop costs " + CFG.maxLossPct + "% of margin)");
  L.push("Regime          " + regimeWord(s));
  L.push("Timeframes      " + (s.stf || CFG.signalTf) + " + " + CFG.trendTf);
  L.push("State           " + LIFE_LABEL[lifeOf(s)]);
  if (s.chase) {
    L.push("Entry now       " + (s.chase.verdict === "take" ? "still good"
      : s.chase.verdict === "retest"
        ? "do not chase — wait near " + s.chase.retest
        : "too late, it has gone"));
  }
  L.push("");
  L.push("Why?");
  for (const w of (why.length ? why : ["\u2713 " + s.tag])) L.push(w);
  if (s.rec && s.rec.n >= 4) {
    L.push("");
    L.push("This strategy on " + coin + ": " + s.rec.rate + "% reached TP1 over "
      + s.rec.n + " trades.");
  }
  return L.join("\n");
}

function regimeWord(s) {
  const a = s.adxAt != null ? s.adxAt : null;
  if (a == null) return s.side === "LONG" ? "bullish setup" : "bearish setup";
  return a >= 28 ? "strong trend" : a >= 20 ? "trending"
       : a >= 15 ? "mixed" : "range";
}

/* =========================================================================
   THE ANTI-CHASE GATE

   A great signal at a terrible entry is a losing trade, and until now the app
   said nothing at all about the entry. It printed a price from the bar the
   rule fired on and left you to notice, on your own, that the coin had since
   run four percent.

   Four measurements, all relative to the coin's own volatility so they mean
   the same thing on BTC as on a mid-cap:

     ran       how far past the signal price it already went, in units of risk
     vwap      how stretched it is from the rolling volume-weighted average
     extension how far the leg has travelled from its origin, in ATR
     spread    what it would cost to get in right now, if the book is known

   The output is not a score. It is one of three answers, because "62/100" is
   not something you can act on and "wait for the retest at 94.20" is.
   ========================================================================= */

function rollingVwap(d, i, n) {
  let pv = 0, v = 0;
  for (let k = Math.max(0, i - n + 1); k <= i; k++) {
    const b = d.c[k], typical = (b.h + b.l + b.c) / 3;
    pv += typical * b.v; v += b.v;
  }
  return v > 0 ? pv / v : null;
}

/** Where did this leg start? Walk back to the last opposite-direction swing. */
function legOrigin(d, i, long) {
  let best = d.c[i][long ? "l" : "h"], at = i;
  for (let k = i; k >= Math.max(1, i - 60); k--) {
    const v = d.c[k][long ? "l" : "h"];
    if (long ? v < best : v > best) { best = v; at = k; }
  }
  return { price: best, idx: at };
}

/**
 * Is this still worth taking, and at what price?
 * Returns {verdict, why[], retest, ran, stretch, ext, cost}.
 */
function chaseCheck(sym, d, i, sig) {
  const long = sig.side === "LONG";
  const a = d.atr[i];
  const risk = Math.abs(sig.entry - (sig.initialStop != null ? sig.initialStop
                                                             : sig.stop));
  const now = d.close[d.close.length - 1];
  if (!(a > 0) || !(risk > 0) || !(now > 0)) return null;

  // 1. how far it already ran, in R — the number that actually decides it
  const ran = (long ? now - sig.entry : sig.entry - now) / risk;

  // 2. stretch from the rolling VWAP, in ATR
  const vw = rollingVwap(d, d.c.length - 2, CFG.chaseVwapBars);
  const stretch = vw ? (long ? now - vw : vw - now) / a : null;

  // 3. how far the whole leg has travelled
  const origin = legOrigin(d, i, long);
  const ext = Math.abs(now - origin.price) / a;

  // 4. what it costs to get in, if the book has been read
  const w = whaleFresh(sym);
  let cost = null;
  if (w && w.book && w.book.parts && w.book.parts.length) {
    // Thin on the side you have to cross is what actually hurts.
    const band = w.book.parts[0];
    const side = long ? band.ask : band.bid;
    const other = long ? band.bid : band.ask;
    cost = other > 0 ? side / (side + other) : null;   // 0..1, lower is worse
  }

  const why = [];
  let verdict = "take";
  if (ran >= CFG.chaseMaxR) {
    verdict = "late";
    why.push("already " + ran.toFixed(1) + "R past the signal price");
  } else if (ran >= CFG.chaseWarnR) {
    verdict = "retest";
    why.push("ran " + ran.toFixed(1) + "R — the edge is in the entry, and it has gone");
  }
  if (stretch != null && stretch >= CFG.chaseVwapAtr) {
    if (verdict === "take") verdict = "retest";
    why.push(stretch.toFixed(1) + "× ATR above the " + CFG.chaseVwapBars
      + "-bar VWAP");
  }
  if (ext >= CFG.chaseExtAtr) {
    if (verdict === "take") verdict = "retest";
    why.push("the leg has run " + ext.toFixed(1) + "× ATR from its origin");
  }
  if (cost != null && cost < 0.3) {
    if (verdict === "take") verdict = "retest";
    why.push("the book is thin on the side you have to cross");
  }

  // Where to wait for. Halfway back to the signal price, or the VWAP,
  // whichever is nearer — a retest level you will never see is not advice.
  let retest = null;
  if (verdict === "retest") {
    const half = sig.entry + (long ? 1 : -1) * risk * CFG.chaseRetestR;
    retest = vw ? (long ? Math.max(half, vw) : Math.min(half, vw)) : half;
    retest = round(retest, sig.entry);
  }
  if (verdict === "take" && !why.length) {
    why.push("still within " + CFG.chaseWarnR + "R of the signal price");
  }
  return { verdict, why, retest, ran: +ran.toFixed(2),
           stretch: stretch == null ? null : +stretch.toFixed(2),
           ext: +ext.toFixed(2), cost: cost == null ? null : +cost.toFixed(2) };
}

/* =========================================================================
   THE EXIT BRAIN

   Separate from the entry, because the question "should I still be in this"
   has almost nothing to do with the question "should I have got in".

   It does four things a fixed target ladder cannot:
     - takes a partial at the first target and protects the rest
     - holds a runner while momentum is still expanding
     - cuts early when momentum flips against the position, rather than
       waiting for a stop that is now far away
     - trails behind structure once the trade is well ahead

   And one thing that matters more than all of them: it is measured against
   the plain fixed-target ladder on the same trade, every time. An exit rule
   that feels clever and quietly caps every winner at the first target is very
   easy to write and almost impossible to notice, so the app keeps both
   numbers and shows the difference.
   ========================================================================= */

const EXITSTAT = { n: 0, brain: 0, fixed: 0, better: 0, worse: 0 };

/** Replay one signal under managed exits. Returns R, or null. */
function exitBrainRun(sig, d) {
  const long = sig.side === "LONG";
  const risk = Math.abs(sig.entry - (sig.initialStop != null ? sig.initialStop
                                                             : sig.stop));
  if (!(risk > 0)) return null;
  let stop = sig.initialStop != null ? sig.initialStop : sig.stop;
  let open = 1, banked = 0, peak = 0;
  const t1 = sig.targets && sig.targets[0] ? sig.targets[0].price : null;
  let tookPartial = false;

  for (let i = sig.idx + 1; i < d.c.length; i++) {
    const b = d.c[i];
    const rNow = (long ? b.c - sig.entry : sig.entry - b.c) / risk;
    peak = Math.max(peak, (long ? b.h - sig.entry : sig.entry - b.l) / risk);

    // stop first, pessimistically
    if (long ? b.l <= stop : b.h >= stop) {
      const r = (long ? stop - sig.entry : sig.entry - stop) / risk;
      return +(banked + open * r).toFixed(3);
    }

    // first target: bank a slice and protect the rest
    if (!tookPartial && t1 && (long ? b.h >= t1 : b.l <= t1)) {
      const r1 = (long ? t1 - sig.entry : sig.entry - t1) / risk;
      banked += CFG.exitPartial * r1;
      open -= CFG.exitPartial;
      tookPartial = true;
      stop = sig.entry;                          // the rest rides free
    }

    // momentum: the MACD histogram expanding in your favour means hold
    const h = d.mhist[i], hPrev = d.mhist[i - 1];
    const withYou = long ? h > 0 : h < 0;
    const expanding = Math.abs(h) > Math.abs(hPrev);

    // flow reversed while ahead: take what is there rather than give it back
    if (tookPartial && !withYou && rNow > 0.3 && CFG.exitOnFlip) {
      return +(banked + open * rNow).toFixed(3);
    }

    // trail behind structure once well ahead, but only when momentum has
    // stopped expanding — trailing into an accelerating move is how runners die
    if (peak >= CFG.exitTrailAfter && !(withYou && expanding)) {
      const trail = long ? b.c - CFG.exitTrailAtr * d.atr[i]
                         : b.c + CFG.exitTrailAtr * d.atr[i];
      stop = long ? Math.max(stop, trail) : Math.min(stop, trail);
    }

    // everything taken
    const last = sig.targets[sig.targets.length - 1];
    if (last && (long ? b.h >= last.price : b.l <= last.price)) {
      const rL = (long ? last.price - sig.entry : sig.entry - last.price) / risk;
      return +(banked + open * rL).toFixed(3);
    }
  }
  const end = d.close[d.close.length - 1];
  const rEnd = (long ? end - sig.entry : sig.entry - end) / risk;
  return +(banked + open * rEnd).toFixed(3);
}

/** Compare the managed exit with the plain ladder, and keep the score. */
function exitCompare(sig, d) {
  if (!sig.closedAt) return;
  const fixed = rOf(sig);
  if (fixed == null) return;
  const brain = exitBrainRun(sig, d);
  if (brain == null) return;
  sig.exitR = { brain, fixed: +fixed.toFixed(3) };
  EXITSTAT.n++;
  EXITSTAT.brain += brain; EXITSTAT.fixed += fixed;
  if (brain > fixed + 0.02) EXITSTAT.better++;
  else if (brain < fixed - 0.02) EXITSTAT.worse++;
}

/* =========================================================================
   WHALE / MEGA-TRADER ENGINE

   The footprint of size, not the identity of it. Nothing here claims to know
   who traded — that is not knowable from public data, and a module that
   pretends otherwise is selling you a story. What is knowable is aggregate
   behaviour: unusually large executions, which side was the aggressor, where
   the book is thick, whether open interest is building with price or against
   it, and whether the crowd is already positioned the way you are about to be.

   Everything is measured relative to the coin's own normal. A $500k trade is
   enormous on a mid-cap and invisible on BTC, so a fixed dollar threshold
   would find "whales" on small coins all day and never on large ones.

   Every reading is checked by several independent bots rather than one
   threshold. A single cut-off is a coin flip near the boundary; three checks
   over different windows agreeing is a finding. The module's score is the
   share of its bots that agree, so a module that is 2-of-3 says 0.67 and
   means it.
   ========================================================================= */

const WHALE = {
  by: new Map(),        // symbol -> reading
  running: false, cancel: false, step: "", at: 0, coin: 0, err: null,
};

const FAPI = "https://fapi.binance.com";

async function jget(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url.split("?")[0].split("/").pop());
  return r.json();
}

/* --- the panels. Each module is reviewed by N bots; each bot is one
   independent check, and the module's score is how many of them agree.  */

/** Large trades, and which side was the aggressor. */
function whaleTrades(trades) {
  if (!trades || trades.length < 50) return null;
  const notional = trades.map((t) => +t.p * +t.q);
  const sorted = notional.slice().sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)] || 1;
  const p99 = sorted[Math.floor(sorted.length * 0.99)] || median;
  let buy = 0, sell = 0, big = 0, bigBuy = 0, bigSell = 0, all = 0;
  for (let i = 0; i < trades.length; i++) {
    const n = notional[i];
    // Binance marks `m` true when the BUYER was the maker — so the seller was
    // the aggressor. Getting this backwards inverts the whole module, which
    // is exactly the kind of bug that looks like a working feature.
    const aggressiveBuy = trades[i].m === false;
    all += n;
    if (aggressiveBuy) buy += n; else sell += n;
    if (n >= p99) {
      big++;
      if (aggressiveBuy) bigBuy += n; else bigSell += n;
    }
  }
  const delta = all > 0 ? (buy - sell) / all : 0;
  const bigDelta = (bigBuy + bigSell) > 0
    ? (bigBuy - bigSell) / (bigBuy + bigSell) : 0;
  const ratio = median > 0 ? p99 / median : 1;
  const topRatio = median > 0 ? sorted[sorted.length - 1] / median : 1;
  // three bots on the same question, different angles
  const bots = [
    // Against the largest single print, not the 99th percentile. One
    // enormous trade among three hundred does not move a percentile at all —
    // the test caught this — and one enormous trade is exactly the footprint
    // worth catching.
    { id: "size", says: topRatio >= 25,
      note: "largest print " + topRatio.toFixed(0) + "× the median" },
    { id: "delta", says: Math.abs(bigDelta) >= 0.25,
      note: "large-trade delta " + (bigDelta * 100).toFixed(0) + "%" },
    { id: "flow", says: Math.abs(delta) >= 0.08,
      note: "overall flow " + (delta * 100).toFixed(0) + "%" },
  ];
  return { median: +median.toFixed(0), p99: +p99.toFixed(0), big,
           topRatio: +topRatio.toFixed(1),
           delta: +delta.toFixed(3), bigDelta: +bigDelta.toFixed(3),
           side: bigDelta > 0 ? "LONG" : bigDelta < 0 ? "SHORT" : null, bots };
}

/** Where the book is thick, at four depths. Each depth is one bot. */
function whaleBook(depth, px) {
  if (!depth || !depth.bids || !depth.bids.length) return null;
  const bands = [0.001, 0.0025, 0.005, 0.01];
  const bots = [], parts = [];
  for (const b of bands) {
    let bid = 0, ask = 0;
    for (const [p, q] of depth.bids) { if (+p >= px * (1 - b)) bid += +p * +q; }
    for (const [p, q] of depth.asks) { if (+p <= px * (1 + b)) ask += +p * +q; }
    const tot = bid + ask;
    const imb = tot > 0 ? (bid - ask) / tot : 0;
    parts.push({ band: (b * 100).toFixed(2) + "%", imb: +imb.toFixed(3),
                 bid: Math.round(bid), ask: Math.round(ask) });
    bots.push({ id: "depth" + b, says: Math.abs(imb) >= 0.2,
      note: (b * 100).toFixed(2) + "% band " + (imb > 0 ? "bid" : "ask")
          + "-heavy " + Math.abs(imb * 100).toFixed(0) + "%" });
  }
  const avg = parts.reduce((a, p) => a + p.imb, 0) / parts.length;
  return { parts, imb: +avg.toFixed(3),
           side: avg > 0 ? "LONG" : avg < 0 ? "SHORT" : null, bots };
}

/** Open interest against price: building, unwinding, or a squeeze setting up. */
function whaleOi(hist, priceChange) {
  if (!hist || hist.length < 4) return null;
  const first = +hist[0].sumOpenInterest, last = +hist[hist.length - 1].sumOpenInterest;
  if (!(first > 0)) return null;
  const chg = (last - first) / first * 100;
  const up = priceChange > 0;
  // The classic four-quadrant read.
  const state = chg > 1 && up ? "new longs"
              : chg > 1 && !up ? "new shorts"
              : chg < -1 && up ? "shorts covering"
              : chg < -1 && !up ? "longs closing" : "flat";
  const bots = [
    { id: "oiMove", says: Math.abs(chg) >= 2, note: "OI " + chg.toFixed(1) + "%" },
    { id: "oiAgree", says: (chg > 1 && up) || (chg < -1 && !up),
      note: state },
    { id: "oiSqueeze", says: chg > 3 && Math.abs(priceChange) < 1,
      note: chg > 3 && Math.abs(priceChange) < 1
        ? "OI building on a flat price — positions stacking" : "no build-up" },
  ];
  return { chg: +chg.toFixed(2), state,
           side: state === "new longs" || state === "shorts covering" ? "LONG"
               : state === "new shorts" || state === "longs closing" ? "SHORT" : null,
           bots };
}

/** Funding: what it costs to hold, and therefore who is crowded. */
function whaleFunding(prem) {
  if (!prem || prem.lastFundingRate == null) return null;
  const rate = +prem.lastFundingRate * 100;      // per 8h, in %
  const bots = [
    { id: "fundLevel", says: Math.abs(rate) >= 0.03,
      note: "funding " + rate.toFixed(4) + "% per 8h" },
    { id: "fundCrowd", says: Math.abs(rate) >= 0.05,
      note: Math.abs(rate) >= 0.05
        ? (rate > 0 ? "longs paying heavily — crowded long"
                    : "shorts paying heavily — crowded short")
        : "funding is unremarkable" },
    { id: "fundFade", says: Math.abs(rate) >= 0.08,
      note: "extreme — the crowded side is the one that gets liquidated" },
  ];
  // Crowding is a fade, not a follow: heavy positive funding means longs are
  // paying to stay long, which is a reason for caution on a long, not for
  // enthusiasm.
  return { rate: +rate.toFixed(4), side: rate > 0.02 ? "SHORT"
         : rate < -0.02 ? "LONG" : null, bots };
}

/** Where the retail crowd already sits. Same logic: extremes fade. */
function whaleCrowd(rows) {
  if (!rows || !rows.length) return null;
  const r = +rows[rows.length - 1].longShortRatio;
  if (!(r > 0)) return null;
  const bots = [
    { id: "crowdLevel", says: r >= 2.2 || r <= 0.6,
      note: "long/short " + r.toFixed(2) },
    { id: "crowdTrend", says: rows.length > 2
      && Math.abs(r - +rows[0].longShortRatio) / +rows[0].longShortRatio >= 0.15,
      note: "positioning shifted from " + (+rows[0].longShortRatio).toFixed(2) },
    { id: "crowdExtreme", says: r >= 3 || r <= 0.45,
      note: r >= 3 ? "very crowded long" : r <= 0.45 ? "very crowded short"
          : "not extreme" },
  ];
  return { ratio: +r.toFixed(2),
           side: r >= 2.2 ? "SHORT" : r <= 0.6 ? "LONG" : null, bots };
}

/* The weights are the ones you specified, minus the parts that need a
   websocket. Liquidations and cross-exchange confirmation are declared and
   left at zero rather than faked. */
const WHALE_W = { trades: 0.30, book: 0.22, oi: 0.22, funding: 0.14, crowd: 0.12 };

function whaleScore(r) {
  if (!r) return null;
  let score = 0, tot = 0, long = 0, short = 0, botN = 0, botYes = 0;
  for (const k in WHALE_W) {
    const part = r[k];
    if (!part || !part.bots) continue;
    const agree = part.bots.filter((b) => b.says).length / part.bots.length;
    botN += part.bots.length;
    botYes += part.bots.filter((b) => b.says).length;
    score += WHALE_W[k] * agree; tot += WHALE_W[k];
    if (part.side === "LONG") long += WHALE_W[k] * agree;
    if (part.side === "SHORT") short += WHALE_W[k] * agree;
  }
  if (!tot) return null;
  const lean = long + short > 0 ? (long - short) / (long + short) : 0;
  return {
    score: Math.round(score / tot * 100),
    side: lean > 0.15 ? "LONG" : lean < -0.15 ? "SHORT" : null,
    lean: +lean.toFixed(2), bots: botN, agreed: botYes,
  };
}

/* Accumulation, distribution, squeeze — each is a combination, not a single
   reading, which is the whole point of having the parts separately. */
function whaleState(r, priceChange) {
  if (!r) return null;
  const flat = Math.abs(priceChange) < 1.2;
  const bigBuy = r.trades && r.trades.bigDelta > 0.2;
  const bigSell = r.trades && r.trades.bigDelta < -0.2;
  const oiUp = r.oi && r.oi.chg > 1.5;
  const bidHeavy = r.book && r.book.imb > 0.15;
  const askHeavy = r.book && r.book.imb < -0.15;
  if (flat && bigBuy && (oiUp || bidHeavy)) return "possible accumulation";
  if (flat && bigSell && (oiUp || askHeavy)) return "possible distribution";
  if (r.funding && Math.abs(r.funding.rate) >= 0.06 && oiUp) {
    return r.funding.rate > 0 ? "long squeeze risk" : "short squeeze risk";
  }
  if (bigBuy && priceChange > 2) return "buying into strength";
  if (bigSell && priceChange < -2) return "selling into weakness";
  return "nothing unusual";
}

/** Read one coin. Five requests; that is the cost, stated plainly. */
async function whaleRead(sym) {
  const px = TICK[sym] ? TICK[sym].price : null;
  const change = TICK[sym] ? TICK[sym].change : 0;
  const out = { sym, at: Date.now(), change };
  const grab = async (k, fn) => { try { out[k] = await fn(); } catch (e) { out[k] = null; } };
  await Promise.all([
    grab("trades", async () => whaleTrades(
      await jget(FAPI + "/fapi/v1/aggTrades?limit=1000&symbol=" + sym))),
    grab("book", async () => whaleBook(
      await jget(FAPI + "/fapi/v1/depth?limit=500&symbol=" + sym),
      px || (TICK[sym] && TICK[sym].price) || 0)),
    grab("oi", async () => whaleOi(
      await jget(FAPI + "/futures/data/openInterestHist?period=5m&limit=12&symbol="
        + sym), change)),
    grab("funding", async () => whaleFunding(
      await jget(FAPI + "/fapi/v1/premiumIndex?symbol=" + sym))),
    grab("crowd", async () => whaleCrowd(
      await jget(FAPI
        + "/futures/data/globalLongShortAccountRatio?period=5m&limit=6&symbol="
        + sym))),
  ]);
  const sc = whaleScore(out);
  out.score = sc ? sc.score : null;
  out.side = sc ? sc.side : null;
  out.lean = sc ? sc.lean : 0;
  out.botN = sc ? sc.bots : 0;
  out.botYes = sc ? sc.agreed : 0;
  out.state = whaleState(out, change);
  WHALE.by.set(sym, out);
  return out;
}

/** Work through the coin list a few at a time, like everything else here. */
async function whaleRun(coins) {
  if (WHALE.running) return;
  WHALE.running = true; WHALE.cancel = false; WHALE.err = null;
  const list = (coins && coins.length) ? coins
    : (UNIVERSE.length ? UNIVERSE : CFG.focus);
  const batch = [];
  for (let k = 0; k < Math.min(CFG.whaleCoins, list.length); k++) {
    batch.push(list[(WHALE.coin + k) % list.length]);
  }
  WHALE.coin = (WHALE.coin + batch.length) % Math.max(1, list.length);
  try {
    for (const sym of batch) {
      if (WHALE.cancel) break;
      WHALE.step = sym.replace("USDT", "");
      render();
      await whaleRead(sym);
      await new Promise((r) => setTimeout(r, 120));   // be polite to the API
    }
    WHALE.at = Date.now();
  } catch (e) {
    WHALE.err = e.message || String(e);
  } finally {
    WHALE.running = false; WHALE.step = ""; render(true);
  }
}

/* =========================================================================
   COHERENCE  —  making the modules argue in the open instead of in secret.

   With twenty modules feeding one number, the dangerous failure is not a
   module being wrong. It is two modules being confidently opposite and the
   average coming out as a calm, meaningless middle. A signal at 55 because
   everything mildly agrees, and a signal at 55 because half the system says
   buy and half says sell, are completely different situations, and a single
   number cannot tell them apart.

   So contradictions are found, named, and shown — and they cost confidence
   rather than quietly cancelling out.
   ========================================================================= */

const CLASHES = [
  { a: "whale", b: "btc", why: "large traders and Bitcoin's direction disagree" },
  { a: "whale", b: "htf", why: "large traders and the higher timeframe disagree" },
  { a: "crowd", b: "whale", why: "the crowd is positioned against the large flow" },
  { a: "regime", b: "agree", why: "the market state does not suit the strategy "
    + "that fired, though the reads agree" },
  { a: "record", b: "cell", why: "the live record and the backtest disagree "
    + "about this combination" },
];

/** Every pair of modules that flatly disagree about this trade. */
function coherenceOf(sig) {
  if (!sig || !sig.mods) return { clashes: [], penalty: 0, spread: 0 };
  const m = sig.mods;
  const out = [];
  for (const c of CLASHES) {
    const x = m[c.a], y = m[c.b];
    if (x == null || y == null) continue;
    // One clearly for, one clearly against. Two middling readings are not a
    // contradiction, they are uncertainty, and calling them a clash would
    // make the warning meaningless.
    if (Math.abs(x - y) >= 0.55 && Math.min(x, y) <= 0.3 && Math.max(x, y) >= 0.7) {
      out.push({ ...c, x, y });
    }
  }
  // How divided the whole panel is, regardless of named pairs.
  const vals = Object.values(m);
  const hi = vals.filter((v) => v >= 0.7).length;
  const lo = vals.filter((v) => v <= 0.3).length;
  const spread = vals.length ? Math.min(hi, lo) / vals.length : 0;
  const penalty = Math.min(0.45, out.length * 0.12 + spread * 0.5);
  return { clashes: out, penalty: +penalty.toFixed(2), spread: +spread.toFixed(2),
           split: hi + " for · " + lo + " against" };
}

/* =========================================================================
   WHAT THE SERVER FOUND WHILE YOU WERE AWAY

   A phone cannot scan in the background — iOS suspends the page the moment
   Safari leaves the screen, and no amount of cleverness in here changes that.
   So a copy of the engine runs on GitHub's servers every fifteen minutes and
   writes signals.json next to this file. The page reads it on open and merges
   it in, labelled, so what you see is everything found since you last looked
   rather than only what this device managed to catch.

   The server runs six of the ten strategies. It says so in the file, and the
   panel says so on screen — a missing strategy that nobody mentions is how a
   list quietly becomes less than it claims to be.
   ========================================================================= */

const SERVER = { at: 0, data: null, err: null, loading: false, on: true };

async function loadServer() {
  if (!SERVER.on || SERVER.loading) return;
  // Opened straight from a file rather than served over the web: the browser
  // blocks the fetch, and the console error looks like a fault when it is
  // simply the wrong way to open the page.
  if (location.protocol === "file:") {
    SERVER.err = "open this from its web address, not as a local file";
    return;
  }
  SERVER.loading = true;
  try {
    // Same folder as this page, so it works on GitHub Pages with no config.
    const r = await fetch("signals.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("no signals.json (" + r.status + ")");
    const j = await r.json();
    SERVER.data = j; SERVER.at = Date.now(); SERVER.err = null;
  } catch (e) {
    // Not an error worth shouting about: the file only exists once the
    // scheduled job has run at least once.
    SERVER.err = e.message || String(e);
    SERVER.data = null;
  } finally {
    SERVER.loading = false; render(true);
  }
}

/** The server's signals, in this app's shape. */
function serverSignals() {
  const j = SERVER.data;
  if (!j || !Array.isArray(j.signals)) return [];
  return j.signals.map((s) => ({
    symbol: s.symbol, side: s.side, leverage: s.leverage, risk: s.risk,
    tag: s.tag, reasons: s.reasons || [], strat: s.strat, stf: s.stf,
    entry: s.entry, stop: s.stop, initialStop: s.initial_stop,
    price: s.last_price != null ? s.last_price : s.entry,
    roi: 0, at: s.at, idx: s.idx, hits: s.hits || 0, be: false,
    status: s.status || "in_progress", closedAt: null,
    targets: (s.targets || []).map((t) => ({ ...t, hit: false })),
    agree: s.agree, agreeOf: s.agree_of, atrPct: s.atr_pct, adxAt: s.adx,
    confidence: s.confidence, rec: s.record || null,
    chase: s.chase || null, by: ["Server"], setupName: "Server",
    fromServer: true, life: "confirmed",
  })).filter((s) => s.targets.length);
}

/* "It found 8" and a list of 2 is the kind of gap that makes an app feel
   broken. It is not broken — the server reports what it found, and the page
   shows what survives your own rules. But a number you cannot account for is
   worse than no number, so this says where the rest went.

   Only the coin filter can be attributed exactly. Everything else is grouped
   honestly as "your rules" rather than guessed at, because a signal can fail
   three gates at once and naming one of them would be a lie. */
function serverShownRow() {
  const found = serverSignals();
  if (!found.length) return "";
  // A server signal the device found too is merged into the local one and
  // loses its fromServer mark. Counting it as hidden would be wrong.
  const local = new Set(OPEN.map((s) => s.symbol + "|" + s.side + "|" + s.at));
  const shown = found.filter((s) =>
    local.has(s.symbol + "|" + s.side + "|" + s.at)).length;
  const hidden = Math.max(0, found.length - shown);
  if (!hidden) return kv("Shown here", shown + " — all of them");

  const mine = CFG.pairMode === "custom" ? new Set(mineList()) : null;
  const offList = mine ? found.filter((s) => !mine.has(s.symbol)).length : 0;
  const byRules = Math.max(0, hidden - offList);
  const why = [
    offList ? offList + " not on your coin list" : "",
    byRules ? byRules + " below your rules — freshness, score, agreement or "
      + "the anti-chase gate" : "",
  ].filter(Boolean).join(", ");

  return kv("Shown here", shown + " of " + found.length)
    + `<div class="hint" style="margin:-2px 0 8px">Hidden: ${why}. Loosen them
       under <b>How often you want signals</b>, or switch to
       <b>Mine + biggest</b> under Coins, to see the rest.</div>`;
}

function serverBlock() {
  const j = SERVER.data;
  if (!SERVER.on) return "";
  if (!j) {
    return `<div class="card" style="margin-bottom:10px">
      <div class="kv" style="border:0;padding-top:0">
        <span class="k" style="font-weight:800">Background scanning</span>
        <span class="v" style="color:var(--dim)">not set up</span></div>
      <div class="hint" style="margin-bottom:0">Nothing at
        <b>signals.json</b> yet. Once the scheduled job in your repository has

  }
  const age = j.generated ? Math.round((Date.now() - j.generated) / 60000) : null;
  return `<div class="card" style="margin-bottom:10px;border-color:#2b6b45">
    <div class="kv" style="border:0;padding-top:0">
      <span class="k" style="font-weight:800">

    </div>

    ${CFG.pairMode === "custom" ? `<div class="hint" style="margin-bottom:0">
      You are on <b>Only my coins</b>, so anything the server found outside

    ${(j.coins_missing || []).length ? `<div class="hint"
