  "patPivot","patTol","patFlat","patMaxAge","patCooldown","patMinHeight","patMinSpan",
  "patFlagRun","patFlagPause","patFlagAtr","patCupBars","patTargets",
];

function exportConfig() {
  const out = {};
  for (const k of EXPORT_KEYS) out[k] = CFG[k];
  if (AUTOPICK.size) {
    out.perCoin = {};
    for (const [sym, v] of AUTOPICK) {
      out.perCoin[sym] = {strategy: v.strat, timeframe: v.tf,
                          trend: v.ttf, params: v.params || null};
    }
  }
  return out;
}

/* ==========================================================================
   SETTINGS THAT SURVIVE A PLAIN LINK

   The hash is a good way to share a setup and a terrible way to store one.
   Half the settings never reached it — only six short keys did — and any
   route that dropped the fragment (a bookmark saved before the hash existed,
   a link pasted without it, an app that trims URLs) silently reset the lot.

   So the whole config is mirrored to this device. The hash still wins when
   it is present, because a link someone hands you should mean what it says.
   ======================================================================= */

const CFGKEY = "signals.cfg.v1";
let CFGLAST = "";

function saveCfg() {
  try {
    const s = JSON.stringify(exportConfig());
    if (s === CFGLAST) return;              // nothing changed; skip the write
    CFGLAST = s;
    localStorage.setItem(CFGKEY, s);
  } catch (e) { /* private mode, or storage full */ }
}

function restoreCfg() {
  try {
    const raw = localStorage.getItem(CFGKEY);
    if (!raw) return false;
    const cfg = JSON.parse(raw);
    let n = 0;
    for (const k of EXPORT_KEYS) if (k in cfg) { CFG[k] = cfg[k]; n++; }
    if (cfg.perCoin) {
      AUTOPICK.clear();
      for (const sym in cfg.perCoin) {
        const v = cfg.perCoin[sym];
        AUTOPICK.set(sym, {strat: v.strategy, tf: v.timeframe, ttf: v.trend,
                           params: v.params, exp: NaN, n: 0,
                           at: Date.now(), tuned: !!v.params});
      }
    }
    CFGLAST = raw;
    return n > 0;
  } catch (e) { return false; }
}

// Written on a slow clock rather than from every setter. There are dozens of
// places that change a setting and hooking each one is how you end up with
// the two or three that were missed.
setInterval(saveCfg, 5000);
addEventListener("pagehide", saveCfg);
addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") saveCfg();
});

function exportLink() {
  const packed = btoa(unescape(encodeURIComponent(JSON.stringify(exportConfig()))))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return location.origin + location.pathname + "#cfg=" + packed;
}

function importPacked(packed) {
  try {
    const json = decodeURIComponent(escape(atob(
      packed.replace(/-/g, "+").replace(/_/g, "/"))));
    const cfg = JSON.parse(json);
    for (const k of EXPORT_KEYS) if (k in cfg) CFG[k] = cfg[k];
    if (cfg.perCoin) {
      AUTOPICK.clear();
      for (const sym in cfg.perCoin) {
        const v = cfg.perCoin[sym];
        AUTOPICK.set(sym, {strat: v.strategy, tf: v.timeframe, ttf: v.trend,
                           params: v.params, exp: NaN, n: 0,
                           at: Date.now(), tuned: !!v.params});
      }
    }
    return true;
  } catch (e) { return false; }
}

function exportBotYaml() {
  const c = CFG;
  const q = (v) => Array.isArray(v) ? "[" + v.join(", ") + "]"
          : typeof v === "string" ? '"' + v + '"' : String(v);
  return [
    "# Generated by the Signals app - paste over the matching keys in config.yaml",
    "market:",

    "  top_n: " + c.pairs,

}

async function copyOut(text, what) {
  try {
    await navigator.clipboard.writeText(text);
    toast(what + " copied");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
    toast(ok ? what + " copied" : "Copy blocked here - select the text instead");
  }
}

let SHOWCFG = "";

/* =========================================================================
   DEPLOY — the single action.

   Find the best setup, apply it, start scanning, and keep re-checking. One
   button instead of: tune, read the table, accept, remember to come back.

   The re-tune is deliberately conservative. Every few hours it runs the whole
   search again and only switches if the new winner beats the running one on
   history neither was tuned against, by a clear margin. Without that margin a
   deployment would flip strategy on noise every time it woke up.
   ========================================================================= */

const DEPLOY = {
  on: false, at: 0, next: 0, retuneHours: 6,
  strat: "", label: "", winner: "", tf: "", holdout: null, combo: null,
  changes: 0, log: [], timer: null, working: false, step: "",
  freshStart: true, perPair: true,
};

const DEPLOY_MARGIN = 1.25;      // a challenger must be 25% better to take over

async function deployNow(silent) {
  if (DEPLOY.working || BEST.running || OPT.running) return;
  DEPLOY.working = true;
  render(true);

  await findBestSetup();

  const win = BEST.rows[0];
  const usable = win && win.holdout.n >= 8 && win.holdout.netPct > 0;

  let applied = false;
  if (usable) {
    const better = !DEPLOY.holdout ||
      win.holdout.netPct > DEPLOY.holdout.netPct * DEPLOY_MARGIN;
    if (!DEPLOY.on || better) {
      applyBest(0, true);                            // apply, rescan below
      if (DEPLOY.on) DEPLOY.changes++;
      DEPLOY.strat = win.strat; DEPLOY.label = win.label;
      DEPLOY.holdout = win.holdout;
      DEPLOY.combo = win.combo;
      applied = true;
      DEPLOY.tf = CFG.signalTf + ">" + CFG.trendTf;
      // The tournament answers "which strategy and which settings hold up
      // across the whole basket". That is the right way to choose the
      // settings, and the wrong way to choose the strategy for any one coin —
      // a coin that trends and a coin that ranges do not want the same rule.
      // So the winner's settings are kept and each coin picks its own strategy
      // from its own history, unless the user turns that off.
      if (DEPLOY.perPair) {
        CFG.strategy = "auto";
        BT.strategy = win.strat;         // the backtester keeps the concrete one
        AUTOPICK.clear();                // re-decide per coin on the new settings
        writeHash();
      }
      DEPLOY.label = DEPLOY.perPair ? "Best per coin" : win.label;
      DEPLOY.winner = win.label;
      deployLog(`${win.label} on ${tfWords(DEPLOY.tf)} — ${
        win.holdout.netPct >= 0 ? "+" : ""}${win.holdout.netPct
        }% on held-back history`);
      if (DEPLOY.perPair) {
        deployLog(`kept its settings, but each coin now picks its own strategy`);
      }
      // A new strategy on a new duration is a different experiment. Keeping
      // the old strategy's record next to it would mix two things that are
      // not comparable, so the tracked record starts again here.
      if (DEPLOY.freshStart) {
        ARCHIVE.clear(); HELD.clear(); CLOSED = []; FEED = [];
        SESSION.startedAt = Date.now(); SESSION.scans = 0;
        saveSession();
        deployLog("record cleared — measuring " + win.label + " from now");
      }
    } else {
      BEST.rows = [];
      deployLog(`kept ${DEPLOY.label} — challenger ${win.label} at ${
        win.holdout.netPct}% was not clearly better`);
      render(true);
    }
  } else {
    BEST.rows = [];
    deployLog("nothing beat doing nothing — settings left alone");
    render(true);
  }

  // Always rescan, even when the incumbent was kept. Pressing "Check now" and
  // being left looking at hour-old cards is indistinguishable from a button
  // that does nothing.
  DEPLOY.step = applied ? "Rescanning with " + DEPLOY.label + "…"
                        : "Refreshing signals…";
  render(true);
  CACHE.clear();                       // pull new candles, not the cached ones
  try { await run(); } catch (e) { /* the scanner reports its own errors */ }
  deployLog(`signals refreshed — ${OPEN.length} open, ${CLOSED.length} closed`);

  DEPLOY.step = "";
  DEPLOY.on = true;
  DEPLOY.at = Date.now();
  DEPLOY.next = Date.now() + DEPLOY.retuneHours * 3600000;
  DEPLOY.working = false;
  scheduleRetune();
  saveDeploy();
  if (!silent) toast(usable ? "Deployed — " + DEPLOY.label : "Deployed");
  render(true);
}

function deployLog(text) {
  DEPLOY.log.unshift({at: Date.now(), text});
  DEPLOY.log = DEPLOY.log.slice(0, 8);
}

/* A deployment has to survive a reload — a phone closes the tab constantly and
   nobody wants to press Deploy again every morning. The strategy itself already
   rides in the URL hash; this remembers that it was deployed, and when the
   next check is due. */
const DKEY = "signals.deploy.v1";
function saveDeploy() {
  try {
    localStorage.setItem(DKEY, JSON.stringify({
      on: DEPLOY.on, at: DEPLOY.at, next: DEPLOY.next,
      retuneHours: DEPLOY.retuneHours, strat: DEPLOY.strat, depth: BEST.depth,
      label: DEPLOY.label, winner: DEPLOY.winner, tf: DEPLOY.tf,
      holdout: DEPLOY.holdout, combo: DEPLOY.combo,
      freshStart: DEPLOY.freshStart, perPair: DEPLOY.perPair,
      changes: DEPLOY.changes, log: DEPLOY.log,
    }));
  } catch (e) { /* private mode — it just will not persist */ }
}
function loadDeploy() {
  try {
    const o = JSON.parse(localStorage.getItem(DKEY) || "null");
    if (!o || !o.on) return;
    Object.assign(DEPLOY, {
      on: true, at: o.at || 0, next: o.next || 0,
      retuneHours: o.retuneHours || 6, strat: o.strat || "",
      label: o.label || "", winner: o.winner || "", tf: o.tf || "",
      holdout: o.holdout || null, combo: o.combo || null,
      freshStart: o.freshStart !== false, perPair: o.perPair !== false,
      changes: o.changes || 0, log: Array.isArray(o.log) ? o.log : [],
    });
    // A record written before per-pair mode existed stored the winning
    // strategy as the label. Move it where it belongs so the panel does not
    // announce one thing while the scanner does another.
    if (DEPLOY.perPair && DEPLOY.label && DEPLOY.label !== "Best per coin") {
      DEPLOY.winner = DEPLOY.winner || DEPLOY.label;
      DEPLOY.label = "Best per coin";
    }

    // Opened without the config in the address bar — put the deployed settings
    // back, so what the panel says is running is what is actually running.
    if (DEPLOY.strat && DEPLOY.combo && CFG.strategy !== DEPLOY.strat
        && CFG.strategy !== "auto") {
      for (const k in DEPLOY.combo) {
        if (k === "tfPair") {
          const [s, t] = String(DEPLOY.combo[k]).split(">");
          if (s && t) { BT.signalTf = s; BT.trendTf = t;
                        CFG.signalTf = s; CFG.trendTf = t; }
          continue;
        }
        BT[k] = DEPLOY.combo[k];
        if (k in CFG) CFG[k] = DEPLOY.combo[k];
      }
      CFG.horizon = horizonFor(CFG.signalTf);
    }

    // This part is not conditional. Gating it on the strategy differing meant
    // that when the saved strategy and the current one matched — the ordinary
    // case — per-pair mode never got switched on, and the deployment quietly
    // ran one strategy across every coin.
    if (DEPLOY.strat) {
      BT.strategy = DEPLOY.strat;
      CFG.strategy = DEPLOY.perPair ? "auto" : DEPLOY.strat;
      PRESET = "custom";
      writeHash();
    }
    // A check that came due while the app was closed runs on the next tick
    // rather than immediately, so opening the app is never a two-minute wait.
    if (DEPTHS[o.depth]) BEST.depth = o.depth;
    if (DEPLOY.next < Date.now()) DEPLOY.next = Date.now() + 120000;
    scheduleRetune();
  } catch (e) { /* nothing to restore */ }
}

function scheduleRetune() {
  clearInterval(DEPLOY.timer);
  DEPLOY.timer = setInterval(() => {
    if (!DEPLOY.on || DEPLOY.working || BUSY) return;
    if (Date.now() < DEPLOY.next) return;
    if (document.visibilityState !== "visible") return;   // no work in the background
    deployNow(true);
  }, 60000);
}

function stopDeploy() {
  DEPLOY.on = false;
  clearInterval(DEPLOY.timer);
  DEPLOY.timer = null;
  deployLog("stopped");
  saveDeploy();
  toast("Deployment stopped");
  render(true);
}

function togDeployFresh() {
  DEPLOY.freshStart = !DEPLOY.freshStart;
  saveDeploy(); render(true);
}

function togDeployPerPair() {
  DEPLOY.perPair = !DEPLOY.perPair;
  if (DEPLOY.on) {
    if (DEPLOY.perPair) {
      DEPLOY.winner = DEPLOY.winner || DEPLOY.label;
      CFG.strategy = "auto";
      DEPLOY.label = "Best per coin";
      AUTOPICK.clear();
    } else if (DEPLOY.strat) {
      CFG.strategy = DEPLOY.strat;
      DEPLOY.label = DEPLOY.winner || DEPLOY.label;
    }
    writeHash();
  }
  saveDeploy(); render(true);
  run();                       // the picks have to be recomputed, not rescored
}

/** What the scanner is actually doing right now — read from CFG, not from a
    string saved earlier. A label that can drift out of step with the engine
    is worse than no label. */
function runningLabel() {
  if (CFG.strategy === "auto") {
    return AUTOPICK.size ? "Best per coin · " + AUTOPICK.size + " decided"
                         : "Best per coin";
  }
  return BT_STRATS[CFG.strategy] || CFG.strategy;
}

/** Which strategy each coin ended up on — the whole point of per-pair mode. */
function perPairBlock() {
  if (!DEPLOY.perPair || !AUTOPICK.size) return "";
  const rows = [...AUTOPICK.entries()].slice(0, 12).map(([sym, v]) =>
    `<div class="kv"><span class="k">${esc(sym.replace("USDT",""))}</span>
      <span class="v">${esc(BT_STRATS[v.strat] || v.strat)}</span></div>`).join("");
  return `<div class="segnote" style="margin-top:10px">What each coin chose</div>
    <div class="status">${rows}</div>`;
}

function setDepth(k) {
  if (!DEPTHS[k] || BEST.running || DEPLOY.working) return;
  BEST.depth = k; saveDeploy(); render(true);
}

function setRetune(h) {
  DEPLOY.retuneHours = +h;
  DEPLOY.next = DEPLOY.at + DEPLOY.retuneHours * 3600000;
  saveDeploy();
  render(true);
}

function deployBlock() {
  if (DEPLOY.working || BEST.running) {

/* =========================================================================
   ALWAYS ON

   A browser tab cannot run when it is closed — no amount of code changes
   that, and anyone who tells you otherwise is selling something. What it can
   do is scan continuously while it is open, keep the phone from sleeping, and
   tell you the moment a new takeable setup appears so you do not have to sit
   watching it.

   For scanning that survives a closed phone there is the Python bot, which
   runs on a server. That is a different thing and it is honest to say so.
   ========================================================================= */
const WATCHDOG = { wake: null, notified: new Set(), state: new Map(),
                  seeded: false, lastCount: 0 };

async function toggleAlwaysOn() {
  CFG.alwaysOn = !CFG.alwaysOn;
  if (CFG.alwaysOn) {
    // Anything at or above the 5 minute default is not "always on" in any
    // useful sense. A faster cadence the user chose themselves is respected.
    if (CFG.autoRefreshMin >= 5) CFG.autoRefreshMin = 1;
    await askNotify();
    await keepAwake();
    refresh();
  } else {
    releaseWake();
  }
  writeHash(); render(true);
}

async function askNotify() {
  try {
    if (!("Notification" in window)) return;
    if (Notification.permission === "default") await Notification.requestPermission();
  } catch (e) { /* some browsers refuse outside a gesture; not fatal */ }
}

async function keepAwake() {
  try {
    if (!("wakeLock" in navigator)) return;
    releaseWake();
    WATCHDOG.wake = await navigator.wakeLock.request("screen");
    WATCHDOG.wake.addEventListener("release", () => { WATCHDOG.wake = null; });
  } catch (e) { WATCHDOG.wake = null; }
}
function releaseWake() {
  try { if (WATCHDOG.wake) WATCHDOG.wake.release(); } catch (e) {}
  WATCHDOG.wake = null;
}

/* Announces three things: a new setup you can take, a target reached, and a
   stop hit. The last one matters most — it is the one you would otherwise
   find out about by opening the app and discovering the money already gone. */
let LASTBATCH = null;
let RISK = null;
function alertScan(all) {
  const shout = (title, body, kind, key) => {
    if (!CFG.notify) return;
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body, tag: kind + "-" + key });
      } else { toast(title); }
    } catch (e) { toast(title); }
    beep(kind);
  };

  // Outcomes first: they are about money already at risk.
  const seen = new Set();
  for (const s of all) {
    const k = sigKey(s);
    seen.add(k);
    const was = WATCHDOG.state.get(k);
    WATCHDOG.state.set(k, { hits: s.hits || 0, status: s.status });
    if (!WATCHDOG.seeded || !was) continue;      // first scan: learn, do not shout
    const coin = s.symbol.replace("USDT", "");
    const roi = (s.roi >= 0 ? "+" : "") + s.roi + "%";
    if (s.status !== was.status &&
        (s.status === "stopped" || s.status === "breakeven")) {
      shout(`${coin} ${s.status === "breakeven" ? "closed at breakeven" : "stopped out"}`,
            `${s.side} from ${s.entry} · ${roi}`, "loss", k);
    } else if (s.status === "completed" && was.status !== "completed") {
      shout(`${coin} — all targets hit`, `${s.side} from ${s.entry} · ${roi}`, "win", k);
    } else if ((s.hits || 0) > (was.hits || 0)) {
      shout(`${coin} hit Target ${s.hits}`, `${s.side} from ${s.entry} · ${roi}`,
            "win", k + ":" + s.hits);
    }
  }
  if (WATCHDOG.state.size > 600) {
    const keep = [...WATCHDOG.state.entries()].filter(([k]) => seen.has(k));
    WATCHDOG.state = new Map(keep.slice(-300));
  }

  // Then anything new worth taking.
  const fired = [];
  for (const s of OPEN) {
    if (s.belowBar || entryGone(s)) continue;
    const k = sigKey(s);
    if (WATCHDOG.notified.has(k)) continue;
    WATCHDOG.notified.add(k);
    if (WATCHDOG.seeded) fired.push(s);
  }
  if (WATCHDOG.notified.size > 400) {
    WATCHDOG.notified = new Set([...WATCHDOG.notified].slice(-200));
  }
  WATCHDOG.seeded = true;
  if (fired.length) LASTBATCH = { at: Date.now(), list: fired.slice(0, 20) };
  if (!fired.length) return;
  const one = fired[0];
  shout(fired.length === 1
      ? `${one.side} ${one.symbol.replace("USDT", "")} @ ${one.entry}`
      : `${fired.length} new signals`,
    fired.length === 1
      ? `Stop ${one.stop} · ${one.spot ? "spot" : one.leverage + "x"} · ${one.tag}`
      : fired.map(s => s.side + " " + s.symbol.replace("USDT", "")).join(", "),
    "new", sigKey(one));
}

/* Three tones, so you know what happened without looking: rising for a new
   setup, higher and doubled for a target, a low fall for a stop. */
const TONES = {
  new:  [[880, 0, 0.18]],
  win:  [[988, 0, 0.14], [1319, 0.16, 0.22]],
  loss: [[320, 0, 0.30], [220, 0.18, 0.34]],
};
function beep(kind) {
  if (!CFG.sound) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const ctx = new A();
    for (const [hz, at, len] of (TONES[kind] || TONES.new)) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = hz;
      o.type = kind === "loss" ? "triangle" : "sine";
      const t0 = ctx.currentTime + at;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      o.start(t0); o.stop(t0 + len + 0.02);
    }
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1200);
  } catch (e) { /* audio blocked until the user interacts; nothing to do */ }
}

  if (!LASTRUN || !CFG.bars) return null;

  const fired = CLOSED.length + OPEN.length;
  if (!days || !fired) return null;
  const perDay = fired / days;
  return { perDay, days: Math.round(days), fired };
}

/* Each bot's own backtest.

   The leaderboard ranks bots on their live record, which is the only thing
   that cannot be fooled — but a bot you switched on this morning has no live
   record, and waiting a month to find out it was never any good is a bad
   trade. So each bot can replay its own settings over deep history and carry
   the answer on its card.

   It is labelled as a backtest everywhere it appears, because that is what it
   is: what these rules would have done on candles that already happened. It
   is evidence, not a forecast, and the live column is what settles it. */
async function botBacktest(id) {
  const b = botById(id);
  if (!b || BT.running || BEST.running || OPT.running || DEPLOY.working) return;
  const cfg = b.follow ? snapshotSetup() : b.cfg;
  b.btBusy = true; render(true);
  const undo = applySetup(cfg);
  const syms = (UNIVERSE.length ? UNIVERSE : CFG.focus).slice(0, CFG.botBtPairs);
  try {
    const data = new Map();
    const queue = syms.slice();
    const worker = async () => {
      while (queue.length) {
        const sym = queue.shift();
        try {
          const [ltf, htf] = await Promise.all([
            btKlines(sym, cfg.signalTf, CFG.botBtBars),
            btKlines(sym, cfg.trendTf, Math.min(1000, CFG.botBtBars)),
          ]);
          data.set(sym, { ltf, h: enrich(htf) });
        } catch (e) { /* a pair that will not load is simply not tested */ }
        await new Promise((r) => setTimeout(r, 0));
      }
    };
    await Promise.all(Array.from({ length: 4 }, worker));
    if (!data.size) { b.bt = { err: "no candle data" }; return; }

    const cands = [];
    for (const [sym, v] of data) {
      const { d, out } = btCandidates(sym, v.ltf, v.h);
      for (const sig of out) cands.push({ sig, path: btPath(sig, d) });
      await new Promise((r) => setTimeout(r, 0));
    }
    const res = btSimulate(cands, cfg.signalTf);
    b.bt = {
      at: Date.now(), pairs: data.size, bars: CFG.botBtBars,
      n: res.n, netPct: res.netPct, rate: res.winRate,
      maxDD: res.maxDD, pf: res.pf,
    };
  } catch (e) {
    b.bt = { err: e.message || String(e) };
  } finally {
    undo(); b.btBusy = false; saveBots(); render(true);
  }
}

/** Backtest every enabled bot, one after another. */
async function botBacktestAll() {
  for (const b of enabledBots()) await botBacktest(b.id);
  toast("Backtested " + enabledBots().length + " bots");
}

/** Run the full search for one bot and keep the result on that bot. */
async function botSearch(id) {
  const b = botById(id);
  if (!b || BEST.running || OPT.running || DEPLOY.working) return;
  const undo = applySetup(b.cfg);
  // A bot searches within its own strategy. It is looking for the chart period
  // and the settings that strategy works best on — all 33 signal/trend
  // combinations, scored on held-back history. It does not go shopping for a
  // different strategy, because then every bot would converge on the same one
  // and ten lenses would collapse back into one.
  const lock = (b.cfg && b.cfg.strategy) || CFG.strategy;
  BEST_ONLY = (lock && lock !== "auto") ? lock : null;
  try {
    await findBestSetup();
    const win = BEST.rows[0];
    if (win && win.holdout.n >= 8 && win.holdout.netPct > 0) {
      // The winner's settings become this bot's settings — and only this
      // bot's. No other bot and nothing on screen is touched.
      const next = snapshotSetup();
      for (const k in win.combo) {
        if (k === "tfPair") {
          const [sig, tr] = String(win.combo[k]).split(">");
          if (sig && tr) { next.signalTf = sig; next.trendTf = tr; }
          continue;
        }
        if (k in next) next[k] = win.combo[k];
      }
      next.strategy = win.strat;
      b.cfg = next;
      b.winner = win.label; b.tf = win.combo.tfPair || "";
      b.holdout = win.holdout; b.combo = win.combo;
      b.startedAt = Date.now();          // its clock restarts with its settings
      b.changes++;
      b.log.unshift({ at: Date.now(), text: win.label + " — "
        + (win.holdout.netPct >= 0 ? "+" : "") + win.holdout.netPct + "%" });
    } else {
      b.log.unshift({ at: Date.now(), text: "nothing beat what it is running" });
    }
    b.log = b.log.slice(0, 6);
    b.nextTune = Date.now() + b.retuneHours * 3600000;
    BEST.rows = [];
  } finally {
    BEST_ONLY = null;
    undo();
    saveBots(); render(true);
  }
  refresh();
}

/** Every enabled bot searches for its own best chart period, one at a time. */
async function botSearchAll() {
  for (const b of enabledBots()) {
    if (BEST.cancel) break;
    await botSearch(b.id);
  }
  toast("Every bot searched");
}

function accordion(html) {
  const parts = html.split(/<h2[^>]*>([\s\S]*?)<\/h2>/);
  let out = parts[0];                       // anything before the first heading
  for (let i = 1; i < parts.length; i += 2) {
    const title = parts[i].replace(/<[^>]+>/g, "").trim();
    const body = parts[i + 1] || "";
    const open = !!PSEC[title];
    out += `<button class="sech${open ? " open" : ""}" onclick="togSec('${
        title.replace(/'/g, "")}')"><span>${title}</span>
        <span class="chev">${open ? "\u2212" : "+"}</span></button>
      <div class="secb"${open ? "" : ' style="display:none"'}>${body}</div>`;
  }
  return out;
}
function togSec(t) { PSEC[t] = !PSEC[t]; render(true); }

/* Your focus coins.

    <input class="search" id="fq" placeholder="Type any coin, then press Enter…"

/* The server keeps its own copy of the list, because it runs when this page
   is closed and cannot ask it anything. Rather than a second place to curate
   coins, this hands you the exact text to paste into one file. */
function serverCoinsBlock() {
  const mine = mineList();
  const srv = (SERVER.data && SERVER.data.coins) || null;
  const same = srv && mine.length === srv.length
    && mine.every((s) => srv.includes(s));
  const state = !SERVER.on
    ? `<span class="v" style="color:var(--dim)">background scanning is off</span>`
    : !srv
    ? `<span class="v" style="color:var(--dim)">not reported yet</span>`
    : same
    ? `<span class="v good">matches your list</span>`
    : `<span class="v" style="color:var(--warn,#d29922)">${
        esc((SERVER.data.coin_source || "different"))}</span>`;
  return `<div class="kv" style="margin-top:14px"><span class="k">
      <b>Server is scanning</b></span>${state}</div>
    <div class="hint">The background scanner reads <b>bot/coins.txt</b> in your
      repository. Copy your list, paste it into that file, commit — and the
      server scans exactly these. Delete the file and it goes back to the top
      ${CFG.pairs} by turnover.</div>
    <button class="btn" onclick="copyOut(mineList().join('\\n'),
      mineList().length + ' coins')">Copy my list for bot/coins.txt</button>`;
}

/* Adds a sector to your list rather than replacing it. The old picker set the
   list to the sector, so choosing "AI" silently threw away everything else. */
function addSector(name) {

let FOCUSQ = "";

/* Add exactly what was typed. Tolerant about how you write it — btc, BTC,
   BTC/USDT and BTCUSDT all mean the same coin, and a list that rejects your
   input because of punctuation is a list you stop maintaining. */
function addTyped() {
  const box = document.getElementById("fq");
  const raw = ((box && box.value) || FOCUSQ || "").trim().toUpperCase()
    .replace(/[^A-Z0-9]/g, "");
  if (!raw) return;
  const sym = raw.endsWith("USDT") ? raw : raw + "USDT";
  if (mineList().includes(sym)) {
    toast(sym.replace("USDT", "") + " is already on your list");
    return;
  }
  const known = ALLSYMS.includes(sym);
  focusOn(sym);
  if (!known) toast(sym.replace("USDT", "") + " added — not listed yet, so it "
    + "will stay quiet until an exchange carries it");
}

function focusFilter(q) {
  FOCUSQ = q;
  const up = q.trim().toUpperCase();
  // Filter in place rather than re-rendering the whole screen: a redraw on
  // every keystroke loses the keyboard focus, which makes typing impossible.
  const mine = mineList();
  const pool = (ALLSYMS.length ? ALLSYMS : [])
    .filter((x) => !mine.includes(x) && (!up || x.includes(up)))
    .slice(0, 40);
  const target = document.getElementById("fpool");
  if (!target) return;
  if (pool.length) {
    target.innerHTML = pool.map((sym) => `<button class="chip"
      onclick="focusOn('${esc(sym)}')">${esc(sym.replace("USDT", ""))}</button>`)
      .join("");
    return;
  }
  // Nothing matched. That usually means the coin is not on the exchange the
  // app reads — but the list is yours, and refusing to add something because
  // the venue of the day has not listed it is the app deciding for you. Offer
  // it anyway, and say plainly what will happen.
  const guess = up.endsWith("USDT") ? up : up + "USDT";
  target.innerHTML = up
    ? `<button class="chip" onclick="focusOn('${esc(guess)}')">
         Add ${esc(up)} anyway</button>
       <span class="hint" style="display:block;margin-top:6px">No listed pair
         matches “${esc(up)}”. You can still add it — it will simply produce
         nothing until an exchange the app can reach carries it.</span>`
    : '<span class="hint">No coin matches.</span>';
}

const MAJORS = ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","ADAUSDT",
                "DOGEUSDT","AVAXUSDT","LINKUSDT","DOTUSDT"];

function onlyMine() {
  if (CFG.pairMode === "custom") {

    CFG.pairMode = "custom";

/* The biggest N by 24h turnover, added to your list.

   Ranked by turnover rather than by "market cap top 100", because turnover is
   what this app can actually verify from the exchange. A coin with a huge
   valuation and no volume cannot be traded on a stop, whatever a coin-ranking
   site says about it. */
function addTopN(n) {
  if (!ALLSYMS.length) { toast("Coin list still loading — try again in a moment"); return; }
  const add = ALLSYMS.slice(0, n);
  const before = mineList().length;
  CFG.focus = [...new Set([...CFG.focus, ...add])];
  const now = mineList().length;
  writeHash(); render(true); refresh();
  // Said out loud because it is a real cost, not a scary warning: every coin
  // is fetched on every scan, on this phone, every five minutes.
  toast((now - before) + " added — " + now + " coins now"
    + (now > 60 ? ". Scans will take noticeably longer." : ""));
}

function focusMajors() {
  CFG.focus = [...new Set([...CFG.focus, ...MAJORS])];

/* Your coins, as one list. `custom` is kept only so old links and saved
   setups still open — anything in it is folded in rather than competing. */
function mineList() {
  return [...new Set([...(CFG.focus || []), ...(CFG.custom || [])])];

function focusOn(sym) {
  if (!CFG.focus.includes(sym)) CFG.focus = [...CFG.focus, sym];

  // only one would make a coin you just tapped reappear on the next redraw.
  CFG.focus = CFG.focus.filter((x) => x !== sym);
  CFG.custom = (CFG.custom || []).filter((x) => x !== sym);
  writeHash(); render(true); refresh();

}

    // Setups that failed a filter are kept apart from the ones that passed.

    const gone = OPEN.filter(s => !s.belowBar && entryGone(s));

        + '<div class="hint">Tap a card to expand its targets</div>'

      + (gone.length ? `<h2>Already running (${gone.length})</h2>
        <div class="segnote">Sold, stopped, or moved too far from the entry on

        </div>` + gone.slice(0, 5).map(card).join("")
        + (gone.length > 5 ? `<div class="hint">${gone.length - 5} more on the

/* ==========================================================================
   Backtester. Replays the strategy over deep history and runs it as an
   account rather than as a list of signals: one position per pair, a cap on
   how many run at once, size chosen from the stop distance so every trade
   risks the same slice of equity, a fifth of the position taken off at each
   target, stop to breakeven after the configured target, taker fees both
   ways, and the equity compounding as it goes.
   ========================================================================== */
const BT = {
  scope:"focus",        // "focus" | "universe" | "one"
  bars:1000,            // candles of history to pull per pair
  equity0:1000,
  riskPct:2,            // % of equity lost if a trade stops out
  maxOpen:5,            // positions held at the same time
  feeBps:5,             // taker fee per side, basis points

  // The backtest carries its own strategy settings so you can tune here
  // without touching what the live scanner is doing.
  strategy:"occ",       // "occ" | "confluence" | "both"
  signalTf:"1h", trendTf:"4h",
  requireHtf:true,      // only take entries that agree with the trend timeframe
  minScore:6,           // confluence threshold
  occMaType:"SMMA", occMaLen:8, occMult:3, occExitOnCross:true,
  srPivot:5, srZoneAtr:0.6, srMinTouch:2, srMaxAge:400,
  srMode:"both", srZoneStop:true, srBreakAtr:0.25,
  utKey:3, utAtrLen:10,
  ttLen:10, ttTarget:0,

  running:false, prog:0, note:"", err:null,
  runs:[], sel:0, res:null,
};
const BTCACHE = new Map();
const BT_STRATS = {occ:"Open/Close Cross", confluence:"Confluence",
                   sr:"Support & Resistance", ut:"UT Bot",
                   tt:"Target Trend", pat:"Chart patterns",
                   brk:"Breakout", rsi:"RSI Strategy",
                   mr:"Mean Reversion", mom:"Momentum"};
const BT_KEYS = ["strategy","signalTf","trendTf","requireHtf","minScore",
  "occMaType","occMaLen","occMult","occExitOnCross",
  "srPivot","srZoneAtr","srMinTouch","srMaxAge","srMode","srZoneStop","srBreakAtr",
  "utKey","utAtrLen","ttLen","ttTarget",
  "brkLen","brkAtrStop","brkMinAdx","rsiLen","rsiLow","rsiHigh","rsiWithTrend",
  "mrLen","mrZ","mrMaxAdx","momLen","momPct","momMinAdx",
  "patPivot","patTol","patFlat","patMaxAge","patCooldown","patMinHeight","patMinSpan",
  "patFlagRun","patFlagPause","patFlagAtr","patCupBars","patTargets"];

/* The strategy functions read CFG, so a run swaps the backtest's settings in,
   does all of its work synchronously, then puts CFG back. Nothing async
   happens in between, so no render can ever observe the swapped state. */
function btSwapCfg(strategy) {
  const keep = {};
  for (const k of BT_KEYS) keep[k] = CFG[k];
  for (const k of BT_KEYS) if (k !== "strategy") CFG[k] = BT[k];
  CFG.strategy = strategy;
  return keep;
}
function btRestoreCfg(keep) { for (const k in keep) CFG[k] = keep[k]; }

function btSymbols() {
  if (BT.scope === "one") return [chSym()];
  if (BT.scope === "top20")
    return (ALLSYMS.length ? ALLSYMS : CFG.focus).slice(0, 20);
  if (BT.scope === "chosen")
    return (CFG.custom.length ? CFG.custom : CFG.focus).slice(0, 30);
  if (BT.scope === "universe")
    return (UNIVERSE.length ? UNIVERSE : CFG.focus).slice(0, 30);
  return CFG.focus.slice();
}

async function btKlines(sym, tf, limit) {
  const key = sym+":"+tf+":"+limit;
  if (BTCACHE.has(key)) return BTCACHE.get(key);
  const order = SOURCE ? [SOURCE, ...SRC.filter(s=>s!==SOURCE)] : SRC;
  let err;
  for (const src of order) {
    try {
      const rows = await klinesFrom(src, sym, tf, limit);
      if (rows.length > 250) { SOURCE = src; BTCACHE.set(key, rows); return rows; }
    } catch (e) { err = e; }
  }
  throw err || new Error("no data");
}

/* Every entry the strategy would have taken, untracked. */
function btCandidates(sym, ltf, h) {
  const d = enrich(ltf), out = [];
  if (CFG.strategy === "occ") {
    const crosses = occCrosses(ltf);
    const tag = `${CFG.occMaType}${CFG.occMaLen}×${CFG.occMult}`;
    for (let k = 0; k < crosses.length; k++) {
      const x = crosses[k];
      if (x.idx < 210 || x.idx > d.c.length-2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side, tag,
        [`${CFG.occMaType}(${CFG.occMaLen}) close/open cross`]);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      if (CFG.occExitOnCross && crosses[k+1]) sig.exitIdx = crosses[k+1].idx;
      out.push(sig);
    }
  } else if (CFG.strategy === "ut") {
    for (const x of utCrosses(d).crosses) {
      if (x.idx < 210 || x.idx > d.c.length-2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side,
        `UT ${CFG.utKey}/${CFG.utAtrLen}`, ["ATR trailing stop cross"], x.stop);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "tt") {
    for (const f of ttFlips(d).flips) {
      if (f.idx < 210 || f.idx > d.c.length-2) continue;
      const sig = ttSignal(sym, d, f);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[f.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "sr") {
    for (const hit of srScan(d)) {
      const sig = srSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "pat") {
    for (const hit of patScan(d)) {
      const sig = patSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (SIMPLE_STRATS[CFG.strategy]) {
    for (const hit of SIMPLE_STRATS[CFG.strategy](d)) {
      const sig = simpleSignals(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else {
    let lastIdx = -999;
    for (let i = 210; i < d.c.length-1; i++) {
      if (i - lastIdx < CFG.cooldownBars) continue;
      const sig = makeSignal(sym, d, i);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[i].t) !== sig.side) continue;
      out.push(sig); lastIdx = i;
    }
  }
  return {d, out};
}

/* What actually happened to one trade, as a list of partial exits.
   The stop is checked before the targets on every bar - if a candle covers
   both, the pessimistic reading is taken. */
function btPath(sig, d) {
  const long = sig.side === "LONG";
  const n = sig.targets.length, frac = 1/n;
  let stop = sig.initialStop, hits = 0, be = false, rem = 1;
  const events = [];
  let reason = "open", endI = d.c.length-1;

  for (let i = sig.idx+1; i < d.c.length; i++) {
    const b = d.c[i];
    if (long ? b.l <= stop : b.h >= stop) {
      events.push({t:b.t, frac:rem, price:stop, kind: be?"breakeven":"stop"});
      rem = 0; reason = be ? "breakeven" : "stopped"; endI = i; break;
    }
    for (const t of sig.targets) {
      if (t.hit) continue;
      if (long ? b.h >= t.price : b.l <= t.price) {
        t.hit = true; t.at = b.t; hits++;
        events.push({t:b.t, frac, price:t.price, kind:"tp"+t.index});
        rem -= frac;
      }
    }
    if (CFG.beAfter && !be && hits >= CFG.beAfter) { be = true; stop = sig.entry; }
    if (hits >= n) { reason = "all targets"; endI = i; rem = 0; break; }
    if (sig.exitIdx != null && i >= sig.exitIdx) {
      if (rem > 0.0001) events.push({t:b.t, frac:rem, price:b.c, kind:"cross"});
      rem = 0; reason = "opposite cross"; endI = i; break;
    }
  }
  if (rem > 0.0001) {                       // never resolved inside the window
    const b = d.c[d.c.length-1];
    events.push({t:b.t, frac:rem, price:b.c, kind:"end"});
    reason = "still open"; endI = d.c.length-1;
  }
  return {events, reason, bars: endI - sig.idx, hits};
}

/* Run the candidates as one account, in time order. */
function btSimulate(cands, tf) {
  const fee = BT.feeBps/10000;
  cands.sort((a,b)=>a.sig.at - b.sig.at);
  let eq = BT.equity0, peak = eq, maxDD = 0, skipped = 0;
  const curve = [], trades = [], queue = [];
  const openSym = new Set();
  let openCount = 0;

  const settle = until => {
    queue.sort((a,b)=>a.t-b.t);
    while (queue.length && queue[0].t <= until) {
      const e = queue.shift();
      eq += e.pnl;
      e.trade.pnl += e.pnl;
      if (e.final) { openCount--; openSym.delete(e.sym); e.trade.closedAt = e.t; }
      peak = Math.max(peak, eq);
      if (peak > 0) maxDD = Math.max(maxDD, (peak-eq)/peak*100);
      curve.push({t:e.t, eq:+eq.toFixed(2)});
    }
  };

  for (const c of cands) {
    const s = c.sig;
    settle(s.at);
    if (eq <= 0) break;
    if (openCount >= BT.maxOpen || openSym.has(s.symbol)) { skipped++; continue; }
    const stopPct = Math.abs(s.entry - s.initialStop)/s.entry;
    if (!(stopPct > 0)) { skipped++; continue; }

    const risk = eq * BT.riskPct/100;
    const notional = Math.min(risk/stopPct, eq * CFG.maxLev);
    const dir = s.side === "LONG" ? 1 : -1;
    openCount++; openSym.add(s.symbol);

    const tr = {sym:s.symbol, side:s.side, at:s.at, entry:s.entry,
                stop:s.initialStop, lev:+(notional/eq).toFixed(1),
                notional:+notional.toFixed(2), pnl:0, closedAt:null,
                reason:c.path.reason, bars:c.path.bars, hits:c.path.hits,
                risk:+risk.toFixed(2), tag:s.tag};
    eq -= notional*fee;                        // entry fee, paid immediately
    tr.pnl -= notional*fee;
    peak = Math.max(peak, eq);
    if (peak > 0) maxDD = Math.max(maxDD, (peak-eq)/peak*100);
    curve.push({t:s.at, eq:+eq.toFixed(2)});

    const ev = c.path.events;
    ev.forEach((e,k) => {
      const part = notional*e.frac;
      const gross = part*(e.price - s.entry)/s.entry*dir;
      queue.push({t:e.t, pnl: gross - part*fee, final: k === ev.length-1,
                  sym:s.symbol, trade:tr});
    });
    trades.push(tr);
  }
  settle(Infinity);

  // ---- metrics. Everything has settled by now; "still open" means the trade
  // had not resolved when the data ran out, and was marked out at the last close.
  const done = trades.filter(t=>t.closedAt);
  const openEnd = trades.filter(t=>t.reason === "still open").length;
  const wins = done.filter(t=>t.pnl > 0), losses = done.filter(t=>t.pnl <= 0);
  const gp = wins.reduce((a,t)=>a+t.pnl,0);
  const gl = Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
  let ws=0, ls=0, wsMax=0, lsMax=0;
  for (const t of done) {
    if (t.pnl > 0) { ws++; ls=0; wsMax=Math.max(wsMax,ws); }
    else { ls++; ws=0; lsMax=Math.max(lsMax,ls); }
  }
  const bySym = {};
  for (const t of done) {
    const b = bySym[t.sym] || (bySym[t.sym] = {sym:t.sym, n:0, wins:0, pnl:0});
    b.n++; b.pnl += t.pnl; if (t.pnl > 0) b.wins++;
  }
  const byMonth = {};
  for (const t of done) {
    const d = new Date(t.closedAt);
    const k = d.getFullYear()+"-"+pad2(d.getMonth()+1);
    const b = byMonth[k] || (byMonth[k] = {k, n:0, wins:0, pnl:0,
      label:d.toLocaleDateString(undefined,{month:"short",year:"numeric"})});
    b.n++; b.pnl += t.pnl; if (t.pnl > 0) b.wins++;
  }
  const span = cands.length
    ? [cands[0].sig.at, Math.max(...done.map(t=>t.closedAt||t.at), cands[0].sig.at)]
    : [0,0];

  return {
    tf, strategy: CFG.strategy, symbols: new Set(cands.map(c=>c.sig.symbol)).size,
    equity0: BT.equity0, equity: +eq.toFixed(2),
    netPct: +((eq-BT.equity0)/BT.equity0*100).toFixed(1),
    n: done.length, taken: trades.length, skipped, candidates: cands.length,
    open: openEnd,
    winRate: done.length ? +(wins.length/done.length*100).toFixed(1) : 0,
    pf: gl > 0 ? +(gp/gl).toFixed(2) : (gp>0 ? Infinity : 0),
    expectancy: done.length ? +((gp-gl)/done.length).toFixed(2) : 0,
    avgWin: wins.length ? +(gp/wins.length).toFixed(2) : 0,
    avgLoss: losses.length ? +(gl/losses.length).toFixed(2) : 0,
    maxDD: +maxDD.toFixed(1), wsMax, lsMax,
    avgBars: done.length ? +(done.reduce((a,t)=>a+t.bars,0)/done.length).toFixed(1) : 0,
    avgTps: done.length ? +(done.reduce((a,t)=>a+t.hits,0)/done.length).toFixed(2) : 0,
    curve, trades: done.slice().sort((a,b)=>b.closedAt-a.closedAt),
    bySym: Object.values(bySym).sort((a,b)=>b.pnl-a.pnl),
    byMonth: Object.values(byMonth).sort((a,b)=>a.k<b.k?1:-1),
    span,
  };
}

async function runBacktest() {
  if (BT.running) return;
  BT.running = true; BT.err = null; BT.runs = []; BT.res = null;
  BT.sel = 0; BT.prog = 0;
  const tf = BT.signalTf, syms = btSymbols();
  BT.note = "Downloading " + syms.length + " pairs…";
  render(true); progress(0.02);

  // ---- 1. candles first. Nothing strategy-specific happens here, so the two
  //         strategies in a comparison run share exactly the same data.
  const data = new Map();
  let got = 0, failed = 0;
  const queue = syms.slice();
  const worker = async () => {
    while (queue.length) {
      const sym = queue.shift();
      try {
        const [ltf, htf] = await Promise.all([
          btKlines(sym, tf, BT.bars),
          btKlines(sym, BT.trendTf, Math.min(1000, BT.bars)),
        ]);
        data.set(sym, {ltf, h: enrich(htf)});
      } catch (e) { failed++; if (!BT.err) BT.err = e.message || String(e); }
      got++; BT.prog = got/syms.length;
      progress(0.02 + BT.prog*0.75);
      BT.note = "Downloaded " + got + " of " + syms.length + " pairs";
      if (got % 2 === 0) render(true);
    }
  };
  await Promise.all(Array.from({length:4}, worker));
  if (failed < syms.length) BT.err = null;

  if (!data.size) {
    BT.err = BT.err || "No candle data came back.";
    BT.running = false; BT.note = ""; progress(0); render(true); return;
  }

  // ---- 2. replay each strategy over that data
  const list = BT.strategy === "all"
    ? ["occ","sr","confluence","ut","tt","pat","brk","rsi","mr","mom"]
    : [BT.strategy];
  for (let k = 0; k < list.length; k++) {
    const strat = list[k];
    BT.note = "Replaying " + BT_STRATS[strat] + "…";
    render(true);
    await new Promise(r=>setTimeout(r, 40));      // let the note paint

    const keep = btSwapCfg(strat);                // ---- synchronous from here
    try {
      const cands = [];
      for (const [sym, v] of data) {
        const {d, out} = btCandidates(sym, v.ltf, v.h);
        for (const sig of out) cands.push({sig, path: btPath(sig, d)});
      }
      const res = btSimulate(cands, tf);
      res.label = BT_STRATS[strat];
      res.detail = strat === "ut"
        ? `key ${BT.utKey} on ATR(${BT.utAtrLen})`
        : strat === "tt"
        ? `length ${BT.ttLen}, targets +${BT.ttTarget}`
        : strat === "occ"
        ? `${BT.occMaType} ${BT.occMaLen} on ${tfLabel(BARMIN[tf]*BT.occMult)} candles`
        : strat === "sr"
        ? `${BT.srMode === "both" ? "bounces + breakouts"
            : BT.srMode === "bounce" ? "bounces only" : "breakouts only"} · `
          + `${BT.srMinTouch}+ touches`
        : strat === "pat"
        ? `shapes ${BT.patMinSpan}+ bars wide, ${BT.patMinHeight}× ATR tall`
        : `${BT.minScore}/8 confluence`;
      BT.runs.push({key:strat, res});
    } catch (e) { BT.err = e.message || String(e); }
    btRestoreCfg(keep);                           // ---- swapped back
    progress(0.77 + (k+1)/list.length*0.2);
  }

  BT.res = BT.runs.length ? BT.runs[0].res : null;
  BT.running = false; BT.prog = 1; BT.note = "";
  progress(1); render(true);
  setTimeout(()=>progress(0), 700);
}

/* ---------------------------------------------------------- equity canvas */
function drawEquity() {
  const cv = document.getElementById("eqcv");
  if (!cv || !BT.res || !BT.res.curve.length) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const W = Math.max(240, cv.clientWidth), H = 170;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.height = H + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.font = "9.5px -apple-system,system-ui,sans-serif";
  ctx.textBaseline = "middle";

  const c = BT.res.curve;
  const padR = 54, padL = 3, top = 8, bot = H-20;
  let hi = -Infinity, lo = Infinity;
  for (const p of c) { hi = Math.max(hi,p.eq); lo = Math.min(lo,p.eq); }
  hi = Math.max(hi, BT.equity0); lo = Math.min(lo, BT.equity0);
  if (hi === lo) { hi += 1; lo -= 1; }
  const padY = (hi-lo)*0.08; hi += padY; lo -= padY;
  const t0 = c[0].t, t1 = c[c.length-1].t || t0+1;
  const X = t => padL + (t-t0)/Math.max(1,(t1-t0))*(W-padL-padR);
  const Y = v => top + (hi-v)/(hi-lo)*(bot-top);

  ctx.strokeStyle = "#212127"; ctx.fillStyle = "#7c7c85"; ctx.textAlign = "left";
  for (let k=0;k<=3;k++) {
    const v = lo + (hi-lo)*k/3, y = Math.round(Y(v))+.5;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText("$"+Math.round(v).toLocaleString(), W-padR+5, y);
  }
  // starting equity line
  ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle = "#4a4a55";
  ctx.beginPath(); ctx.moveTo(padL, Y(BT.equity0));
  ctx.lineTo(W-padR, Y(BT.equity0)); ctx.stroke(); ctx.restore();

  const end = c[c.length-1].eq, good = end >= BT.equity0;
  const grad = ctx.createLinearGradient(0, top, 0, bot);
  grad.addColorStop(0, good ? "rgba(62,207,142,.30)" : "rgba(229,72,77,.30)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath();
  c.forEach((p,i)=> i ? ctx.lineTo(X(p.t),Y(p.eq)) : ctx.moveTo(X(p.t),Y(p.eq)));
  ctx.lineTo(X(c[c.length-1].t), Y(lo)); ctx.lineTo(X(c[0].t), Y(lo));
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath(); ctx.lineWidth = 1.8;
  ctx.strokeStyle = good ? "#3ecf8e" : "#ff6b6f";
  c.forEach((p,i)=> i ? ctx.lineTo(X(p.t),Y(p.eq)) : ctx.moveTo(X(p.t),Y(p.eq)));
  ctx.stroke();

  ctx.fillStyle = "#7c7c85"; ctx.textAlign = "left";
  ctx.fillText(new Date(t0).toLocaleDateString(undefined,
    {day:"numeric",month:"short"}), padL+2, H-9);
  ctx.textAlign = "right";
  ctx.fillText(new Date(t1).toLocaleDateString(undefined,
    {day:"numeric",month:"short"}), W-padR-2, H-9);
}

/* ------------------------------------------------------------ backtest UI */
/* =========================================================================
   AUTO-TUNE — a real parameter search, run inside the backtester.

   It reuses the backtest's own account simulation, so a tuned result means
   the same thing the Backtest tab means: position sizing off the stop, fees,
   partial exits, compounding equity.

   Why it is not simply "try everything and take the winner":

     Searching 20,000 combinations on one stretch of history and keeping the
     best is a reliable way to discover noise. The more you search, the better
     the luckiest combination looks. So:

     - History is cut into four blocks by time. Three are used for ranking,
       the newest is a holdout the search never sees.
     - A combination is scored on the MEDIAN of the three ranking blocks, not
       the sum, so one lucky stretch cannot carry it.
     - Score is return divided by worst drawdown, which prefers a steady
       curve over one that triples and then halves.
     - The winner is re-tested on the holdout and on its own neighbours.

   Search is two-phase: a random sweep to find promising regions, then
   coordinate descent (walk each setting to its best value, repeat until
   nothing improves) which converges far faster than brute force.
   ========================================================================= */

const OPT = {
  running: false, cancel: false,
  budget: 5000,               // evaluation cap
  evals: 0, phase: "", note: "",
  best: null, res: null, err: null,
  startedAt: 0, eta: 0,
  data: null, dataKey: "",
};

const OPT_BUDGETS = [1000, 20000, 100000];

/* Timeframe pairs the search may choose between. Making the chart itself a
   searchable setting is what takes the space past six figures - and it is a
   real question, since a strategy that fails on 1h can work on 4h. */
/* Rather than a hand-written list, every signal period is paired with every
   trend period between 3x and 20x its length. Below 3x the "trend" is the same
   noise read twice; above 20x it barely moves inside the trade and stops
   filtering anything. The rule produces every combination worth testing —
   2h against 1d, 1h against 12h, 30m against 8h — without inventing pairs
   that cannot inform each other. */
const TF_SIGNAL = ["1m","3m","5m","15m","30m","1h","2h","4h","6h","12h","1d"];
const TF_TREND  = ["3m","5m","15m","30m","1h","2h","4h","6h","8h","12h","1d","3d","1w"];
const OPT_TFS = (() => {
  const out = [];
  for (const sig of TF_SIGNAL) {
    for (const trend of TF_TREND) {
      const ratio = BARMIN[trend] / BARMIN[sig];
      if (ratio >= 3 && ratio <= 20) out.push([sig, trend]);
    }
  }
  return out;
})();

/* ------------------------------------------------------------ the space */
/* When a specific speed is being tuned, the timeframe is that speed's own -
   otherwise "Scalp" would happily wander off and choose daily candles. */
let OPT_TF_LOCK = null;
/* A shortlist of chart periods, set by the first pass of the search. */
let OPT_TF_SET = null;

function optSpace(strategy) {
  // Every section of Settings that can sensibly be searched is in here, so
  // "Find my best setup" answers the whole page rather than a corner of it.
  const common = {
    tfPair: OPT_TF_LOCK ? [OPT_TF_LOCK]
          : OPT_TF_SET ? OPT_TF_SET.slice()
          : OPT_TFS.map((p) => p.join(">")),
    requireHtf: [true, false],
    riskPct: [1, 2, 3, 5],
    maxOpen: [3, 5, 8, 12],
    slAtr: [1.0, 1.5, 2.0, 2.5, 3.0],
    beAfter: [0, 1, 2, 3],
    minAgree: [0, 2, 3, 4],
    cooldownBars: [1, 4, 8, 16],
  };
  if (strategy === "occ") {
    return {
      ...common,
      occMaType: ["SMA", "EMA", "DEMA", "TEMA", "WMA", "SMMA", "HullMA",
                  "LSMA", "ALMA", "SSMA", "TMA"],
      occMaLen: [1, 3, 5, 8, 13, 21, 34, 50],
      occMult: [1, 2, 3, 4, 5, 6, 8],
      occExitOnCross: [true, false],
    };
  }
  if (strategy === "ut") {
    return {
      ...common,
      utKey: [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8],
      utAtrLen: [5, 7, 10, 14, 20, 28],
    };
  }
  if (strategy === "tt") {
    return {
      ...common,
      ttLen: [5, 8, 10, 14, 20, 30],
      ttTarget: [0, 1, 2, 3, 5],
    };
  }
  if (strategy === "sr") {
    return {
      ...common,
      srPivot: [2, 3, 5, 8, 12],
      srZoneAtr: [0.2, 0.4, 0.6, 0.9, 1.3],
      srMinTouch: [2, 3, 4],
      srMaxAge: [150, 300, 400, 600],
      srMode: ["bounce", "breakout", "both"],
      srZoneStop: [true, false],
      srBreakAtr: [0.1, 0.2, 0.25, 0.4, 0.6],
    };
  }
  if (strategy === "brk") {
    return { ...common, brkLen: [10, 15, 20, 30, 55],
             brkAtrStop: [1.0, 1.5, 2.5], brkMinAdx: [0, 15, 18, 22, 28] };
  }
  if (strategy === "rsi") {
    return { ...common, rsiLow: [20, 25, 30, 35], rsiHigh: [65, 70, 75, 80],
             rsiWithTrend: [true, false] };
  }
  if (strategy === "mr") {
    return { ...common, mrLen: [14, 20, 30, 50], mrZ: [1.8, 2.2, 2.6, 3.0],
             mrMaxAdx: [16, 22, 28] };
  }
  if (strategy === "mom") {
    return { ...common, momLen: [6, 12, 20, 34], momPct: [1.5, 2.5, 4, 6],
             momMinAdx: [0, 18, 25] };
  }
  if (strategy === "pat") {
    return {
      ...common,
      patPivot: [2, 3, 4, 6, 8],
      patTol: [1.0, 1.75, 2.5, 4.0],
      patFlat: [0.5, 1.2, 2.0],
      patMinHeight: [0.8, 1.2, 2.0, 3.0],
      patMinSpan: [8, 14, 22, 35],
      patMaxAge: [80, 140, 220],
      patFlagAtr: [2, 3, 4.5],
    };
  }
  return { ...common, minScore: [4, 5, 6, 7, 8], adxMin: [10, 15, 20, 25, 30],
           volMult: [1.0, 1.15, 1.3] };
}

const optSize = (space) =>
  Object.values(space).reduce((a, o) => a * o.length, 1);

const optKey = (c) => Object.keys(c).sort().map((k) => k + "=" + c[k]).join("|");

/* -------------------------------------------------- candidates, no re-enrich
   btCandidates() calls enrich() every time it runs. Indicator periods are
   fixed, so across thousands of trials that is the same work repeated
   thousands of times. This mirrors it exactly but takes the series already
   built. That single change is what makes a big search practical.          */
function optCandidates(sym, ltf, d, h) {
  const out = [];
  if (CFG.strategy === "occ") {
    const crosses = occCrosses(ltf);
    for (let k = 0; k < crosses.length; k++) {
      const x = crosses[k];
      if (x.idx < 210 || x.idx > d.c.length - 2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side, "opt", []);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      if (CFG.occExitOnCross && crosses[k + 1]) sig.exitIdx = crosses[k + 1].idx;
      out.push(sig);
    }
  } else if (CFG.strategy === "ut") {
    for (const x of utCrosses(d).crosses) {
      if (x.idx < 210 || x.idx > d.c.length - 2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side, "opt", [], x.stop);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "tt") {
    for (const f of ttFlips(d).flips) {
      if (f.idx < 210 || f.idx > d.c.length - 2) continue;
      const sig = ttSignal(sym, d, f);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[f.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "sr") {
    for (const hit of srScan(d)) {
      const sig = srSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (CFG.strategy === "pat") {
    for (const hit of patScan(d)) {
      const sig = patSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else if (SIMPLE_STRATS[CFG.strategy]) {
    for (const hit of SIMPLE_STRATS[CFG.strategy](d)) {
      const sig = simpleSignals(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      out.push(sig);
    }
  } else {
    let last = -999;
    for (let i = 210; i < d.c.length - 1; i++) {
      if (i - last < CFG.cooldownBars) continue;
      const sig = makeSignal(sym, d, i);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[i].t) !== sig.side) continue;
      out.push(sig); last = i;
    }
  }
  return out;
}

/* ------------------------------------------------------------- one trial */
function optTrial(params, strategy) {
  const tfKey = params.tfPair || (BT.signalTf + ">" + BT.trendTf);
  const prep = OPT.data[tfKey] || OPT.data[Object.keys(OPT.data)[0]];
  if (!prep) return { folds: [], holdout: {n:0, netPct:0, maxDD:0, score:-999},
                      trades: 0, obj: -Infinity, worstFold: -Infinity };

  const keepBt = {};
  const keepAgree = CFG.minAgree;
  for (const k in params) {
    if (k === "tfPair") continue;
    if (k === "minAgree") { CFG.minAgree = params[k]; continue; }
    keepBt[k] = BT[k]; BT[k] = params[k];
  }
  const keepStf = BT.signalTf, keepTtf = BT.trendTf;
  if (params.tfPair) {
    const [s, t] = params.tfPair.split(">");
    BT.signalTf = s; BT.trendTf = t;
  }
  const keepCfg = btSwapCfg(strategy);

  let folds, holdout;
  try {
    const cands = [];
    for (const p of prep.symbols) {
      for (const sig of optCandidates(p.sym, p.ltf, p.d, p.h)) {
        cands.push({ sig, path: btPath(sig, p.d) });
      }
    }
    const inWindow = (w) => cands.filter((c) => c.sig.at >= w[0] && c.sig.at < w[1]);
    folds = prep.folds.map((w) => optMetrics(btSimulate(inWindow(w), BT.signalTf)));
    holdout = optMetrics(btSimulate(inWindow(prep.holdout), BT.signalTf));
  } finally {
    btRestoreCfg(keepCfg);
    for (const k in keepBt) BT[k] = keepBt[k];
    BT.signalTf = keepStf; BT.trendTf = keepTtf;
    CFG.minAgree = keepAgree;
  }

  const scores = folds.map((f) => f.score);
  const trades = folds.reduce((a, f) => a + f.n, 0);
  const thin = folds.filter((f) => f.n < 5).length;
  const sorted = scores.slice().sort((a, b) => a - b);
  const median = sorted[1];                       // three folds

  return {
    folds, holdout, trades,
    // a combination that only works in one of three periods is not an edge
    obj: thin > 1 || trades < 20 ? -Infinity : median,
    worstFold: sorted[0],
  };
}

function optMetrics(r) {
  const dd = Math.max(5, r.maxDD || 0);
  return {
    n: r.n, netPct: r.netPct, maxDD: r.maxDD, pf: r.pf,
    winRate: r.winRate, equity: r.equity,
    score: r.n < 5 ? -999 : +(r.netPct / dd).toFixed(3),
  };
}

/* ------------------------------------------------------------ preparation */
async function optPrepare(strategy, tfPairs) {
  const pairs = tfPairs && tfPairs.length ? tfPairs : [[BT.signalTf, BT.trendTf]];
  const key = [BT.scope, BT.bars, chSym(),
               pairs.map((p) => p.join(">")).join(",")].join("|");
  if (OPT.data && OPT.dataKey === key) return true;

  // Every (coin x chart period) is a full set of enriched candles held at
  // once. Thirty-odd periods across twenty coins is six hundred of them, which
  // is where a phone runs out of room and the tab dies. The cap trims the coin
  // list rather than the period list — comparing periods is the entire point
  // of the search — and it reports what it cut instead of quietly shrinking.
  const CAP = 400;
  let syms = btSymbols();
  OPT.trimmed = 0;
  if (syms.length * pairs.length > CAP) {
    const room = Math.max(8, Math.floor(CAP / pairs.length));
    if (room < syms.length) {
      OPT.trimmed = syms.length - room;
      syms = syms.slice(0, room);
    }
  }
  const total = syms.length * pairs.length;
  const sets = {};
  let done = 0;

  for (const [stf, ttf] of pairs) {
    if (OPT.cancel) break;
    const list = [];
    const queue = syms.slice();
    const worker = async () => {
      while (queue.length && !OPT.cancel) {
        const sym = queue.shift();
        try {
          const [ltf, htf] = await Promise.all([
            btKlines(sym, stf, BT.bars),
            btKlines(sym, ttf, Math.min(1000, BT.bars)),
          ]);
          list.push({ sym, ltf, d: enrich(ltf), h: enrich(htf) });
        } catch (e) { if (!OPT.err) OPT.err = e.message || String(e); }
        done++;
        OPT.note = `Downloading ${done} of ${total} (${stf}/${ttf})`;
        if (done % 3 === 0) { render(true); await optPause(); }
      }
    };
    await Promise.all(Array.from({ length: 4 }, worker));
    if (!list.length) continue;

    // Four equal spans of time: three to rank on, the newest held back.
    let lo = Infinity, hi = -Infinity;
    for (const p of list) {
      lo = Math.min(lo, p.ltf[0].t);
      hi = Math.max(hi, p.ltf[p.ltf.length - 1].t);
    }
    const q = (hi - lo) / 4;
    sets[stf + ">" + ttf] = {
      symbols: list,
      folds: [[lo, lo + q], [lo + q, lo + 2 * q], [lo + 2 * q, lo + 3 * q]],
      holdout: [lo + 3 * q, hi + 1],
      span: [lo, hi],
    };
  }

  if (!Object.keys(sets).length) {
    OPT.err = OPT.err || "No candle data came back.";
    return false;
  }
  OPT.err = null;
  OPT.data = sets;                       // keyed by "signalTf>trendTf"
  OPT.dataKey = key;
  return true;
}

const optPause = () => new Promise((r) => setTimeout(r, 0));

/* ------------------------------------------------------------- the search */
async function autoTune() {
  if (OPT.running) return;
  const strategy = BT.strategy === "all" ? "occ" : BT.strategy;

  OPT.running = true; OPT.cancel = false; OPT.evals = 0;
  OPT.res = null; OPT.best = null; OPT.err = null;
  OPT.startedAt = Date.now();
  OPT.phase = "Preparing";
  render(true);

  const space0 = optSpace(strategy);
  const tfPairs = (space0.tfPair || []).map((s) => s.split(">"));
  if (!(await optPrepare(strategy, tfPairs))) {
    OPT.running = false; OPT.phase = ""; OPT.note = ""; render(true); return;
  }
  if (OPT.cancel) { optFinish(strategy, null, []); return; }

  const space = space0;
  const keys = Object.keys(space);
  const total = optSize(space);
  const seen = new Map();
  let tick = performance.now();

  // Best score seen on each timeframe pair, so the result can show that every
  // duration really was tried and what each one managed.
  const byTf = {};
  const evaluate = (combo) => {
    const k = optKey(combo);
    if (seen.has(k)) return seen.get(k);
    const r = optTrial(combo, strategy);
    seen.set(k, r);
    OPT.evals++;
    const tf = combo.tfPair;
    if (tf) {
      const cur = byTf[tf];
      if (!cur || (isFinite(r.obj) && r.obj > cur.obj)) {
        byTf[tf] = { obj: r.obj, holdout: r.holdout, tried: (cur ? cur.tried : 0) + 1 };
      } else { cur.tried++; }
    }
    return r;
  };

  const breathe = async () => {
    if (performance.now() - tick < 40) return;
    tick = performance.now();
    const per = (Date.now() - OPT.startedAt) / Math.max(1, OPT.evals);
    OPT.eta = Math.round((Math.min(OPT.budget, total) - OPT.evals) * per / 1000);
    // Not render(true). Forcing a full rebuild of the Settings page every time
    // the trial counter moves is what locked the screen during a deploy; the
    // throttle below keeps the progress readable without the reflow storm.
    render();
    await optPause();
  };

  /* Phase 1 — random sweep. If the space is small enough, walk all of it. */
  OPT.phase = total <= OPT.budget ? "Testing every combination" : "Exploring";
  const explore = Math.min(total, Math.max(200, Math.floor(OPT.budget * 0.6)));
  let bestCombo = null, bestRes = null;

  if (total <= explore) {
    // exhaustive, in index order
    const idx = keys.map(() => 0);
    outer: while (!OPT.cancel) {
      const combo = {};
      keys.forEach((k, i) => { combo[k] = space[k][idx[i]]; });
      const r = evaluate(combo);
      if (!bestRes || r.obj > bestRes.obj) { bestRes = r; bestCombo = combo; }
      await breathe();
      let c = 0;
      while (c < keys.length) {
        if (++idx[c] < space[keys[c]].length) break;
        idx[c] = 0; c++;
      }
      if (c === keys.length) break outer;
    }
  } else {
    // The timeframe is cycled rather than drawn at random, so each duration
    // gets an equal share of the budget. Left to chance, a six-way choice can
    // hand one duration twice the trials of another and the winner is then
    // partly an accident of sampling.
    const tfs = space.tfPair || [];
    for (let i = 0; i < explore && !OPT.cancel; i++) {
      const combo = {};
      for (const k of keys) {
        combo[k] = k === "tfPair" && tfs.length
          ? tfs[i % tfs.length]
          : space[k][Math.floor(Math.random() * space[k].length)];
      }
      const r = evaluate(combo);
      if (!bestRes || r.obj > bestRes.obj) { bestRes = r; bestCombo = combo; }
      await breathe();
    }
  }

  /* Phase 2 — coordinate descent from the best few seeds. */
  if (!OPT.cancel && bestCombo) {
    OPT.phase = "Refining";
    const seeds = [...seen.entries()]
      .filter(([, r]) => isFinite(r.obj))
      .sort((a, b) => b[1].obj - a[1].obj)
      .slice(0, 3)
      .map(([k]) => {
        const c = {};
        k.split("|").forEach((kv) => {
          const [key, val] = kv.split("=");
          const opts = space[key];
          c[key] = opts.find((o) => String(o) === val);
        });
        return c;
      });

    for (const seed of seeds) {
      let cur = { ...seed };
      let curRes = evaluate(cur);
      let improved = true;
      while (improved && !OPT.cancel && OPT.evals < OPT.budget) {
        improved = false;
        for (const k of keys) {
          if (OPT.cancel || OPT.evals >= OPT.budget) break;
          for (const v of space[k]) {
            if (v === cur[k]) continue;
            const trial = { ...cur, [k]: v };
            const r = evaluate(trial);
            if (r.obj > curRes.obj) { cur = trial; curRes = r; improved = true; }
            await breathe();
            if (OPT.evals >= OPT.budget) break;
          }
        }
      }
      if (!bestRes || curRes.obj > bestRes.obj) { bestRes = curRes; bestCombo = cur; }
    }
  }

  /* Phase 3 — how fragile is the winner? */
  let stability = 0;
  if (!OPT.cancel && bestCombo && isFinite(bestRes.obj) && bestRes.obj > 0) {
    OPT.phase = "Checking stability";
    let sum = 0, n = 0;
    for (const k of keys) {
      const opts = space[k];
      const at = opts.indexOf(bestCombo[k]);
      for (const step of [-1, 1]) {
        const j = at + step;
        if (j < 0 || j >= opts.length) continue;
        const r = evaluate({ ...bestCombo, [k]: opts[j] });
        if (isFinite(r.obj)) { sum += Math.max(0, r.obj); n++; }
        await breathe();
      }
    }
    stability = n ? Math.max(0, Math.min(1, (sum / n) / bestRes.obj)) : 0;
  }

  optFinish(strategy, bestCombo ? { combo: bestCombo, ...bestRes, stability, byTf } : null,
            [...seen.values()], total);
}

function optFinish(strategy, best, all, total) {
  // where the current backtest settings sit, measured identically
  let baseline = null;
  if (best) {
    const space = optSpace(strategy);
    const cur = {};
    for (const k of Object.keys(space)) {
      cur[k] = k === "tfPair" ? BT.signalTf + ">" + BT.trendTf
             : k === "minAgree" ? CFG.minAgree : BT[k];
    }
    if (!OPT.data[cur.tfPair]) cur.tfPair = Object.keys(OPT.data)[0];
    try { baseline = optTrial(cur, strategy); } catch (e) { baseline = null; }
  }
  OPT.res = best ? {
    strategy, ...best, baseline,
    tested: OPT.evals, space: total,
    symbols: OPT.data ? (Object.values(OPT.data)[0] || {symbols:[]}).symbols.length : 0,
    seconds: Math.round((Date.now() - OPT.startedAt) / 1000),
    cancelled: OPT.cancel,
  } : null;
  OPT.running = false; OPT.phase = ""; OPT.note = ""; OPT.eta = 0;
  render(true);
}

function cancelTune() { OPT.cancel = true; OPT.phase = "Stopping…"; render(true); }
function setOptBudget(b) { OPT.budget = b; render(true); }
function discardTune() { OPT.res = null; render(true); }

/** Adopt the winning settings into the backtest, and optionally go live. */
function applyTune(toLive) {
  const r = OPT.res;
  if (!r) return;
  for (const k in r.combo) {
    if (k === "tfPair") {
      const [s, t] = r.combo[k].split(">");
      BT.signalTf = s; BT.trendTf = t;
    } else BT[k] = r.combo[k];
  }
  BT.strategy = r.strategy;
  if (toLive) {
    for (const k in r.combo) if (k !== "tfPair" && k in CFG) CFG[k] = r.combo[k];
    CFG.strategy = r.strategy;
    CFG.signalTf = BT.signalTf; CFG.trendTf = BT.trendTf;
    PRESET = "custom";
    writeHash();
    toast("Applied to the live scanner");
    OPT.res = null;
    render(true);
    run();
    return;
  }
  toast("Applied to the backtest — run it to see the full result");
  OPT.res = null;
  render(true);
}

  requireHtf: "Only trade with the trend",
  riskPct: "Risk per trade",
  maxOpen: "Positions at once",
  minScore: "Confluence needed",
  minAgree: "Agreement needed", cooldownBars: "Cooldown (candles)",
  volMult: "Volume multiple", adxMin: "Minimum ADX",
  occMaType: "MA type", occMaLen: "MA period", occMult: "Timeframe multiplier",
  occExitOnCross: "Close on opposite cross",
  srPivot: "Pivot strength", srZoneAtr: "Zone width (× ATR)",
  srMinTouch: "Touches to count", srMaxAge: "Forget pivots after",
  srMode: "Mode", srZoneStop: "Stop beyond the zone",
  srBreakAtr: "Break needs (× ATR)",
