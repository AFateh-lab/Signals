};

function tuneBlock() {
  const strategy = BT.strategy === "all" ? "occ" : BT.strategy;
  const space = optSpace(strategy);
  const total = optSize(space);
  const budgetSeg = OPT_BUDGETS.map((b) =>
    `<button class="${b === OPT.budget ? "on" : ""}" onclick="setOptBudget(${b})">
      ${b.toLocaleString()}</button>`).join("");

  if (OPT.running) {
    const pct = Math.min(99, Math.round(OPT.evals / Math.min(OPT.budget, total) * 100));
    return `<h2>Auto-tune</h2>
      <div class="status">
        ${kv("Phase", esc(OPT.phase || "…"))}
        ${kv("Tested", OPT.evals.toLocaleString() + " of "
             + Math.min(OPT.budget, total).toLocaleString())}
        ${kv("Progress", pct + "%")}
        ${kv("Time left", OPT.eta ? "~" + OPT.eta + "s" : "estimating…")}
      </div>
      ${OPT.note ? `<div class="segnote">${esc(OPT.note)}</div>` : ""}
      <button class="btn" onclick="cancelTune()">Stop and keep the best so far</button>`;
  }

  if (OPT.err && !OPT.res) {
    return `<h2>Auto-tune</h2>
      <div class="err"><b>Could not tune.</b><br>${esc(OPT.err)}</div>`;
  }

  if (!OPT.res) {
    return `<h2>Auto-tune</h2>
      <div class="seg">${budgetSeg}</div>
      <div class="segnote">Combinations to try. This strategy has
        <b>${total.toLocaleString()}</b> in total${total <= OPT.budget
          ? " — every one will be tested."
          : "; the search samples widely, then walks the best ones uphill."}
        Uses the pairs, timeframes and account rules set above.</div>
      <button class="btn gold" onclick="autoTune()">Find the best settings</button>
      <div class="hint">History is split into four blocks by time. Three are used
        to rank, the newest is held back and never seen by the search. A setting
        is judged on the <b>median</b> of the three, so one lucky stretch can't
        carry it, and scored as return ÷ worst drawdown rather than raw profit.</div>`;
  }

  const r = OPT.res;
  const rows = Object.keys(r.combo).map((k) => {
    const now = String(BT[k]), next = String(r.combo[k]);
    const changed = now !== next;
    return `<div class="kv"><span class="k">${OPT_LABELS[k] || k}</span>
      <span class="v">${changed
        ? `<span style="color:var(--dim)">${esc(now)}</span> → `
        : ""}<span style="color:${changed ? "var(--gold)" : "var(--txt)"}">${
        esc(next)}</span></span></div>`;
  }).join("");

  const f = r.folds.map((x, i) =>
    kv("Block " + (i + 1), `${x.netPct >= 0 ? "+" : ""}${x.netPct}% · ${x.n} trades`)
  ).join("");

  const hoColour = r.holdout.netPct >= 0 ? "var(--green2)" : "var(--red2)";
  const baseHo = r.baseline && r.baseline.holdout;

  return `<h2>Auto-tune</h2>
    <div class="segnote">${r.cancelled ? "Stopped early. " : ""}Tested
      ${r.tested.toLocaleString()} of ${r.space.toLocaleString()} combinations
      across ${r.symbols} pairs in ${r.seconds}s.</div>
    <div class="status">${rows}</div>
    <h2>Ranking blocks</h2>
    <div class="status">${f}${kv("Median score", r.obj.toFixed(3))}
      ${kv("Stability", Math.round((r.stability || 0) * 100) + "%")}</div>
    <h2>Held-back block</h2>
    <div class="status">
      ${kv("Never seen by the search", `<span style="color:${hoColour}">${
        r.holdout.netPct >= 0 ? "+" : ""}${r.holdout.netPct}%</span> · ${
        r.holdout.n} trades`)}
      ${kv("Worst drawdown there", r.holdout.maxDD + "%")}
      ${kv("Your current settings", baseHo && baseHo.n
        ? `${baseHo.netPct >= 0 ? "+" : ""}${baseHo.netPct}% · ${baseHo.n} trades`
        : "too few trades")}
    </div>
    <div class="segnote">${optVerdict(r)}</div>
    <button class="btn gold" onclick="applyTune(false)">Use in the backtest</button>
    <button class="btn" onclick="applyTune(true)">Use for live signals too</button>
    <button class="btn" onclick="discardTune()">Discard</button>`;
}

function optVerdict(r) {
  const ho = r.holdout, base = r.baseline && r.baseline.holdout;
  if (ho.n < 5) {
    return "Barely any trades in the held-back block, so there is nothing to "
         + "confirm it with. Treat this as untested.";
  }
  if (ho.netPct <= 0) {
    return "It ranked first on the blocks it was tuned against and lost money on "
         + "the block it never saw. That is the signature of overfitting — the "
         + "search found a pattern in noise. I would not use this.";
  }
  if (base && base.n >= 5 && ho.netPct <= base.netPct) {
    return "It held up on unseen data, but no better than the settings you "
         + "already have. Not worth changing.";
  }
  if ((r.stability || 0) < 0.5) {
    return "Profitable on unseen data, but nudging any single setting collapses "
         + "it. That is a narrow spike rather than a broad plateau, and narrow "
         + "spikes rarely survive contact with a live market.";
  }
  return "Profitable on the block it never saw, beat your current settings there, "
       + "and the settings around it score similarly. That is the strongest "
       + "result a search like this can give — which still is not a promise "
       + "about tomorrow.";
}


/* =========================================================================
   BEST SETUP — one button that runs the whole search.

   For each of the ten strategies it downloads the top-20 pairs once, tunes
   that strategy's own settings against three blocks of history, then scores
   the winner on a fourth block held back from the entire process. The five
   finalists are ranked on that held-back block only — never on the history
   they were tuned against.

   What comes out is one recommendation you can accept or ignore, instead of
   twenty sliders you have to reason about.
   ========================================================================= */

/* How hard to look. Fast screens all the chart periods on a short slice and
   then tunes the best four properly; Deep skips the screen and tunes every
   period on a long slice. Fast is the default because a search nobody waits
   for is a search that never runs. */
const DEPTHS = {
  fast:   { screen: true,  screenBars: 300, screenBudget: 60,  keep: 4,
            bars: 700,  budget: 400,  label: "Fast" },
  normal: { screen: true,  screenBars: 400, screenBudget: 120, keep: 6,
            bars: 1000, budget: 800,  label: "Balanced" },
  deep:   { screen: false, screenBars: 0,   screenBudget: 0,   keep: 99,
            bars: 1200, budget: 1500, label: "Thorough" },
};

const BEST = {
  depth: "fast", screened: 0, kept: null,
  running: false, cancel: false,
  step: "", rows: [], done: 0, err: null, at: 0, seconds: 0,
};

const BEST_ORDER_ALL = ["confluence", "occ", "sr", "ut", "tt", "pat",
                        "brk", "rsi", "mr", "mom"];
/* When a bot searches, it is not shopping for a new strategy — it already is
   one. It is looking for the chart period and settings that strategy works
   best on. Locking the search to one strategy is what makes a bot a bot
   rather than a second copy of the global search. */
let BEST_ONLY = null;
const BEST_ORDER_OF = () => BEST_ONLY ? [BEST_ONLY] : BEST_ORDER_ALL;

/** Which speed label a signal timeframe belongs to, so the Quick setup
    buttons keep telling the truth after the search changes the duration. */
function horizonFor(tf) {
  const m = BARMIN[tf] || 60;
  if (m <= 3) return "scalp";
  if (m <= 30) return "fast";
  if (m <= 120) return "medium";
  return "long";
}

/* One winning setup per speed. Switching speed then switches to settings that
   were tuned for that speed, instead of carrying 4h settings onto a 1m chart. */
const HBEST = {};
const HSPEEDS = ["scalp", "fast", "medium", "long"];
const HORIZON_TUNE = {running:false, cancel:false, speed:"", done:0};

async function tuneAllSpeeds() {
  if (HORIZON_TUNE.running || BEST.running || OPT.running) return;
  HORIZON_TUNE.running = true; HORIZON_TUNE.cancel = false; HORIZON_TUNE.done = 0;

  const keepH = CFG.horizon, keepStf = BT.signalTf, keepTtf = BT.trendTf;
  try {
    for (const speed of HSPEEDS) {
      if (HORIZON_TUNE.cancel) break;
      const h = HORIZONS[speed];
      HORIZON_TUNE.speed = speed;
      render(true);

      BT.signalTf = h.signalTf; BT.trendTf = h.trendTf;
      OPT_TF_LOCK = h.signalTf + ">" + h.trendTf;
      OPT.data = null; OPT.dataKey = "";
      BEST.rows = [];

      await findBestSetup();               // all ten strategies, this speed only

      if (BEST.rows.length && BEST.rows[0].holdout.n >= 5) {
        HBEST[speed] = {
          strat: BEST.rows[0].strat,
          label: BEST.rows[0].label,
          combo: BEST.rows[0].combo,
          holdout: BEST.rows[0].holdout,
          tf: h.signalTf + "/" + h.trendTf,
          at: Date.now(),
        };
      }
      BEST.rows = [];
      HORIZON_TUNE.done++;
      render(true);
    }
  } finally {
    OPT_TF_LOCK = null;
    BT.signalTf = keepStf; BT.trendTf = keepTtf;
    HORIZON_TUNE.running = false; HORIZON_TUNE.speed = "";
    CFG.horizon = keepH;
  }
  toast(Object.keys(HBEST).length + " speeds tuned");
  render(true);
}

function cancelSpeedTune() { HORIZON_TUNE.cancel = true; BEST.cancel = true;
  OPT.cancel = true; render(true); }

/** Adopt the setup tuned for a speed. Called when you switch speed. */
function applyHorizonBest(speed) {
  const b = HBEST[speed];
  if (!b) return false;
  for (const k in b.combo) {
    if (k === "tfPair") continue;
    BT[k] = b.combo[k];
    if (k in CFG) CFG[k] = b.combo[k];
  }
  BT.strategy = b.strat; CFG.strategy = b.strat;
  PRESET = "custom";
  return true;
}

function speedTuneBlock() {
  if (HORIZON_TUNE.running) {
    return `<div class="status" style="margin-top:10px">
        ${kv("Tuning speed", esc(HORIZON_TUNE.speed))}
        ${kv("Speeds done", HORIZON_TUNE.done + " of 4")}
        ${kv("Strategy", esc(BEST.step || "…"))}</div>
      <button class="btn" onclick="cancelSpeedTune()">Stop</button>`;
  }
  const done = HSPEEDS.filter((s) => HBEST[s]);
  const rows = done.map((s) => {
    const b = HBEST[s];
    return `<div class="kv"><span class="k">${s[0].toUpperCase()+s.slice(1)}
      <span style="color:#5e5e66"> · ${b.tf}</span></span>
      <span class="v">${esc(b.label)} <span style="color:${
        b.holdout.netPct >= 0 ? "var(--green2)" : "var(--red2)"}">${
        b.holdout.netPct >= 0 ? "+" : ""}${b.holdout.netPct}%</span></span></div>`;
  }).join("");
  return `${done.length ? `<div class="status" style="margin-top:10px">${rows}</div>
      <div class="hint">Switching speed now also switches to the setup tuned for
        it.</div>` : ""}
    <button class="btn" onclick="tuneAllSpeeds()">Tune all four speeds${
      done.length ? " again" : ""}</button>
    <div class="hint">Runs the whole search once per speed — Scalp, Fast, Medium
      and Long each get their own winning strategy and settings, tuned on their
      own timeframe. Four times the work of one search, so give it a while.</div>`;
}

async function findBestSetup() {
  if (BEST.running || OPT.running) return;
  BEST.running = true; BEST.cancel = false;
  BEST.rows = []; BEST.done = 0; BEST.err = null;
  const t0 = Date.now();

  // Everything is judged on the same pairs, the same history, the same rules.
  const keepScope = BT.scope, keepBars = BT.bars, keepStrat = BT.strategy;
  // Judge the strategies on the coins you are actually going to trade. Picking
  // a winner on the top 20 and then running it on your own 14 Layer 1 coins
  // would be answering a different question.
  BT.scope = (CFG.pairMode === "custom" && CFG.custom.length) ? "chosen" : "top20";
  BEST.scope = BT.scope;                    // recorded before the restore below
  OPT.data = null; OPT.dataKey = "";
  OPT_TF_SET = null;

  const D = DEPTHS[BEST.depth] || DEPTHS.normal;

  try {
    /* ---------------------------------------------------------- first pass
       Thirty-three chart periods tuned properly against ten strategies is
       an enormous amount of work, and most of those periods are hopeless
       within a few trials. So: a cheap screen over all of them on a short
       slice of history, then the real search on the handful that survived.

       Same idea as reading the abstracts before the papers. It costs one
       quick pass and saves most of the expensive one. */
    if (D.screen && OPT_TFS.length > D.keep) {
      const score = new Map();
      BT.bars = D.screenBars;
      for (const strat of BEST_ORDER_OF()) {
        if (BEST.cancel) break;
        BEST.step = `Narrowing ${OPT_TFS.length} chart periods — `
                  + `${BT_STRATS[strat] || strat}`;
        render(true);
        await optPause();
        BT.strategy = strat;
        OPT.budget = D.screenBudget;
        await autoTune();
        const by = OPT.res && OPT.res.byTf;
        if (by) {
          for (const tf in by) {
            const h = by[tf].holdout;
            const v = h && h.n >= 4 ? h.netPct : -9999;
            if (!score.has(tf) || v > score.get(tf)) score.set(tf, v);
          }
        }
        OPT.res = null;
      }
      const ranked = [...score.entries()].sort((a, b) => b[1] - a[1]);
      if (ranked.length) {
        OPT_TF_SET = ranked.slice(0, D.keep).map(([tf]) => tf);
        BEST.screened = OPT_TFS.length;
        BEST.kept = OPT_TF_SET.slice();
      }
      OPT.data = null; OPT.dataKey = "";     // different history length below
    }

    BT.bars = D.bars;
    for (const strat of BEST_ORDER_OF()) {
      if (BEST.cancel) break;
      BEST.step = "Tuning " + (BT_STRATS[strat] || strat)
                + ` (${BEST.done + 1} of ${BEST_ORDER_OF().length})`;
      render(true);
      await optPause();

      BT.strategy = strat;
      OPT.budget = D.budget;
      await autoTune();                       // shares the downloaded candles

      if (OPT.res) {
        BEST.rows.push({
          strat,
          label: BT_STRATS[strat] || strat,
          combo: OPT.res.combo,
          holdout: OPT.res.holdout,
          folds: OPT.res.folds,
          stability: OPT.res.stability || 0,
          tested: OPT.res.tested,
          byTf: OPT.res.byTf || null,
          tf: (OPT.res.combo && OPT.res.combo.tfPair) || (BT.signalTf + ">" + BT.trendTf),
        });
      }
      OPT.res = null;
      BEST.done++;
      render(true);
    }
  } catch (e) {
    BEST.err = e.message || String(e);
  } finally {
    BT.scope = keepScope; BT.bars = keepBars; BT.strategy = keepStrat;
    OPT_TF_SET = null;
  }

  // Ranked purely on the block none of them ever saw.
  BEST.rows.sort((a, b) => {
    const an = a.holdout.n >= 8 ? a.holdout.netPct : -9999;
    const bn = b.holdout.n >= 8 ? b.holdout.netPct : -9999;
    return bn - an;
  });
  BEST.seconds = Math.round((Date.now() - t0) / 1000);
  BEST.at = Date.now();
  BEST.running = false; BEST.step = "";
  render(true);
}

function cancelBest() { BEST.cancel = true; OPT.cancel = true; BEST.step = "Stopping…"; render(true); }
function discardBest() { BEST.rows = []; BEST.at = 0; render(true); }

/** Adopt a finalist everywhere: live scanner and backtester both. */
function applyBest(i, skipRun) {
  const r = BEST.rows[i];
  if (!r) return;
  for (const k in r.combo) {
    // The timeframe pair is searched like any other setting, and it arrives
    // as one "1h>4h" string. Writing it through as a literal key was silently
    // dropping the winning duration and leaving the scanner on the old one.
    if (k === "tfPair") {
      const [s, t] = String(r.combo[k]).split(">");
      if (s && t) { BT.signalTf = s; BT.trendTf = t; }
      continue;
    }
    BT[k] = r.combo[k];
    if (k in CFG) CFG[k] = r.combo[k];
  }
  BT.strategy = r.strat;
  CFG.strategy = r.strat;
  CFG.signalTf = BT.signalTf; CFG.trendTf = BT.trendTf;
  CFG.horizon = horizonFor(CFG.signalTf);
  PRESET = "custom";
  writeHash();
  BEST.rows = []; BEST.at = 0;
  toast(r.label + " applied");
  render(true);
  // Deploy awaits its own rescan so it can report how many signals came back.
  if (!skipRun) run();
}

/* ----------------------------------------------------------------- the UI */
function bestBlock() {
  if (BEST.running) {
    return `<div class="status">
        ${kv("Working", esc(BEST.step || "…"))}
        ${kv("Strategies done", BEST.done + " of " + BEST_ORDER_OF().length)}
        ${kv("This strategy", OPT.evals ? OPT.evals.toLocaleString()
             + " combinations" : "starting…")}
      </div>
      <button class="btn" onclick="cancelBest()">Stop</button>`;
  }

  if (BEST.err && !BEST.rows.length) {
    return `<div class="err">${esc(BEST.err)}</div>
      <button class="btn gold" onclick="findBestSetup()">Try again</button>`;
  }

  if (!BEST.rows.length) {
    return `<button class="btn gold" onclick="findBestSetup()">Find my best setup</button>
      <div class="hint">Downloads ${CFG.pairMode === "custom" && CFG.custom.length
        ? "your " + CFG.custom.length + " chosen pairs" : "the top 20 pairs"}
        once, then tunes all five
        strategies against them and ranks the five winners on history none of
        them was tuned on. A few minutes on a phone. Nothing changes until you
        accept a result.</div>`;
  }

  const rows = BEST.rows.map((r, i) => {
    const ok = r.holdout.n >= 8;
    const pct = ok ? (r.holdout.netPct >= 0 ? "+" : "") + r.holdout.netPct + "%"
                   : "too few trades";
    const col = !ok ? "var(--dim)"
              : r.holdout.netPct > 0 ? "var(--green2)" : "var(--red2)";
    return `<div class="kv">
      <span class="k">${i === 0 && ok ? "★ " : ""}${esc(r.label)}
        <span style="color:#5e5e66"> · ${esc(tfWords(r.tf))} · ${r.holdout.n}
        trades</span></span>
      <span class="v" style="color:${col}">${pct}</span></div>`;
  }).join("");

  const win = BEST.rows[0];
  const good = win && win.holdout.n >= 8 && win.holdout.netPct > 0;
  const detail = win ? Object.keys(win.combo).map((k) =>
    `<div class="kv"><span class="k">${OPT_LABELS[k] || k}</span>
      <span class="v">${esc(String(win.combo[k]))}</span></div>`).join("") : "";

  return `<div class="segnote">Ranked on history none of them was tuned on.
      ${BEST.seconds}s, ${BEST.scope === "chosen" ? "your chosen pairs"
        : "top 20 pairs"}, ${OPT_TFS.length} chart periods tried.${OPT.trimmed
        ? " Coin list trimmed by " + OPT.trimmed + " to hold that many periods "
          + "in memory at once." : ""}${BEST.screened
        ? " Screened all " + BEST.screened + ", then tuned the best "
          + (BEST.kept ? BEST.kept.length : 0) + " properly."
        : ""}</div>
    <div class="status">${rows}</div>
    ${good ? `
      ${tfTable(win)}
      <h2>${esc(win.label)} — what it would use</h2>
      <div class="status">${detail}
        ${kv("Held out", (win.holdout.netPct >= 0 ? "+" : "") + win.holdout.netPct
             + "% · " + win.holdout.n + " trades")}
        ${kv("Worst drawdown", win.holdout.maxDD + "%")}
        ${kv("Stability", Math.round(win.stability * 100) + "%")}</div>
      <div class="segnote">${bestVerdict(win)}</div>
      <button class="btn gold" onclick="applyBest(0)">Use this setup</button>`
    : `<div class="segnote">None of the five made money on the held-back
        history. That is a real answer, not a failure of the search — on this
        sample of pairs and this timeframe, none of them had an edge. Try a
        different speed, or leave your settings as they are.</div>`}
    <button class="btn" onclick="discardBest()">Clear</button>`;
}

/** "1h>4h" as something readable. */
function tfWords(p) {
  if (!p) return "—";
  const [s, t] = String(p).split(">");
  return t ? s + " / " + t + " trend" : s;
}

/** Every duration the search tried for the winning strategy, and its best. */
function tfTable(w) {
  if (!w || !w.byTf) return "";
  const rows = Object.keys(w.byTf).map((tf) => {
    const b = w.byTf[tf];
    const h = b.holdout;
    const ok = h && h.n >= 8;
    const pct = ok ? (h.netPct >= 0 ? "+" : "") + h.netPct + "%"
              : h && h.n ? h.n + " trades only" : "no trades";
    const col = !ok ? "var(--dim)" : h.netPct > 0 ? "var(--green2)" : "var(--red2)";
    const win = tf === w.tf;
    return { tf, pct, col, win, sort: ok ? h.netPct : -9999 };
  }).sort((a, b) => b.sort - a.sort).map((r) =>
    `<div class="kv"><span class="k">${r.win ? "★ " : ""}${esc(tfWords(r.tf))}</span>
      <span class="v" style="color:${r.col}">${r.pct}</span></div>`).join("");
  if (!rows) return "";
  return `<h2>Every duration it tried</h2>
    <div class="status">${rows}</div>
    <div class="segnote">The chart period is searched like any other setting —
      each one got an equal share of the trials, and the starred row is the one
      the winner runs on.</div>`;
}

function bestVerdict(w) {
  if (w.stability < 0.4) {
    return "It won, but nudging one setting collapses it — a narrow spike "
         + "rather than a broad plateau. Treat it as fragile.";
  }
  if (w.holdout.maxDD > 40) {
    return "Profitable on unseen history, but it drew down "
         + w.holdout.maxDD + "% on the way. Size accordingly.";
  }
  return "Profitable on history it was never tuned against, and the settings "
       + "around it score similarly. That is the strongest evidence a search "
       + "like this can produce — still not a promise about tomorrow.";
}


function backtestView() {

     <select onchange="setBtStr('${k}',this.value)">${opts.map(o=>

  const tog=(k,label,val)=>
    `<div class="kv"><span class="k">${label}</span>
     <button class="sw${val?" on":""}" onclick="togBt('${k}',this)"></button></div>`;

  const stratSeg = [["occ","Open/Close"],["sr","S&R"],["confluence","Confluence"],
                    ["ut","UT Bot"],["tt","Target Trend"],["pat","Chart patterns"],
                    ["brk","Breakout"],["rsi","RSI"],["mr","Mean rev"],
                    ["mom","Momentum"],["all","Compare all"]].map(([k,l])=>
    `<button class="chip${k===BT.strategy?" on":""}"
      onclick="setBtStrategy('${k}')">${l}</button>`).join("");
  const srModeSeg = [["bounce","Bounces"],["breakout","Breakouts"],
                     ["both","Both"]].map(([k,l])=>
    `<button class="${k===BT.srMode?"on":""}" onclick="setBtStr('srMode','${k}')">
      ${l}</button>`).join("");

  const occBlock = `<div class="status">
    ${selRaw("occMaType","MA type",BT.occMaType,
      ["SMA","EMA","DEMA","TEMA","WMA","VWMA","SMMA","HullMA","LSMA","ALMA","SSMA","TMA"])}
    ${rng("occMaLen","MA period",BT.occMaLen,1,50,1,"")}
    ${rng("occMult","Timeframe multiplier",BT.occMult,1,8,1,"×")}
    ${tog("occExitOnCross","Close on opposite cross",BT.occExitOnCross)}</div>
    <div class="hint">Entries are the ${BT.occMaType}(${BT.occMaLen}) of the close
      crossing the same average of the open, measured on candles built by grouping
      ${BT.occMult} of the ${BT.signalTf} bars together — a
      ${tfLabel(BARMIN[BT.signalTf]*BT.occMult)} view. Crossing up is a long,
      crossing down is a short.</div>`;
  const confBlock = `<div class="status">
    ${rng("minScore","Confluence needed",BT.minScore,4,8,1,"/8")}</div>
    <div class="hint">Eight indicators scored together; an entry needs at least
      ${BT.minScore} of them agreeing.</div>`;
  const srBlock = `<div class="seg" style="margin-bottom:9px">${srModeSeg}</div>
    <div class="status">
    ${rng("srPivot","Pivot strength (bars)",BT.srPivot,2,15,1,"")}
    ${rng("srZoneAtr","Zone width (x ATR)",BT.srZoneAtr,0.2,2,0.1,"")}
    ${rng("srMinTouch","Touches to count",BT.srMinTouch,2,6,1,"")}
    ${rng("srMaxAge","Forget pivots after",BT.srMaxAge,100,800,50," bars")}
    ${rng("srBreakAtr","Break needs (x ATR)",BT.srBreakAtr,0.05,1,0.05,"")}
    ${tog("srZoneStop","Stop beyond the zone",BT.srZoneStop)}</div>
    <div class="hint">Zones are rebuilt as the replay walks forward using only
      the pivots confirmed by that bar — a pivot ${BT.srPivot} bars from the edge
      is not visible until ${BT.srPivot} bars later, so the backtest never trades
      a level it could not have seen yet.</div>`;
  const utBlock = `<div class="status">
    ${rng("utKey","Sensitivity (key value)",BT.utKey,0.5,10,0.5,"")}
    ${rng("utAtrLen","ATR period",BT.utAtrLen,2,40,1,"")}</div>
    <div class="hint">An ATR trailing stop that only ever moves in the direction
      of the trade. A close above it is a buy, below it a sell, and that same
      line becomes the trade's stop — the exit is the indicator itself rather
      than a separate guess. Higher sensitivity means a looser stop and fewer,
      longer trades.</div>`;
  const ttBlock = `<div class="status">
    ${rng("ttLen","Trend length",BT.ttLen,3,50,1,"")}
    ${rng("ttTarget","Widen targets",BT.ttTarget,0,10,1,"")}</div>
    <div class="hint">Trend flips when price closes through SMA(high,${BT.ttLen})
      plus a band, or SMA(low,${BT.ttLen}) minus it, where the band is
      SMA(ATR(200),200) × 0.8. The opposite band trails as the stop. Targets sit
      at 5, 10 and 15 band-widths — the script's own three — plus two further
      rungs to fill the usual five.</div>`;
  // allBlock is gone with the rest of the hand-tuning: "compare all" now means
  // compare them on the settings the search chose, which is the only
  // comparison worth reading.
  void occBlock; void srBlock; void confBlock; void utBlock; void ttBlock;

  // The moving-average types, lengths, multipliers and thresholds used to be
  // laid out here as knobs. They are gone, and that is the point: those are
  // precisely the values the search tries thousands of combinations of, on
  // held-back history, and a person guessing at them by hand is competing
  // with that and losing. They are still reachable — Settings, under
  // "Everything else" — but they are no longer presented as a thing to fiddle
  // with before pressing Run.
  const settings = `<h2>Strategy</h2>
    <div class="chips">${stratSeg}</div>
    <div class="card" style="margin:8px 0 4px;border-color:#3d3320">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:4px">
        The settings are not yours to guess</div>
      <div class="hint" style="margin-bottom:9px">Moving-average type and
        length, multipliers, thresholds — the search tries every combination of
        those across all ${OPT_TFS.length} chart periods and scores them on
        history they were not chosen on. Setting them by hand here would be
        competing with that, by hand, on one guess.</div>
      <div class="pickbar">
        <button class="go" onclick="go('profile')">Run the search instead</button>
        <button onclick="go('matrix')">See what it already found</button>
      </div>
    </div>
    <h2>Trend filter</h2><div class="status">
    ${tog("requireHtf","Only trade with the trend",BT.requireHtf)}
    ${selRaw("signalTf","Signal timeframe",BT.signalTf,ALL_TFS.slice(0,-2))}
    ${selRaw("trendTf","Trend timeframe",BT.trendTf,ALL_TFS.slice(4))}</div>
    <div class="hint">${BT.requireHtf
      ? "An entry is only taken when the "+BT.trendTf+" chart agrees: price and "
        + "EMA21 both on the same side of EMA50. Longs in an uptrend, shorts in a "
        + "downtrend, nothing when it is flat."
      : "Trend filter off — every crossover is taken in both directions."}</div>
    <h2>What to test</h2>
    <div class="seg">${scopeSeg}</div>
    <div class="seg" style="margin-top:9px">${barSeg}</div>
    <div class="segnote">Candles of history per pair. ${BT.bars} × ${BT.signalTf}
      ≈ ${(BT.bars*BARMIN[BT.signalTf]/1440).toFixed(0)} days. Binance serves the
      full depth; other sources cap lower.</div>
    <h2>Account rules</h2><div class="status">
    ${rng("equity0","Starting equity",BT.equity0,100,10000,100,"")}
    ${rng("riskPct","Risk per trade",BT.riskPct,0.5,10,0.5,"%")}
    ${rng("maxOpen","Positions at once",BT.maxOpen,1,20,1,"")}
    ${rng("feeBps","Taker fee per side",BT.feeBps,0,20,1," bps")}</div>
    <div class="hint">Position size comes from the stop distance, so every trade
      risks ${BT.riskPct}% of equity if it stops out — leverage is whatever that
      implies, capped at ${CFG.maxLev}×. A fifth of the position is taken off at
      each target and the stop moves to breakeven after target
      ${CFG.beAfter||"—"}. Equity compounds. Funding is not modelled.</div>
    <button class="btn gold" onclick="runBacktest()">${BT.running
      ? "Running…" : "Run backtest"}</button>
    ${tuneBlock()}`;

  if (BT.running) return settings +
    `<div class="empty" style="margin-top:12px">${esc(BT.note||"Working…")}</div>`;
  if (BT.err && !BT.runs.length) return settings +
    `<div class="err" style="margin-top:12px"><b>Backtest failed.</b><br>
     ${esc(BT.err)}</div>`;
  if (!BT.runs.length) return settings +
    `<div class="hint" style="margin-top:14px">Nothing run yet. The Results above
      only cover the live scan window — a backtest goes back much further and
      simulates an actual account balance.</div>`;

  const money = v => (v>=0?"+":"−") + "$" + Math.abs(v).toFixed(2);

  // ---- head-to-head, when more than one strategy was run
  let compare = "";
  if (BT.runs.length > 1) {
    const rs = BT.runs.map(x=>x.res);
    // Green marks the best cell in a row, red the worst - only when they differ.
    const mark = (vals, i, big) => {
      if (big == null) return "";        // neither more nor less is "better"
      const best = big ? Math.max(...vals) : Math.min(...vals);
      const worst = big ? Math.min(...vals) : Math.max(...vals);
      if (best === worst) return "";
      return vals[i] === best ? "up" : vals[i] === worst ? "down" : "";
    };
    const row = (label, pick, big, f) => {
      const vals = rs.map(pick);
      return `<div class="cmp"><span class="k">${label}</span>` + vals.map((v,i)=>
        `<span class="c ${mark(vals,i,big)}">${f? f(v) : v}</span>`).join("")
        + "</div>";
    };
    compare = `<h2>Head to head</h2>
      <div class="cmpbox" style="--cols:${rs.length}">
      <div class="cmp head"><span class="k"></span>${rs.map(x=>
        `<span class="c">${esc(x.label.replace("Support & Resistance","S&R")
          .replace("Open/Close Cross","OCC"))}</span>`).join("")}</div>
      ${row("Net return", x=>x.netPct, true, v=>(v>=0?"+":"")+v+"%")}
      ${row("Trades", x=>x.n, null)}
      ${row("Win rate", x=>x.winRate, true, v=>v+"%")}
      ${row("Profit factor", x=>x.pf===Infinity?999:x.pf, true,
            v=>v===999?"\u221e":v)}
      ${row("Max drawdown", x=>x.maxDD, false, v=>"-"+v+"%")}
      ${row("Per trade", x=>+x.expectancy, true, money)}
      ${row("Avg TPs", x=>x.avgTps, true)}
      ${row("Worst streak", x=>x.lsMax, false, v=>v+"L")}
      </div>
      <div class="segnote">Same candles, same account rules, same trend filter.
      Green is the best of the ${rs.length} on that row, red the worst.</div>
      <div class="seg" style="margin-top:11px">${BT.runs.map((x,i)=>
        `<button class="${i===BT.sel?"on":""}" onclick="setBtSel(${i})">
          ${esc(x.res.label.replace("Support & Resistance","S&R")
            .replace("Open/Close Cross","OCC"))}</button>`).join("")}</div>
      <div class="segnote">Full report below is for
        <b>${esc(BT.runs[BT.sel].res.label)}</b>.</div>`;
  }

  const r = BT.runs[Math.min(BT.sel, BT.runs.length-1)].res;
  BT.res = r;
  const days = (r.span[1]-r.span[0])/86400000;
  const grid = `<div class="stats">
    ${stat(`<span class="${cls(r.netPct)}">${r.netPct>=0?"+":""}${r.netPct}%</span>`,
       "Net return")}
    ${stat("$"+r.equity.toLocaleString(undefined,{maximumFractionDigits:0}),"Final")}
    ${stat(r.n,"Trades")}${stat(r.winRate+"%","Win rate")}</div>
    <div class="stats" style="margin-top:7px">
    ${stat(r.pf===Infinity?"∞":r.pf,"Profit factor")}
    ${stat(`<span class="down">-${r.maxDD}%</span>`,"Max drawdown")}
    ${stat(money(r.expectancy),"Per trade")}
    ${stat(r.avgTps,"Avg TPs")}</div>`;

  const detail = `<div class="status">
    ${kv("Period", days>=1 ? days.toFixed(0)+" days · "
        + new Date(r.span[0]).toLocaleDateString() + " → "
        + new Date(r.span[1]).toLocaleDateString() : "—")}
    ${kv("Pairs tested", r.symbols)}
    ${kv("Entries found", r.candidates + (r.skipped
        ? " ("+r.skipped+" skipped — slots full)" : ""))}
    ${kv("Unresolved when data ran out", r.open + " trades")}
    ${kv("Average win", r.avgWin
        ? '<span class="up">'+money(r.avgWin)+"</span>" : "no winning trades")}
    ${kv("Average loss", r.avgLoss
        ? '<span class="down">'+money(-r.avgLoss)+"</span>" : "no losing trades")}
    ${kv("Best streak", r.wsMax + " wins")}
    ${kv("Worst streak", r.lsMax + " losses")}
    ${kv("Average hold", r.avgBars + " candles · "
        + (r.avgBars*BARMIN[r.tf]/60).toFixed(1) + "h")}</div>`;

  const months = r.byMonth.length > 1 ? "<h2>By month</h2>" + r.byMonth.map(b=>{
    const rate = +(b.wins/b.n*100).toFixed(0);
    const col = rate>=60?"var(--green)":rate>=40?"var(--gold)":"var(--red)";
    return `<div class="prow"><div class="top"><span class="d">${esc(b.label)}</span>
      <span class="c">${b.n} trades</span>
      <span class="roi ${cls(b.pnl)}">${money(b.pnl)}</span></div>
      <div class="wr"><div class="track"><i style="width:${rate}%;
        background:${col}"></i></div><span class="pct">${rate}% · ${b.wins}/${b.n}
      </span></div></div>`; }).join("") : "";

  const pairs = r.bySym.length > 1 ? "<h2>By pair</h2>" + r.bySym.map(b=>
    `<div class="mv"><span class="n">${esc(b.sym.replace("USDT",""))}</span>
     <span class="px">${b.n} · ${(b.wins/b.n*100).toFixed(0)}%</span>
     <span class="${cls(b.pnl)}">${money(b.pnl)}</span></div>`).join("") : "";

  const list = r.trades.slice(0,40).map(t=>
    `<div class="mv"><span class="n">${esc(t.sym.replace("USDT",""))}
       <span style="color:var(--dim);font-weight:700;font-size:11px">
       ${t.side==="LONG"?"L":"S"} ${t.lev}×</span></span>
     <span class="px" style="font-size:11.5px">${new Date(t.closedAt)
       .toLocaleDateString(undefined,{day:"numeric",month:"short"})} ·
       ${esc(t.reason)}</span>
     <span class="${cls(t.pnl)}">${money(t.pnl)}</span></div>`).join("");

  return settings + compare + `
    <h2>${esc(r.label||"Result")}</h2>
    <div class="segnote" style="margin:-4px 0 9px">${esc(r.detail||"")} ·
      ${r.tf} candles${BT.requireHtf? " · "+BT.trendTf+" trend filter":""}</div>
    ${grid}
    <div class="card" style="margin-top:10px">
      <div style="font-size:12px;color:var(--dim);font-weight:700">
        Account equity · ${r.n} trades · ${r.symbols} pairs</div>
      <canvas id="eqcv"></canvas></div>
    ${detail}
    ${months}${pairs}
    <h2>Trades${r.n>40 ? " (newest 40 of "+r.n+")" : ""}</h2>
    ${list || '<div class="empty">No closed trades.</div>'}
    <div class="hint">Past behaviour of a strategy is not a forecast. Slippage,
      funding and partial fills are not modelled, and a backtest can only see the
      pairs that exist and trade today — the ones that died are missing.</div>`;
}

  BT[k] = parseFloat(v);
  const el = document.getElementById("v_bt_"+k);
  if (el) el.textContent = v + suf;
}

function setBtStr(k, v) { BT[k] = v; render(true); }
function togBt(k, el) { el.classList.toggle("on"); BT[k] = el.classList.contains("on");
  render(true); }

function setBtSel(i) { BT.sel = i; render(true); }

for (const [,list] of IND_GROUPS) for (const [k,l] of list) IND_NAME[k] = l;

const chSym = () => CH.sym || (OPEN[0] && OPEN[0].symbol) || CFG.focus[0] || "BTCUSDT";
const chTf  = () => CH.tf  || CFG.signalTf;

async function chFetch(sym, tf, limit) {
  const order = SOURCE ? [SOURCE, ...SRC.filter(s=>s!==SOURCE)] : SRC;
  let last;
  for (const src of order) {
    try {
      const rows = await klinesFrom(src, sym, tf, limit);
      if (rows && rows.length) { SOURCE = src; return rows; }
    } catch (e) { last = e; }
  }
  throw last || new Error("no data");
}

async function loadChart() {
  const sym = chSym(), tf = chTf();
  CH.sym = sym; CH.tf = tf; CH.busy = true; CH.err = null;
  chHead();
  try {
    const der = DERIVED_TF[tf];
    const rows = der
      ? aggregate(await chFetch(sym, der.base, 500), der.group)
      : await chFetch(sym, tf, 500);
    CH.rows = rows; CH.off = 0; CH.hover = null; CH.at = Date.now();
  } catch (e) {
    CH.err = e.message || String(e); CH.rows = [];
  }
  CH.busy = false;
  chHead(); drawChart();
}

/* Only the newest few candles, merged in - cheap enough to run every 5s. */
async function pollChart() {
  if (CH.busy || TAB !== "chart" || !CH.rows.length) return;
  if (document.visibilityState !== "visible") return;
  try {
    const rows = await chFetch(CH.sym, CH.tf, 3);
    for (const r of rows) {
      const n = CH.rows.length, last = CH.rows[n-1];
      if (!last || r.t > last.t) { CH.rows.push(r); if (CH.off > 0) CH.off++; }
      else { for (let i=n-1; i>=Math.max(0,n-4); i--)
               if (CH.rows[i].t === r.t) { CH.rows[i] = r; break; } }
    }
    CH.at = Date.now();
    chHead(); drawChart();
  } catch (e) { /* a dropped poll is not worth showing */ }
}

function chStartPoll() {
  clearInterval(CH.poll);
  CH.poll = setInterval(pollChart, 5000);
}

/* ------------------------------------------------------- chart indicators */
function occForRows(rows) {
  const mult = Math.max(1, Math.round(CFG.occMult));
  const agg = aggregate(rows, mult);
  if (agg.length < CFG.occMaLen + 3) return null;
  const vol = agg.map(x=>x.v);
  const cm = variant(CFG.occMaType, agg.map(x=>x.c), CFG.occMaLen,
                     CFG.occSigma, CFG.occAlmaOffset, vol);
  const om = variant(CFG.occMaType, agg.map(x=>x.o), CFG.occMaLen,
                     CFG.occSigma, CFG.occAlmaOffset, vol);
  const pts = [];
  for (let k=0; k<agg.length; k++) {
    if (isNaN(cm[k]) || isNaN(om[k])) continue;
    pts.push({i:agg[k].endIdx, cm:cm[k], om:om[k]});
  }
  const crosses = [];
  for (let k=1; k<pts.length; k++) {
    const a0=pts[k-1].cm, b0=pts[k-1].om, a1=pts[k].cm, b1=pts[k].om;
    if (a0<=b0 && a1>b1) crosses.push({i:pts[k].i, side:"LONG", p:pts[k].om});
    else if (a0>=b0 && a1<b1) crosses.push({i:pts[k].i, side:"SHORT", p:pts[k].om});
  }
  return {pts, crosses};
}

function bollinger(close, p, k) {
  const mid = sma(close, p), up = [], lo = [];
  for (let i=0; i<close.length; i++) {
    const s = Math.max(0, i-p+1); let sum=0, n=0;
    for (let j=s; j<=i; j++) { const d=close[j]-mid[i]; sum+=d*d; n++; }
    const sd = Math.sqrt(sum/Math.max(1,n));
    up.push(mid[i]+k*sd); lo.push(mid[i]-k*sd);
  }
  return {mid, up, lo};
}

/* VWAP anchored to each UTC day, the way most charts do it. */
function vwapDaily(rows) {
  const out = []; let pv=0, vv=0, day=null;
  for (const b of rows) {
    const d = Math.floor(b.t/86400000);
    if (d !== day) { day = d; pv = 0; vv = 0; }
    const tp = (b.h+b.l+b.c)/3;
    pv += tp*b.v; vv += b.v;
    out.push(vv ? pv/vv : b.c);
  }
  return out;
}

/* Everything the enabled indicators need, computed once per candle set and
   reused while you pan and zoom. Recomputed when a new candle arrives. */
let CHI = {key:null, v:null};
function chInd(rows) {
  const on = Object.keys(CH.ind).filter(k=>CH.ind[k]).join(",");
  const key = CH.sym+":"+CH.tf+":"+rows.length+":"+on+":"+JSON.stringify(CH.p);
  if (CHI.key === key) return CHI.v;
  const P = CH.p, close = rows.map(r=>r.c), v = {};
  try {
    const a = atr(rows, 14);
    v.atr = a;
    if (CH.ind.st)    v.st    = supertrend(rows, P.stLen, P.stMult);
    if (CH.ind.utbot) v.ut    = utBot(rows, P.utKey, P.utAtr);
    if (CH.ind.psar)  v.sar   = psar(rows, P.sarStep, P.sarMax);
    if (CH.ind.ema)   v.ema   = [ema(close,20), ema(close,50), ema(close,100),
                                 ema(close,200)];
    if (CH.ind.bb)    v.bb    = bollinger(close, 20, 2);
    if (CH.ind.vwap)  v.vwap  = vwapDaily(rows);
    if (CH.ind.fvg)   v.fvg   = fvgs(rows, 40);
    if (CH.ind.ob)    v.ob    = orderBlocks(rows, a, 30);
    if (CH.ind.rng)   v.don   = donchian(rows, P.rngLen);
    if (CH.ind.sweep || CH.ind.swing) {
      const pv = pivots(rows, CFG.srPivot);
      if (CH.ind.sweep) v.swp = sweeps(rows, pv.slice(-60), 20);
      if (CH.ind.swing) {
        const hs = pv.filter(p=>p.type==="H"), ls = pv.filter(p=>p.type==="L");
        if (hs.length && ls.length)
          v.swing = {hi: hs[hs.length-1], lo: ls[ls.length-1]};
      }
    }
  } catch (e) { /* one bad indicator must not blank the chart */ }
  CHI = {key, v};
  return v;
}

/* Zones for the chart. Cached so panning and the 5s poll don't recompute. */
let CHZ = {key:null, zones:[]};
function chZones(rows) {
  const key = CH.sym + ":" + CH.tf + ":" + rows.length + ":" + CFG.srPivot
            + ":" + CFG.srZoneAtr + ":" + CFG.srMinTouch + ":" + CFG.srMaxAge;
  if (CHZ.key === key) return CHZ.zones;
  let zones = [];
  try {
    const d = enrich(rows);
    zones = srZonesNow(d).slice(0, 8);
  } catch (e) { zones = []; }
  CHZ = {key, zones};
  return zones;
}

/* --------------------------------------------------------------- drawing */
function drawChart() {
  const cv = document.getElementById("cv");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const W = Math.max(240, cv.clientWidth);

  const subs = [];
  if (CH.ind.vol)  subs.push("vol");
  if (CH.ind.rsi)  subs.push("rsi");
  if (CH.ind.macd) subs.push("macd");
  const priceH = Math.max(190, Math.min(360, Math.round(window.innerHeight*0.38)));
  const subH = 56, gap = 7, axH = 15;
  const H = priceH + subs.length*(subH+gap) + axH;

  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.height = H + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.font = "9.5px -apple-system,system-ui,sans-serif";
  ctx.textBaseline = "middle";

  const rows = CH.rows;
  if (!rows.length) {
    ctx.fillStyle = CHCOL.txt; ctx.textAlign = "center";
    ctx.fillText(CH.busy ? "Loading candles…" : (CH.err || "No data"), W/2, H/2);
    CH.geo = null; return;
  }

  const padL = 3, padR = 52;
  const end = Math.max(10, rows.length - CH.off);
  const cnt = Math.min(CH.n, end);
  const start = Math.max(0, end - cnt);
  const vis = rows.slice(start, end);
  const plotW = W - padL - padR;
  const bw = plotW / Math.max(1, vis.length);
  const X = i => padL + (i - start + 0.5) * bw;

  // ---- price range, widened by whatever overlays are switched on
  let hi = -Infinity, lo = Infinity;
  const grow = v => { if (isFinite(v)) { if (v>hi) hi=v; if (v<lo) lo=v; } };
  for (const b of vis) { grow(b.h); grow(b.l); }

  const close = rows.map(r=>r.c);
  const zones = CH.ind.sr ? chZones(rows) : null;
  const occ  = CH.ind.occ  ? occForRows(rows) : null;
  const I    = chInd(rows);
  const emas = I.ema || null, bb = I.bb || null, vw = I.vwap || null;
  const chan = CH.ind.chan ? regChannel(rows, Math.max(0, end-CH.p.chanLen), end,
                                        CH.p.chanK) : null;
  const vp   = CH.ind.vprof ? volProfile(rows, start, end, CH.p.vpBuckets) : null;
  const fib  = CH.ind.fib
    ? autoSwing(rows, Math.max(0, end-CH.p.fibLook), end) : null;

  if (occ) for (const p of occ.pts)
    if (p.i>=start && p.i<end) { grow(p.cm); grow(p.om); }
  // Zones only widen the view a little - a far-off level should not squash
  // the candles, so anything more than 12% away is left off the scale.
  if (zones) for (const z of zones) {
    const ref = rows[end-1].c;
    if (Math.abs(z.mid-ref)/ref < 0.12) { grow(z.lo); grow(z.hi); }
  }
  if (emas) for (const e of emas)
    for (let i=start;i<end;i++) grow(e[i]);
  if (bb) for (let i=start;i<end;i++) { grow(bb.up[i]); grow(bb.lo[i]); }
  if (vw) for (let i=start;i<end;i++) grow(vw[i]);
  if (I.st) for (let i=start;i<end;i++) grow(I.st.line[i]);
  if (I.ut) for (let i=start;i<end;i++) grow(I.ut.stop[i]);
  if (I.sar) for (let i=start;i<end;i++) grow(I.sar[i]);
  if (I.don) for (let i=start;i<end;i++) { grow(I.don.hi[i]); grow(I.don.lo[i]); }
  if (chan) { grow(chan.a + chan.sd); grow(chan.a + chan.b*(chan.n-1) + chan.sd);
              grow(chan.a - chan.sd); grow(chan.a + chan.b*(chan.n-1) - chan.sd); }
  if (fib) { grow(fib.hi); grow(fib.lo); }
  if (I.swing) { grow(I.swing.hi.price); grow(I.swing.lo.price); }

  // ---- the signal levels for this pair, if there is one
  let sig = null;
  if (CH.sigOn && CH.tf === CFG.signalTf) {
    sig = OPEN.find(s=>s.symbol===CH.sym) || CLOSED.find(s=>s.symbol===CH.sym);
    if (sig) { grow(sig.entry); grow(sig.stop);
               for (const t of sig.targets) grow(t.price); }
  }

  if (!isFinite(hi) || !isFinite(lo) || hi===lo) { hi = (hi||1)*1.01; lo = (lo||0)*0.99; }
  const pad = (hi-lo)*0.06; hi += pad; lo -= pad;
  const pTop = 4, pBot = priceH - 4;
  const Y = p => pTop + (hi-p)/(hi-lo) * (pBot-pTop);

  // ---- grid + right-hand price scale
  ctx.strokeStyle = CHCOL.grid; ctx.lineWidth = 1;
  ctx.fillStyle = CHCOL.txt; ctx.textAlign = "left";
  for (let k=0; k<=4; k++) {
    const p = lo + (hi-lo)*k/4, y = Math.round(Y(p)) + .5;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(fmt(p), W-padR+5, y);
  }

  const box = (i0, i1, y0, y1, col, alpha, dashed) => {
    const x0 = Math.max(padL, X(i0) - bw/2);
    const x1 = Math.min(W-padR, i1 == null ? W-padR : X(i1) + bw/2);
    if (x1 <= x0 || y1 < pTop-40 || y0 > pBot+40) return;
    ctx.globalAlpha = alpha; ctx.fillStyle = col;
    ctx.fillRect(x0, y0, x1-x0, Math.max(1, y1-y0));
    ctx.globalAlpha = Math.min(1, alpha*2.4); ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    if (dashed) { ctx.save(); ctx.setLineDash([3,3]); }
    ctx.strokeRect(x0+.5, y0+.5, x1-x0-1, Math.max(1, y1-y0)-1);
    if (dashed) ctx.restore();
    ctx.globalAlpha = 1;
  };

  // ---- fair value gaps: unfilled ones extend to the right edge
  if (I.fvg) for (const g of I.fvg) {
    if (g.i >= end) continue;
    const to = g.filled ? Math.min(g.fillIdx, end-1) : null;
    if (to != null && to < start) continue;
    box(Math.max(g.i, start-1), to, Y(g.hi), Y(g.lo),
        g.side === "bull" ? CHCOL.upw : CHCOL.dnw, g.filled ? 0.05 : 0.13);
  }

  // ---- order blocks, brighter while they have not been traded back into
  if (I.ob) for (const b of I.ob) {
    if (b.i >= end || b.i < start-60) continue;
    const to = b.mit ? Math.min(b.mitIdx, end-1) : null;   // stop at mitigation
    if (to != null && to < start) continue;
    box(Math.max(b.i, start-1), to, Y(b.hi), Y(b.lo),
        b.side === "bull" ? CHCOL.ob : CHCOL.res, b.mit ? 0.06 : 0.17, true);
  }

  // ---- regression channel
  if (chan) {
    const yAt = k => Y(chan.a + chan.b*k);
    const line = (off, col, wdt, dash) => {
      ctx.save(); if (dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = wdt;
      ctx.moveTo(X(chan.start), Y(chan.a + off));
      ctx.lineTo(X(chan.start+chan.n-1), Y(chan.a + chan.b*(chan.n-1) + off));
      ctx.stroke(); ctx.restore();
    };
    line(chan.sd, CHCOL.chan, 1, [4,4]);
    line(0, CHCOL.chan, 1.4);
    line(-chan.sd, CHCOL.chan, 1, [4,4]);
  }

  // ---- range breakout channel
  if (I.don) {
    const dl = (arr, col) => {
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = 1.2;
      for (let i=start;i<end;i++)
        i===start ? ctx.moveTo(X(i), Y(arr[i])) : ctx.lineTo(X(i), Y(arr[i]));
      ctx.stroke();
    };
    ctx.globalAlpha = .8; dl(I.don.hi, CHCOL.rng); dl(I.don.lo, CHCOL.rng);
    ctx.globalAlpha = 1;
  }

  // ---- auto Fibonacci over the last significant leg
  if (fib) {
    const span = fib.to - fib.from;
    ctx.textAlign = "left";
    for (const f of FIBS) {
      const p = fib.from + span*f, y = Y(p);
      if (y < pTop || y > pBot) continue;
      ctx.save(); ctx.setLineDash(f===0||f===1 ? [] : [3,4]);
      ctx.strokeStyle = CHCOL.fib; ctx.globalAlpha = f===0||f===1 ? .8 : .45;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = CHCOL.fib; ctx.globalAlpha = .9;
      ctx.fillText(f.toFixed(3).replace(/0+$/,"").replace(/\.$/,""), padL+3, y-5);
      ctx.globalAlpha = 1;
    }
  }

  // ---- current swing range with its midpoint
  if (I.swing) {
    const hi = I.swing.hi.price, lo = I.swing.lo.price, mid = (hi+lo)/2;
    ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle = CHCOL.flip;
    ctx.globalAlpha = .7; ctx.lineWidth = 1;
    [hi, lo, mid].forEach(p=>{ const y=Y(p);
      if (y>=pTop && y<=pBot) { ctx.beginPath();
        ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); } });
    ctx.restore();
    ctx.fillStyle = CHCOL.flip; ctx.textAlign = "left";
    if (Y(mid)>=pTop && Y(mid)<=pBot) ctx.fillText("50%", padL+3, Y(mid)-5);
  }

  // ---- volume profile down the right-hand side
  if (vp) {
    const wMax = (W-padR-padL) * 0.22;
    for (let k = 0; k < vp.bins.length; k++) {
      const y0 = Y(vp.lo + (k+1)*vp.step), y1 = Y(vp.lo + k*vp.step);
      const w = vp.max ? vp.bins[k]/vp.max*wMax : 0;
      const inVA = (vp.lo + k*vp.step) >= vp.vaLo && (vp.lo + (k+1)*vp.step) <= vp.vaHi;
      ctx.fillStyle = inVA ? "#5a6474" : CHCOL.vp;
      ctx.globalAlpha = .45;
      ctx.fillRect(W-padR-w, y0, w, Math.max(1, y1-y0-1));
    }
    ctx.globalAlpha = 1;
    const yp = Y(vp.poc);
    ctx.strokeStyle = CHCOL.poc; ctx.lineWidth = 1.2; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.moveTo(W-padR-wMax, yp); ctx.lineTo(W-padR, yp); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = CHCOL.poc; ctx.textAlign = "right";
    ctx.fillText("POC", W-padR-4, yp-6);
  }

  // ---- support & resistance zones, drawn first so candles sit on top
  if (zones) {
    for (const z of zones) {
      const y0 = Y(z.hi), y1 = Y(z.lo);
      if (y1 < pTop-2 || y0 > pBot+2) continue;
      const col = z.kind === "support" ? CHCOL.sup
                : z.kind === "resistance" ? CHCOL.res : CHCOL.flip;
      const a = Math.min(0.30, 0.10 + z.touches*0.045);
      ctx.fillStyle = col; ctx.globalAlpha = a;
      ctx.fillRect(padL, y0, W-padR-padL, Math.max(1.5, y1-y0));
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.globalAlpha = .75;
      ctx.beginPath(); ctx.moveTo(padL, y0); ctx.lineTo(W-padR, y0);
      ctx.moveTo(padL, y1); ctx.lineTo(W-padR, y1); ctx.stroke();
      ctx.globalAlpha = 1;
      const lbl = z.touches + "×";
      ctx.fillStyle = col; ctx.textAlign = "right";
      ctx.fillText(lbl, W-padR-4, (y0+y1)/2);
    }
  }

  // ---- OCC band + the two averages
  if (occ && occ.pts.length) {
    const p = occ.pts.filter(x=>x.i>=start-2 && x.i<end+2);
    for (let k=1; k<p.length; k++) {
      const a=p[k-1], b=p[k];
      ctx.beginPath();
      ctx.moveTo(X(a.i), Y(a.cm)); ctx.lineTo(X(b.i), Y(b.cm));
      ctx.lineTo(X(b.i), Y(b.om)); ctx.lineTo(X(a.i), Y(a.om)); ctx.closePath();
      ctx.fillStyle = b.cm >= b.om ? "rgba(62,207,142,.16)" : "rgba(229,72,77,.16)";
      ctx.fill();
    }
    const line = (key, col) => {
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      p.forEach((x,k)=> k ? ctx.lineTo(X(x.i), Y(x[key])) : ctx.moveTo(X(x.i), Y(x[key])));
      ctx.stroke();
    };
    line("om", CHCOL.om); line("cm", CHCOL.cm);
    for (const c of occ.crosses) {
      if (c.i < start || c.i >= end) continue;
      const x = X(c.i), long = c.side === "LONG";
      const y = long ? Y(rows[c.i].l) + 13 : Y(rows[c.i].h) - 13;
      ctx.fillStyle = long ? CHCOL.upw : CHCOL.dnw;
      ctx.beginPath();
      if (long) { ctx.moveTo(x, y-8); ctx.lineTo(x-5, y+2); ctx.lineTo(x+5, y+2); }
      else      { ctx.moveTo(x, y+8); ctx.lineTo(x-5, y-2); ctx.lineTo(x+5, y-2); }
      ctx.closePath(); ctx.fill();
    }
  }

  // ---- moving averages, bands, vwap
  const series = (arr, col, wdt) => {
    ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = wdt||1.3;
    let started = false;
    for (let i=start; i<end; i++) {
      const v = arr[i]; if (!isFinite(v)) continue;
      const x = X(i), y = Y(v);
      started ? ctx.lineTo(x,y) : (ctx.moveTo(x,y), started=true);
    }
    ctx.stroke();
  };
  if (bb) { series(bb.up, CHCOL.bb, 1); series(bb.lo, CHCOL.bb, 1);
            series(bb.mid, "#3f4756", 1); }
  if (emas) { series(emas[0], CHCOL.e2); series(emas[1], CHCOL.e1);
              series(emas[2], "#f472b6"); series(emas[3], CHCOL.e3); }
  if (vw) series(vw, CHCOL.vwap, 1.4);

  // Supertrend is drawn in segments so it changes colour when it flips.
  if (I.st) {
    ctx.lineWidth = 1.8;
    for (let i=Math.max(start+1,1); i<end; i++) {
      if (!isFinite(I.st.line[i]) || !isFinite(I.st.line[i-1])) continue;
      if (I.st.dir[i] !== I.st.dir[i-1]) continue;      // skip the flip gap
      ctx.beginPath();
      ctx.strokeStyle = I.st.dir[i] === 1 ? CHCOL.upw : CHCOL.dnw;
      ctx.moveTo(X(i-1), Y(I.st.line[i-1])); ctx.lineTo(X(i), Y(I.st.line[i]));
      ctx.stroke();
    }
  }
  if (I.ut) {
    series(I.ut.stop, CHCOL.ut, 1.3);
    for (const g of I.ut.sig) {
      if (g.i < start || g.i >= end) continue;
      const x = X(g.i), long = g.side === "LONG";
      ctx.fillStyle = long ? CHCOL.upw : CHCOL.dnw;
      ctx.beginPath(); ctx.arc(x, Y(g.p), 3.2, 0, 6.284); ctx.fill();
    }
  }
  if (I.sar) {
    ctx.fillStyle = CHCOL.sar;
    for (let i=start;i<end;i++) {
      if (!isFinite(I.sar[i])) continue;
      ctx.beginPath(); ctx.arc(X(i), Y(I.sar[i]), 1.5, 0, 6.284); ctx.fill();
    }
  }
  if (I.swp) for (const w of I.swp) {
    if (w.i < start || w.i >= end) continue;
    const x = X(w.i), y = Y(w.price);
    ctx.strokeStyle = CHCOL.swp; ctx.lineWidth = 1.4; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.moveTo(x-7, y); ctx.lineTo(x+7, y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = CHCOL.swp; ctx.textAlign = "center";
    ctx.fillText("sweep", x, w.side==="bull" ? y+11 : y-9);
  }

  // ---- candles
  const bodyW = Math.max(1, Math.min(15, bw*0.66));
  for (let i=start; i<end; i++) {
    const b = rows[i], x = X(i), up = b.c >= b.o;
    ctx.strokeStyle = up ? CHCOL.upw : CHCOL.dnw;
    ctx.fillStyle   = up ? CHCOL.up  : CHCOL.dn;
    ctx.lineWidth = Math.max(1, Math.min(1.6, bw*0.12));
    ctx.beginPath();
    ctx.moveTo(Math.round(x)+.5, Y(b.h)); ctx.lineTo(Math.round(x)+.5, Y(b.l));
    ctx.stroke();
    const y0 = Y(Math.max(b.o,b.c)), y1 = Y(Math.min(b.o,b.c));
    ctx.fillRect(x-bodyW/2, y0, bodyW, Math.max(1, y1-y0));
  }

  // ---- signal levels
  if (sig) {
    const lv = [{p:sig.entry, col:"#ffffff", txt:"Entry "+sig.entry, dash:[2,3]},
                {p:sig.stop,  col:CHCOL.dnw, txt:"Stop "+sig.stop, dash:[4,4]}];
    sig.targets.forEach(t => lv.push({p:t.price, col:CHCOL.upw, dash:[4,4],
      txt:"TP"+t.index+" "+t.price+(t.hit?" \u2713":"")}));
    lv.forEach((l,k) => { l.y = Y(l.p); l.rank = k < 2 ? 0 : 1; });
    for (const l of lv) {                        // lines first, all of them
      if (l.y < pTop || l.y > pBot) continue;
      ctx.save(); ctx.setLineDash(l.dash);
      ctx.strokeStyle = l.col; ctx.lineWidth = 1; ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.moveTo(padL, l.y); ctx.lineTo(W-padR, l.y); ctx.stroke();
      ctx.restore();
    }
    // Entry and stop are labelled whatever happens; a target label is dropped
    // if it would land on top of one already drawn.
    const drawn = [];
    for (const l of [...lv].sort((a,b)=> a.rank-b.rank || a.y-b.y)) {
      if (l.y < pTop+6 || l.y > pBot) continue;
      let ty = l.y;
      if (drawn.some(y => Math.abs(y-ty) < 12)) {
        if (l.rank) continue;                  // a target simply loses its label
        while (drawn.some(y => Math.abs(y-ty) < 12) && ty > pTop+8) ty -= 12;
      }
      drawn.push(ty);
      const w = ctx.measureText(l.txt).width + 7;
      ctx.fillStyle = "rgba(13,13,15,.75)";
      ctx.fillRect(padL+1, ty-13, w, 12);
      ctx.fillStyle = l.col; ctx.textAlign = "left";
      ctx.fillText(l.txt, padL+4, ty-7);
    }
  }

  // ---- sub panes
  let top = priceH + gap;
  const paneBg = (h) => {
    ctx.strokeStyle = CHCOL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, top+.5); ctx.lineTo(W-padR, top+.5); ctx.stroke();
  };
  for (const kind of subs) {
    paneBg(subH);
    if (kind === "vol") {
      let mv = 0; for (const b of vis) mv = Math.max(mv, b.v);
      const vMa = sma(rows.map(r=>r.v), 20);
      for (let i=start; i<end; i++) {
        const b = rows[i], h = mv? b.v/mv*(subH-6) : 0;
        ctx.fillStyle = b.c>=b.o ? "rgba(38,161,123,.75)" : "rgba(229,72,77,.75)";
        ctx.fillRect(X(i)-bodyW/2, top+subH-h, bodyW, h);
      }
      ctx.beginPath(); ctx.strokeStyle = "#b0b0bb"; ctx.lineWidth = 1;
      for (let i=start;i<end;i++) {
        const y = top+subH - (mv? vMa[i]/mv*(subH-6) : 0);
        i===start ? ctx.moveTo(X(i),y) : ctx.lineTo(X(i),y);
      }
      ctx.stroke();
      ctx.fillStyle = CHCOL.txt; ctx.textAlign="left";
      ctx.fillText("Volume", padL+3, top+8);
    }
    if (kind === "rsi") {
      const r = rsi(close, 14);
      const yy = v => top + (100-v)/100*subH;
      ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle = "#33333c";
      [30,50,70].forEach(v=>{ ctx.beginPath();
        ctx.moveTo(padL, yy(v)); ctx.lineTo(W-padR, yy(v)); ctx.stroke(); });
      ctx.restore();
      ctx.beginPath(); ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 1.4;
      for (let i=start;i<end;i++)
        i===start ? ctx.moveTo(X(i),yy(r[i])) : ctx.lineTo(X(i),yy(r[i]));
      ctx.stroke();
      ctx.fillStyle = CHCOL.txt; ctx.textAlign="left";
      ctx.fillText("RSI 14 · " + r[end-1].toFixed(0), padL+3, top+8);
    }
    if (kind === "macd") {
      const m = macd(close, 12, 26, 9);
      let mx = 1e-9;
      for (let i=start;i<end;i++)
        mx = Math.max(mx, Math.abs(m.line[i]), Math.abs(m.sig[i]), Math.abs(m.hist[i]));
      const mid = top + subH/2, yy = v => mid - v/mx*(subH/2-4);
      for (let i=start;i<end;i++) {
        const h = m.hist[i];
        ctx.fillStyle = h>=0 ? "rgba(62,207,142,.7)" : "rgba(229,72,77,.7)";
        ctx.fillRect(X(i)-bodyW/2, Math.min(mid, yy(h)), bodyW, Math.abs(yy(h)-mid));
      }
      const ml = (arr,col)=>{ ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=1.3;
        for (let i=start;i<end;i++)
          i===start? ctx.moveTo(X(i),yy(arr[i])) : ctx.lineTo(X(i),yy(arr[i]));
        ctx.stroke(); };
      ml(m.line, "#4aa8ff"); ml(m.sig, "#f0c14b");
      ctx.fillStyle = CHCOL.txt; ctx.textAlign="left";
      ctx.fillText("MACD 12/26/9", padL+3, top+8);
    }
    top += subH + gap;
  }

  // ---- time axis
  ctx.fillStyle = CHCOL.txt; ctx.textAlign = "center";
  const step = Math.max(1, Math.round(vis.length/5));
  for (let i=start+Math.floor(step/2); i<end; i+=step) {
    const d = new Date(rows[i].t);
    const lbl = BARMIN[CH.tf] >= 1440
      ? d.toLocaleDateString(undefined,{day:"numeric",month:"short"})
      : (d.getHours()===0 && d.getMinutes()===0
          ? d.toLocaleDateString(undefined,{day:"numeric",month:"short"})
          : pad2(d.getHours())+":"+pad2(d.getMinutes()));
    ctx.fillText(lbl, Math.max(padL+22, Math.min(W-padR-22, X(i))), H-axH/2);
  }

  // ---- crosshair
  if (CH.hover != null && CH.hover>=start && CH.hover<end) {
    const x = X(CH.hover), b = rows[CH.hover];
    ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle = "#6a6a72";
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, priceH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, Y(b.c)); ctx.lineTo(W-padR, Y(b.c)); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#2b2b33"; ctx.fillRect(W-padR+1, Y(b.c)-8, padR-2, 16);
    ctx.fillStyle = "#fff"; ctx.textAlign="left";
    ctx.fillText(fmt(b.c), W-padR+5, Y(b.c));
  }

  CH.geo = {start, end, bw, padL, padR, W};
  chOhlc();
}

/* The readout above the chart - last candle, or whatever the crosshair is on. */
function chOhlc() {
  const el = document.getElementById("ohlc");
  if (!el || !CH.rows.length) return;
  const i = (CH.hover != null && CH.rows[CH.hover]) ? CH.hover : CH.rows.length-1;
  const b = CH.rows[i], up = b.c>=b.o;
  const d = new Date(b.t);
  const chg = ((b.c-b.o)/b.o*100);
  el.innerHTML =
    `<span>${d.toLocaleString(undefined,{month:"short",day:"numeric",
       hour:"2-digit",minute:"2-digit"})}</span>
     <span>O <b>${fmt(b.o)}</b></span><span>H <b>${fmt(b.h)}</b></span>
     <span>L <b>${fmt(b.l)}</b></span><span>C <b>${fmt(b.c)}</b></span>
     <span class="${up?"up":"down"}">${sgn(chg)}</span>`;
}

/* Header price + 24h change, straight off the candles. */
function chHead() {
  const el = document.getElementById("chpx");
  if (!el) return;
  if (!CH.rows.length) { el.innerHTML = CH.busy
    ? '<b style="font-size:13px;color:var(--dim)">loading…</b>' : ""; return; }
  const last = CH.rows[CH.rows.length-1];
  const per = Math.max(1, Math.round(1440/BARMIN[CH.tf]));
  const ref = CH.rows[Math.max(0, CH.rows.length-1-per)];
  const ch = (last.c-ref.c)/ref.c*100;
  el.innerHTML = `<b>${fmt(last.c)}</b>
    <span class="ch ${cls(ch)}">${sgn(ch)} · 24h</span>`;
}

/* ------------------------------------------------------------- chart view */
function chartView() {
  const sym = chSym(), tf = chTf();
  const CHART_TFS = [...ALL_TFS, "1M", "1y"];
  const tfs = CHART_TFS.map(t=>
    `<button class="tfb${t===tf?" on":""}" onclick="setChartTf('${t}')">${t}</button>`
    ).join("");
  const active = Object.keys(CH.ind).filter(k=>CH.ind[k]);
  const inds = active.map(k=>
    `<button class="indb on" onclick="togInd('${k}',this)">
      <i class="sw2"></i>${esc(IND_NAME[k]||k)} ×</button>`).join("")
    || `<span class="chartsub" style="margin:6px 2px">No indicators on</span>`;

  const sheet = CH.pickInd ? `<div class="indsheet">
    ${IND_GROUPS.map(([g,list])=>`<div class="indgrp">${g}</div>
      <div class="indwrap">${list.map(([k,l])=>
        `<button class="indb${CH.ind[k]?" on":""}" onclick="togInd('${k}',this)">

    <div class="indgrp">Settings</div>
    <div class="status" style="margin-top:2px">

      ${chRng("stMult","Supertrend multiplier",CH.p.stMult,1,6,0.5)}
      ${chRng("utKey","UT Bot sensitivity",CH.p.utKey,1,6,0.5)}
      ${chRng("chanLen","Channel length",CH.p.chanLen,30,300,10)}
      ${chRng("rngLen","Range lookback",CH.p.rngLen,5,60,1)}
      ${chRng("fibLook","Fib swing lookback",CH.p.fibLook,30,300,10)}
      ${chRng("vpBuckets","Volume profile rows",CH.p.vpBuckets,15,90,1)}</div>
    <button class="btn" onclick="togIndSheet()">Done</button></div>` : "";

  const leg = [];
  if (CH.ind.occ) leg.push([CHCOL.cm,"MA of close"], [CHCOL.om,"MA of open"]);
  if (CH.ind.sr) leg.push([CHCOL.sup,"Support"], [CHCOL.res,"Resistance"],
                          [CHCOL.flip,"Flipped level"]);
  if (CH.ind.ema) leg.push([CHCOL.e2,"EMA20"], [CHCOL.e1,"EMA50"],
                           ["#f472b6","EMA100"], [CHCOL.e3,"EMA200"]);
  if (CH.ind.st) leg.push([CHCOL.st,"Supertrend "+CH.p.stLen+"/"+CH.p.stMult]);
  if (CH.ind.utbot) leg.push([CHCOL.ut,"UT Bot "+CH.p.utKey+"/"+CH.p.utAtr]);
  if (CH.ind.psar) leg.push([CHCOL.sar,"Parabolic SAR"]);
  if (CH.ind.chan) leg.push([CHCOL.chan,"Regression channel"]);
  if (CH.ind.fib) leg.push([CHCOL.fib,"Fibonacci"]);
  if (CH.ind.rng) leg.push([CHCOL.rng,"Range "+CH.p.rngLen]);
  if (CH.ind.ob) leg.push([CHCOL.ob,"Order block"]);
  if (CH.ind.fvg) leg.push([CHCOL.upw,"Fair value gap"]);
  if (CH.ind.sweep) leg.push([CHCOL.swp,"Liquidity sweep"]);
  if (CH.ind.vprof) leg.push([CHCOL.poc,"Point of control"]);
  if (CH.ind.bb) leg.push([CHCOL.bb,"Bollinger 20/2"]);
  if (CH.ind.vwap) leg.push([CHCOL.vwap,"VWAP"]);
  const legend = leg.length
    ? `<div class="legend">${leg.map(([c,l])=>
        `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>` : "";

  const list = (ALLSYMS.length ? ALLSYMS : CFG.focus).filter(s=>
    !CH.q || s.replace("USDT","").includes(CH.q.toUpperCase()));
  const quick = [...new Set([...OPEN.map(s=>s.symbol), ...CFG.focus])].slice(0,14);
  const picker = CH.pick ? `<div class="chpick">
    <input class="search" placeholder="Search pairs…" value="${esc(CH.q)}"
      oninput="chFilter(this.value)" autocomplete="off">
    <div class="chips">${list.slice(0,60).map(s=>
      `<button class="chip${s===sym?" on":""}" onclick="setChartSym('${s}')">
        ${esc(s.replace("USDT",""))}</button>`).join("")}</div></div>` : "";

  const sig = OPEN.find(s=>s.symbol===sym) || CLOSED.find(s=>s.symbol===sym);
  const sigNote = sig && tf===CFG.signalTf
    ? `<div class="chartsub">Showing the ${sig.side} signal levels — entry, stop

  const tvSym = CFG.market === "spot" ? "BINANCE:"+sym : "BINANCE:"+sym+".P";
  return `
    <div class="cbar">
      <button class="symbtn" onclick="togPick()">${esc(sym.replace("USDT",""))}<span style="color:var(--dim);font-weight:700">/USDT</span> ▾</button>

        + "Profile settings (" + CFG.occMaType + " " + CFG.occMaLen + ", ×"
        + CFG.occMult + " timeframe). " : ""}
      ${CH.ind.sr ? "Shaded bands are support and resistance zones built from "
        + "swing pivots — the number on the right is how many times price has "

    <a class="tvbtn" href="https://www.tradingview.com/chart/?symbol=${
      encodeURIComponent(tvSym)}&interval=${
      {"15m":"15","30m":"30","1h":"60","2h":"120","4h":"240","1d":"D"}[tf]}"
      target="_blank" rel="noopener">Open ${esc(sym.replace("USDT",""))} on TradingView ↗</a>
    <div class="hint">TradingView opens the same pair and timeframe, with their
      full indicator library. The OCC overlay above is computed here, from the
      same code that generates your signals.</div>`;
}

function togPick() { CH.pick = !CH.pick; render(true); }
function chFilter(v) { CH.q = v; render(true);
  const el = document.querySelector(".chpick .search");
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }
function setChartSym(s) {
  CH.sym = s; CH.pick = false; CH.q = ""; CH.rows = []; CH.hover = null;
  render(true); loadChart();
}
function setChartTf(t) {
  if (CH.tf === t) return;
  CH.tf = t; CH.rows = []; CH.hover = null; render(true); loadChart();
}
function togInd(k, el) {
  CH.ind[k] = !CH.ind[k];
  if (el) el.classList.toggle("on", CH.ind[k]);
  render(true);
}
function togIndSheet() { CH.pickInd = !CH.pickInd; render(true); }
function chRng(k, label, val, min, max, step) {
  return `<div class="kv"><span class="k">${label}</span><span class="v">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}"
     oninput="setChParam('${k}',this.value)">
    <span id="v_ch_${k}">${val}</span></span></div>`;
}
function setChParam(k, v) {
  CH.p[k] = parseFloat(v);
  const el = document.getElementById("v_ch_"+k);
  if (el) el.textContent = v;
  clearTimeout(setChParam._t);
  setChParam._t = setTimeout(()=>{ CHI.key = null; drawChart(); }, 200);
}
function openChart(sym) {
  CH.sym = sym; CH.tf = CFG.signalTf; CH.rows = []; CH.off = 0; CH.hover = null;
  go("chart");
}

/* Gestures: drag to pan, two fingers to zoom, tap for the crosshair. */
function initChart() {
  const cv = document.getElementById("cv");
  if (!cv) return;
  if (!cv.dataset.wired) {
    cv.dataset.wired = "1";
    const pts = new Map();
    let mode = null, startX = 0, startOff = 0, startN = 0, startDist = 0, moved = 0;
    const dist = () => { const a=[...pts.values()];
      return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (pts.size === 1) { mode="pan"; startX=e.clientX; startOff=CH.off; moved=0; }
      else if (pts.size === 2) { mode="zoom"; startDist=dist(); startN=CH.n; }
    });
    cv.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (mode === "zoom" && pts.size >= 2) {
        const d = dist();
        if (startDist > 8) {
          CH.n = Math.max(25, Math.min(400, Math.round(startN * startDist / d)));
          drawChart();
        }
        return;
      }
      if (mode === "pan" && CH.geo) {
        const dx = e.clientX - startX;
        moved = Math.max(moved, Math.abs(dx));
        if (moved > 5) {
          const bars = Math.round(dx / CH.geo.bw);
          CH.off = Math.max(0, Math.min(CH.rows.length-20, startOff + bars));
          CH.hover = null;
          drawChart();
        }
      }
    });
    const up = e => {
      if (mode === "pan" && moved <= 5 && CH.geo) {
        const r = cv.getBoundingClientRect();
        const i = CH.geo.start + Math.floor((e.clientX - r.left - CH.geo.padL)/CH.geo.bw);
        CH.hover = (i>=CH.geo.start && i<CH.geo.end) ? i : null;
        drawChart();
      }
      pts.delete(e.pointerId);
      if (!pts.size) mode = null; else if (pts.size === 1) { mode = null; }
    };
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", e => { pts.delete(e.pointerId); mode=null; });
    cv.addEventListener("wheel", e => {
      e.preventDefault();
      CH.n = Math.max(25, Math.min(400, Math.round(CH.n * (e.deltaY>0?1.12:0.89))));
      drawChart();
    }, {passive:false});
  }
  if (!CH.rows.length && !CH.busy) loadChart();
  else { drawChart(); chHead(); }
  chStartPoll();
}

let chRz; window.addEventListener("resize", ()=>{
  clearTimeout(chRz);
  chRz = setTimeout(()=>{ if (TAB==="chart") drawChart();
    else if (TAB==="closed" && RTAB==="bt" && BT.res) drawEquity(); }, 180);
});

/* ------------------------------------------------------------------- start */
readHash();
loadBots(); loadMatrix(); loadModules(); loadEvo(); loadBook(); loadServer();
loadSession();
loadDeploy();
// The backtester starts from whatever the app is currently set to, then keeps
// its own copy so tuning a backtest never disturbs the live scanner.
for (const k of BT_KEYS) if (k !== "strategy") BT[k] = CFG[k];
render();
run();
startLive();
setInterval(()=>{
  // A scan on top of a running search means two heavy jobs fighting over one
  // thread, and the phone loses. The search finishes, then scanning resumes.
  if (BUSY || OPT.running || BEST.running || DEPLOY.working) return;
  if (document.visibilityState !== "visible") return;
  // The one switch. Off means off — no scanning, no searching, nothing.
  if (!ENGINE.on && !CFG.alwaysOn) return;
  if (Date.now()-LASTRUN > CFG.autoRefreshMin*60000) refresh();
}, 5000);

/* The slow jobs, on their own clock.
   Each bot already recorded when its next search was due — and nothing ever
   read that field, so a bot set to find its own best period searched once when
   you pressed the button and never again. One job at a time, and never while
   a scan is running: three heavy jobs on one thread is what makes a phone
   stop responding. */
setInterval(() => {
  if (!ENGINE.on) return;
  if (document.visibilityState !== "visible") return;
  if (BUSY || OPT.running || BEST.running || DEPLOY.working
      || MATRIX.running || EVO.running || WHALE.running) return;
  const now = Date.now();

  const due = enabledBots().find((b) => b.mode === "auto" && b.nextTune
                                     && now >= b.nextTune);
  if (due) { botSearch(due.id); return; }

  if (CFG.matrixAuto && now - (MATRIX.at || 0) > CFG.matrixEveryMin * 60000) {
    matrixRun(); return;
  }
  if (CFG.evoAuto && now - (EVO.at || 0) > CFG.evoEveryHours * 3600000) {
    evoRun(); return;
  }
}, 20000);
// The wake lock is dropped by the browser whenever the tab is backgrounded,
// so it has to be taken again on the way back.
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible" && CFG.alwaysOn) keepAwake();
});
setInterval(()=>{ if (!BUSY && TAB!=="chart") render(); }, 60000);
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState==="visible" && !OPT.running && !BEST.running
      && !DEPLOY.working
      && Date.now()-LASTRUN > CFG.autoRefreshMin*60000) refresh(); });
</script>
