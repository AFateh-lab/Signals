      if (x.idx < 210 || x.idx > d.c.length - 2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side,
        `UT ${CFG.utKey}/${CFG.utAtrLen}`, ["ATR trailing stop cross"], x.stop);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      track(sig, d); out.push(sig);
    }
  } else if (CFG.strategy === "tt") {
    for (const f of ttFlips(d).flips) {
      if (f.idx < 210 || f.idx > d.c.length - 2) continue;
      const sig = ttSignal(sym, d, f);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[f.idx].t) !== sig.side) continue;
      track(sig, d); out.push(sig);
    }
  } else if (CFG.strategy === "sr") {
    for (const hit of srScan(d)) {
      const sig = srSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d); out.push(sig);
    }
  } else if (CFG.strategy === "pat") {
    for (const hit of patScan(d)) {
      const sig = patSignal(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d); out.push(sig);
    }
  } else if (SIMPLE_STRATS[CFG.strategy]) {
    for (const hit of SIMPLE_STRATS[CFG.strategy](d)) {
      const sig = simpleSignals(sym, d, hit);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d); out.push(sig);
    }
  } else {
    let last = -999;
    for (let i = 210; i < d.c.length - 1; i++) {
      if (i - last < CFG.cooldownBars) continue;
      const sig = makeSignal(sym, d, i);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[i].t) !== sig.side) continue;
      track(sig, d); out.push(sig); last = i;
    }
  }
  return out;
}


function occSeries(c) {
  const agg = aggregate(c, Math.max(1, Math.round(CFG.occMult)));
  if (agg.length < CFG.occMaLen + 3) return null;
  const t = CFG.occMaType, n = CFG.occMaLen;
  const closeMa = variant(t, agg.map(x=>x.c), n, CFG.occSigma, CFG.occAlmaOffset,
                          agg.map(x=>x.v));
  const openMa  = variant(t, agg.map(x=>x.o), n, CFG.occSigma, CFG.occAlmaOffset,
                          agg.map(x=>x.v));
  return {agg, closeMa, openMa};
}

function occCrosses(c) {
  const s = occSeries(c);
  if (!s) return [];
  const out = [];
  for (let k = 1; k < s.agg.length; k++) {
    const a0=s.closeMa[k-1], b0=s.openMa[k-1], a1=s.closeMa[k], b1=s.openMa[k];
    if (isNaN(a0)||isNaN(b0)||isNaN(a1)||isNaN(b1)) continue;
    if (a0 <= b0 && a1 > b1) out.push({idx: s.agg[k].endIdx, side: "LONG"});
    else if (a0 >= b0 && a1 < b1) out.push({idx: s.agg[k].endIdx, side: "SHORT"});
  }
  return out;
}

/* Walk the candles after the signal and see what actually happened. */
/* Two numbers that decide whether a win was comfortable or a near miss: how
   far the trade went against you before it resolved, and how far it went in
   your favour. Both in R -- multiples of the distance to the original stop --
   so they mean the same thing on every coin.

   Without them, two trades that both reached Target 2 look identical, when one
   of them nearly stopped you out on the way and will next time. */
/* track() decides the outcome under the plain ladder. The exit brain replays
   the same trade under managed exits so the two can be compared — see
   exitCompare. Wrapped rather than merged so the baseline stays untouched:
   a comparison where the baseline moved is not a comparison. */
function track(sig, d) {
  const long = sig.side==="LONG";
  let stop = sig.stop;
  const risk = Math.abs(sig.entry - (sig.initialStop != null ? sig.initialStop : sig.stop));
  sig.mae = 0;                       // worst against you, in R
  sig.mfe = 0;                       // best in your favour, in R
  for (let i=sig.idx+1; i<d.c.length; i++) {
    const b=d.c[i];
    if (risk > 0) {
      const against = long ? (sig.entry - b.l) : (b.h - sig.entry);
      const forward = long ? (b.h - sig.entry) : (sig.entry - b.l);
      if (against > 0) sig.mae = Math.max(sig.mae, +(against / risk).toFixed(2));
      if (forward > 0) sig.mfe = Math.max(sig.mfe, +(forward / risk).toFixed(2));
    }
    if (long ? b.l<=stop : b.h>=stop) {
      sig.stop = round(stop, sig.entry);
      sig.price = sig.stop;
      sig.roi = netRoi(((stop-sig.entry)/sig.entry)*100*(long?1:-1)*sig.leverage,
                       sig.leverage);
      sig.status = sig.be ? "breakeven" : "stopped";
      sig.closedAt = b.t;
      return sig;
    }
    for (const t of sig.targets) {
      if (t.hit) continue;
      if (long ? b.h>=t.price : b.l<=t.price) {
        t.hit = true; t.at = b.t;
        sig.hits = Math.max(sig.hits, t.index);
        sig.status = "target_" + t.index;
      }
    }
    if (CFG.beAfter && !sig.be && sig.hits>=CFG.beAfter) {
      sig.be = true; stop = sig.entry; sig.stop = sig.entry;
    }
    if (sig.hits >= sig.targets.length) {
      sig.status="completed"; sig.closedAt=b.t;
      sig.price=sig.targets[sig.targets.length-1].price;
      sig.roi = netRoi(((sig.price-sig.entry)/sig.entry)*100*(long?1:-1)*sig.leverage,
                       sig.leverage);
      return sig;
    }
    // The strategy itself says get out (OCC: the MAs crossed back).
    if (sig.exitIdx != null && i >= sig.exitIdx) {
      sig.status = "reversed"; sig.closedAt = b.t;
      sig.price = round(b.c, sig.entry);
      sig.roi = netRoi(((b.c-sig.entry)/sig.entry)*100*(long?1:-1)*sig.leverage,
                       sig.leverage);
      return sig;
    }
  }
  const last = d.close[d.close.length-1];
  sig.price = round(last, sig.entry);
  sig.roi = netRoi(((last-sig.entry)/sig.entry)*100*(long?1:-1)*sig.leverage,
                   sig.leverage);
  return sig;
}

/* Every path out of track() lands here, so the comparison cannot be skipped
   by whichever branch closed the trade. */
const _track = track;
track = function (sig, d) {
  const out = _track(sig, d);
  if (CFG.exitBrain) { try { exitCompare(out, d); } catch (e) {} }
  return out;
};

/* The auto-pilot swaps CFG over to whichever strategy this coin picked, and
   the settings that come with it. The swap has to be undone on every exit
   path — there are five — or the global settings are left holding one coin's
   choice, and the next scan is no longer in auto mode at all. A single manual
   restore on one branch was doing exactly that. */
/* Six workers share one CFG, so the per-coin strategy swap is only safe if
   nothing can run between the swap and its undo. Everything after the swap in
   the body is synchronous, and every exit calls st.done() before returning --
   so the swap and the restore happen inside one uninterrupted turn.

   Undoing it in this wrapper's `finally` was not enough: that runs a microtask
   later, by which point another worker had already started and recorded the
   swapped value as the thing to put back. The scan then quietly stopped being
   per-coin at all. */
async function scanSymbol(sym) {
  const st = { keep: null, done: null };
  try {
    return await scanSymbolBody(sym, st);
  } finally {
    if (st.keep) {                      // belt and braces on an early throw
      for (const k in st.keep) CFG[k] = st.keep[k];
      if (PASS_STRATEGY !== null) CFG.strategy = PASS_STRATEGY;
    }
  }
}

async function scanSymbolBody(sym, __st) {
  const [ltf, htf] = await Promise.all([
    klines(sym, CFG.signalTf, CFG.bars),
    klines(sym, CFG.trendTf, 400),
  ]);
  const d = enrich(ltf), h = enrich(htf);
  const found = [];
  const j = d.c.length - 2;
  let near = null;

  // Auto-pilot: let this pair's own history choose the strategy.
  //
  // Deciding costs five full replays of that coin's history. Doing it for a
  // hundred coins in one pass is five hundred replays, which on a phone is
  // minutes of a frozen screen and no signals — the scan never finishes.
  //
  // So only a handful of coins are re-decided per scan, and the choice is kept
  // for hours rather than half an hour. Everything else uses the pick it
  // already has, or the strategy that won the search, and gets its turn on a
  // later pass. The whole list converges over a few scans instead of stalling
  // on the first one.
  let autoKeep = null;
  if (CFG.strategy === "auto") {
    const cached = AUTOPICK.get(sym);
    const fresh = cached && Date.now() - cached.at < AUTO.ttl
      && (cached.tuned || cached.tf === CFG.signalTf);
    if (!fresh && AUTO.left > 0) {
      AUTO.left--;
      AUTO.decided++;
      const pick = autoPick(sym, d, h, ltf);
      if (pick) AUTOPICK.set(sym, {strat: pick.strat, exp: pick.exp, n: pick.n,
                                   at: Date.now(), tf: CFG.signalTf});
    } else if (!fresh) {
      AUTO.waiting++;
    }
    const chosen = AUTOPICK.get(sym);
    autoKeep = {strategy: CFG.strategy};
    __st.keep = autoKeep;              // and again in the caller, on a throw
    // No pick yet: use whatever won the basket-wide search rather than
    // silently defaulting to one strategy for everything.
    CFG.strategy = chosen ? chosen.strat
                 : (DEPLOY.strat || BT.strategy || "confluence");
    // A coin that has been individually tuned also carries its own settings.
    if (chosen && chosen.params) {
      for (const k in chosen.params) {
        autoKeep[k] = CFG[k];
        CFG[k] = chosen.params[k];
      }
    }
    __st.done = () => {
      for (const k in autoKeep) CFG[k] = autoKeep[k];
      if (PASS_STRATEGY !== null) CFG.strategy = PASS_STRATEGY;
      __st.keep = null;
    };
  }

  // Four independent reads of direction, one value per candle.
  const votes = voteArrays(d, ltf);
  const gate = (sig) => {
    if (!sig) return null;
    const a = agreementAt(votes, sig.idx, sig.side);
    sig.agree = a.n; sig.agreeOf = a.of; sig.voters = a.names;
    // Every module reads the signal at the moment it fired, and the readings
    // travel with it. That is what makes the measurement possible later: when
    // this trade resolves, we know exactly what each module said beforehand.
    sig.adxAt = d.adx[sig.idx];
    if (CFG.chaseOn) sig.chase = chaseCheck(sym, d, sig.idx, sig);
    moduleRead(sym, d, sig.idx, sig, h);
    if (autoKeep) {
      sig.autoStrat = CFG.strategy;
      sig.tag += " · " + (STRAT_SHORT[CFG.strategy] || CFG.strategy);
    }
    if (CFG.minAgree && a.n < CFG.minAgree) {
      DROP.agree++;
      sig.belowBar = "agreement " + a.n + "/4";
      track(sig, d);
      SPARE.push(sig);
      return null;
    }
    return sig;
  };

  if (CFG.strategy === "occ") {
    const crosses = occCrosses(ltf);
    const tag = `${CFG.occMaType}${CFG.occMaLen}×${CFG.occMult}`;
    for (let k = 0; k < crosses.length; k++) {
      const x = crosses[k];
      if (x.idx < 210 || x.idx > d.c.length-2) continue;
      const why = [`${CFG.occMaType}(${CFG.occMaLen}) close/open cross`,
                   `${CFG.signalTf} ×${CFG.occMult} timeframe`,
                   x.side === "LONG" ? "close MA crossed above open MA"
                                     : "close MA crossed below open MA"];
      const sig = gate(buildSignal(sym, d, x.idx, x.side, tag, why));
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      if (CFG.occExitOnCross && crosses[k+1]) sig.exitIdx = crosses[k+1].idx;
      track(sig, d);
      found.push(sig);
    }
    // How close the two MAs are to touching, as a stand-in for "nearly firing".
    const s = occSeries(ltf);
    if (s) {
      const last = s.agg.length-1;
      const cm = s.closeMa[last], om = s.openMa[last];
      if (!isNaN(cm) && !isNaN(om) && om) {
        const gap = (cm-om)/Math.abs(om)*100;
        near = {symbol: sym, side: gap>=0 ? "SHORT" : "LONG",
                gap: Math.abs(gap), agrees: true};
      }
    }
    if (__st.done) __st.done();
    return {found, near};
  }

  if (CFG.strategy === "ut") {
    const {crosses} = utCrosses(d);
    for (const x of crosses) {
      if (x.idx < 210 || x.idx > d.c.length-2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side, `UT ${CFG.utKey}/${CFG.utAtrLen}`,
        [`price crossed the ATR(${CFG.utAtrLen}) trailing stop`,
         `sensitivity ${CFG.utKey}`, "stop rides the trailing line"], x.stop);
      if (!gate(sig)) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      track(sig, d);
      found.push(sig);
    }
    const st = utCrosses(d).stop, last = d.c.length-2;
    if (last > 0) {
      const gap = (d.close[last]-st[last])/d.close[last]*100;
      near = {symbol: sym, side: gap>=0 ? "SHORT":"LONG",
              gap: Math.abs(gap), agrees: true};
    }
    if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
    if (__st.done) __st.done();
    return {found, near};
  }

  if (CFG.strategy === "tt") {
    const {flips, trend, upper, lower} = ttFlips(d);
    for (const f of flips) {
      if (f.idx < 210 || f.idx > d.c.length-2) continue;
      const sig = gate(ttSignal(sym, d, f));
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[f.idx].t) !== sig.side) continue;
      track(sig, d);
      found.push(sig);
    }
    const last = d.c.length-2;
    if (last > 0 && trend[last] !== null) {
      const line = trend[last] ? lower[last] : upper[last];
      near = {symbol: sym, side: trend[last] ? "LONG":"SHORT",
              gap: Math.abs((d.close[last]-line)/d.close[last]*100), agrees: true};
    }
    if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
    if (__st.done) __st.done();
    return {found, near};
  }

  if (SIMPLE_STRATS[CFG.strategy]) {
    const hits = SIMPLE_STRATS[CFG.strategy](d);
    for (const hit of hits) {
      const sig = gate(simpleSignals(sym, d, hit));
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d);
      found.push(sig);
    }
    const lastB = d.c.length - 2;
    if (lastB > 0) {
      // how far from firing: distance to the level the rule watches
      const px = d.close[lastB];
      const g = CFG.strategy === "rsi"
        ? Math.abs(d.rsi[lastB] - (d.rsi[lastB] < 50 ? CFG.rsiLow : CFG.rsiHigh))
        : Math.abs(d.atrPct[lastB] || 0);
      near = { symbol: sym, side: d.ef[lastB] > d.em[lastB] ? "LONG" : "SHORT",
               gap: g, agrees: true };
    }
    if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
    if (__st.done) __st.done();
    return {found, near};
  }

  if (CFG.strategy === "pat") {
    const hits = patScan(d);
    for (const hit of hits) {
      const sig = gate(patSignal(sym, d, hit));
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d);
      found.push(sig);
    }
    // "Closest to firing" for a pattern is the newest shape on the chart,
    // measured by how far price sits from the line it has to break.
    const lastBar = d.c.length - 2;
    if (lastBar > 0 && hits.length) {
      const h0 = hits[hits.length - 1];
      near = {symbol: sym, side: h0.side,
              gap: Math.abs((d.close[lastBar] - h0.level) / d.close[lastBar] * 100),
              agrees: true};
    }
    if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
    if (__st.done) __st.done();
    return {found, near};
  }

  if (CFG.strategy === "sr") {
    for (const hit of srScan(d)) {
      const sig = gate(srSignal(sym, d, hit));
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[hit.idx].t) !== sig.side) continue;
      track(sig, d);
      found.push(sig);
    }
    // How far price sits from the nearest zone, as a "close to firing" reading.
    const zs = srZonesNow(d);
    if (zs.length) {
      const px = d.close[d.close.length-1];
      let nearest = null;
      for (const z of zs) {
        const dist = px > z.hi ? (px-z.hi) : px < z.lo ? (z.lo-px) : 0;
        if (!nearest || dist < nearest.dist) nearest = {z, dist};
      }
      near = {symbol: sym, side: px < nearest.z.mid ? "SHORT" : "LONG",
              gap: nearest.dist/px*100, agrees: true};
    }
    if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
    if (__st.done) __st.done();
    return {found, near};
  }

  let lastIdx = -999;
  for (let i = 210; i < d.c.length-1; i++) {           // -1: last candle is forming
    if (i - lastIdx < CFG.cooldownBars) continue;
    const sig = gate(makeSignal(sym, d, i));
    if (!sig) {
      // Track the strongest misses so an over-tight filter cannot empty the list.
      if (i > d.c.length - 120) {
        const nm = nearMissSignal(sym, d, i);
        if (nm && (!CFG.requireHtf || htfBias(h, d.c[i].t) === nm.side)) {
          // keep the same labelling as a full signal, so a topped-up card
          // still says which strategy produced it
          if (autoKeep) {
            nm.autoStrat = CFG.strategy;
            nm.tag += " · " + (STRAT_SHORT[CFG.strategy] || CFG.strategy);
          }
          track(nm, d); SPARE.push(nm);
        }
      }
      continue;
    }
    if (CFG.requireHtf && htfBias(h, d.c[i].t) !== sig.side) continue;
    track(sig, d);
    found.push(sig);
    lastIdx = i;
  }

  // What the newest closed candle scores right now, even if below threshold.
  // This is what feeds the "closest to firing" list.
  if (j > 210) {
    const L = score(d, j, "LONG"), S = score(d, j, "SHORT");
    const side = L.pts >= S.pts ? "LONG" : "SHORT";
    const pts = Math.max(L.pts, S.pts);
    const bias = htfBias(h, d.c[j].t);
    near = {symbol: sym, side, pts, agrees: bias === side};
  }
  if (autoKeep) for (const k in autoKeep) CFG[k] = autoKeep[k];
  if (__st.done) __st.done();
    return {found, near};
}

/* =========================================================================
   TWO SETUPS AT ONCE

   Your own settings and the ones the search deployed are different opinions
   about the same market. Running only one means the other's signals never
   happen. Running both means whichever fires, fires — immediately, with the
   card saying which produced it.

   The cost is honest: a second pass over the same coins. No extra downloads,
   because the candles are already cached, but twice the processor work. It is
   off unless you ask for it, and it refuses to run the same setup twice.
   ========================================================================= */

/* The fields that make one setup different from another. Anything not here
   is shared, because it is about the app rather than the trading. */
const SETUP_KEYS = [
  "strategy", "signalTf", "trendTf", "requireHtf", "minScore", "adxMin",
  "minAgree", "slAtr", "tpAtr", "beAfter", "maxLossPct", "minLev", "maxLev",
  "cooldownBars", "occMaType", "occMaLen", "occMult", "occExitOnCross",
  "utKey", "utAtrLen", "ttLen", "ttTarget",
  "srPivot", "srZoneAtr", "srMinTouch", "srMode", "srZoneStop", "srBreakAtr",
  "brkLen","brkAtrStop","brkMinAdx","rsiLen","rsiLow","rsiHigh","rsiWithTrend",
  "mrLen","mrZ","mrMaxAdx","momLen","momPct","momMinAdx",
  "patPivot", "patTol", "patFlat", "patMaxAge", "patCooldown",
  "patMinHeight", "patMinSpan", "patFlagRun", "patFlagPause", "patFlagAtr", "patCupBars",
  "patTargets",
];

/* The setup you built by hand, kept aside so the deployment cannot eat it. */
let MYSETUP = null;

/* What CFG.strategy is meant to be for the pass currently running, so a
   concurrent worker cannot restore a neighbour's value over it. */
let PASS_STRATEGY = null;

function snapshotSetup(from) {
  const o = {};
  for (const k of SETUP_KEYS) {
    o[k] = Array.isArray((from || CFG)[k]) ? (from || CFG)[k].slice() : (from || CFG)[k];
  }
  return o;
}

function applySetup(setup) {
  // Nothing applied, nothing to undo. Returning a blanket restore here was a
  // quiet disaster: a scan takes a minute, and on finishing it would put back
  // the settings as they were when it started — throwing away anything changed
  // while it ran. Change the strategy mid-scan and it reverted itself.
  if (!setup) return () => {};
  const before = snapshotSetup();
  for (const k of SETUP_KEYS) if (k in setup) CFG[k] = setup[k];
  return () => { for (const k of SETUP_KEYS) CFG[k] = before[k]; };
}

function sameSetup(a, b) {
  if (!a || !b) return false;
  return SETUP_KEYS.every((k) => String(a[k]) === String(b[k]));
}

/** Save what is on screen now as "my setup", so it can run alongside. */
function saveMySetup() {
  MYSETUP = snapshotSetup();
  CFG.dualScan = true;
  writeHash(); render(true);
  toast("Saved — both setups now scanning");
  refresh();
}
function dropMySetup() {
  MYSETUP = null; CFG.dualScan = false;
  writeHash(); render(true); refresh();
}

/* =========================================================================
   BOTS

   A bot is a competitor: its own coins, its own strategy, its own chart
   period, its own risk, its own clock. Several run side by side over the same
   candles, every signal is stamped with the bot that produced it, and a
   leaderboard ranks them on their own live record.

   This replaces Automatic-versus-Manual, which was the wrong shape. A mode is
   a switch; what you actually want is contestants. A self-tuning bot and a
   hand-built one are then just two bots with different `mode`, and they can
   never overwrite each other's settings — which was a real bug, not a
   preference.

   Nothing here decides which bot is right. It runs them and measures.
   ========================================================================= */
const BKEY = "signals.bots.v1";
const BOT_MAX = 10;

let BOTS = [];
let ENGINE = { on: false };        // the one Run / Stop switch

function newBot(n, from) {
  return {
    id: "b" + n + "-" + Math.random().toString(36).slice(2, 7),
    name: "Bot " + n,
    on: false,
    // A bot that follows uses whatever the app is currently set to rather than
    // a frozen copy. The first one does, so a deployment still drives the
    // scanner; freezing it meant a stale snapshot quietly overrode every
    // deploy on the next scan.
    follow: false,
    mode: "auto",                  // it finds its own best chart period
    cfg: snapshotSetup(from),
    startedAt: 0,                  // its clock: nothing older than this counts
    retuneHours: 6,
    nextTune: 0,
    winner: "", tf: "", holdout: null, combo: null, changes: 0,
    log: [],
  };
}

function saveBots() {
  try {
    localStorage.setItem(BKEY, JSON.stringify({ bots: BOTS, on: ENGINE.on }));
  } catch (e) { /* private mode */ }
}

function loadBots() {
  try {
    const o = JSON.parse(localStorage.getItem(BKEY) || "null");
    if (o && Array.isArray(o.bots) && o.bots.length) {
      BOTS = o.bots.slice(0, BOT_MAX);
      ENGINE.on = !!o.on;
    }
  } catch (e) { /* nothing to restore */ }
  if (!BOTS.length) {
    // First run: one bot holding whatever the app is already set to, so
    // nothing changes until the user adds a second.
    const b = newBot(1);
    b.on = true;
    b.follow = true;               // the live settings, deploy and all
    b.name = "Main";
    // Start its clock a day back. A bot whose clock begins now hides every
    // signal until something fresh fires, which on a 4h chart is most of a
    // day of an empty screen and no way to tell that from a broken app.
    b.startedAt = Date.now() - 86400000;
    BOTS = [b];
  }
}

/* How often you want to hear from it.

   One control instead of six. Every knob under here trades the same thing:
   how sure the app has to be before it says anything. Moving right means more
   signals — and, unavoidably, a higher share of them wrong. There is no
   setting that produces more signals of the same quality; if there were, it
   would already be the default. */
const RATES = {
  strict:  { minScore: 7, minAgree: 3, cooldownBars: 12, maxAgeBars: 12,
             minWinRate: 55, minRecord: 6, requireHtf: true, maxOpen: 15,
             botsPerScan: 4, patMinHeight: 2.0, patMinSpan: 22,
             note: "Only setups with several readings behind them and a winning "
                 + "record on that coin. Expect a handful a day, sometimes none." },
  normal:  { minScore: 6, minAgree: 2, cooldownBars: 8, maxAgeBars: 24,
             minWinRate: 0, minRecord: 6, requireHtf: true, maxOpen: 20,
             botsPerScan: 4, patMinHeight: 1.2, patMinSpan: 14,
             note: "The middle. Trend has to agree, and two of the four reads "
                 + "have to back the direction." },
  often:   { minScore: 5, minAgree: 0, cooldownBars: 3, maxAgeBars: 48,
             minWinRate: 0, minRecord: 6, requireHtf: false, maxOpen: 40,
             botsPerScan: 6, patMinHeight: 0.9, patMinSpan: 10,
             note: "Many more signals. The higher-timeframe check is off and "
                 + "nothing has to agree, so a good number of these will be "
                 + "wrong — read the record badge on each card before taking one." },
  flood:   { minScore: 4, minAgree: 0, cooldownBars: 1, maxAgeBars: 96,
             minWinRate: 0, minRecord: 6, requireHtf: false, maxOpen: 60,
             botsPerScan: 10, patMinHeight: 0.6, patMinSpan: 8,
             note: "Everything the strategies produce, filtered by almost "
                 + "nothing. This is a research setting. Trading it as a signal "
                 + "list is how an account gets fee'd to death." },
};
let RATE = "normal";
function setRate(k) {
  const r = RATES[k];
  if (!r) return;
  RATE = k;
  for (const key in r) if (key !== "note") CFG[key] = r[key];
  writeHash();
  render(true);
  refresh();
}
function rateBlock() {
  const seg = [["strict","Selective"],["normal","Balanced"],
               ["often","Frequent"],["flood","Everything"]].map(([k,l]) =>
    `<button class="${k === RATE ? "on" : ""}" onclick="setRate('${k}')">${l}</button>`
  ).join("");
  return `<div class="seg">${seg}</div>
    <div class="segnote">${RATES[RATE].note}</div>`;
}

/* The lineup.

   Ten bots are only worth running if they are ten different opinions. Ten
   copies of one setting is not a panel of experts, it is one expert shouting
   — and it was exactly that which produced the repeated cards. So a new bot
   takes the next unused lens rather than a copy of the screen: a different
   strategy, a different chart period, or both.

   Deliberately spread across speeds. A 15m bot and a 4h bot disagreeing is
   information; two 1h bots disagreeing is mostly noise. */
const BOT_LINEUP = [
  { name: "Confluence",     cfg: { strategy: "confluence", signalTf: "1h",  trendTf: "4h" } },
  { name: "Chart patterns", cfg: { strategy: "pat",        signalTf: "1h",  trendTf: "4h" } },
  { name: "UT Bot",         cfg: { strategy: "ut",         signalTf: "4h",  trendTf: "1d" } },
  { name: "Open/Close",     cfg: { strategy: "occ",        signalTf: "1h",  trendTf: "4h" } },
  { name: "Target Trend",   cfg: { strategy: "tt",         signalTf: "2h",  trendTf: "8h" } },
  { name: "S&R zones",      cfg: { strategy: "sr",         signalTf: "1h",  trendTf: "4h" } },
  { name: "Patterns slow",  cfg: { strategy: "pat",        signalTf: "4h",  trendTf: "1d" } },
  { name: "Confluence fast",cfg: { strategy: "confluence", signalTf: "15m", trendTf: "1h" } },
  { name: "UT Bot fast",    cfg: { strategy: "ut",         signalTf: "30m", trendTf: "2h" } },
  { name: "Best per coin",  cfg: { strategy: "auto",       signalTf: "1h",  trendTf: "4h" } },
];

/** The first lens no bot is using yet. */
function nextLens() {
  const taken = new Set(BOTS.map((b) => (b.cfg && b.cfg.strategy) + "|"
                                      + (b.cfg && b.cfg.signalTf)));
  return BOT_LINEUP.find((l) => !taken.has(l.cfg.strategy + "|" + l.cfg.signalTf))
      || BOT_LINEUP[BOTS.length % BOT_LINEUP.length];
}

function addBot(lens) {
  if (BOTS.length >= BOT_MAX) { toast("Ten bots is the limit"); return; }
  const pick = lens || nextLens();
  const b = newBot(BOTS.length + 1);
  b.on = true;
  b.name = pick.name;
  for (const k in pick.cfg) b.cfg[k] = pick.cfg[k];
  if (ENGINE.on) b.startedAt = Date.now();
  BOTS.push(b);
  saveBots(); render(true);
  return b;
}

/** One tap: fill every empty slot with a lens nobody is running. */
function fillBots() {
  let added = 0;
  while (BOTS.length < BOT_MAX) { if (!addBot()) break; added++; }
  toast(added ? "Added " + added + " bot" + (added === 1 ? "" : "s")
              : "Every slot is already taken");
  refresh();
}

function removeBot(id) {
  BOTS = BOTS.filter((b) => b.id !== id);
  if (!BOTS.length) {
    BOTS = [Object.assign(newBot(1), { on: true, follow: true, name: "Main" })];
  }
  saveBots(); render(true); refresh();
}

function botById(id) { return BOTS.find((b) => b.id === id) || null; }

function toggleBot(id) {
  const b = botById(id);
  if (!b) return;
  b.on = !b.on;
  if (b.on && !b.startedAt) b.startedAt = Date.now();
  if (b.on && b.mode === "auto" && !b.nextTune) {
    // Stagger the first search so switching six bots on does not queue six
    // full searches back to back.
    b.nextTune = Date.now() + (1 + BOTS.indexOf(b)) * 60000;
  }
  saveBots(); render(true); refresh();
}

function setBotMode(id, mode) {
  const b = botById(id);
  if (!b) return;
  // Following the app and tuning itself are the same job done twice, and they
  // would fight. Choosing to self-tune takes a copy first.
  if (mode === "auto" && b.follow) { b.cfg = snapshotSetup(); b.follow = false; }
  b.mode = mode;
  saveBots(); render(true);
}

/** Copy what is on screen into a bot — the way you build a fixed one. */
function botTakeCurrent(id) {
  const b = botById(id);
  if (!b) return;
  b.cfg = snapshotSetup();
  b.follow = false;
  b.startedAt = Date.now();
  saveBots(); render(true);
  toast(b.name + " now holds its own copy of these settings");
  refresh();
}

/** Load a bot's settings onto the screen, to look at or edit them. */
function botEdit(id) {
  const b = botById(id);
  if (!b || b.follow) return;      // a following bot already is the screen
  for (const k of SETUP_KEYS) if (k in b.cfg) CFG[k] = b.cfg[k];
  PRESET = "custom";
  writeHash(); render(true);
  toast("Editing " + b.name + " — press Take current to save it back");
}

/* --------------------------------------------------------------- the engine */
function engineToggle() {
  ENGINE.on = !ENGINE.on;
  if (ENGINE.on) {
    const now = Date.now();
    for (const b of BOTS) if (b.on && !b.startedAt) b.startedAt = now;
    askNotify(); keepAwake();
    saveBots(); render(true);
    refresh();
  } else {
    releaseWake();
    saveBots(); render(true);
  }
}

function enabledBots() { return BOTS.filter((b) => b.on); }

/* ------------------------------------------------------------- leaderboard */
/** Each bot's live record, from the trades it actually produced. */
function botStats(id) {
  const rows = CLOSED.filter((s) => (s.setup || "") === id);
  const n = rows.length;
  if (!n) return { n: 0, rate: 0, exp: 0, sum: 0 };
  const wins = rows.filter((s) => s.hits >= 1).length;
  let sum = 0, counted = 0;
  for (const s of rows) {
    const r = rOf(s);
    if (r != null) { sum += r; counted++; }
  }
  return { n, rate: Math.round(wins / n * 100),
           exp: counted ? +(sum / counted).toFixed(2) : 0, sum: +sum.toFixed(2) };
}

function leaderboard() {
  const rows = BOTS.map((b) => ({ b, st: botStats(b.id) }))
    .sort((a, x) => x.st.exp - a.st.exp);
  const any = rows.some((r) => r.st.n);
  if (!any) {
    return `<div class="segnote">No bot has a finished trade yet. This ranks
      them on their own live record — not on a backtest — so it fills up as
      trades resolve.</div>`;
  }
  return `<div class="status">${rows.map(({ b, st }) => `<div class="kv">
      <span class="k">${b.on ? "" : "<span style=\"color:var(--dim)\">off</span> "}${
        esc(b.name)}<span style="color:#5e5e66"> · ${st.n} trade${
        st.n === 1 ? "" : "s"}${st.n ? " · TP1 " + st.rate + "%" : ""}</span></span>
      <span class="v" style="color:${st.exp > 0 ? "var(--green2)"
        : st.exp < 0 ? "var(--red2)" : "var(--dim)"}">${
        st.n ? (st.exp > 0 ? "+" : "") + st.exp + "R" : "—"}</span></div>`).join("")}
    </div>
    <div class="hint">Average result per trade, in R. Give it a few weeks
      before believing the order — ten trades tells you almost nothing.</div>`;
}

/** Which setups this scan should run. The live one always; yours as well. */
function activeSetups() {
  const on = enabledBots();
  if (!on.length) {
    // No bot enabled: scan with whatever is on screen, so the app still works
    // as a plain scanner rather than going silent.
    return [{ id: "live", name: "Current settings", cfg: null, startedAt: 0 }];
  }
  return on.map((b) => ({ id: b.id, name: b.name,
                          cfg: b.follow ? null : b.cfg,
                          startedAt: b.startedAt }));
}

/* What each bot found on its last turn, so a staged rotation does not make
   perfectly good signals blink out of the list. Keyed by signal and bot. */
let HELD = new Map();
let BOT_TURN = 0;

/** The few bots that get a turn this scan. */
function setupSlice(list) {
  const n = Math.max(1, Math.min(CFG.botsPerScan || 4, list.length));
  if (list.length <= n) return list;
  const out = [];
  for (let k = 0; k < n; k++) out.push(list[(BOT_TURN + k) % list.length]);
  BOT_TURN = (BOT_TURN + n) % list.length;
  return out;
}

/* =========================================================================
   THE MATRIX  —  10 strategies x 10 chart periods = 100 bots.

   Every cell is one bot: one strategy on one period. Each cell is replayed
   over history per coin, scored on eight measures, put through a wall of
   filters, and only what survives is ranked. The top few cells per coin
   become the signal candidates.

   Three things make this different from just running 100 scanners:

   * The score is a weighted combination, not a single number. A cell with a
     90% win rate over 4 trades is not better than 58% over 120, and a score
     built only on net profit would say it was. Trade count and consistency
     are in the formula precisely so a fluke cannot win.

   * Every cell is scored on candles it was not chosen on. The last third of
     history is held back. Anything can be made to look good on data it was
     fitted to; the held-back slice is the only part worth reading.

   * Filters come before ranking, not after. A cell that fails the trade
     minimum is removed rather than ranked low, so it can never surface just
     because everything else that day was worse.

   Cost is the honest constraint. 100 cells x 100 coins is ten thousand
   replays; a phone will not do that in one go and pretending otherwise is
   how the page froze before. So it works through a rotation of coins, keeps
   what it learns, and improves the picture over minutes rather than claiming
   to have the whole answer in one pass.
   ========================================================================= */

const MATRIX_STRATS = ["confluence", "occ", "ut", "tt", "sr",
                       "pat", "brk", "rsi", "mr", "mom"];
const MATRIX_TFS = [["5m","30m"], ["15m","1h"], ["30m","2h"], ["1h","4h"],
                    ["2h","8h"], ["4h","1d"], ["6h","1d"], ["8h","1d"],
                    ["12h","3d"], ["1d","1w"]];

const MATRIX = {
  on: false, running: false, cancel: false,
  cell: new Map(),        // "sym|strat|tf" -> score row
  coin: 0,                // rotation pointer into the coin list
  done: 0, total: 0, step: "", at: 0, pass: 0, view: "",
  err: null,
};

/* The eight measures, weighted. Everything is on a 0..1 scale before it is
   weighted, so no single measure can dominate by having a bigger unit. */
const MSCORE = {
  winRate:    0.18,
  profitF:    0.20,
  netProfit:  0.14,
  expectancy: 0.18,
  drawdown:   0.12,
  trades:     0.08,
  consistency:0.06,
  recency:    0.04,
};

/* The wall. A cell has to clear every one of these before it is ranked. */
const MFILTER = {
  minTrades: 20, minWinRate: 45, minPf: 1.1, maxDD: 25, minStability: 60,
};

function mkey(sym, strat, tf) { return sym + "|" + strat + "|" + tf; }

/* Score one cell from a list of resolved signals. `hold` is the index the
   held-back slice starts at — everything before it is ignored. */
function matrixScore(sigs, hold, nowT) {
  const done = sigs.filter((s) => s.closedAt && s.idx >= hold);
  const n = done.length;
  if (!n) return null;
  let wins = 0, gp = 0, gl = 0, sumR = 0, rN = 0;
  // A real equity curve, compounding. Summing percentages and calling the
  // difference a drawdown was wrong: 70 winners then 50 losers came out as
  // "100% drawdown" on an account that never went below its start. Drawdown
  // has to be measured against the peak of the curve, as a share of it.
  let eq = 100, peak = 100, dd = 0;
  const half = [0, 0];
  for (let k = 0; k < done.length; k++) {
    const s = done[k];
    const risk = Math.abs(s.entry - (s.initialStop != null ? s.initialStop : s.stop));
    const move = (s.roi || 0) / (s.leverage || 1);
    if (s.roi > 0) { wins++; gp += s.roi; } else { gl += Math.abs(s.roi); }
    if (risk > 0) {
      const r = move / (risk / s.entry * 100);
      sumR += r; rN++;
      half[k < done.length / 2 ? 0 : 1] += r;
    }
    eq *= 1 + move / 100;
    peak = Math.max(peak, eq);
    if (peak > 0) dd = Math.max(dd, (peak - eq) / peak * 100);
  }
  const netPct = eq - 100;
  const winRate = wins / n * 100;
  const pf = gl > 0 ? gp / gl : (gp > 0 ? 5 : 0);
  const expR = rN ? sumR / rN : 0;
  // Consistency: did both halves of the record pay, or only one lucky patch?
  const stability = (half[0] > 0 && half[1] > 0) ? 100
                  : (half[0] > 0 || half[1] > 0) ? 50 : 0;
  const newest = Math.max(...done.map((s) => s.closedAt || 0));
  const ageDays = nowT ? (nowT - newest) / 86400000 : 0;
  const norm = {
    winRate:    Math.min(1, winRate / 70),
    profitF:    Math.min(1, pf / 2.5),
    netProfit:  Math.min(1, Math.max(0, netPct) / 60),
    expectancy: Math.min(1, Math.max(0, expR) / 1.2),
    drawdown:   Math.max(0, 1 - dd / 40),
    trades:     Math.min(1, n / 60),
    consistency:stability / 100,
    recency:    Math.max(0, 1 - ageDays / 30),
  };
  let score = 0;
  for (const k in MSCORE) score += MSCORE[k] * norm[k];
  // Shrink toward zero on a thin record.
  //
  // Without this, four winning trades in a row scored higher than a hundred
  // and twenty trades at 58% — which is exactly backwards, and exactly the
  // way a matrix of a hundred cells fools you. With a hundred cells looking
  // at the same coin, several will have a perfect short record by chance
  // alone; that is arithmetic, not skill. Multiplying by n/(n+25) says what
  // is actually true: a four-trade result is mostly ignorance, and the score
  // should reflect how much we know, not just how good it looks.
  const confidence = n / (n + 25);
  return {
    n, winRate: +winRate.toFixed(1), pf: +pf.toFixed(2),
    netPct: +netPct.toFixed(1), expR: +expR.toFixed(2), maxDD: +dd.toFixed(1),
    stability, ageDays: +ageDays.toFixed(1), confidence: +confidence.toFixed(2),
    raw: +(score * 100).toFixed(1),
    score: +(score * confidence * 100).toFixed(1),
  };
}

/** Does this cell clear the wall? Returns the reason it failed, or "". */
function matrixReject(m) {
  if (!m) return "no trades";
  if (m.n < MFILTER.minTrades) return m.n + " trades — too few";
  if (m.winRate < MFILTER.minWinRate) return "won " + m.winRate + "%";
  if (m.pf < MFILTER.minPf) return "profit factor " + m.pf;
  if (m.maxDD > MFILTER.maxDD) return "drew down " + m.maxDD + "%";
  if (m.stability < MFILTER.minStability) return "only one good patch";
  return "";
}

/* One coin, all 100 cells. Synchronous per cell, with a yield between
   strategies so the page keeps breathing. */
async function matrixCoin(sym) {
  const keep = snapshotSetup();
  let built = 0;
  try {
    for (const [sigTf, trTf] of MATRIX_TFS) {
      if (MATRIX.cancel) break;
      let ltf, htf;
      try {
        [ltf, htf] = await Promise.all([
          btKlines(sym, sigTf, CFG.matrixBars),
          btKlines(sym, trTf, Math.min(1000, CFG.matrixBars)),
        ]);
      } catch (e) { continue; }
      const d = enrich(ltf), h = enrich(htf);
      // Half held back, not a third. The wall asks for 20 trades in the
      // tested slice, and a third of the window rarely contains that many —
      // so almost every cell was being rejected for thinness rather than for
      // being bad, which tells you nothing.
      const hold = Math.floor(d.c.length * 0.5);
      CFG.signalTf = sigTf; CFG.trendTf = trTf;
      for (const strat of MATRIX_STRATS) {
        if (MATRIX.cancel) break;
        CFG.strategy = strat;
        let sigs = [];
        try { sigs = autoSignals(sym, d, h, ltf); } catch (e) { sigs = []; }
        const m = matrixScore(sigs, hold, Date.now());
        const tf = sigTf + ">" + trTf;
        MATRIX.cell.set(mkey(sym, strat, tf), m
          ? Object.assign(m, { sym, strat, tf, why: matrixReject(m), at: Date.now() })
          : { sym, strat, tf, n: 0, score: 0, why: "no trades", at: Date.now() });
        built++;
        MATRIX.done++;
      }
      MATRIX.step = sym.replace("USDT", "") + " · " + sigTf + " · "
                  + MATRIX.done + " cells";
      render();
      await new Promise((r) => setTimeout(r, 0));
    }
  } finally {
    for (const k in keep) CFG[k] = keep[k];
  }
  return built;
}

/* Work through the coin rotation. Never all of them at once — that is the
   difference between a machine that keeps running and a page that dies. */
async function matrixRun(coins) {
  if (MATRIX.running) return;
  MATRIX.running = true; MATRIX.cancel = false; MATRIX.err = null;
  MATRIX.done = 0;
  const list = (coins && coins.length) ? coins
    : (UNIVERSE.length ? UNIVERSE : CFG.focus);
  const batch = [];
  for (let k = 0; k < Math.min(CFG.matrixCoins, list.length); k++) {
    batch.push(list[(MATRIX.coin + k) % list.length]);
  }
  MATRIX.coin = (MATRIX.coin + batch.length) % Math.max(1, list.length);
  MATRIX.total = batch.length * MATRIX_STRATS.length * MATRIX_TFS.length;
  try {
    for (const sym of batch) {
      if (MATRIX.cancel) break;
      await matrixCoin(sym);
    }
    MATRIX.pass++;
    MATRIX.at = Date.now();
  } catch (e) {
    MATRIX.err = e.message || String(e);
  } finally {
    MATRIX.running = false; MATRIX.step = "";
    saveMatrix(); render(true);
  }
}

/** The cells that cleared the wall, best first. */
function matrixRanked(sym) {
  const rows = [...MATRIX.cell.values()]
    .filter((m) => (!sym || m.sym === sym) && !m.why);
  // Tie-break the way the flow chart says: profit factor, then drawdown,
  // then how recently it last worked.
  rows.sort((a, b) => b.score - a.score || b.pf - a.pf
                   || a.maxDD - b.maxDD || a.ageDays - b.ageDays);
  return rows;
}

/** The top few cells per coin — the diverse shortlist, not five of one thing. */
function matrixTop(sym, n) {
  const rows = matrixRanked(sym);
  const out = [], usedStrat = new Map();
  for (const r of rows) {
    // Cap any one strategy at two slots, so a shortlist of five is five
    // opinions rather than the same rule at five speeds.
    const c = usedStrat.get(r.strat) || 0;
    if (c >= 2) continue;
    usedStrat.set(r.strat, c + 1);
    out.push(r);
    if (out.length >= (n || CFG.matrixTop)) break;
  }
  return out;
}

/** The whole matrix's best cells, across every coin it has scored. */
function matrixBest(n) {
  const bySym = new Map();
  for (const m of matrixRanked(null)) {
    if (!bySym.has(m.sym)) bySym.set(m.sym, m);
  }
  return [...bySym.values()].sort((a, b) => b.score - a.score).slice(0, n || 12);
}

const MXKEY = "signals.matrix.v1";
function saveMatrix() {
  try {
    // Keep the best cells whether or not they passed. Saving only the winners
    // meant that on a coin where nothing cleared the wall you reopened the app
    // to an empty grid, as though the work had never run — and "it found
    // nothing" is a result the screen should be able to show you.
    const keep = [...MATRIX.cell.values()]
      .sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 900);
    localStorage.setItem(MXKEY, JSON.stringify(
      { cells: keep, coin: MATRIX.coin, pass: MATRIX.pass, at: MATRIX.at,
        on: MATRIX.on }));
  } catch (e) { /* private mode */ }
}
function loadMatrix() {
  try {
    const o = JSON.parse(localStorage.getItem(MXKEY) || "null");
    if (!o) return;
    MATRIX.coin = o.coin || 0; MATRIX.pass = o.pass || 0; MATRIX.at = o.at || 0;
    MATRIX.on = !!o.on;
    for (const m of (o.cells || [])) MATRIX.cell.set(mkey(m.sym, m.strat, m.tf), m);
  } catch (e) { /* nothing to restore */ }
}

/* The grid, on screen. Ten strategies down, ten chart periods across, one
   cell per bot, coloured by score. A cell that failed a filter is drawn dark
   with the reason on tap, because "why is this empty" is the first question
   anyone asks and an unexplained gap is worse than a bad number. */
function matrixGrid(sym) {
  const cells = MATRIX_STRATS.map((strat) => {
    const row = MATRIX_TFS.map(([a, b]) => {
      const m = MATRIX.cell.get(mkey(sym, strat, a + ">" + b));
      if (!m) return `<td class="mx none" title="not scored yet">·</td>`;
      if (m.why) return `<td class="mx bad" title="${esc(m.why)}">${
        m.n ? m.n : "—"}</td>`;
      const g = Math.min(1, m.score / 55);
      return `<td class="mx ok" style="background:rgba(62,207,142,${
        (0.12 + g * 0.6).toFixed(2)})"
        title="${esc(BT_STRATS[strat])} ${esc(a)}/${esc(b)} — score ${m.score}, ${
        m.n} trades, ${m.winRate}% won, PF ${m.pf}, ${m.maxDD}% drop"
        >${Math.round(m.score)}</td>`;
    }).join("");
    return `<tr><th>${esc(STRAT_SHORT[strat] || strat)}</th>${row}</tr>`;
  }).join("");
  return `<div class="mxwrap"><table class="mxt">
    <tr><th></th>${MATRIX_TFS.map(([a]) => `<th>${a}</th>`).join("")}</tr>
    ${cells}</table></div>`;
}

/* The answer to "which modules actually help". One table, measured, ranked.
   A module that has never disagreed with anything is marked as such rather
   than credited — a filter that says yes to everything has proved nothing. */
/* The radar: what is forming but has not fired. Labelled as such, because a
   near-miss presented next to real signals is how a watchlist turns into a
   trade you should not have taken. */
function radarBlock() {
  const rows = radarRows();
  if (!rows.length) return "";
  return `<h2>Radar — forming, not fired</h2>
    <div class="status">${rows.map((r) => `<div class="kv">
      <span class="k">${esc(r.symbol.replace("USDT", ""))}
        <span style="color:#5e5e66">· ${esc(r.side || "")}</span></span>
      <span class="v">${r.gap != null ? r.gap.toFixed(2) + "% away"
        : r.pts != null ? r.pts + "/8"
        : r.why ? esc(r.why) : "close"}</span></div>`).join("")}</div>
    <div class="hint">These have not fired. They are here so a setup does not
      appear out of nowhere — not as something to take.</div>`;
}

/* The risk gate, visible. A limit you cannot see is a limit you will argue
   with at the worst moment. */
function riskBar() {
  if (!RISK) return "";
  const blocked = OPEN.filter((s) => s.blocked);
  const any = CFG.dayLossR || CFG.ddStopR || CFG.maxSameSide;
  if (!any && !blocked.length) return "";
  return `<div class="card" style="margin-bottom:10px;border-color:${
      blocked.length ? "#40252a" : "#26262e"}">
    <div class="kv" style="border:0;padding-top:0">
      <span class="k" style="font-weight:800">Risk gate</span>
      <span class="v">${blocked.length ? blocked.length + " blocked" : "clear"}</span>
    </div>

/* The whale panel. Every reading shows the bots behind it and what each one
   found, because "score 78" with no working shown is a number you have to

function whaleBlock() {
  const rows = [...WHALE.by.values()].sort((a, b) => (b.score || 0) - (a.score || 0));

/* The scoreboard that keeps the exit brain honest. */
function exitBlock() {
  const e = EXITSTAT;
  const avgB = e.n ? e.brain / e.n : 0, avgF = e.n ? e.fixed / e.n : 0;
  const diff = avgB - avgF;
  const verdict = e.n < 20 ? "too few trades to judge"
    : diff > 0.08 ? "the managed exit is ahead"
    : diff < -0.08 ? "the plain ladder is ahead — turn the brain off"
    : "no real difference";
  return `<div class="card" style="margin-bottom:10px">
      <div class="kv" style="border:0;padding-top:0">
        <span class="k" style="font-weight:800;font-size:15px">Exit brain</span>
        <button class="sw${CFG.exitBrain ? " on" : ""}"
          onclick="CFG.exitBrain=!CFG.exitBrain;writeHash();render(true)"></button>
      </div>
      ${kv("Trades compared", e.n)}
      ${kv("Managed exit", (avgB > 0 ? "+" : "") + avgB.toFixed(2) + "R average")}
      ${kv("Plain ladder", (avgF > 0 ? "+" : "") + avgF.toFixed(2) + "R average")}
      ${kv("Verdict", `<span style="color:${diff > 0.08 ? "var(--green2)"
        : diff < -0.08 ? "var(--red2)" : "var(--dim)"}">${verdict}</span>`)}
      ${e.n ? kv("Better / worse", e.better + " / " + e.worse) : ""}
      <div class="hint" style="margin-bottom:0">Every finished trade is replayed
        twice: once under the managed exit — partial at the first target, stop to
        breakeven, hold while momentum expands, cut on a flip, trail once well
        ahead — and once under the plain target ladder. An exit rule that feels
        clever and quietly caps every winner at TP1 is easy to write and almost
        impossible to notice, so both numbers stay on screen.</div>
    </div>`;
}
