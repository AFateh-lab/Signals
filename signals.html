    <div class="hint" style="margin-bottom:0">Not yet ported to the server:
      ${esc((j.not_ported || []).join(", ") || "none")}. Those still only come
      from this device while the page is open.
      ${(j.failed || []).length ? "<br>" + j.failed.length
        + " pairs failed to load on the last run." : ""}</div>
  </div>`;
}

/* =========================================================================
   PER-COIN SWEEP  —  every interval, for one coin at a time.

   Until now a bot was a strategy on one chart period, and the coin was
   whatever came up. That put the app's own "chart period" setting in direct
   conflict with each bot's, and whichever ran last won — which is exactly the
   confusion you get when two controls answer the same question.

   This turns it around. A coin is the unit. For each coin in the rotation,
   every enabled strategy is run across every interval, and the best signal
   per direction is kept. So a coin is not judged on the period that happened
   to be selected; it is judged on the period it actually works on.

   The cost is real and there is no way around it: ten intervals is ten times
   the replay work per coin. So it works through the list a few coins at a
   time and carries results forward, the same as everything else here. Four
   coins a scan covers sixty coins in about an hour.
   ========================================================================= */

const SWEEP = { coin: 0, running: false, at: 0, done: 0, step: "",
                covered: new Map() };   // symbol -> {at, tfs, found}

/** One coin, every interval, every enabled strategy. */
async function sweepCoin(sym) {
  const keep = snapshotSetup();
  const out = [];
  try {
    for (const [sigTf, trTf] of MATRIX_TFS) {
      if (!SWEEP.running) break;
      let ltf, htf;
      try {
        [ltf, htf] = await Promise.all([
          klines(sym, sigTf, CFG.sweepBars),
          klines(sym, trTf, Math.min(500, CFG.sweepBars)),
        ]);
      } catch (e) { continue; }
      if (!ltf || ltf.length < 220) continue;
      CFG.signalTf = sigTf; CFG.trendTf = trTf;
      for (const strat of sweepStrats()) {
        if (!SWEEP.running) break;
        CFG.strategy = strat;
        try {
          const r = await scanSymbol(sym);
          for (const sig of r.found) {
            sig.setup = "sweep"; sig.setupName = "Sweep";
            sig.sweepTf = sigTf + ">" + trTf;
            sig.botStart = 0;
          }
          out.push(...r.found);
        } catch (e) { /* one bad combination must not stop the coin */ }
      }
      SWEEP.step = sym.replace("USDT", "") + " · " + sigTf;
      SWEEP.done++;
      render();
      await new Promise((r) => setTimeout(r, 0));
    }
  } finally {
    for (const k in keep) CFG[k] = keep[k];
  }
  return out;
}

/* Which strategies the sweep runs. Restricting it is the honest lever for
   cost: ten strategies across ten intervals is a hundred replays per coin,
   and on a phone that is a minute of work for one coin. */
function sweepStrats() {
  if (CFG.sweepStrats && CFG.sweepStrats.length) return CFG.sweepStrats;
  return ["confluence", "ut", "brk", "mom"];
}

/* Keep only the best signal per coin and direction — the whole point is that
   the coin gets one answer, not ten. Best means the newest that still clears
   the entry check, breaking ties on independent agreement. */
function sweepBest(list) {
  const by = new Map();
  for (const s of list) {
    const k = s.symbol + "|" + s.side;
    const cur = by.get(k);
    const better = !cur
      || (s.agree || 0) > (cur.agree || 0)
      || ((s.agree || 0) === (cur.agree || 0) && s.at > cur.at);
    if (better) by.set(k, s);
  }
  return [...by.values()];
}

async function sweepRun(coins) {
  if (SWEEP.running || BUSY || MATRIX.running || EVO.running) return [];
  SWEEP.running = true; SWEEP.done = 0;
  const list = (coins && coins.length) ? coins
    : (UNIVERSE.length ? UNIVERSE : CFG.focus);
  const batch = [];
  for (let k = 0; k < Math.min(CFG.sweepCoins, list.length); k++) {
    batch.push(list[(SWEEP.coin + k) % list.length]);
  }
  SWEEP.coin = (SWEEP.coin + batch.length) % Math.max(1, list.length);
  const found = [];
  try {
    for (const sym of batch) {
      if (!SWEEP.running) break;
      const got = sweepBest(await sweepCoin(sym));
      SWEEP.covered.set(sym, { at: Date.now(), tfs: MATRIX_TFS.length,
                               found: got.length });
      found.push(...got);
    }
    SWEEP.at = Date.now();
  } finally {
    SWEEP.running = false; SWEEP.step = "";
  }
  // Hold them the same way bot findings are held, so a coin's answer survives
  // until its turn comes round again.
  for (const s of found) HELD.set(sigKey(s) + "|sweep", s);
  render(true);
  return found;
}

function sweepBlock() {
  const seen = [...SWEEP.covered.entries()]
    .sort((a, b) => b[1].at - a[1].at).slice(0, 8);
  return `<div class="card" style="margin-bottom:10px">
    <div class="kv" style="border:0;padding-top:0">
      <span class="k" style="font-weight:800;font-size:15px">Per-coin sweep</span>
      <button class="sw${CFG.sweepOn ? " on" : ""}"
        onclick="CFG.sweepOn=!CFG.sweepOn;writeHash();render(true)"></button>
    </div>
    ${kv("Intervals per coin", MATRIX_TFS.length)}
    ${kv("Strategies per interval", sweepStrats().length)}
    ${kv("Replays per coin", MATRIX_TFS.length * sweepStrats().length)}
    ${kv("Coins per scan", CFG.sweepCoins)}
    ${kv("Coins covered so far", SWEEP.covered.size)}
    ${SWEEP.running ? kv("Working on", esc(SWEEP.step || "…")) : ""}
    <div class="kv"><span class="k">Coins per scan</span><span class="v">
      <input type="range" min="1" max="8" step="1" value="${CFG.sweepCoins}"
        oninput="setv('sweepCoins',this.value,'')">
      <span id="v_sweepCoins">${CFG.sweepCoins}</span></span></div>
    <button class="btn ${SWEEP.running ? "" : "gold"}" style="margin-top:8px"
      onclick="${SWEEP.running ? "SWEEP.running=false" : "sweepRun()"}">${
      SWEEP.running ? "Stop" : "Sweep the next " + CFG.sweepCoins
        + " coins now"}</button>
    <div class="hint" style="margin-bottom:0">Each coin is run through
      <b>every</b> interval from 5m to 1d, on every enabled strategy, and only
      the best signal per direction is kept. That is
      ${MATRIX_TFS.length * sweepStrats().length} replays per coin, which is
      why it works through the list a few at a time rather than all at once.
      While this is on, the single chart period above is only a starting
      point — the sweep decides per coin.</div>
    ${seen.length ? `<div class="status" style="margin-top:8px">${seen.map(
      ([sym, v]) => kv(esc(sym.replace("USDT", "")),
        v.found + " signal" + (v.found === 1 ? "" : "s") + " · " + age(v.at))
      ).join("")}</div>` : ""}
  </div>`;
}

/* =========================================================================
   THE BOOK  —  a published signal stays published.

   Until now every scan rebuilt the list from scratch, which meant a signal
   could appear at 10:00, vanish at 10:05 because it had drifted a little past
   the freshness window, and come back at 10:10 when a different bot found it.
   That is unusable. You cannot act on something that might not be there when
   you look again, and a list that churns teaches you to ignore it.

   So the filters now decide one thing only: whether a signal gets *published*.
   Once it is in the book it stays there, tracked, until it actually resolves —
   target, stop, or the setup breaking. A later scan updates its price and its
   state; it does not re-litigate whether it should have existed.

   This is a real trade-off and worth naming: a signal published on a filter
   you later tighten will still be sitting there. That is the correct
   behaviour. Changing your mind about a filter does not un-take a trade, and
   an app that quietly deleted the evidence would be flattering you.
   ========================================================================= */

const BOOK = new Map();          // sigKey -> the published signal
const BKKEY = "signals.book.v1";

function saveBook() {
  try {
    const rows = [...BOOK.values()].slice(-120);
    localStorage.setItem(BKKEY, JSON.stringify(rows));
  } catch (e) { /* private mode */ }
}

function loadBook() {
  try {
    const rows = JSON.parse(localStorage.getItem(BKKEY) || "[]");
    for (const s of rows) if (s && s.symbol) BOOK.set(sigKey(s), s);
  } catch (e) { /* nothing to restore */ }
}

/** Publish anything new, then hand back the whole book, freshest first. */
function bookMerge(passed, live) {
  const now = Date.now();

  // Removing a coin is not the same as tightening a filter.
  //
  // The book deliberately keeps a published signal even after you make a
  // rule stricter, because changing your mind about a threshold does not
  // un-take a trade. But taking a coin off your list is a different
  // statement: you are saying you do not trade it at all. Keeping DOGE on
  // screen after you deleted DOGE is not honesty, it is clutter — and it is
  // what makes the list look like it ignores you.
  let mineOnly = null;
  if (CFG.pairMode === "custom") {
    mineOnly = new Set(mineList());
    let dropped = 0;
    for (const [k, s] of BOOK) {
      if (!mineOnly.has(s.symbol)) { BOOK.delete(k); dropped++; }
    }
    if (dropped) saveBook();
  }

  for (const s of passed) {
    // The purge above is not enough on its own. If anything upstream ever
    // hands us an off-list coin again, publishing it here would put it
    // straight back after the sweep — cleared and re-added in the same pass,
    // which is exactly how this looked from the outside.
    if (mineOnly && !mineOnly.has(s.symbol)) continue;
    const k = sigKey(s);
    if (!BOOK.has(k)) {
      // A copy, not the object itself. HELD and `all` hold references to the
      // same signals, and updating the book in place would reach back and
      // change theirs too — the kind of aliasing that surfaces weeks later as
      // a signal that closed itself for no visible reason.
      BOOK.set(k, Object.assign({}, s, { publishedAt: now }));
    }
  }
  // Update what is already published from this scan's fresher copy of the
  // same signal — price, targets hit, status — without changing whether it
  // is in the list.
  const bySeen = new Map();
  for (const s of live) bySeen.set(sigKey(s), s);
  for (const [k, held] of BOOK) {
    const now2 = bySeen.get(k);
    if (now2) {
      held.price = now2.price; held.roi = now2.roi;
      held.hits = now2.hits; held.status = now2.status; held.stop = now2.stop;
      held.be = now2.be; held.targets = now2.targets;
      held.closedAt = now2.closedAt; held.mae = now2.mae; held.mfe = now2.mfe;
      held.chase = now2.chase;
      // Fresher information about the same trade is worth having: another bot
      // agreeing since it was published, or a confidence that has moved.
      // Freezing those at publish time would leave "1 bot" on a card that
      // four bots now back.
      if (now2.by && now2.by.length) {
        held.by = [...new Set([...(held.by || []), ...now2.by])];
      }
      if (now2.agree != null) held.agree = now2.agree;
      if (now2.confidence != null) held.confidence = now2.confidence;
      if (now2.mods) { held.mods = now2.mods; held.clash = now2.clash; }
    }
    held.life = lifeOf(held);
    // Out of the book only when it is genuinely over, or so old that keeping
    // it would be clutter rather than record.
    const done = held.closedAt || held.life === "invalid";
    const ancient = now - (held.publishedAt || held.at) > CFG.bookHours * 3600000;
    if (done || ancient) {
      if (held.closedAt) ARCHIVE.set(k, held);
      BOOK.delete(k);
    }
  }
  saveBook();
  return [...BOOK.values()].sort((a, b) => (b.publishedAt || b.at)
                                         - (a.publishedAt || a.at));
}

/* --------------------------------------------------------------------- run */
async function run() {
  if (BUSY) return;
  BUSY = true; ERROR = null; SCANNED = 0; FAILED = 0; setDot("busy");
  DROP = {old:0, agree:0, dup:0, capped:0, stale:0, weak:0, before:0,
          conflict:0, chase:0, conf:0, risk:0, total:0};
  AUTO.left = AUTO.perScan; AUTO.decided = 0; AUTO.waiting = 0;
  SPARE = [];
  progress(0.01); render();

  // 1. Live pair list: biggest USDT perps by 24h turnover.
  let bySym = {};
  try {
    const tk = await tickers();
    if (tk.length) {
      bySym = Object.fromEntries(tk.map(x=>[x.symbol,x]));
      TICK = bySym;
      const bl = new Set(CFG.blacklist);
      ALLSYMS = tk.filter(x=>!bl.has(x.symbol) && x.vol > 0)
                  .sort((a,b)=>b.vol-a.vol).map(x=>x.symbol);
      if (CFG.pairMode === "custom") {
        // Exactly what you picked, nothing else. One list: the coins in
        // "Your coins". There used to be a second, separate list behind the
        // picker, so choosing coins in one place did nothing to the other —
        // which is why signals kept arriving from coins you had not picked.
        const mine = mineList();
        UNIVERSE = mine.filter((x) => bySym[x]);
        if (!UNIVERSE.length) UNIVERSE = mine.slice();
      }
      // Always computed - the Market tiles use it whichever pair mode is on.
      const focus = CFG.focus.filter(s=>bySym[s]);
      // The condition used to be `pairMode !== "custom" || !CFG.custom.length`,
      // and that second half was the bug behind every "why am I seeing a coin
      // I did not pick".
      //
      // It is a leftover from when there were two coin lists. Your coins now
      // live in CFG.focus and CFG.custom stays empty — so `!CFG.custom.length`
      // was always true, and this block overwrote the list built two lines
      // above with focus-plus-the-top-hundred. "Only my coins" was on, the
      // screen said so, the book filter and the server filter both honoured
      // it — and underneath, the scanner was still reading a hundred pairs
      // and publishing whatever they produced.
      if (CFG.pairMode !== "custom") {
        // Focus coins first and always present, then fill up with the biggest
        // remaining pairs by 24h turnover.
        let rest;
        if (CFG.pickBy === "movement") {
          // A strategy with a stop and five targets needs room to move. Ranking
          // by how far a coin travelled in the day, rather than by turnover,
          // puts the ones that actually swing at the front — with a liquidity
          // floor, because a coin nobody trades can move 40% and still be
          // untradable.
          rest = tk.filter(x => !bl.has(x.symbol) && x.vol > 20e6
                                && !focus.includes(x.symbol))
                   .sort((a, b) => (b.range || 0) - (a.range || 0))
                   .map(x => x.symbol);
        } else {
          rest = ALLSYMS.filter(s=>!focus.includes(s));
        }
        UNIVERSE = focus.concat(rest).slice(0, Math.max(CFG.pairs, focus.length));
      }
      const liquid = tk.filter(x=>x.vol>20e6).sort((a,b)=>b.change-a.change);
      MARKET = {
        majors: focus.map(s=>bySym[s]),
        movers: [...liquid.slice(0,3), ...liquid.slice(-3).reverse()],
      };
    }
  } catch (e) { /* fall through to the fallback list */ }

  if (!UNIVERSE.length) {
    UNIVERSE = CFG.pairMode === "custom" ? mineList() : CFG.focus.slice();
  }
  const syms = UNIVERSE.slice();
  render();

  // 2. Scan them, six at a time — once per active setup.
  //
  // Two setups can run side by side: the one you configured and the one the
  // search deployed. They see the same coins and the same candles, so the
  // second pass costs processor time but no extra downloads. Whichever fires
  // first, fires — and every card says which setup produced it, because a
  // signal you cannot attribute is a signal you cannot judge.
  const all = [], near = [];
  // Ten bots is ten replays of every coin. Doing all of them in one scan is
  // minutes of a locked phone, so each scan gives a few bots a turn and the
  // rest keep the signals they found last time (see HELD, below). The whole
  // lineup comes round every few scans instead of stalling on the first.
  const lineup = activeSetups();
  const passes = setupSlice(lineup);
  // Whatever happens inside a pass -- a throw from a render, a worker dying --
  // the settings must come out exactly as they went in. A scan that leaves
  // CFG holding one coin's strategy silently turns off per-coin selection for
  // every scan after it, and nothing on screen says so.
  try {
  for (const pass of passes) {
    const restore = applySetup(pass.cfg);
    PASS_STRATEGY = CFG.strategy;
    const queue = syms.slice();
    const worker = async () => {
      while (queue.length) {
        const s = queue.shift();
        try {
          const r = await scanSymbol(s);
          for (const sig of r.found) {
            sig.setup = pass.id; sig.setupName = pass.name;
            sig.botStart = pass.startedAt || 0;
          }
          all.push(...r.found);
          if (r.near && pass.id === passes[0].id) near.push(r.near);
        } catch (e) { FAILED++; if (!ERROR) ERROR = e.message || String(e); }
        SCANNED++; progress(SCANNED / (syms.length * passes.length + 1));
        if (SCANNED % 5 === 0) render();
        // Enriching a thousand candles and replaying a strategy over them is
        // solid synchronous work. Six workers doing it back to back never let
        // the browser paint or register a tap, which is why the page felt dead
        // mid-scan. One macrotask between coins hands control back.
        await new Promise((r) => setTimeout(r, 0));
      }
    };
    await Promise.all(Array.from({length:6}, worker));
    PASS_STRATEGY = null;
    restore();
  }
  } finally { PASS_STRATEGY = null; }
  if (FAILED < syms.length * passes.length) ERROR = null;   // partials are fine

  WATCH = CFG.strategy === "occ"
    ? near.filter(n=>n.gap != null).sort((a,b)=>a.gap-b.gap).slice(0,8)
    : near.filter(n=>n.agrees && n.pts >= CFG.minScore-2)
          .sort((a,b)=>b.pts-a.pts).slice(0,8);

  // 3. Overlay live prices on anything still open.
  for (const s of all) {
    if (s.closedAt || !bySym[s.symbol]) continue;
    const live = bySym[s.symbol].price;
    const candles = CACHE.get(s.symbol + ":" + CFG.signalTf);
    const lastClose = candles ? candles[candles.length-1].c : live;
    // Ignore a tick that disagrees wildly with the candle feed - it means
    // the two endpoints are quoting different things, not a real move.
    if (!(live > 0) || Math.abs(live-lastClose)/lastClose > 0.2) continue;
    s.price = round(live, s.entry);
    s.roi = netRoi(((s.price-s.entry)/s.entry)*100*(s.side==="LONG"?1:-1)*s.leverage,
                   s.leverage);
  }

  // Everything the server found while this device was asleep, folded in
  // before the filters so it goes through exactly the same wall as anything
  // found here. A signal that skipped the gates because of where it came from
  // would be the one you could least trust.
  if (SERVER.on && SERVER.data) {
    const have = new Set(all.map((x) => x.symbol + "|" + x.side + "|" + x.at));
    // "Only my coins" has to mean it. The device filter works by choosing
    // which coins to fetch, so it never sees a server signal for a coin it
    // did not ask for — which is how AAOI appeared on a screen focused on
    // ten majors. The server has its own list and may be behind yours, so
    // the gate is applied again here.
    const only = CFG.pairMode === "custom" ? new Set(mineList()) : null;
    for (const s of serverSignals()) {
      if (only && !only.has(s.symbol)) continue;
      if (!have.has(s.symbol + "|" + s.side + "|" + s.at)) all.push(s);
    }
  }

  // Carry forward what the bots that sat this scan out found on their last
  // turn. Without this, staging would make signals blink in and out as the
  // rotation came round — the list would look broken and, worse, a signal
  // that is still perfectly valid would disappear for no reason the reader
  // can see. Freshness and the resolve check still govern how long they last.
  {
    const ran = new Set(passes.map((p) => p.id));
    const live = new Set(lineup.map((p) => p.id));
    const carried = [];
    const mineNow = CFG.pairMode === "custom" ? new Set(mineList()) : null;
    for (const [k, held] of HELD) {
      // A bot that just ran has said everything it has to say; drop its old
      // entries so a signal it no longer finds cannot linger.
      if (ran.has(held.setup) || !live.has(held.setup)) { HELD.delete(k); continue; }
      // And a coin you have taken off your list stops being carried at all.
      // Its bot may not have run this pass, so nothing else would clear it.
      if (mineNow && !mineNow.has(held.symbol)) { HELD.delete(k); continue; }
      carried.push(held);
    }
    for (const s of all) HELD.set(sigKey(s) + "|" + (s.setup || "live"), s);
    all.push(...carried);
    // A hard cap, so a long session cannot grow this without limit.
    if (HELD.size > 900) {
      const keys = [...HELD.keys()].slice(0, HELD.size - 900);
      for (const k of keys) HELD.delete(k);
    }
  }

  all.sort((a,b)=>b.at-a.at);
  SESSION.scans++;
  // Everything before you started watching is history - the backtester's job,
  // not this list's.
  const cut = CFG.liveOnly ? SESSION.startedAt : 0;
  // A setup that fired days ago and still has not hit its stop or its first
  // target is not a trade you can take now — its entry price is history. The
  // window is counted in candles, so it means the same thing on 5m as on 1d.
  const fresh = staleCut();

  // The same signal found by several bots is one signal.
  //
  // This has to happen before anything counts them. Four bots on the same
  // settings find the same trade four times, and left alone that would
  // quadruple the coin's track record, the results list, and the number of
  // times the alert sounds — every number in the app inflated by however many
  // bots happen to be switched on. Collapse identical finds here, once, and
  // remember which bots found each one.
  {
    const one = new Map();
    const uniq = [];
    for (const s of all) {
      const k = s.symbol + "|" + s.at + "|" + s.side + "|" + s.entry;
      const first = one.get(k);
      if (first) {
        if (s.setupName && !first.by.includes(s.setupName)) first.by.push(s.setupName);
        // The earliest bot's clock owns it. Otherwise a bot switched on five
        // minutes ago could make an hour-old signal look brand new.
        if (s.botStart && (!first.botStart || s.botStart < first.botStart))
          first.botStart = s.botStart;
        continue;
      }
      s.by = s.setupName ? [s.setupName] : [];
      one.set(k, s); uniq.push(s);
    }
    all.length = 0; all.push(...uniq);
  }

  buildRecord(all);
  modLearn(all);
  OPEN = [];
  const seen = new Set();
  for (const s of all) {
    if (s.closedAt) continue;
    DROP.total++;
    s.rec = RECORD.get(s.symbol) || null;
    // "Only signals from now on" governs the *record* — what counts as a
    // result you could have taken. It has no business hiding a setup that is
    // live right now just because it fired before you opened the app. What is
    // current is decided by the freshness window, and by that alone.
    if (fresh && s.at < fresh) { DROP.stale++; continue; }
    // Strictest first: fired before the bot that produced it started. Each
    // bot has its own clock, so one bot's history cannot leak into another's
    // freshly deployed list.
    const from = s.botStart || startedAt();
    if (CFG.sinceDeploy && s.at < from) { DROP.before++; continue; }
    if (CFG.sideBias) {
      const want = sideBiasOf(s.symbol);
      if (want && s.side !== want) {
        DROP.weak++;
        s.belowBar = want === "LONG" ? "longs only here" : "shorts only here";
        SPARE.push(s);
        continue;
      }
    }
    if (s.chase && s.chase.verdict === "late") {
      DROP.chase++;
      s.belowBar = "too late · " + s.chase.why[0];
      SPARE.push(s);
      continue;
    }
    if (CFG.modGate && s.confidence != null && s.confidence < CFG.modGate) {
      DROP.conf++;
      s.belowBar = "confidence " + s.confidence;
      SPARE.push(s);
      continue;
    }
    if (!recordOk(s.symbol)) {
      DROP.weak++;
      s.belowBar = s.rec && s.rec.n >= CFG.minRecord
        ? "record " + s.rec.rate + "%"
        : "no record yet";
      SPARE.push(s);
      continue;
    }
    // Within one setup, only the newest setup on a coin is takeable; the
    // older ones are history. Keyed by setup because two setups looking at
    // the same coin is a separate matter, handled just below.
    const key = s.symbol + "|" + (s.setup || "live");
    if (seen.has(key)) { DROP.dup++; continue; }
    seen.add(key); s.focus = CFG.focus.includes(s.symbol); OPEN.push(s);
  }

  // One coin, one direction, one card.
  //
  // Four bots running the same settings all find the same setup. That is four
  // bots agreeing about one trade, not four trades — and printing it four
  // times tells you the scan found more than it did, which is the worst kind
  // of error this app can make. Collapse them into the newest card and name
  // the bots on it, so agreement reads as agreement.
  //
  // Opposite sides are deliberately left alone: that is a real disagreement,
  // and the conflict rules below decide what to do about it.
  {
    const byDir = new Map();
    const merged = [];
    for (const s of OPEN) {
      if (!s.by) s.by = s.setupName ? [s.setupName] : [];
      const k = s.symbol + "|" + s.side;
      const first = byDir.get(k);
      if (first) {
        DROP.dup++;
        for (const n of s.by) if (!first.by.includes(n)) first.by.push(n);
        // The earliest bot's clock owns the card. Otherwise a bot started
        // five minutes ago could make an hour-old signal look new.
        if (s.botStart && (!first.botStart || s.botStart < first.botStart))
          first.botStart = s.botStart;
        continue;
      }
      byDir.set(k, s); merged.push(s);
    }
    OPEN = merged;
  }
  if (CFG.focusFirst) {
    const rank = s => {
      const i = CFG.focus.indexOf(s.symbol);
      return i < 0 ? CFG.focus.length : i;      // focus coins in listed order
    };
    OPEN.sort((a,b)=> rank(a)-rank(b) || b.at-a.at);
  }
  // Two setups can disagree about the same coin — one long, one short. That is
  // not a bug, it is two opinions, and showing them as two calm cards would be
  // the app pretending they are compatible. Flag both and let the reader
  // decide; the honest reading is usually "no trade here".
  const bySide = new Map();
  for (const s of OPEN) {
    const cur = bySide.get(s.symbol) || new Set();
    cur.add(s.side);
    bySide.set(s.symbol, cur);
  }
  for (const s of OPEN) {
    const sides = bySide.get(s.symbol);
    s.conflict = !!(sides && sides.size > 1);
  }

  // What to do about a disagreement is a judgement, so it is yours. The app
  // will show both, keep the better-evidenced one, or drop the coin — but it
  // will never quietly pick a side and present it as if the two had agreed.
  if (CFG.onConflict !== "show") {
    const clashing = OPEN.filter((x) => x.conflict);
    if (clashing.length) {
      const bySym = new Map();
      for (const x of clashing) {
        const list = bySym.get(x.symbol) || [];
        list.push(x); bySym.set(x.symbol, list);
      }
      const drop = new Set();
      for (const [, list] of bySym) {
        if (CFG.onConflict === "hide") {
          for (const x of list) { drop.add(x); DROP.conflict++; }
          continue;
        }
        // "best": more independent backing wins. Agreement first, because it
        // is about this candle; then how that coin has paid on that side;
        // then its overall hit rate.
        const rank = (x) => {
          const rec = x.rec && x.rec[x.side];
          return [x.agree || 0,
                  rec && rec.n >= 3 ? rec.expR : -99,
                  x.rec && x.rec.n >= 3 ? x.rec.rate : 0];
        };
        let keep = list[0];
        for (const x of list.slice(1)) {
          const a = rank(x), b = rank(keep);
          for (let i = 0; i < a.length; i++) {
            if (a[i] === b[i]) continue;
            if (a[i] > b[i]) keep = x;
            break;
          }
        }
        // Nothing to choose between them is not a reason to choose one.
        const tied = list.every((x) => rank(x).join() === rank(keep).join());
        if (tied) {
          for (const x of list) { drop.add(x); DROP.conflict++; }
          continue;
        }
        keep.keptOver = list.filter((x) => x !== keep).map((x) => x.side).join(", ");
        for (const x of list) if (x !== keep) { drop.add(x); DROP.conflict++; }
      }
      if (drop.size) OPEN = OPEN.filter((x) => !drop.has(x));
    }
  }

  // Lifecycle, then the risk gate. Order matters: a trade has to be real
  // before it is worth refusing.
  for (const s of OPEN) s.life = lifeOf(s);
  {
    const state = riskState();
    const taken = [];
    for (const s of OPEN) {
      if (s.belowBar) continue;
      const no = riskBlock(s, state, taken);
      if (no) { s.belowBar = no; s.blocked = true; DROP.risk++; }
      else taken.push(s);
    }
    RISK = state;
  }

  DROP.capped = Math.max(0, OPEN.length - CFG.maxOpen);
  OPEN = OPEN.slice(0, CFG.maxOpen);

  // Everything above decided what to publish. From here the book decides what
  // you see, so a signal does not blink out between scans.
  if (CFG.keepSignals) {
    const passed = OPEN.filter((x) => !x.belowBar);
    const below = OPEN.filter((x) => x.belowBar);
    OPEN = bookMerge(passed, all).concat(below);
  }

  // The floor. Only ever fills a short list, never replaces a full one, and
  // every added card says which filter it missed.
  if (CFG.minShow && OPEN.length < CFG.minShow) {
    const have = new Set(OPEN.map(s => s.symbol));
    const extra = SPARE
      .filter(s => !s.closedAt && !have.has(s.symbol)
                   && (!fresh || s.at >= fresh)
                   && (!CFG.sinceDeploy || s.at >= startedAt()))
      .sort((a,b) => (b.agree||0) - (a.agree||0) || (b.score||0) - (a.score||0)
                     || b.at - a.at);
    for (const s of extra) {
      if (OPEN.length >= CFG.minShow) break;
      if (have.has(s.symbol)) continue;
      have.add(s.symbol); s.focus = CFG.focus.includes(s.symbol);
      OPEN.push(s);
    }
  }
  if (CFG.liveOnly) {
    // Keep resolved signals even once their candles scroll out of the fetched
    // window, so the record of what happened since you started stays intact.
    for (const s of all) if (s.closedAt && s.at >= cut) ARCHIVE.set(sigKey(s), s);
    CLOSED = [...ARCHIVE.values()]
      .filter(s => s.strat === CFG.strategy && s.stf === CFG.signalTf)
      .sort((a,b)=>b.closedAt-a.closedAt).slice(0, 80);
    saveSession();
  } else {
    // Same rule as the Signals tab: if you asked for nothing older than the
    // deployment, the record cannot quietly show a month of history either.
    const from = CFG.sinceDeploy ? startedAt() : 0;
    CLOSED = all.filter(s => s.closedAt && s.at >= from)
                .sort((a,b)=>b.closedAt-a.closedAt).slice(0,60);
  }
  FEED = buildFeed(CFG.liveOnly ? all.filter(s=>s.at >= cut)
        : CFG.sinceDeploy ? all.filter(s=>s.at >= startedAt()) : all);
  // Opt-in, and never in the same breath as the scan: five requests a coin on
  // top of a scan is what makes a phone stop responding.
  if (CFG.whaleOn && !WHALE.running) setTimeout(() => whaleRun(), 1500);
  // The sweep is heavy, so it runs after the scan rather than inside it.
  if (CFG.sweepOn && !SWEEP.running) setTimeout(() => sweepRun(), 2500);
  // Pick up anything the scheduled job has written since the last scan.
  if (SERVER.on && Date.now() - SERVER.at > 120000) loadServer();
  LASTRUN = Date.now(); progress(1);
  alertScan(all);
  setDot(ERROR && !all.length ? "bad" : "");
  BUSY = false; render();
  setTimeout(()=>progress(0), 700);
}

/* =========================================================================
   THE RECORD — what this strategy has actually done on this coin.

   Every scan already replays the strategy across the whole downloaded window,
   so the outcome of every setup it fired is sitting there. Grouping those by
   coin gives a track record per coin: how often the first target came before
   the stop, and the average result in R.

   This is the closest honest thing to "only show me winners". It cannot know
   whether the next one wins. What it can do is refuse to offer you a coin
   where this strategy has been losing all week.
   ========================================================================= */
const RECORD = new Map();

/* =========================================================================
   WHAT THE TRADE ACTUALLY COSTS

   A backtest without costs is a sales brochure. Every entry and every exit
   pays the exchange, and the price you get is not the price you saw. On
   leverage both are multiplied, because the fee is charged on the position,
   not on your margin — 5x leverage pays 5x the fee for the same deposit.

   At 20x, a 0.14% round trip is 2.8% of margin gone before the trade has done
   anything. That single line is why a strategy that looks profitable at zero
   cost can be a slow loss in an account, and it is the most important number
   in this file.
   ========================================================================= */
function tradeCostPct(leverage) {
  const lev = leverage || 1;
  return (CFG.feePct * 2 + CFG.slipPct * 2) * lev;
}

/** Gross move on margin, minus the round trip. */
function netRoi(grossPct, leverage) {
  return +(grossPct - tradeCostPct(leverage)).toFixed(2);
}

const blankRec = () => ({ n: 0, tp1: 0, stopped: 0, sumR: 0 });

function buildRecord(all) {
  RECORD.clear();
  for (const s of all) {
    if (!s.closedAt) continue;
    let r = RECORD.get(s.symbol);
    if (!r) {
      r = blankRec();
      r.LONG = blankRec(); r.SHORT = blankRec();   // kept apart on purpose
      RECORD.set(s.symbol, r);
    }
    // Falling back to the total when the side is missing would count that
    // trade twice — once in the total, once "as" the total.
    const side = (s.side === "LONG" || s.side === "SHORT") ? r[s.side] : null;
    for (const t of side ? [r, side] : [r]) {
      t.n++;
      if (s.hits >= 1) t.tp1++;
      if (s.status === "stopped") t.stopped++;
    }
    const ref = s.initialStop != null ? s.initialStop : s.stop;
    const risk = Math.abs(s.entry - ref) / s.entry * 100;
    if (risk > 0) {
      const R = (s.roi / (s.leverage || 1)) / risk;
      r.sumR += R;
      if (side) side.sumR += R;
    }
  }
  const fin = (t) => {
    t.rate = t.n ? Math.round((t.tp1 / t.n) * 100) : 0;
    t.expR = t.n ? +(t.sumR / t.n).toFixed(2) : 0;
  };
  for (const r of RECORD.values()) { fin(r); fin(r.LONG); fin(r.SHORT); }
}

/* =========================================================================
   WHICH SIDE PAYS ON THIS COIN

   The same coin can be worth shorting and not worth buying. Judging a coin as
   one number hides that. This scores the two directions separately and, if
   asked, only lets through the one that has been working.

   It is a description of the recent past, not a forecast. A coin that only
   paid shorts all month will stop doing so the day the trend turns, and this
   will keep saying "short" until enough new trades have resolved to change
   its mind.
   ========================================================================= */
function sideBiasOf(sym) {
  const r = RECORD.get(sym);
  if (!r || !r.LONG || !r.SHORT) return null;
  const need = Math.max(3, Math.floor(CFG.minRecord / 2));
  const L = r.LONG, S = r.SHORT;
  const okL = L.n >= need, okS = S.n >= need;
  if (!okL && !okS) return null;
  if (okL && !okS) return L.expR > 0 ? "LONG" : null;
  if (okS && !okL) return S.expR > 0 ? "SHORT" : null;
  if (L.expR <= 0 && S.expR <= 0) return null;      // neither side pays
  if (Math.abs(L.expR - S.expR) < 0.1) return null; // too close to call
  return L.expR > S.expR ? "LONG" : "SHORT";
}

/** Coins ranked by how well one direction has worked on them. */
function sideTable(side, limit) {
  const rows = [];
  for (const [sym, r] of RECORD) {
    const t = r[side];
    if (!t || t.n < Math.max(3, Math.floor(CFG.minRecord / 2))) continue;
    rows.push({ sym, n: t.n, rate: t.rate, expR: t.expR });
  }
  rows.sort((a, b) => b.expR - a.expR);
  return rows.slice(0, limit || 6);
}

function sideBlock() {
  if (!RECORD.size) {
    return `<div class="segnote">Run a scan and this fills in.</div>`;
  }
  const fmtRow = (r) => `<div class="kv">
      <span class="k">${esc(r.sym.replace("USDT", ""))}
        <span style="color:#5e5e66"> · ${r.n} trades · TP1 ${r.rate}%</span></span>
      <span class="v" style="color:${r.expR > 0 ? "var(--green2)" : "var(--red2)"}"
        >${r.expR > 0 ? "+" : ""}${r.expR}R</span></div>`;
  const longs = sideTable("LONG"), shorts = sideTable("SHORT");
  const none = `<div class="kv"><span class="k" style="color:var(--dim)">
    not enough resolved trades yet</span></div>`;
  return `<div class="segnote">Average result per trade in R — one R is the
      distance to the stop. Above zero means that direction has been paying on
      that coin in the window just scanned.</div>
    <div class="status"><div class="kv"><span class="k"
      style="color:var(--green2);font-weight:800">Best to LONG</span></div>
      ${longs.length ? longs.map(fmtRow).join("") : none}</div>
    <div class="status" style="margin-top:9px"><div class="kv"><span class="k"
      style="color:var(--red2);font-weight:800">Best to SHORT</span></div>
      ${shorts.length ? shorts.map(fmtRow).join("") : none}</div>
    <div class="kv" style="margin-top:9px"><span class="k">Only take the side
      that has been working</span>
      <button class="sw${CFG.sideBias ? " on" : ""}"
        onclick="tgl('sideBias',this)"></button></div>
    <div class="hint">This is the recent past, not a forecast. It changes when
      the trend does — and it changes late, because it needs resolved trades
      before it will admit the new direction.</div>`;
}

/** Does this coin's record clear the bar the user set? */
function recordOk(sym) {
  if (!CFG.minWinRate) return true;
  const r = RECORD.get(sym);
  if (!r || r.n < CFG.minRecord) return false;      // unproven is not proven
  return r.rate >= CFG.minWinRate;
}

/* =========================================================================
   ENTRY STILL VALID, OR ALREADY GONE?

   Age alone is the wrong question. On daily candles a setup from two weeks
   ago can still be the live trade; on 5m candles one from an hour ago is
   ancient. What actually matters is whether the price is still near the entry
   the card is quoting.

   A signal that has already banked a target is not an opportunity — it is
   somebody else's trade, in progress. Showing the two in one list is how a
   card reading "+21.99%, Target 2 hit" gets mistaken for something you can
   still take.
   ========================================================================= */
function entryGone(s) {
  if (s.closedAt) return true;
  if (s.hits >= 1) return true;                    // a target is already banked
  const t1 = s.targets && s.targets[0];
  if (!t1) return false;
  const reach = Math.abs(t1.price - s.entry);
  if (!(reach > 0)) return false;
  const moved = (s.side === "LONG" ? s.price - s.entry : s.entry - s.price);
  // A third of the way to the first target is the point at which the reward
  // left no longer matches the risk the card is quoting.
  return moved > reach / 3;
}

/** How far price has run from the quoted entry, as a share of the way to TP1. */
function entryDrift(s) {
  const t1 = s.targets && s.targets[0];
  if (!t1) return 0;
  const reach = Math.abs(t1.price - s.entry);
  if (!(reach > 0)) return 0;
  const moved = (s.side === "LONG" ? s.price - s.entry : s.entry - s.price);
  return Math.round((moved / reach) * 100);
}

/** The moment the current run began — the deployment if there is one, else
    when the app was opened. Everything before it is somebody else's trade. */
function startedAt() {
  return DEPLOY.on && DEPLOY.at ? DEPLOY.at : SESSION.startedAt;
}

/** Timestamp before which an unresolved setup is too old to act on, or 0. */
function staleCut() {
  if (!CFG.maxAgeBars) return 0;
  const mins = BARMIN[CFG.signalTf] || 60;
  return Date.now() - CFG.maxAgeBars * mins * 60000;
}

/** The same window in plain words, for the UI. */
function staleLabel() {
  if (!CFG.maxAgeBars) return "any age";
  const mins = (BARMIN[CFG.signalTf] || 60) * CFG.maxAgeBars;
  if (mins < 90) return Math.round(mins) + " min";
  if (mins < 60 * 48) return Math.round(mins / 60) + "h";
  return Math.round(mins / 1440) + " days";
}

function buildFeed(all) {
  const ev = [];
  for (const s of all) {
    ev.push({at:s.at, ic:"◎", sym:s.symbol, tone:s.side==="LONG"?"good":"bad",
             text:`New ${s.spot? "BUY spot" : s.side+" x"+s.leverage}`
                + ` at ${s.entry} · ${s.tag || s.score+"/8"}`});
    for (const t of s.targets) if (t.hit)
      ev.push({at:t.at, ic:"✅", sym:s.symbol, tone:"good",
               text:`Target ${t.index} hit at ${t.price} · +${t.roi}%`});
    if (s.status==="stopped")
      ev.push({at:s.closedAt, ic:"❌", sym:s.symbol, tone:"bad",
               text:`Stopped out at ${s.stop} · ${s.roi}%`});
    if (s.status==="breakeven")
      ev.push({at:s.closedAt, ic:"◻️", sym:s.symbol, tone:"", text:"Closed at breakeven"});
    if (s.status==="completed")
      ev.push({at:s.closedAt, ic:"🎯", sym:s.symbol, tone:"good",
               text:`All 5 targets hit · +${s.roi}%`});
    if (s.status==="reversed")
      ev.push({at:s.closedAt, ic:"↩️", sym:s.symbol,
               tone:s.roi>=0?"good":"bad",
               text:`Closed on opposite cross · ${s.roi>=0?"+":""}${s.roi}%`});
  }
  return ev.sort((a,b)=>b.at-a.at).slice(0,25);
}

function stats() {
  const n = CLOSED.length;
  if (!n) return {n:0, winRate:0, avgRoi:0, totalRoi:0, avgT:0, rates:[0,0,0,0,0],
                  curve:[], best:null, worst:null};
  const wins = CLOSED.filter(s=>s.hits>=1).length;
  const chron = [...CLOSED].reverse();
  let run=0; const curve = chron.map(s=>+(run+=s.roi).toFixed(1));
  const byRoi = [...CLOSED].sort((a,b)=>b.roi-a.roi);
  return {
    n, winRate:+(wins/n*100).toFixed(1),
    avgRoi:+(CLOSED.reduce((a,s)=>a+s.roi,0)/n).toFixed(2),
    totalRoi:+CLOSED.reduce((a,s)=>a+s.roi,0).toFixed(1),
    avgT:+(CLOSED.reduce((a,s)=>a+s.hits,0)/n).toFixed(2),
    rates:[1,2,3,4,5].map(k=>+(CLOSED.filter(s=>s.hits>=k).length/n*100).toFixed(1)),
    curve, best:byRoi[0], worst:byRoi[byRoi.length-1],
  };
}

/* Success rate sliced by calendar day or by week, using the moment each signal
   actually closed. A "win" is a signal that reached at least Target 1 - the
   same rule as the TP1 rate on the dashboard. */
let PERF = "day";                       // "day" | "week"
const pad2 = n => (n<10?"0":"") + n;
const tfLabel = m => m < 60 ? m+"m" : m % 1440 === 0 ? (m/1440)+"d"
  : m % 60 === 0 ? (m/60)+"h" : (m/60).toFixed(1)+"h";

function bucketStats(mode) {
  const map = new Map();
  for (const s of CLOSED) {
    if (!s.closedAt) continue;
    const d = new Date(s.closedAt);
    let ts, label;
    if (mode === "week") {
      const m = new Date(d);
      m.setHours(0,0,0,0);
      m.setDate(m.getDate() - ((m.getDay()+6) % 7));   // back to Monday
      ts = m.getTime();
      const e = new Date(ts + 6*86400000);
      label = m.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + " – "
            + e.toLocaleDateString(undefined,{day:"numeric",month:"short"});
    } else {
      const m = new Date(d); m.setHours(0,0,0,0);
      ts = m.getTime();
      label = m.toLocaleDateString(undefined,
                {weekday:"short", day:"numeric", month:"short"});
    }
    let b = map.get(ts);
    if (!b) { b = {ts, label, n:0, wins:0, roi:0, tps:0}; map.set(ts, b); }
    b.n++; b.roi += s.roi; b.tps += s.hits;
    if (s.hits >= 1) b.wins++;
  }
  const out = [...map.values()].sort((a,b)=>b.ts-a.ts);
  for (const b of out) {
    b.rate = +(b.wins/b.n*100).toFixed(1);
    b.roi  = +b.roi.toFixed(1);
    b.avgT = +(b.tps/b.n).toFixed(2);
  }
  return out;
}

function perfBlock() {
  const rows = bucketStats(PERF);
  const seg = [["day","Daily"],["week","Weekly"]].map(([k,l])=>
    `<button class="${k===PERF?"on":""}" onclick="setPerf('${k}')">${l}</button>`
    ).join("");
  const today = PERF === "day"
    ? new Date().setHours(0,0,0,0)
    : (()=>{ const m=new Date(); m.setHours(0,0,0,0);
             m.setDate(m.getDate()-((m.getDay()+6)%7)); return m.getTime(); })();
  const body = rows.length ? rows.map(b=>{
    const col = b.rate>=60 ? "var(--green)" : b.rate>=40 ? "var(--gold)" : "var(--red)";
    return `<div class="prow">
      <div class="top"><span class="d">${b.ts===today
          ? (PERF==="day"?"Today":"This week") : esc(b.label)}</span>
        <span class="c">${b.n} closed · ${b.avgT} avg TPs</span>
        <span class="roi ${cls(b.roi)}">${b.roi>=0?"+":""}${b.roi}%</span></div>
      <div class="wr"><div class="track"><i style="width:${b.rate}%;
        background:${col}"></i></div>
        <span class="pct">${b.rate}% · ${b.wins}/${b.n}</span></div></div>`;
  }).join("") : `<div class="empty">${BUSY?"Scanning…"
      :"Nothing has closed yet in the scanned window."}</div>`;
  return `<h2>Success rate</h2><div class="seg">${seg}</div>
    <div class="segnote">A win is any signal that reached Target 1 before its
      stop. Grouped by the ${PERF==="day"?"day":"week"} the signal closed.</div>
    <div style="margin-top:10px">${body}</div>`;
}

function setPerf(k) { PERF = k; render(true); }

/* Two rows on the dashboard: how today and this week are going. */
function miniPerf() {
  const d = bucketStats("day")[0], w = bucketStats("week")[0];
  if (!d && !w) return "";
  const row = (b, name) => {
    if (!b) return "";
    const col = b.rate>=60 ? "var(--green)" : b.rate>=40 ? "var(--gold)" : "var(--red)";
    return `<div class="prow"><div class="top"><span class="d">${name}</span>
      <span class="c">${b.n} closed</span>
      <span class="roi ${cls(b.roi)}">${b.roi>=0?"+":""}${b.roi}%</span></div>
      <div class="wr"><div class="track"><i style="width:${b.rate}%;
        background:${col}"></i></div>
      <span class="pct">${b.rate}% · ${b.wins}/${b.n}</span></div></div>`;
  };
  return `<div style="margin-top:9px">${row(d, "Latest day")}${
    row(w, "Latest week")}</div>
    <div class="hint" style="margin-top:2px">Full daily and weekly breakdown is
      on the Results tab.</div>`;
}

/* ------------------------------------------------------------------ render */
const $ = s => document.querySelector(s);
const esc = t => String(t==null?"":t).replace(/[&<>"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => { const a=Math.abs(n);
  return a>=100? n.toFixed(2) : a>=1? n.toFixed(3) : a>=0.01? n.toFixed(5)
       : Number(n.toPrecision(3)).toString(); };
const sgn = n => (n>=0?"+":"") + n.toFixed(2) + "%";
const cls = n => n>=0? "up":"down";
function age(ms) { if(!ms) return "";
  const s=(Date.now()-ms)/1000;
  if (s<90) return "just now";
  if (s<5400) return Math.floor(s/60)+" min ago";
  if (s<172800){const h=Math.floor(s/3600); return h+" hour"+(h!=1?"s":"")+" ago";}
  return Math.floor(s/86400)+" days ago"; }
const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const stat=(v,k)=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
function setDot(c){ $("#dot").className = "dot " + c; }
function progress(f){ $("#prog").style.width = Math.round(f*100) + "%"; }
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

function pill(s) {
  if (s.status==="stopped") return '<span class="pill stop">Stopped &#10005;</span>';
  if (s.status==="reversed") return '<span class="pill flat">Closed on cross</span>';
  if (s.status==="breakeven") return '<span class="pill flat">Breakeven</span>';
  if (s.status==="completed") return '<span class="pill done">Sold — all targets &#10003;</span>';
  if (s.hits) return `<span class="pill tgt">${s.closedAt ? "Sold at" : "Took"} Target ${s.hits} &#10003;</span>`;
  return '<span class="pill prog">In progress</span>';
}

/* Which bot found it — and, when several found the same thing, that they
   agreed. Silent when only one setup is running, because "Main" on every card
   is noise, and noise is what stops people reading the badges that matter. */
function botBadge(s) {
  const by = (s.by && s.by.length) ? s.by
    : (s.setupName && s.setupName !== "Current settings" ? [s.setupName] : []);
  if (!by.length) return "";
  const many = by.length > 1;
  if (!many && enabledBots().length <= 1) return "";
  return `<span class="b" style="background:${many ? "#14432c" : "#1d3a5c"};color:${
    many ? "#8ff0c0" : "#9ad2ff"}">${
    many ? by.length + " bots agree · " : ""}${esc(by.join(", "))}</span>`;
}

/* The coin's own track record with this strategy, on the card. A number you
   can argue with beats a claim you cannot check. */
function recBadge(s) {
  const r = s.rec;
  if (!r || r.n < 4) return "";
  const good = r.rate >= 60, bad = r.rate < 40;
  return `<span class="b" style="background:${
      good ? "#0f5f34" : bad ? "#3a2326" : "var(--sunk)"};color:${
      good ? "#8ff0c0" : bad ? "#ffb4b7" : "#9b9ba3"}"
    >TP1 ${r.rate}% of ${r.n}</span>`;
}

/* Says plainly whether the entry on this card is still available. */
function driftBadge(s) {
  if (s.closedAt) return "";
  const d = entryDrift(s);
  if (!entryGone(s)) {
    return d > 0 ? `<span class="b" style="background:var(--sunk);color:#9b9ba3"
      >${d}% toward TP1</span>` : "";
  }
  return `<span class="b" style="background:#3a2f16;color:#f0c14b">entry gone${
    s.hits >= 1 ? " · TP" + s.hits + " hit" : " · " + d + "% run"}</span>`;
}

/* =========================================================================
   A SIGNAL AS TEXT

   Somebody sending these to other people needs one tap that produces a
   message, not a screenshot of a phone. Everything a reader needs to act, and
   nothing they cannot check: the pair, the direction, the entry, the stop,
   the ladder, when it fired, and what produced it.

   The disclosure lines are not decoration. Anyone passing a signal to another
   person is telling them where to put money, and the leverage and the fee
   assumption change the answer.
   ========================================================================= */
const SIGBY = {};          // key -> signal, so a card's button can find it

function signalText(s) {
  if (!s) return "";
  const coin = s.symbol.replace("USDT", "");
  const arrow = s.side === "LONG" ? "\u25B2" : "\u25BC";
  const L = [];
  L.push(`${arrow} ${s.side} ${coin}${s.spot ? " (spot)" : " x" + s.leverage}`);
  L.push(`Entry ${s.entry}`);
  L.push(`Stop  ${s.stop}`);
  s.targets.forEach((t) => {
    L.push(`TP${t.index}   ${t.price}  (${t.roi.toFixed(1)}%${t.hit ? " hit" : ""})`);
  });
  L.push("");
  L.push(`${s.stf || CFG.signalTf} chart, ${CFG.trendTf} trend · ${s.tag || ""}`
       + (s.setupName ? ` · ${s.setupName}` : ""));
  L.push(`Fired ${new Date(s.at).toLocaleString(undefined, {day:"numeric",
    month:"short", hour:"2-digit", minute:"2-digit"})}`);
  if (s.agree != null) L.push(`${s.agree}/${s.agreeOf} indicators agree`);
  if (s.conflict) {
    L.push(`WARNING: the other setup is signalling ${
      s.side === "LONG" ? "SHORT" : "LONG"} on this coin at the same time.`);
  }
  if (s.rec && s.rec.n >= 4) {
    L.push(`This setup on ${coin}: first target reached ${s.rec.rate}% of the `
         + `last ${s.rec.n}`);
  }
  L.push("");
  L.push(`Percentages are on margin at ${s.spot ? 1 : s.leverage}x and include `
       + `${CFG.feePct}% fee + ${CFG.slipPct}% slippage each side.`);
  L.push("Not advice. Position size so a stop you can survive is a stop you can take.");
  return L.join("\n");
}

/* The batch that just fired, as one block — the way a channel posts it.
   Several signals arriving together is normal and reads better as one message
   than as a scroll of separate cards you have to piece together yourself. */
function digestBlock() {
  if (!LASTBATCH || !LASTBATCH.list.length) return "";
  const still = LASTBATCH.list.filter((s) => OPEN.includes(s) && !entryGone(s));
  if (!still.length) return "";
  const rows = still.map((s) => `<div class="kv">
      <span class="k"><b class="${s.side === "LONG" ? "up" : "down"}">${s.side}</b>
        ${esc(s.symbol.replace("USDT", ""))}
        <span style="color:#5e5e66">· ${esc(s.tag)}</span></span>
      <span class="v">${s.entry} <span style="color:#5e5e66">→</span>
        <span class="up">TP ${s.targets[0] ? s.targets[0].price : "—"}</span>
        <span style="color:#5e5e66">·</span>
        <span class="down">SL ${s.stop}</span></span></div>`).join("");
  return `<div class="card" style="margin-bottom:10px;border-color:#2b6b45">
    <div class="kv" style="border:0;padding-top:0">
      <span class="k" style="font-weight:800;font-size:14px">
        ${still.length} new signal${still.length === 1 ? "" : "s"}</span>
      <span class="v">${age(LASTBATCH.at)}</span>
    </div>
    ${rows}
    <button class="btn" style="margin-top:9px"
      onclick="copyOut(batchText(),'${still.length} signals')">Copy all
      ${still.length} as one message</button>
  </div>`;
}

/** The batch as a single message, ready to paste into a channel. */
function batchText() {
  if (!LASTBATCH) return allSignalsText();
  const still = LASTBATCH.list.filter((s) => OPEN.includes(s) && !entryGone(s));
  if (!still.length) return allSignalsText();
  return still.map(telegramCard).join("\n\n———\n\n");
}

/** Every takeable signal in one message. */
function allSignalsText() {
  const list = OPEN.filter((x) => !x.belowBar && !entryGone(x));
  if (!list.length) return "No fresh signals right now.";
  return list.map(telegramCard).join("\n\n———\n\n");
}

function card(s, i) {

     <span class="p">${t.price}</span>
     <span class="r">${t.roi.toFixed(2)}%${t.hit?" &#10003;":""}</span></div>`).join("");
  return `<div class="card${i===0?" open":""}" onclick="this.classList.toggle('open')">

        style="color:${s.focus ? "var(--gold)" : "#3f4652"};font-size:15px;

      ${/* When the setup fired on the chart — not when the app last looked.
             A bare "4 hours ago" next to a scan you just started reads as a

      <span class="b risk-${s.risk}">${s.risk} risk</span>
      <span class="b meta">${s.sweepTf ? esc(s.sweepTf.replace(">", " / "))
        : (s.stf || CFG.signalTf)} &middot; ${s.tag || (s.score+"/8")}</span>
      ${s.sweepTf ? `<span class="b" style="background:#1d3a5c;color:#9ad2ff"
        >best of ${MATRIX_TFS.length} intervals</span>` : ""}
      ${s.belowBar ? `<span class="b" style="background:#3a2f16;color:#f0c14b"
        >below filter · ${esc(s.belowBar)}</span>` : ""}
      ${s.fromServer ? `<span class="b" style="background:#14432c;color:#8ff0c0"

      ${s.chase ? `<span class="b" style="background:${
        s.chase.verdict === "take" ? "#0f5f34"
        : s.chase.verdict === "retest" ? "#3a2f16" : "#3a2326"};color:${
        s.chase.verdict === "take" ? "#8ff0c0"
        : s.chase.verdict === "retest" ? "#f0c14b" : "#ffb4b7"}">${
        s.chase.verdict === "take" ? "entry still good"
        : s.chase.verdict === "retest" ? "wait for retest" : "too late"}</span>`
        : ""}
      ${s.life ? `<span class="b" style="background:${
        s.life === "entry" ? "#0f5f34" : s.life === "invalid" ? "#3a2326"
        : "var(--sunk)"};color:${s.life === "entry" ? "#8ff0c0"
        : s.life === "invalid" ? "#ffb4b7" : "#9b9ba3"}"
        >${LIFE_LABEL[s.life]}</span>` : ""}
      ${s.confidence != null ? `<span class="b" style="background:${
        s.confidence >= 70 ? "#0f5f34" : s.confidence >= 45 ? "var(--sunk)" : "#3a2326"
      };color:${s.confidence >= 70 ? "#8ff0c0" : s.confidence >= 45 ? "#9b9ba3"
        : "#ffb4b7"}">${s.confidence}/100</span>` : ""}
      ${s.mae ? `<span class="b" style="background:var(--sunk);color:#9b9ba3"
        >${s.mae}R against${s.mfe ? " · " + s.mfe + "R for" : ""}</span>` : ""}
      ${s.keptOver ? `<span class="b" style="background:#1f3d2a;color:#8ff0c0"
        >kept over the ${esc(s.keptOver)}</span>` : ""}
      ${s.conflict && !s.keptOver ? `<span class="b" style="background:#4a2317;color:#ffb08a"
        >conflict · the other setup says ${s.side === "LONG" ? "SHORT" : "LONG"}</span>`
        : ""}

/* A one-line read of the whole market: how much of what we scan is green,
   and which way the majors are leaning. */
function breadth() {
  const syms = (UNIVERSE.length ? UNIVERSE : CFG.focus).filter(x=>TICK[x]);
  if (!syms.length) return null;
  const ch = syms.map(x=>TICK[x].change).filter(x=>isFinite(x));
  if (!ch.length) return null;
  const up = ch.filter(x=>x>0).length;
  const pct = up/ch.length*100;
  const avg = ch.reduce((a,b)=>a+b,0)/ch.length;
  const verdict = pct >= 70 ? ["Risk on", "good"]
    : pct >= 55 ? ["Leaning up", "good"]
    : pct >= 45 ? ["Mixed", ""]
    : pct >= 30 ? ["Leaning down", "bad"] : ["Risk off", "bad"];
  return {n: ch.length, up, pct:+pct.toFixed(0), avg:+avg.toFixed(2),
          verdict: verdict[0], tone: verdict[1]};
}

/* Tiny inline sparkline from whatever candles the last scan cached. */
function spark(sym, w, h) {
  const rows = CACHE.get(sym + ":" + CFG.signalTf);
  if (!rows || rows.length < 12) return "";
  const v = rows.slice(-44).map(r=>r.c);
  const hi = Math.max(...v), lo = Math.min(...v);
  if (!(hi > lo)) return "";
  const pts = v.map((y,i)=>
    (i/(v.length-1)*w).toFixed(1) + "," + ((hi-y)/(hi-lo)*h).toFixed(1)).join(" ");
  const col = v[v.length-1] >= v[0] ? "var(--green)" : "var(--red)";
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* =========================================================================
   THE DAY'S NUMBERS

   Accuracy on its own flatters. A strategy that reaches its first target seven
   times in ten still loses money if the three losers give back more than the
   seven winners make, so the hit rate and the expectancy are shown together
   and neither is allowed to stand alone.

   Everything is in R -- multiples of the distance to the original stop --
   because a percentage on 20x leverage and the same percentage on 3x are not
   comparable, and averaging them produces a number that means nothing.
   ========================================================================= */
function dayKey(ms) {
  const d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}

function rOf(s) {
  const ref = s.initialStop != null ? s.initialStop : s.stop;
  const risk = Math.abs(s.entry - ref) / s.entry * 100;
  if (!(risk > 0)) return null;
  return (s.roi / (s.leverage || 1)) / risk;
}

/** Closed trades grouped by the day they finished, newest first. */
function dailyKpis(list, days) {
  const by = new Map();
  for (const s of list) {
    if (!s.closedAt) continue;
    const k = dayKey(s.closedAt);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(s);
  }
  const out = [];
  for (const [day, rows] of [...by.entries()].sort((a, b) => b[0].localeCompare(a[0]))) {
    const rs = rows.map(rOf).filter((v) => v != null);
    const wins = rows.filter((s) => s.hits >= 1);
    const losses = rows.filter((s) => s.hits < 1);
    const wR = wins.map(rOf).filter((v) => v != null);
    const lR = losses.map(rOf).filter((v) => v != null);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const gain = sum(wR.filter((v) => v > 0));
    const pain = Math.abs(sum(lR.filter((v) => v < 0)));
    out.push({
      day, n: rows.length, tp1: wins.length,
      rate: rows.length ? Math.round(wins.length / rows.length * 100) : 0,
      avgWin: wR.length ? +(sum(wR) / wR.length).toFixed(2) : 0,
      avgLoss: lR.length ? +(sum(lR) / lR.length).toFixed(2) : 0,
      exp: rs.length ? +(sum(rs) / rs.length).toFixed(2) : 0,
      pf: pain > 0 ? +(gain / pain).toFixed(2) : (gain > 0 ? Infinity : 0),
      mae: rows.length ? +(sum(rows.map((s) => s.mae || 0)) / rows.length).toFixed(2) : 0,
      worstWinMae: wins.length ? Math.max(...wins.map((s) => s.mae || 0)) : 0,
    });
    if (out.length >= (days || 7)) break;
  }
  return out;
}

function kpiBlock() {
  const rows = dailyKpis(CLOSED, 7);
  if (!rows.length) {
    return `<div class="segnote">No trades have finished yet. A day appears
      here once something has reached a target or a stop — not when it fires.</div>`;
  }
  const fmtR = (v) => (v > 0 ? "+" : "") + v + "R";
  const body = rows.map((d) => `<div class="card" style="margin-bottom:8px">
      <div class="kv"><span class="k" style="font-weight:800">${esc(d.day)}</span>
        <span class="v" style="color:${d.exp > 0 ? "var(--green2)" : "var(--red2)"}"
          >${fmtR(d.exp)} per trade</span></div>
      ${kv("Finished", d.n + " trade" + (d.n === 1 ? "" : "s"))}
      ${kv("Reached TP1", d.tp1 + " of " + d.n + " · " + d.rate + "%")}
      ${kv("Average win / loss", fmtR(d.avgWin) + " / " + fmtR(d.avgLoss))}
      ${kv("Profit factor", d.pf === Infinity ? "no losses" : d.pf)}
      ${kv("Typical drawdown before resolving", d.mae + "R")}
      ${d.worstWinMae ? kv("Closest call on a winner", d.worstWinMae + "R against") : ""}
    </div>`).join("");
  const all = rows.reduce((a, d) => ({ n: a.n + d.n, e: a.e + d.exp * d.n }), { n: 0, e: 0 });
  const avg = all.n ? +(all.e / all.n).toFixed(2) : 0;
  return `<div class="segnote">Everything in R — one R is the distance from
      entry to the original stop. Hit rate and expectancy are shown together
      because either one alone can flatter a losing strategy.</div>
    ${body}
    <div class="status">${kv("Across these " + rows.length + " days",
      all.n + " trades · " + (avg > 0 ? "+" : "") + avg + "R per trade")}</div>
    <div class="hint">Expectancy is the number that decides whether this is
      worth trading. Above zero and the winners outweigh the losers; below zero
      a high hit rate is just losing slowly.</div>`;
}

      `<i style="height:${Math.max(2,Math.abs(v)/mx*40)}px;background:${

    <div class="kv" style="border:0;padding-bottom:0"><span class="k">Total</span>
    <span class="v ${cls(st.totalRoi)}">${sgn(st.totalRoi)}</span></div></div>` : "";
  const rates = st.rates.map((r,i)=>kv(`Target ${i+1} reached`, r+"%")).join("");
  const bw = st.best ? kv("Best", esc(st.best.symbol)+
      ` <span class="up">${sgn(st.best.roi)}</span>`) +
      kv("Worst", esc(st.worst.symbol)+
      ` <span class="down">${sgn(st.worst.roi)}</span>`) : "";
  return head + `<div class="stats">${stat(st.n,"Closed")}${stat(st.winRate+"%","TP1 rate")}

    ${spark?"<h2>Equity</h2>"+spark:""}

    ${perfBlock()}
    <h2>Hit rates</h2><div class="status">${rates}${bw}</div>
    <h2>History</h2>${CLOSED.length? CLOSED.map(card).join("")
      : `<div class="empty">${BUSY?"Scanning…"
         : CFG.liveOnly
         ? "Nothing has resolved since you started watching on " + sinceLabel() + "."
         : "No resolved signals in the scanned window."}</div>`}
    ${/* This button used to live behind an accordion in Settings, which is
          nowhere near where anyone looks for it. It belongs on the tab whose
          record it clears. */""}
    <button class="btn" style="margin-top:10px" onclick="askReset()">Reset
      tracking — start from now</button>
    <div class="hint">Clears everything currently tracked, including trades
      opened on coins you have since removed, and restarts the record from this
      moment. The Backtest tab is untouched.</div>
    <div class="hint">${CFG.liveOnly
      ? "Only signals that fired after " + sinceLabel() + " are counted here, "
        + "tracked bar by bar from their entry. Resolved ones are kept even once "
        + "their candles scroll out of the window. Use Reset above to start "
        + "a fresh record, or the Backtest tab for the full history."
      : "Every signal the strategy would have produced over the last " + CFG.bars
        + " candles, tracked bar by bar."} Fees and funding are not included.</div>`;
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  PRESET = name;
  for (const k in p) if (k !== "note") CFG[k] = p[k];
  render();
  toast(name[0].toUpperCase() + name.slice(1) + " — rescanning");
  run();
}

function setv(k, v, suf) {
  CFG[k] = parseFloat(v);
  PRESET = "custom";
  const el = document.getElementById("v_"+k);
  if (el) el.textContent = v + suf;
  clearTimeout(setv._t);
  setv._t = setTimeout(rescore, 350);          // no refetch needed
}
function tgl(k, el) {
  // el is null when a shortcut button flips a setting from another screen
  if (el) el.classList.toggle("on");
  CFG[k] = el ? el.classList.contains("on") : !CFG[k];
  if (k !== "liveOnly" && k !== "focusFirst") PRESET = "custom";
  render(true); rescore(); }
function setTf(k, v) {
  const order=ALL_TFS;
  const other = k==="signalTf" ? CFG.trendTf : CFG.signalTf;
  if ((k==="signalTf" && order.indexOf(v)>=order.indexOf(CFG.trendTf)) ||
      (k==="trendTf" && order.indexOf(v)<=order.indexOf(CFG.signalTf))) {
    toast("Trend timeframe must be higher than the signal one"); render(); return;
  }
  CFG[k]=v; writeHash(); CACHE.clear(); run();
}

/* Members of a sector that are actually listed, limited to the top N by volume
   so "Layer 1" means the liquid layer 1s, not every obscure chain. */
function catMembers(name) {
  const want = new Set(CATS[name].map(s=>s+"USDT"));
  const pool = ALLSYMS.length ? ALLSYMS.slice(0, Math.max(CFG.pairs, 20))
                              : CFG.focus;
  return pool.filter(s=>want.has(s));
}

function pickCat(name) {
  const list = catMembers(name);
  if (!list.length) { toast(name + ": nothing listed in the top " + CFG.pairs); return; }
  CFG.custom = list;
  refreshChips();
  toast(name + ": " + list.length + " coins selected");
}

/* An accordion over whatever profileView produced: every <h2> becomes a header
   you can fold away. The settings did not shrink, but only the section you
   opened is on screen. */
let PSEC = {"Quick setup": true};

/* The three decisions that matter, plus the button that makes the rest of
   them for you. Everything below this is folded away by default. */
/* What Auto chose for each pair, and why. Without this the mode is a black
   box - you should be able to see that BTC is on one strategy and SOL another,
   and what each one scored. */
function autoTable() {
  if (CFG.strategy !== "auto") {
    return `<div class="segnote">Not in Auto mode. Pick <b>Auto per pair</b>
      under Strategy and every coin will be matched to whichever of the five
      worked best on its own history.</div>`;
  }
  const rows = [...AUTOPICK.entries()]
    .sort((a, b) => (b[1].exp || -Infinity) - (a[1].exp || -Infinity));
  if (!rows.length) {
    return `<div class="segnote">Nothing picked yet — run a scan.</div>`;
  }
  const body = rows.map(([sym, v]) => {
    const ok = isFinite(v.exp);
    return `<div class="kv">
      <span class="k">${esc(sym.replace("USDT",""))}${v.tf && v.ttf
        ? `<span style="color:#5e5e66"> · ${v.tf}/${v.ttf}</span>` : ""}</span>
      <span class="v">${v.tuned ? "\u2699 " : ""}${esc(STRAT_SHORT[v.strat] || v.strat)}
        <span style="color:${!ok ? "var(--dim)"
          : v.exp > 0 ? "var(--green2)" : "var(--red2)"}">${
          ok ? (v.exp > 0 ? "+" : "") + v.exp.toFixed(2) + "R" : "thin"}</span>
        <span style="color:#5e5e66">${v.n}</span></span></div>`;
  }).join("");
  const tally = {};
  for (const [, v] of rows) tally[v.strat] = (tally[v.strat] || 0) + 1;
  const summary = Object.entries(tally)
    .sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `${n}× ${STRAT_SHORT[k] || k}`).join(" · ");

  return `<div class="segnote">${summary}</div>
    <div class="status">${body}</div>
    <button class="btn" onclick="repickAuto()">Choose again from fresh history</button>
    ${coinTuneBlock()}
    <div class="hint">Each pair was replayed through all ten strategies and kept
      the one with the best expectancy, in R, over the newest third of its
      history. The number after the name is that score; the grey one is how many
      trades it came from. Fewer than four trades shows as "thin" — too little
      to judge, so the pick there is close to a guess. Choices refresh
      automatically every 30 minutes.</div>`;
}

function coinTuneBlock() {
  if (COIN_TUNE.running) {
    return `<div class="status" style="margin-top:10px">
        ${kv("Tuning", esc(COIN_TUNE.sym.replace("USDT","")))}
        ${kv("Progress", COIN_TUNE.done + " of " + COIN_TUNE.total)}</div>
      <button class="btn" onclick="cancelCoinTune()">Stop</button>`;
  }
  const tuned = [...AUTOPICK.values()].filter(v => v.tuned).length;
  return `<button class="btn gold" onclick="tuneEveryCoin()">Tune every coin
      separately</button>
    <div class="hint">${tuned
      ? tuned + " coins carry their own tuned settings."
      : "Right now each coin only picks a strategy; they all share the same "
        + "settings underneath."} Tuning searches each coin's strategy AND its
      settings on that coin's history alone — BTC might end up on Open/Close
      with a 21-period average while ETH runs UT Bot at a different
      sensitivity. Takes a minute or two for 20 coins.</div>`;
}

function repickAuto() {
  AUTOPICK.clear();
  toast("Re-picking from fresh history");
  render(true);
  rescore();
}

/* =========================================================================
   PER-COIN TUNING — every coin gets its own strategy AND its own settings.

   Auto per pair already picked a strategy per coin. This goes further: for
   each coin it also searches that strategy's settings on that coin's history
   alone, so BTC can run Open/Close on a 21-period average while ETH runs
   UT Bot at a different sensitivity.

   Scored the same way as everything else — expectancy in R on the newest
   third of the coin's history, which the search does not tune against.
   ========================================================================= */

/* Compact spaces: this runs once per coin, so it stays small on purpose. */
const COIN_SPACE = {
  confluence: { minScore: [4,5,6,7], adxMin: [10,20,30], slAtr: [1,1.5,2,2.5],
                beAfter: [0,2,3], requireHtf: [true,false] },
  occ:        { occMaType: ["SMMA","EMA","HullMA","TEMA","WMA"],
                occMaLen: [1,5,8,13,21], occMult: [1,2,3,5],
                occExitOnCross: [true,false], slAtr: [1,1.5,2,2.5],
                requireHtf: [true,false] },
  ut:         { utKey: [1,2,3,4,6], utAtrLen: [5,10,14,20],
                slAtr: [1,1.5,2,2.5], beAfter: [0,2,3],
                requireHtf: [true,false] },
  tt:         { ttLen: [5,8,10,14,20], ttTarget: [0,1,3],
                slAtr: [1,1.5,2,2.5], requireHtf: [true,false] },
  sr:         { srPivot: [3,5,8], srZoneAtr: [0.4,0.6,0.9],
                srMinTouch: [2,3], srMode: ["bounce","breakout","both"],
                srZoneStop: [true,false], slAtr: [1,1.5,2,2.5] },
};

const COIN_TUNE = { running:false, cancel:false, done:0, total:0, sym:"", at:0 };

/** Try `tries` random settings for one strategy on one coin. */
function tuneCoinStrategy(sym, d, h, ltf, strat, hold, tries) {
  const space = COIN_SPACE[strat];
  const keys = Object.keys(space);
  const keep = {};
  for (const k of keys) keep[k] = CFG[k];
  const keepStrat = CFG.strategy, keepTp = CFG.tpAtr;
  CFG.strategy = strat;

  let best = null;
  const seen = new Set();
  try {
    for (let i = 0; i < tries; i++) {
      const combo = {};
      for (const k of keys) {
        combo[k] = space[k][Math.floor(Math.random() * space[k].length)];
      }
      const id = keys.map((k) => combo[k]).join("|");
      if (seen.has(id)) continue;
      seen.add(id);
      for (const k of keys) CFG[k] = combo[k];

      let sigs = [];
      try { sigs = autoSignals(sym, d, h, ltf); } catch (e) { continue; }
      const sc = autoScore(sigs, hold);
      const better = !best || sc.exp > best.exp ||
        (!isFinite(sc.exp) && !isFinite(best.exp) && sc.n > best.n);
      if (better) best = { strat, params: combo, exp: sc.exp, n: sc.n };
    }
  } finally {
    for (const k of keys) CFG[k] = keep[k];
    CFG.strategy = keepStrat; CFG.tpAtr = keepTp;
  }
  return best;
}

/** Search every strategy and every setting for one coin. */
function tuneOneCoin(sym, d, h, ltf, triesEach) {
  const hold = Math.floor(d.c.length * 0.65);
  let best = null;
  for (const strat of AUTO_STRATS) {
    const r = tuneCoinStrategy(sym, d, h, ltf, strat, hold, triesEach);
    if (!r) continue;
    const better = !best || r.exp > best.exp ||
      (!isFinite(r.exp) && !isFinite(best.exp) && r.n > best.n);
    if (better) best = r;
  }
  return best;
}

/* Timeframes a single coin may be tuned on. Kept short: each one is another
   download per coin. */
const COIN_TFS = [["15m","1h"], ["1h","4h"], ["4h","1d"]];

async function tuneEveryCoin() {
  if (COIN_TUNE.running || BUSY) return;
  const syms = (UNIVERSE.length ? UNIVERSE : CFG.focus).slice(0, 20);
  COIN_TUNE.running = true; COIN_TUNE.cancel = false;
  COIN_TUNE.done = 0; COIN_TUNE.total = syms.length;
  render(true);

  const tries = 120;                       // per strategy, per coin
  for (const sym of syms) {
    if (COIN_TUNE.cancel) break;
    COIN_TUNE.sym = sym;
    render(true);
    await new Promise((r) => setTimeout(r, 0));
    try {
      let best = null;
      // Try the coin on each timeframe as well as each strategy - a coin that
      // is noise on 15m is often perfectly tradable on 4h.
      for (const [stf, ttf] of COIN_TFS) {
        if (COIN_TUNE.cancel) break;
        let ltf, htf;
        try {
          ltf = await klines(sym, stf, CFG.bars);
          htf = await klines(sym, ttf, 400);
        } catch (e) { continue; }
        const d = enrich(ltf), h = enrich(htf);
        const keepS = CFG.signalTf, keepT = CFG.trendTf;
        CFG.signalTf = stf; CFG.trendTf = ttf;
        let r = null;
        try { r = tuneOneCoin(sym, d, h, ltf, tries); }
        finally { CFG.signalTf = keepS; CFG.trendTf = keepT; }
        if (!r) continue;
        r.stf = stf; r.ttf = ttf;
        const better = !best || r.exp > best.exp ||
          (!isFinite(r.exp) && !isFinite(best.exp) && r.n > best.n);
        if (better) best = r;
        COIN_TUNE.sym = sym + " · " + stf;
        render(true);
        await new Promise((res) => setTimeout(res, 0));
      }
      if (best) {
        AUTOPICK.set(sym, { strat: best.strat, params: best.params,
                            exp: best.exp, n: best.n, at: Date.now(),
                            tf: best.stf, ttf: best.ttf, tuned: true });
      }
    } catch (e) { /* a pair that will not load is simply skipped */ }
    COIN_TUNE.done++;
    render(true);
  }

  COIN_TUNE.running = false; COIN_TUNE.sym = ""; COIN_TUNE.at = Date.now();
  CFG.strategy = "auto";
  toast("Every coin tuned");
  render(true);
  rescore();
}

function cancelCoinTune() { COIN_TUNE.cancel = true; render(true); }

   The page only works while it is open, so a tuned setup is worth nothing
   until it lives somewhere else. Three ways out:

     a link      the whole configuration packed into the URL, so a bookmark or
                 a home-screen icon reopens exactly this setup

   ========================================================================= */

  "alwaysOn","notify","sound","autoRefreshMin","sinceDeploy","dualScan",

  "minWinRate","minRecord","liveOnly","botsPerScan","botBtPairs","botBtBars",

  "whaleCoins","whaleOn","whaleTtlMin",
  "entryZoneR","evoChamps","evoMutations","evoMargin","evoRetireAfter","evoPatience",
