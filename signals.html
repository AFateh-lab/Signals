<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0d0f;--card:#17171a;--sunk:#202024;--line:#26262b;--txt:#f2f2f4;
 --dim:#8b8b93;--green:#12a150;--green2:#3ecf8e;--red:#e5484d;--red2:#ff6b6f;
 --gold:#f0c14b}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,
 BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
 -webkit-font-smoothing:antialiased;max-width:720px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 14px) 14px
   calc(env(safe-area-inset-bottom) + 96px);overscroll-behavior-y:contain}
.head{display:flex;align-items:center;gap:10px}
h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green2);
 margin-left:auto;animation:pulse 2.4s infinite;flex:none}
.dot.busy{background:var(--gold)}.dot.bad{background:var(--red2);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.5)}
 70%{box-shadow:0 0 0 9px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.sub{color:var(--dim);font-size:11.5px;margin:4px 0 14px;line-height:1.5}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
 margin:20px 0 9px;font-weight:800}
h2:first-child{margin-top:2px}
.bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;
 margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;
 transition:width .25s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:var(--card);border-radius:14px;padding:11px 6px;text-align:center}
.stat .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;
 letter-spacing:.06em;margin-top:3px}
.card{background:var(--card);border-radius:20px;padding:15px;margin-bottom:12px}
.row1{display:flex;align-items:center;gap:10px}
.sym{font-size:19px;font-weight:800;letter-spacing:-.01em}
.age{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap}
.badges{display:flex;gap:6px;margin:9px 0 11px;flex-wrap:wrap;align-items:center}
.b{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;
 white-space:nowrap}
.LONG{background:var(--green);color:#fff}
.SHORT{background:var(--red);color:#fff}
.meta{background:var(--sunk);color:#9b9ba3}
.risk-high{border:1px solid var(--red);color:var(--red2)}
.risk-medium{border:1px solid #d9a521;color:var(--gold)}
.risk-low{border:1px solid var(--green);color:var(--green2)}
.pill{margin-left:auto;font-size:11px;font-weight:800;padding:6px 12px;
 border-radius:999px;white-space:nowrap}
.pill.prog{background:#fff;color:#111}
.pill.tgt{background:var(--green);color:#fff}
.pill.stop{background:var(--red);color:#fff}
.pill.done{background:#0b6b38;color:#fff}
.pill.flat{background:var(--sunk);color:#c9c9d1}
.prices{display:flex;justify-content:space-between;font-size:13px;color:#c9c9d1;
 margin-bottom:10px;gap:10px;flex-wrap:wrap}
.prices b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.cur{background:var(--sunk);border-radius:14px;padding:12px 15px;display:flex;
 align-items:center;justify-content:space-between;font-size:14.5px}
.cur .lbl{color:#a5a5ad}
.cur b{font-variant-numeric:tabular-nums}
.up{color:var(--green2);font-weight:800}.down{color:var(--red2);font-weight:800}
.tgts{margin-top:9px;display:none;flex-direction:column;gap:6px}
.card.open .tgts{display:flex}
.t{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;
 border-radius:12px;background:var(--sunk);font-size:13.5px}
.t.hit{background:#0f5f34}
.t .p{color:#c9c9d1;font-variant-numeric:tabular-nums}
.t.hit .p{color:#eafff3}
.t .r{font-weight:800;font-variant-numeric:tabular-nums}
.why{color:#7c7c85;font-size:10.5px;margin-top:10px;line-height:1.5;display:none}
.card.open .why{display:block}
.hint{color:#5e5e66;font-size:10.5px;text-align:center;margin:2px 0 12px;
 line-height:1.5}
.mxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}
.mxt{border-collapse:collapse;font-size:11px;width:100%}
.mxt th{color:var(--dim);font-weight:600;padding:4px 5px;text-align:left;
  white-space:nowrap;font-size:10.5px}
.mxt td{padding:4px 5px;text-align:center;border:1px solid #1e1e26;
  min-width:30px;color:var(--txt)}
.mxt td.none{color:#3a3a45}
.mxt td.bad{background:#1a1a20;color:#5e5e66}
.mxt td.ok{font-weight:800;color:#05130c}
.mxt.lb td{text-align:left;border:0;border-bottom:1px solid #1e1e26;
  color:var(--dim)}
.mxt.lb th{border-bottom:1px solid #1e1e26;color:var(--txt)}
.stepno{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.10em;
 text-transform:uppercase;color:var(--gold);border:1px solid rgba(240,185,11,.35);
 border-radius:99px;padding:2px 8px;margin-bottom:8px}
.empty{background:var(--card);border-radius:20px;padding:32px 22px;text-align:center;
 color:var(--dim);font-size:13.5px;line-height:1.6}
.err{background:#2a1416;border:1px solid #5c2126;border-radius:16px;padding:14px;
 color:#ffb4b7;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border-radius:16px;padding:13px 14px}
.tile .s{font-size:12px;color:var(--dim);font-weight:700}
.tile .p{font-size:18px;font-weight:800;margin-top:3px;
 font-variant-numeric:tabular-nums}
.tile .c{font-size:12px;font-weight:800;margin-top:2px}
.mv{display:flex;align-items:center;justify-content:space-between;
 background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:6px;
 font-size:13.5px}
.mv .n{font-weight:700}
.mv .px{color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto;
 margin-right:12px}
.feed{background:var(--card);border-radius:18px;padding:4px 14px}
.ev{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);
 font-size:13px;align-items:flex-start}
.ev:last-child{border-bottom:0}
.ev .ic{width:20px;text-align:center;flex:none}
.ev .tx{flex:1;line-height:1.4}
.ev .tm{color:#6a6a72;font-size:10.5px;margin-top:2px}
.good{color:var(--green2)}.bad{color:var(--red2)}
.status{background:var(--card);border-radius:18px;padding:6px 14px;
 margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:11px 0;
 border-bottom:1px solid var(--line);font-size:13.5px;gap:14px;align-items:center}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:120px;height:4px;border-radius:2px;
 background:var(--sunk);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;
 height:22px;border-radius:50%;background:var(--gold)}
select{background:var(--sunk);color:var(--txt);border:0;border-radius:9px;
 padding:7px 10px;font-size:13px;font-family:inherit;font-weight:700}
.sw{width:47px;height:28px;border-radius:99px;background:var(--sunk);
 position:relative;border:0;flex:none;transition:background .2s}
.sw.on{background:var(--green)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
 border-radius:50%;background:#fff;transition:transform .2s}
.sw.on::after{transform:translateX(19px)}
.btn{width:100%;background:var(--sunk);color:var(--txt);border:0;border-radius:14px;
 padding:14px;font-size:14px;font-weight:800;font-family:inherit;margin-top:10px}
.btn.gold{background:var(--gold);color:#1a1400}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--dim);font-family:inherit;
 font-size:13px;font-weight:800;padding:11px 4px;border-radius:11px}
.seg button.on{background:var(--gold);color:#1a1400}
.segnote{color:var(--dim);font-size:11.5px;line-height:1.5;margin:9px 2px 2px}
.search{width:100%;background:var(--sunk);border:0;border-radius:12px;padding:12px 14px;
 color:var(--txt);font-size:15px;font-family:inherit;margin:10px 0 9px}
.search::placeholder{color:#6a6a72}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow-y:auto;
 -webkit-overflow-scrolling:touch;padding:2px}
.chip{background:var(--sunk);color:#c9c9d1;border:0;border-radius:10px;
 padding:9px 12px;font-size:12.5px;font-weight:800;font-family:inherit}
.chip.on{background:var(--gold);color:#1a1400}
.chips.cats{max-height:none;margin-bottom:2px}
.chip.cat{background:#1f1f24;border:1px solid #303038;color:#d5d5dc}
.chip.cat.on{background:var(--gold);border-color:var(--gold);color:#1a1400}
.pickbar{display:flex;gap:7px;margin-top:9px}
.pickbar button{flex:1;background:var(--sunk);color:var(--txt);border:0;
 border-radius:12px;padding:12px 6px;font-size:12.5px;font-weight:800;
 font-family:inherit}
.pickbar button.go{background:var(--gold);color:#1a1400}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:10px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
 bottom:calc(env(safe-area-inset-bottom) + 110px);background:#26262b;
 padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;
 transition:opacity .25s;pointer-events:none;z-index:9;max-width:88%;
 text-align:center}
.toast.show{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,21,.94);
 backdrop-filter:saturate(160%) blur(18px);
 -webkit-backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line);
 display:flex;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:10.5px;
 font-weight:700;font-family:inherit;padding:5px 0;display:flex;
 flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;
 stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
footer{color:#5e5e66;font-size:10.5px;text-align:center;margin-top:22px;
 line-height:1.6}
/* ---- dashboard hero ---- */
.hero{background:linear-gradient(160deg,#1b1b21 0%,#141418 100%);
 border:1px solid #26262e;border-radius:20px;padding:16px 16px 13px;
 margin-bottom:14px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start}
.hlabel{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;
 letter-spacing:.7px;margin-bottom:3px}
.hbig{font-size:22px;font-weight:800;letter-spacing:-.4px;
 font-variant-numeric:tabular-nums}
.hbig.good{color:var(--green)} .hbig.bad{color:var(--red)}
.brd{height:7px;border-radius:4px;background:#2a2a32;overflow:hidden;margin:13px 0 8px}
.brd i{display:block;height:100%;border-radius:4px;
 background:linear-gradient(90deg,var(--red),var(--gold) 45%,var(--green))}
.hsub{font-size:11.5px;color:#8f8f99;font-weight:600}
.hline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
 margin-top:12px;padding-top:11px;border-top:1px solid #26262e}
.hline .k{font-size:11.5px;color:var(--dim);font-weight:700}
.hline .v{font-weight:800;font-variant-numeric:tabular-nums}
.spk{width:100%;height:18px;margin-top:6px;display:block;opacity:.85}
@keyframes tickup{0%{color:var(--green)}100%{color:inherit}}
@keyframes tickdn{0%{color:var(--red)}100%{color:inherit}}
.tick-up{animation:tickup .7s ease-out}
.tick-dn{animation:tickdn .7s ease-out}
/* ---- daily / weekly performance rows ---- */
.prow{background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:6px}
.prow .top{display:flex;align-items:baseline;gap:8px;font-size:13px}
.prow .d{font-weight:800}
.prow .c{color:var(--dim);font-size:11px}
.prow .roi{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;
 font-size:13px}
.prow .wr{display:flex;align-items:center;gap:9px;margin-top:7px}
.prow .track{flex:1;height:6px;border-radius:3px;background:var(--sunk);
 overflow:hidden}
.prow .track i{display:block;height:100%;border-radius:3px}
.prow .pct{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;
 width:74px;text-align:right;color:#c9c9d1}
/* ---- chart ---- */
.cbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.cbar .symbtn{background:var(--sunk);border:0;color:var(--txt);font-family:inherit;
 font-size:15px;font-weight:800;border-radius:12px;padding:10px 13px;flex:none}
.cbar .px{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.cbar .px b{font-size:16px;font-weight:800}
.cbar .px .ch{font-size:11.5px;font-weight:800;display:block}
.scroller{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
 padding-bottom:3px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.out{width:100%;background:var(--sunk);border:0;border-radius:12px;padding:12px;
 color:#c9c9d1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
 line-height:1.5;margin-top:10px;resize:vertical}
.sech{width:100%;display:flex;align-items:center;justify-content:space-between;
 background:none;border:0;border-top:1px solid var(--line);color:var(--dim);
 font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.07em;
 text-transform:uppercase;padding:15px 2px;margin-top:2px;text-align:left}
.sech.open{color:var(--gold)}
.sech .chev{font-size:16px;font-weight:700}
.secb{padding-bottom:6px}
.tfb{background:var(--sunk);border:0;color:var(--dim);font-family:inherit;
 font-size:12px;font-weight:800;border-radius:10px;padding:8px 12px;flex:none}
.tfb.on{background:var(--gold);color:#1a1400}
.indb{background:#1f1f24;border:1px solid #303038;color:#c9c9d1;font-family:inherit;
 font-size:11.5px;font-weight:800;border-radius:999px;padding:7px 12px;flex:none;
 display:flex;align-items:center;gap:6px}
.indb.on{background:#2b2b33;border-color:#4a4a55;color:#fff}
.indb .sw2{width:8px;height:8px;border-radius:50%;background:#4a4a55;flex:none}
.indb.on .sw2{background:currentColor}
.indrow{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.indopen{flex:none;background:var(--gold);color:#1a1400;border:0;font-family:inherit;
 font-size:12px;font-weight:800;border-radius:10px;padding:8px 11px;
 display:flex;align-items:center;gap:5px}
.indopen b{background:rgba(0,0,0,.18);border-radius:6px;padding:1px 5px;font-size:11px}
.indsheet{background:var(--card);border-radius:18px;padding:13px;margin-bottom:10px}
.indgrp{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;
 letter-spacing:.6px;margin:12px 2px 7px}
.indgrp:first-child{margin-top:0}
.indwrap{display:flex;flex-wrap:wrap;gap:6px}
.chartbox{background:var(--card);border-radius:18px;padding:9px 8px 6px;
 margin-bottom:10px;position:relative}
.chartbox canvas{display:block;width:100%;touch-action:none;border-radius:10px}
#eqcv{display:block;width:100%;margin-top:9px;border-radius:10px}
.ohlc{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:#9b9ba3;
 font-variant-numeric:tabular-nums;padding:0 4px 7px;min-height:15px}
.ohlc b{color:#e8e8ee;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--dim);
 padding:6px 4px 2px;font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:3px;border-radius:2px;display:block}
.chartsub{color:#6a6a72;font-size:10.5px;line-height:1.5;margin:2px 2px 12px}
.chpick{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px}
.tvbtn{display:block;width:100%;text-align:center;background:var(--sunk);
 color:var(--txt);border-radius:14px;padding:13px;font-size:13.5px;font-weight:800;
 text-decoration:none;margin-top:8px}
.cmpbox{background:var(--card);border-radius:16px;padding:6px 13px;margin-bottom:8px}
.cmp{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
 font-size:12.5px;font-variant-numeric:tabular-nums}
.cmp:last-child{border-bottom:0}
.cmp .k{flex:1;color:var(--dim);font-weight:600}
.cmp .c{width:calc((100% - 34%)/var(--cols,2));min-width:56px;text-align:right;
 font-weight:800;color:#d5d5dc}
.cmp.head{font-size:11px;color:var(--dim);font-weight:800;text-transform:uppercase;
 letter-spacing:.4px}
.cmp.head .c{color:var(--dim);font-size:10px}
.cmp .c.up{color:var(--green)}
.cmp .c.down{color:var(--red)}

<script>
"use strict";
/* ==========================================================================
   Signal engine - the whole bot, running in your browser.
   Fetches candles from a public exchange API, computes the indicators,
   scores each candle out of 8, and tracks every signal it finds through the
   candles that came after it. No server, no account, nothing stored.
   ========================================================================== */

  utAtrLen: 10,

  // Target Trend [BigBeluga]. Trend flips on a close through SMA(high)+band or

const SRC = ["binance", "bybit", "okx"];
/* Everything from one second to one week.
   Coverage is not uniform and pretending otherwise would just produce silent
   failures: 1s candles exist only on Binance's SPOT feed (futures starts at
   1m), Bybit has no seconds and no 3-day, OKX names things differently. Each

const TFMAP = {

           "1h":"1h","2h":"2h","4h":"4h","6h":"6h","8h":"8h","12h":"12h",

/* =========================================================================
   ONE ENGINE.

   There used to be an Automatic mode and a Manual mode, and you had to pick.
   That was a hedge on my part, and it cost more than it bought: the same
   number was settable from two places, so nobody could tell what was actually

let TICK = {};               // last full ticker snapshot, by symbol

/* Signal tracking starts the moment you open the app. Anything the strategy
   would have fired before that is history and is deliberately ignored, so the
   numbers on Results are things you could actually have taken. */
const SKEY = "signals.session.v2";
const SESSION = {startedAt: Date.now(), scans: 0};
let ARCHIVE = new Map();
const sigKey = s => s.symbol + "|" + s.at + "|" + s.side + "|" + (s.strat||"");

function loadSession() {
  try {
    const o = JSON.parse(localStorage.getItem(SKEY) || "null");
    if (!o || !o.startedAt) return;
    SESSION.startedAt = o.startedAt;
    SESSION.scans = o.scans || 0;
    for (const s of (o.archive || [])) ARCHIVE.set(sigKey(s), s);
  } catch (e) { /* private mode, or no storage - carry on in memory */ }
}
function saveSession() {
  try {
    const archive = [...ARCHIVE.values()]
      .sort((a,b)=>(b.closedAt||0)-(a.closedAt||0)).slice(0, 250);
    localStorage.setItem(SKEY, JSON.stringify(
      {startedAt: SESSION.startedAt, scans: SESSION.scans, archive}));
  } catch (e) { /* nothing to do */ }
}
function resetSession() {
  SESSION.startedAt = Date.now(); SESSION.scans = 0;
  ARCHIVE.clear(); HELD.clear(); BOOK.clear(); saveBook();
  OPEN = []; CLOSED = []; FEED = [];
  saveSession();
  toast("Reset — tracking from right now");
  render(true);
  refresh();
}

/* The chosen pairs live in the URL, not in storage - so a reload keeps them,
   the home-screen icon remembers them, and you can send someone your setup. */
function readHash() {
  // Your settings first, from this device. The address bar is for sharing a
  // setup and for carrying it to another phone; it should not be the only
  // copy. Opening the plain address — from a bookmark, a home-screen icon,
  // or anything that drops the part after the # — used to hand you factory
  // defaults and a list full of coins you never chose.
  restoreCfg();
  const h = location.hash || "";
  // A packed setup carries everything, so it wins outright over the short keys.
  const packed = /[#&]cfg=([A-Za-z0-9\-_]+)/.exec(h);
  if (packed && importPacked(packed[1])) return;
  const p = /[#&]p=([^&]*)/.exec(h);
  if (p) {
    const list = decodeURIComponent(p[1]).split(",").map(s=>s.trim().toUpperCase())
                   .filter(Boolean).map(s=>s.endsWith("USDT")? s : s+"USDT");
    if (list.length) { CFG.custom = list; CFG.pairMode = "custom"; }
  }
  // Your own coins. Without this they were chosen, used for one session, and
  // silently lost on the next reload — which is worse than not offering the
  // choice at all.
  const f = /[#&]f=([^&]*)/.exec(h);
  if (f) {
    const list = decodeURIComponent(f[1]).split(",").map(x=>x.trim().toUpperCase())
                   .filter(Boolean).map(x=>x.endsWith("USDT")? x : x+"USDT");
    if (list.length) CFG.focus = list;
  }
  const s = /[#&]s=(occ|confluence|sr|ut|tt|auto|pat|brk|rsi|mr|mom)/.exec(h);
  if (s) CFG.strategy = s[1];
  const m = /[#&]m=(spot|futures)/.exec(h);
  if (m) CFG.market = m[1];
  const x = /[#&]h=(scalp|fast|medium|long)/.exec(h);
  if (x && HORIZONS[x[1]]) {
    const q = HORIZONS[x[1]];
    CFG.horizon = x[1];
    CFG.signalTf = q.signalTf; CFG.trendTf = q.trendTf;
    CFG.slAtr = q.slAtr; CFG.tpAtr = q.tpAtr.slice();
    CFG.cooldownBars = q.cooldownBars;
  }
  const t = /[#&]tf=([0-9]+[smhdwM])/.exec(h);     // explicit tf wins
  if (t) CFG.signalTf = t[1];
}
function writeHash() {
  const bits = [];
  if (CFG.pairMode === "custom" && CFG.custom.length)
    bits.push("p=" + CFG.custom.map(s=>s.replace("USDT","")).join(","));
  if (CFG.focus.length) bits.push("f=" + CFG.focus.map(x=>x.replace("USDT","")).join(","));
  if (CFG.strategy !== "confluence") bits.push("s=" + CFG.strategy);
  if (CFG.market !== "futures") bits.push("m=" + CFG.market);
  if (CFG.horizon !== "medium") bits.push("h=" + CFG.horizon);
  else if (CFG.signalTf !== "1h") bits.push("tf=" + CFG.signalTf);
  const h = bits.length ? "#" + bits.join("&") : "";
  history.replaceState(null, "", location.pathname + location.search + h);
}

/* ----------------------------------------------------------------- fetching */
async function getJSON(url, ms = 15000) {
  // Timeout by racing a timer rather than with AbortController.
  //
  // Some embedded viewers (in-app previews, webview wrappers) proxy fetch over
  // postMessage, and an AbortSignal cannot be structured-cloned across that
  // bridge - the request then dies with "AbortSignal object could not be
  // cloned" and every source looks blocked. Racing a timer needs no options
  // object at all, so it survives those environments. The request itself is
  // not cancelled, only ignored, which costs nothing here.
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error("timed out after " + (ms / 1000) + "s")), ms);
  });
  try {
    const r = await Promise.race([fetch(url), timeout]);
    if (!r || !r.ok) throw new Error("HTTP " + (r ? r.status : "no response"));
    return await Promise.race([r.json(), timeout]);
  } finally {
    clearTimeout(timer);
  }
}

const okxSym = s => s.replace("USDT", "") + "-USDT-SWAP";

async function klinesFrom(src, symbol, tf, limit) {
  if (!TFMAP[src] || !TFMAP[src][tf]) throw new Error(src + " has no " + tf + " candles");
  if (src === "binance") {
    // Second candles only exist on the spot API.
    const host = SECONDS_TF.has(tf)
      ? `https://api.binance.com/api/v3/klines?symbol=${symbol}`
      : `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}`;
    const d = await getJSON(`${host}&interval=${TFMAP.binance[tf]}&limit=${limit}`);
    return d.map(k => ({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
  }
  if (src === "bybit") {
    const d = await getJSON(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${TFMAP.bybit[tf]}&limit=${Math.min(limit,1000)}`);
    return d.result.list.map(k => ({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]})).reverse();
  }
  const d = await getJSON(`https://www.okx.com/api/v5/market/candles?instId=${okxSym(symbol)}&bar=${TFMAP.okx[tf]}&limit=${Math.min(limit,300)}`);
  return d.data.map(k => ({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]})).reverse();
}

async function klines(symbol, tf, limit) {
  const key = symbol + ":" + tf;
  if (CACHE.has(key)) return CACHE.get(key);
  const order = SOURCE ? [SOURCE, ...SRC.filter(s => s !== SOURCE)] : SRC;
  let lastErr;
  for (const src of order) {
    try {
      const rows = await klinesFrom(src, symbol, tf, limit);
      if (rows.length > 60) { SOURCE = src; CACHE.set(key, rows); return rows; }
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("no data");
}

async function tickers() {
  const order = SOURCE ? [SOURCE, ...SRC.filter(s => s !== SOURCE)] : SRC;
  for (const src of order) {
    try {
      if (src === "binance") {
        const d = await getJSON("https://fapi.binance.com/fapi/v1/ticker/24hr");
        return d.filter(x => x.symbol.endsWith("USDT")).map(x => {
          const lo = +x.lowPrice, hi = +x.highPrice;
          return {symbol:x.symbol, price:+x.lastPrice, change:+x.priceChangePercent,
                  vol:+x.quoteVolume,
                  // how far it travelled in the day, not where it ended up
                  range: lo > 0 ? (hi - lo) / lo * 100 : Math.abs(+x.priceChangePercent)};
        });
      }
      if (src === "bybit") {
        const d = await getJSON("https://api.bybit.com/v5/market/tickers?category=linear");
        return d.result.list.filter(x => x.symbol.endsWith("USDT")).map(x => {

                  vol:+x.turnover24h,
                  range: lo > 0 ? (hi - lo) / lo * 100 : Math.abs(+x.price24hPcnt*100)};
        });

      return d.data.filter(x => x.instId.endsWith("-USDT-SWAP")).map(x => {

                change:(last-op)/op*100, vol:+x.volCcy24h*last,

      });

/* Price-only feed. Much smaller than the 24h ticker, so it can run every few
   seconds without hammering anything. */
async function livePrices() {

/* Patch the numbers already on screen instead of re-rendering the page - the
   list keeps its scroll position and open cards stay open. */
async function tickLive() {
  if (BUSY || document.visibilityState !== "visible") return;
  if (TAB !== "home" && TAB !== "open" && TAB !== "closed") return;
  let rows;
  try { rows = await livePrices(); } catch (e) { return; }
  if (!rows.length) return;
  for (const r of rows) if (r.price > 0) LIVE.set(r.symbol, r.price);

  for (const sig of OPEN) {
    const px = LIVE.get(sig.symbol);
    if (!(px > 0)) continue;
    if (Math.abs(px - sig.entry)/sig.entry > 0.5) continue;   // clearly a mismatch
    sig.price = round(px, sig.entry);
    sig.roi = +(((sig.price - sig.entry)/sig.entry)*100
              * (sig.side === "LONG" ? 1 : -1) * sig.leverage).toFixed(2);
  }
  for (const m of MARKET.majors) {
    const px = LIVE.get(m.symbol);
    if (px > 0) m.price = px;
  }

  document.querySelectorAll("[data-px]").forEach(el => {
    const px = LIVE.get(el.dataset.px);
    if (!(px > 0)) return;
    const next = fmt(px);
    if (el.textContent === next) return;
    const upTick = px > (+el.dataset.last || px);
    el.dataset.last = px;
    el.textContent = next;
    el.classList.remove("tick-up","tick-dn");
    void el.offsetWidth;                       // restart the flash
    el.classList.add(upTick ? "tick-up" : "tick-dn");
  });
  document.querySelectorAll("[data-roi]").forEach(el => {
    const sig = OPEN.find(s => s.symbol === el.dataset.roi);
    if (!sig) return;
    el.textContent = sgn(sig.roi);
    el.className = el.className.replace(/\b(up|down)\b/g, "") + " " + cls(sig.roi);
  });
  const tot = document.getElementById("livepnl");
  if (tot) tot.innerHTML = openPnlHtml();
}

function startLive() {
  clearInterval(LIVET);
  LIVET = setInterval(tickLive, 6000);
}

/* --------------------------------------------------------------- indicators */
function ema(v, p) { const k=2/(p+1), o=[]; let e=v[0];
  for (let i=0;i<v.length;i++){ e = i? v[i]*k + e*(1-k) : v[0]; o.push(e); } return o; }
function wilder(v, p) { const o=[]; let e=v[0];
  for (let i=0;i<v.length;i++){ e = i? e + (v[i]-e)/p : v[0]; o.push(e); } return o; }
function sma(v, p) { const o=[]; let s=0;
  for (let i=0;i<v.length;i++){ s+=v[i]; if(i>=p) s-=v[i-p]; o.push(i>=p-1? s/p : NaN);} return o; }

function rsi(close, p) {
  const g=[0], l=[0];
  for (let i=1;i<close.length;i++){ const d=close[i]-close[i-1];
    g.push(d>0?d:0); l.push(d<0?-d:0); }
  const ag=wilder(g,p), al=wilder(l,p);
  return close.map((_,i)=> al[i]===0 ? 100 : 100 - 100/(1 + ag[i]/al[i]));
}
function macd(close, f, s, sg) {
  const ef=ema(close,f), es=ema(close,s);
  const line=close.map((_,i)=>ef[i]-es[i]);
  const sig=ema(line,sg);
  return {line, sig, hist: line.map((v,i)=>v-sig[i])};
}
function trueRange(c) {
  return c.map((x,i)=> i? Math.max(x.h-x.l, Math.abs(x.h-c[i-1].c), Math.abs(x.l-c[i-1].c))
                        : x.h-x.l);
}
function atr(c, p) { return wilder(trueRange(c), p); }
function adx(c, p) {
  const pdm=[0], mdm=[0];
  for (let i=1;i<c.length;i++){
    const up=c[i].h-c[i-1].h, dn=c[i-1].l-c[i].l;
    pdm.push(up>dn && up>0 ? up : 0);
    mdm.push(dn>up && dn>0 ? dn : 0);
  }
  const tr=wilder(trueRange(c),p), sp=wilder(pdm,p), sm=wilder(mdm,p);
  const dx=c.map((_,i)=>{
    if(!tr[i]) return 0;
    const pd=100*sp[i]/tr[i], md=100*sm[i]/tr[i];
    return (pd+md)? Math.abs(pd-md)/(pd+md)*100 : 0;
  });
  return wilder(dx,p);
}

/* ------------------------------------------------------- MA variants (OCC)
   Direct port of the variant() function in the Pine script, same formulas and
   the same warm-up behaviour, so the crossovers line up with TradingView.   */
function wma(v, len) {
  const o = new Array(v.length).fill(NaN);
  const denom = len*(len+1)/2;
  for (let i = len-1; i < v.length; i++) {
    let s = 0;
    for (let k = 0; k < len; k++) s += v[i-k] * (len-k);
    o[i] = s/denom;
  }
  return o;
}
function smaArr(v, len) {
  // Windowed rather than cumulative: TMA feeds one SMA into another, and a
  // running total would carry the first pass's NaN warm-up forever.
  const o = new Array(v.length).fill(NaN);
  for (let i = len-1; i < v.length; i++) {
    let s = 0, ok = true;
    for (let k = 0; k < len; k++) {
      const x = v[i-k];
      if (!isFinite(x)) { ok = false; break; }
      s += x;
    }
    if (ok) o[i] = s/len;
  }
  return o;
}
function emaArr(v, len) {
  const k = 2/(len+1), o = [];
  let e = v[0];
  for (let i = 0; i < v.length; i++) { e = i ? v[i]*k + e*(1-k) : v[0]; o.push(e); }
  return o;
}
function linreg(v, len, off) {
  const o = new Array(v.length).fill(NaN);
  const n = len, sx = n*(n-1)/2, sxx = (n-1)*n*(2*n-1)/6;
  const den = n*sxx - sx*sx;
  for (let i = len-1; i < v.length; i++) {
    let sy = 0, sxy = 0;
    for (let k = 0; k < n; k++) { const y = v[i-n+1+k]; sy += y; sxy += k*y; }
    const b = (n*sxy - sx*sy)/den, a = (sy - b*sx)/n;
    o[i] = a + b*(n-1-off);
  }
  return o;
}
function alma(v, len, offset, sigma) {
  const o = new Array(v.length).fill(NaN);
  const m = offset*(len-1), s = len/sigma;
  const w = [];
  let norm = 0;
  for (let i = 0; i < len; i++) {
    const x = Math.exp(-((i-m)*(i-m))/(2*s*s));
    w.push(x); norm += x;
  }
  for (let i = len-1; i < v.length; i++) {
    let sum = 0;
    for (let k = 0; k < len; k++) sum += v[i-(len-1)+k]*w[k];
    o[i] = sum/norm;
  }
  return o;
}
function variant(type, src, len, offSig, offAlma, vol) {
  switch (type) {
    case "EMA":  return emaArr(src, len);
    case "DEMA": { const v2=emaArr(src,len); const e=emaArr(v2,len);
                   return v2.map((x,i)=>2*x-e[i]); }
    case "TEMA": { const v2=emaArr(src,len), e1=emaArr(v2,len), e2=emaArr(e1,len);
                   return v2.map((x,i)=>3*(x-e1[i])+e2[i]); }
    case "WMA":  return wma(src, len);
    case "VWMA": { const pv=src.map((x,i)=>x*vol[i]);
                   const a=smaArr(pv,len), b=smaArr(vol,len);
                   return a.map((x,i)=>x/b[i]); }
    case "SMMA": { const base=smaArr(src,len), o=new Array(src.length).fill(NaN);
                   for (let i=0;i<src.length;i++)
                     o[i] = isNaN(o[i-1]) ? base[i] : (o[i-1]*(len-1)+src[i])/len;
                   return o; }
    case "HullMA": { const half=wma(src,Math.max(1,Math.round(len/2)));
                     const full=wma(src,len);
                     const raw=half.map((x,i)=>2*x-full[i]);
                     return wma(raw, Math.max(1,Math.round(Math.sqrt(len)))); }
    case "LSMA": return linreg(src, len, offSig);
    case "ALMA": return alma(src, len, offAlma, offSig);
    case "TMA":  return smaArr(smaArr(src,len), len);
    case "SSMA": { // Ehlers SuperSmoother
      const a1=Math.exp(-1.414*Math.PI/len);
      const b1=2*a1*Math.cos(1.414*Math.PI/len);
      const c2=b1, c3=-a1*a1, c1=1-c2-c3;
      const o=new Array(src.length).fill(0);
      for (let i=0;i<src.length;i++) {
        const prev = i? src[i-1] : src[i];
        o[i] = c1*(src[i]+prev)/2 + c2*(i>0?o[i-1]:0) + c3*(i>1?o[i-2]:0);
      }
      return o; }
    default: return smaArr(src, len);
  }
}

/* Group base candles into higher-timeframe candles (the script's "Multiplier
   for Alternate Resolution"). Only complete groups are produced, which is what
   keeps this non-repainting. */
function aggregate(c, n) {
  if (n <= 1) return c.slice();
  const out = [];
  for (let i = 0; i + n <= c.length; i += n) {
    const g = c.slice(i, i+n);
    out.push({
      t: g[0].t, o: g[0].o, c: g[n-1].c,
      h: Math.max(...g.map(x=>x.h)), l: Math.min(...g.map(x=>x.l)),
      v: g.reduce((a,x)=>a+x.v, 0),
      endIdx: i+n-1,                 // index of the base candle it closes on
    });
  }
  return out;
}

/* ==========================================================================
   Indicator pack. Native ports of the tools people usually stack on a
   TradingView chart. Each one takes candles and returns plain arrays or a
   list of boxes, so the chart can draw them and a strategy could read them.
   ========================================================================== */

/* Supertrend — ATR bands that trail price and flip when it closes through. */
function supertrend(c, p, mult) {
  const a = atr(c, p), up = [], dn = [], dir = [];
  let pUp = 0, pDn = 0, pDir = 1;
  for (let i = 0; i < c.length; i++) {
    const hl2 = (c[i].h + c[i].l)/2;
    let u = hl2 + mult*a[i], d = hl2 - mult*a[i];
    if (i) {
      u = (u < pUp || c[i-1].c > pUp) ? u : pUp;
      d = (d > pDn || c[i-1].c < pDn) ? d : pDn;
    }
    let dr = pDir;
    if (i) {
      if (pDir === -1 && c[i].c > pUp) dr = 1;
      else if (pDir === 1 && c[i].c < pDn) dr = -1;
    }
    up.push(u); dn.push(d); dir.push(dr);
    pUp = u; pDn = d; pDir = dr;
  }
  return {up, dn, dir, line: dir.map((x,i)=> x === 1 ? dn[i] : up[i])};
}

/* UT Bot — an ATR trailing stop; a close through it is the signal. */
function utBot(c, key, per) {
  const a = atr(c, per), stop = [], sig = [];
  for (let i = 0; i < c.length; i++) {
    const n = key*a[i], src = c[i].c;
    let s;
    if (!i) s = src - n;
    else {
      const p = stop[i-1], pc = c[i-1].c;
      if (src > p && pc > p) s = Math.max(p, src-n);
      else if (src < p && pc < p) s = Math.min(p, src+n);
      else s = src > p ? src-n : src+n;
    }
    stop.push(s);
    if (i) {
      const pc = c[i-1].c, p = stop[i-1];
      if (pc <= p && src > s) sig.push({i, side:"LONG", p:s});
      else if (pc >= p && src < s) sig.push({i, side:"SHORT", p:s});
    }
  }
  return {stop, sig};
}

/* Parabolic SAR. */
function psar(c, step, max) {
  const out = new Array(c.length).fill(NaN);
  if (c.length < 4) return out;
  let bull = c[1].c >= c[0].c;
  let sar = bull ? c[0].l : c[0].h;
  let ep = bull ? c[1].h : c[1].l, af = step;
  for (let i = 2; i < c.length; i++) {
    sar = sar + af*(ep - sar);
    if (bull) {
      sar = Math.min(sar, c[i-1].l, c[i-2].l);
      if (c[i].l < sar) { bull = false; sar = ep; ep = c[i].l; af = step; }
      else if (c[i].h > ep) { ep = c[i].h; af = Math.min(max, af+step); }
    } else {
      sar = Math.max(sar, c[i-1].h, c[i-2].h);
      if (c[i].h > sar) { bull = true; sar = ep; ep = c[i].h; af = step; }
      else if (c[i].l < ep) { ep = c[i].l; af = Math.min(max, af+step); }
    }
    out[i] = sar;
  }
  return out;
}

/* Linear regression channel over a window, with standard-deviation rails. */
function regChannel(rows, start, end, k) {
  const n = end - start;
  if (n < 12) return null;
  let sx=0, sy=0, sxx=0, sxy=0;
  for (let i = 0; i < n; i++) {
    const y = rows[start+i].c; sx += i; sy += y; sxx += i*i; sxy += i*y;
  }
  const den = n*sxx - sx*sx;
  if (!den) return null;
  const b = (n*sxy - sx*sy)/den, a = (sy - b*sx)/n;
  let ss = 0;
  for (let i = 0; i < n; i++) { const d = rows[start+i].c - (a + b*i); ss += d*d; }
  return {a, b, sd: Math.sqrt(ss/n)*k, start, n};
}

/* Fair value gaps / liquidity voids — a three-candle imbalance. */
function fvgs(rows, maxKeep) {
  const out = [];
  for (let i = 2; i < rows.length; i++) {
    if (rows[i].l > rows[i-2].h)
      out.push({i, lo:rows[i-2].h, hi:rows[i].l, side:"bull"});
    else if (rows[i].h < rows[i-2].l)
      out.push({i, lo:rows[i].h, hi:rows[i-2].l, side:"bear"});
  }
  for (const g of out) {
    g.filled = false;
    for (let k = g.i+1; k < rows.length; k++) {
      if (g.side === "bull" ? rows[k].l <= g.lo : rows[k].h >= g.hi) {
        g.filled = true; g.fillIdx = k; break;
      }
    }
  }
  return out.slice(-(maxKeep || 40));
}

/* Order blocks — the last opposing candle before an impulsive move. */
function orderBlocks(rows, a, maxKeep) {
  const out = [];
  for (let i = 3; i < rows.length-1; i++) {
    const move = rows[i].c - rows[i].o;
    if (Math.abs(move) < 1.3*a[i]) continue;
    for (let k = i-1; k >= Math.max(0, i-4); k--) {
      const d = rows[k].c - rows[k].o;
      if (move > 0 && d < 0) { out.push({i:k, from:i, lo:rows[k].l, hi:rows[k].h, side:"bull"}); break; }
      if (move < 0 && d > 0) { out.push({i:k, from:i, lo:rows[k].l, hi:rows[k].h, side:"bear"}); break; }
    }
  }
  for (const b of out) {
    b.mit = false;
    for (let k = b.from+1; k < rows.length; k++) {
      if (b.side === "bull" ? rows[k].l <= b.lo : rows[k].h >= b.hi) {
        b.mit = true; b.mitIdx = k; break;
      }
    }
  }
  return out.slice(-(maxKeep || 30));
}

/* Liquidity sweeps — a wick takes out a prior swing then closes back inside. */
function sweeps(rows, pvs, maxKeep) {
  const out = [];
  for (const p of pvs) {
    for (let k = p.i+3; k < rows.length; k++) {
      const b = rows[k];
      if (p.type === "H" && b.h > p.price && b.c < p.price) {
        out.push({i:k, price:p.price, side:"bear"}); break;
      }
      if (p.type === "L" && b.l < p.price && b.c > p.price) {
        out.push({i:k, price:p.price, side:"bull"}); break;
      }
      if (p.type === "H" && b.c > p.price) break;    // properly broken, not swept
      if (p.type === "L" && b.c < p.price) break;
    }
  }
  return out.slice(-(maxKeep || 20));
}

/* Volume profile over a window: volume per price bucket, POC and value area. */
function volProfile(rows, start, end, buckets) {
  let hi = -Infinity, lo = Infinity;
  for (let i = start; i < end; i++) { hi = Math.max(hi, rows[i].h); lo = Math.min(lo, rows[i].l); }
  if (!(hi > lo)) return null;
  const step = (hi-lo)/buckets, bins = new Array(buckets).fill(0);
  for (let i = start; i < end; i++) {
    const b = rows[i];
    const a = Math.max(0, Math.floor((b.l-lo)/step));
    const z = Math.min(buckets-1, Math.floor((b.h-lo)/step));
    const share = b.v/Math.max(1, z-a+1);
    for (let k = a; k <= z; k++) bins[k] += share;
  }
  const total = bins.reduce((x,y)=>x+y, 0);
  let poc = 0;
  bins.forEach((v,i)=>{ if (v > bins[poc]) poc = i; });
  // Value area: grow out from the POC until 70% of volume is inside.
  let lo_i = poc, hi_i = poc, acc = bins[poc];
  while (acc < total*0.7 && (lo_i > 0 || hi_i < buckets-1)) {
    const below = lo_i > 0 ? bins[lo_i-1] : -1;
    const above = hi_i < buckets-1 ? bins[hi_i+1] : -1;
    if (above >= below) { hi_i++; acc += bins[hi_i]; } else { lo_i--; acc += bins[lo_i]; }
  }
  return {bins, lo, hi, step, max: Math.max(...bins),
          poc: lo + (poc+0.5)*step,
          vaLo: lo + lo_i*step, vaHi: lo + (hi_i+1)*step};
}

/* The most recent meaningful swing, for auto Fibonacci. */
function autoSwing(rows, start, end) {
  let hi = -Infinity, lo = Infinity, hiI = start, loI = start;
  for (let i = start; i < end; i++) {
    if (rows[i].h > hi) { hi = rows[i].h; hiI = i; }
    if (rows[i].l < lo) { lo = rows[i].l; loI = i; }
  }
  if (!(hi > lo)) return null;
  // Direction: whichever extreme came last is the end of the leg.
  const up = hiI > loI;
  return {from: up ? lo : hi, to: up ? hi : lo, up,
          fromI: up ? loI : hiI, toI: up ? hiI : loI, hi, lo};
}
const FIBS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.272, 1.618];

/* Donchian range, for the range-breakout view. */
function donchian(rows, n) {
  const hi = [], lo = [];
  for (let i = 0; i < rows.length; i++) {
    const s = Math.max(0, i-n+1);
    let h = -Infinity, l = Infinity;
    for (let k = s; k <= i; k++) { h = Math.max(h, rows[k].h); l = Math.min(l, rows[k].l); }
    hi.push(h); lo.push(l);
  }
  return {hi, lo};
}

function enrich(c) {
  const close=c.map(x=>x.c), vol=c.map(x=>x.v);
  const m=macd(close,12,26,9), a=atr(c,14);
  return {c, close,
    ef:ema(close,21), em:ema(close,50), es:ema(close,200),
    rsi:rsi(close,14), macd:m.line, msig:m.sig, mhist:m.hist,
    atr:a, atrPct:a.map((v,i)=>v/close[i]*100), adx:adx(c,14),
    volMa:sma(vol,20), vol};
}

/* ----------------------------------------------------------------- strategy */
function score(d, i, side) {
  const p=i-1, why=[]; let pts=0;
  const long = side === "LONG";
  const add=(ok,txt)=>{ if(ok){pts++; why.push(txt);} };
  add(long ? d.ef[i]>d.em[i] : d.ef[i]<d.em[i], long?"EMA21 > EMA50":"EMA21 < EMA50");
  add(long ? d.em[i]>d.es[i] : d.em[i]<d.es[i],
      long?"EMA50 > EMA200 (bull regime)":"EMA50 < EMA200 (bear regime)");
  add(long ? d.close[i]>d.ef[i] : d.close[i]<d.ef[i],
      long?"price above EMA21":"price below EMA21");
  const band = long ? CFG.rsiLong : CFG.rsiShort;
  const rOk = d.rsi[i]>=band[0] && d.rsi[i]<=band[1] &&
              (long ? d.rsi[i]>d.rsi[p] : d.rsi[i]<d.rsi[p]);
  add(rOk, "RSI " + d.rsi[i].toFixed(0) + (long?" rising in band":" falling in band"));
  add(long ? (d.mhist[i]>0 && d.mhist[i]>d.mhist[p])
           : (d.mhist[i]<0 && d.mhist[i]<d.mhist[p]),
      "MACD histogram expanding");
  add(long ? d.macd[i]>d.msig[i] : d.macd[i]<d.msig[i],
      long?"MACD above signal":"MACD below signal");
  add(d.adx[i] >= CFG.adxMin, "ADX " + d.adx[i].toFixed(0) + " (trending)");
  add(d.volMa[i] && d.vol[i] > d.volMa[i]*CFG.volMult, "volume above average");
  return {pts, why};
}

function htfBias(h, ts) {
  let i = -1;
  for (let k=0;k<h.c.length;k++){ if (h.c[k].t <= ts) i=k; else break; }
  if (i < 60) return "NONE";
  if (h.close[i] > h.em[i] && h.ef[i] > h.em[i]) return "LONG";
  if (h.close[i] < h.em[i] && h.ef[i] < h.em[i]) return "SHORT";
  return "NEUTRAL";
}

const round = (v, ref) => ref>=1000? +v.toFixed(2) : ref>=100? +v.toFixed(3)
  : ref>=1? +v.toFixed(4) : ref>=0.01? +v.toFixed(6) : +v.toFixed(8);

/* Shared risk model: given a direction and a bar, place the stop and the five
   targets off ATR and derive the leverage. Used by both strategies. */
function buildSignal(sym, d, i, side, tag, reasons, stopPx, unitPx, mults) {
  const spot = CFG.market === "spot";
  if (spot && side === "SHORT") return null;   // you can't short on spot
  const entry=d.close[i], a=d.atr[i], aPct=d.atrPct[i];
  if (!(a>0) || aPct<CFG.atrMinPct || aPct>CFG.atrMaxPct) return null;
  const best = {pts: null, why: reasons};

  const sign = side==="LONG"? 1 : -1;
  // A strategy can place its own stop (S&R puts it beyond the zone); otherwise
  // it comes off ATR. Everything downstream - leverage, risk, targets - follows.
  const stop = (stopPx != null && (side==="LONG" ? stopPx < entry : stopPx > entry))
    ? stopPx : entry - sign*CFG.slAtr*a;
  const slPct = Math.abs(entry-stop)/entry*100;
  // Spot has no leverage, so every percentage on the card is the real move.
  const lev = spot ? 1
    : (Math.max(CFG.minLev, Math.min(CFG.maxLev,
        Math.floor(CFG.maxLossPct/slPct))) || CFG.minLev);
  const risk = spot
    ? (aPct >= 4 ? "high" : aPct < 2 ? "low" : "medium")
    : ((lev>=20 || aPct>=4) ? "high" : (lev<=10 && aPct<2) ? "low" : "medium");

  return {
    symbol:sym, side, leverage:lev, risk, score:best.pts, reasons:best.why,
    tag, spot, horizon: CFG.horizon,
    entry:round(entry,entry), stop:round(stop,entry), initialStop:round(stop,entry),
    atrPct:+aPct.toFixed(2), at:d.c[i].t, idx:i,
    // A strategy may set its own target spacing and its own unit of distance
    // (Target Trend measures in its band, not in ATR).
    targets: (mults || CFG.tpAtr).map((m,k)=>{
      const tp = entry + sign*m*(unitPx != null && unitPx > 0 ? unitPx : a);
      return {index:k+1, price:round(tp,entry),
              roi:+(Math.abs(tp-entry)/entry*100*lev).toFixed(2), hit:false};
    }),
    status:"in_progress", hits:0, be:false, price:round(entry,entry), roi:0,
    closedAt:null, exitIdx:null,
    strat: CFG.strategy, stf: CFG.signalTf,
  };
}

/* Strategy 1: the 8-point confluence score. */
/* A candidate that missed the confluence threshold, kept for the floor. */
function nearMissSignal(sym, d, i) {
  const L = score(d,i,"LONG"), S = score(d,i,"SHORT");
  const side = L.pts >= S.pts ? "LONG" : "SHORT";
  const best = side === "LONG" ? L : S;
  if (best.pts < CFG.minScore - 2 || best.pts >= CFG.minScore) return null;
  const sig = buildSignal(sym, d, i, side, `${best.pts}/8`, best.why);
  if (sig) { sig.score = best.pts; sig.belowBar = best.pts + "/8"; }
  return sig;
}

function makeSignal(sym, d, i) {
  const L=score(d,i,"LONG"), S=score(d,i,"SHORT");
  const side = L.pts>=S.pts ? "LONG":"SHORT";
  const best = side==="LONG"? L : S;
  if (best.pts < CFG.minScore) return null;
  const sig = buildSignal(sym, d, i, side, best.pts+"/8", best.why);
  if (sig) sig.score = best.pts;
  return sig;
}

/* ---------------------------------------------------- support & resistance
   A swing high with `L` lower highs either side of it is a pivot, and the
   same in reverse for lows. Pivots that sit at similar prices are clustered
   into a zone; the more pivots in a zone the more the market has respected
   that price. A pivot at bar p is only *knowable* at bar p+L, which is what
   `conf` records — the backtest never uses a zone before it existed. */
function pivots(c, L) {
  const out = [];
  for (let i = L; i < c.length - L; i++) {
    let isH = true, isL = true;
    for (let k = i-L; k <= i+L; k++) {
      if (k === i) continue;
      if (c[k].h >= c[i].h) isH = false;
      if (c[k].l <= c[i].l) isL = false;
      if (!isH && !isL) break;
    }
    if (isH) out.push({i, conf:i+L, price:c[i].h, type:"H", t:c[i].t});
    if (isL) out.push({i, conf:i+L, price:c[i].l, type:"L", t:c[i].t});
  }
  return out;
}

function srZones(pvs, width, nowIdx) {
  if (!pvs.length || !(width > 0)) return [];
  const sorted = pvs.slice().sort((a,b)=>a.price-b.price);
  const zones = [];
  let cur = null;
  for (const p of sorted) {
    if (cur && p.price - cur.lo <= width) {
      cur.hi = Math.max(cur.hi, p.price); cur.pts.push(p);
    } else { cur = {lo:p.price, hi:p.price, pts:[p]}; zones.push(cur); }
  }
  for (const z of zones) {
    z.mid = (z.lo + z.hi)/2;
    z.touches = z.pts.length;
    z.highs = z.pts.filter(p=>p.type==="H").length;
    z.lows  = z.touches - z.highs;
    z.lastIdx = Math.max(...z.pts.map(p=>p.i));
    z.lastT   = Math.max(...z.pts.map(p=>p.t));
    z.kind = z.highs && z.lows ? "flip" : z.highs ? "resistance" : "support";
    // Recent zones matter more than ancient ones.
    const age = nowIdx - z.lastIdx;
    z.strength = +(z.touches + Math.max(0, 1 - age/400)).toFixed(2);
  }
  return zones;
}

/* Zones as they stood at the newest closed bar - what the chart draws. */
function srZonesNow(d, atIdx) {
  const i = atIdx == null ? d.c.length-2 : atIdx;
  const pvs = pivots(d.c, CFG.srPivot)
    .filter(p => p.conf <= i && i - p.i <= CFG.srMaxAge);
  const w = CFG.srZoneAtr * (d.atr[i] || 0);
  return srZones(pvs, w, i)
    .filter(z => z.touches >= CFG.srMinTouch)
    .sort((a,b)=>b.strength-a.strength);
}

/* Walk the candles forward and record every entry the S&R rules would give.
   Zones are rebuilt from only the pivots confirmed so far, every few bars. */
function srScan(d) {
  const L = CFG.srPivot, pvs = pivots(d.c, L);
  const mode = CFG.srMode, out = [];
  const avail = [];
  let ptr = 0, zones = [], nextCalc = 0, lastIdx = -999;

  for (let i = 210; i < d.c.length-1; i++) {
    while (ptr < pvs.length && pvs[ptr].conf <= i) avail.push(pvs[ptr++]);
    if (i >= nextCalc) {
      const live = avail.filter(p => i - p.i <= CFG.srMaxAge);
      zones = srZones(live, CFG.srZoneAtr * d.atr[i], i)
                .filter(z => z.touches >= CFG.srMinTouch);
      nextCalc = i + 3;
    }
    if (!zones.length || i - lastIdx < CFG.cooldownBars) continue;

    const b = d.c[i], p = d.c[i-1], a = d.atr[i], brk = CFG.srBreakAtr * a;
    let best = null;
    const take = (side, z, kind) => {
      if (!best || z.strength > best.z.strength) best = {side, z, kind};
    };
    for (const z of zones) {
      if (mode !== "breakout") {
        // Traded into the zone and closed back out of it: a rejection.
        if (z.lows >= z.highs && b.l <= z.hi && b.l >= z.lo - brk
            && b.c > z.hi && p.c > z.lo) take("LONG", z, "bounce");
        if (z.highs >= z.lows && b.h >= z.lo && b.h <= z.hi + brk
            && b.c < z.lo && p.c < z.hi) take("SHORT", z, "bounce");
      }
      if (mode !== "bounce") {
        // Closed decisively through a level it was on the other side of.
        if (p.c <= z.hi && b.c > z.hi + brk) take("LONG", z, "breakout");
        if (p.c >= z.lo && b.c < z.lo - brk) take("SHORT", z, "breakout");
      }
    }
    if (best) { out.push({idx:i, ...best}); lastIdx = i; }
  }
  return out;
}

/* Where the stop goes for an S&R trade: just the far side of the zone. */
function srStop(side, z, kind, a) {
  const pad = 0.3 * a;
  if (side === "LONG")  return (kind === "bounce" ? z.lo : z.lo) - pad;
  return (kind === "bounce" ? z.hi : z.hi) + pad;
}

function srSignal(sym, d, hit) {
  const {idx:i, side, z, kind} = hit;
  const a = d.atr[i];
  let stopPx = null;
  if (CFG.srZoneStop && a > 0) {
    const s = srStop(side, z, kind, a);
    const dist = Math.abs(d.close[i] - s);
    // Fall back to the ATR stop if the zone puts it absurdly near or far.
    if (dist > 0.3*a && dist < 3.5*a) stopPx = s;
  }
  const lvl = round(z.mid, d.close[i]);
  const why = [
    kind === "bounce"
      ? `${side==="LONG"?"Bounce off support":"Rejected at resistance"} ${lvl}`
      : `${side==="LONG"?"Broke above resistance":"Broke below support"} ${lvl}`,
    `${z.touches} touches since ${new Date(z.pts[0].t)
       .toLocaleDateString(undefined,{day:"numeric",month:"short"})}`,
    stopPx != null ? "stop placed beyond the zone" : "ATR stop",
  ];
  const tag = (kind === "bounce" ? "S&R bounce" : "S&R break")
            + " ×" + z.touches;
  const sig = buildSignal(sym, d, i, side, tag, why, stopPx);
  if (sig) { sig.zone = {lo:z.lo, hi:z.hi, touches:z.touches, kind:z.kind}; }
  return sig;
}

/* =========================================================================
   CHART PATTERNS

   The shapes every chart-reading course teaches, found by rule instead of by
   eye: wedges, flags, pennants, triangles, rectangles, double tops and
   bottoms, head and shoulders both ways, cup and handle.

   Two things make this honest rather than decorative:

   * A pattern is built only from *confirmed* pivots. A swing high at bar p is
     not knowable until bar p+L, and `pivots()` records that as `conf`. The
     replay never uses a pivot before the chart could have drawn it, so the
     backtest is not quietly reading the future.

   * A pattern is not a signal until it breaks. The shape alone means nothing —
     what is traded is the close through the line, on the bar it happens.

   Every pattern carries its own measured move (the classic height projection)
   and its own structural stop (the far side of the shape), which is the whole
   reason for using patterns instead of an ATR guess in both directions.
   ========================================================================= */

const PAT_NAMES = {
  dbot:"Double bottom", dtop:"Double top",
  ihs:"Inverted head & shoulders", hs:"Head & shoulders",
  fwedge:"Falling wedge", rwedge:"Rising wedge",
  atri:"Ascending triangle", dtri:"Descending triangle", stri:"Symmetrical triangle",
  rect:"Rectangle", bflag:"Bull flag", sflag:"Bear flag",
  bpen:"Bullish pennant", spen:"Bearish pennant", cup:"Cup and handle",
};

/** Straight line through two pivots, read at any bar index. */
function patLine(a, b) {
  const dx = b.i - a.i;
  if (!dx) return null;
  const m = (b.price - a.price) / dx;
  return { m, at: (x) => a.price + m * (x - a.i) };
}

/** Did this bar close through `lvl`, when the one before it had not? */
function brokeUp(d, i, lvl)   { return d.close[i] > lvl && d.close[i-1] <= lvl; }
function brokeDown(d, i, lvl) { return d.close[i] < lvl && d.close[i-1] >= lvl; }

/* One pattern found at bar i, or null. `hi` and `lo` are the recent confirmed
   pivot highs and lows, oldest first. */
function patAt(d, i, hi, lo) {
  const px = d.close[i], a = d.atr[i];
  if (!(a > 0) || !(px > 0)) return null;
  const tol  = CFG.patTol / 100;               // "the same price, near enough"
  const flat = CFG.patFlat / 100;              // "level, near enough"
  const near = (x, y) => Math.abs(x - y) / ((x + y) / 2) <= tol;
  const minH = CFG.patMinHeight * a;           // ignore shapes too small to trade
  const H = hi.slice(-3), L = lo.slice(-3);
  // A shape three bars wide is not a double bottom, it is two candles. Noise
  // throws up plenty of those, and counting them is how a pattern scanner ends
  // up finding a pattern every time you look.
  const wide = (a1, b1) => Math.abs(b1.i - a1.i) >= CFG.patMinSpan;
  const out = (kind, side, level, stop, height, why) => {
    if (!(height >= minH)) return null;
    // A stop on the wrong side of the entry is not a stop.
    if (side === "LONG" ? !(stop < px) : !(stop > px)) return null;
    return { kind, side, idx: i, level, stop, height,
             why: [PAT_NAMES[kind] + " — broke " + (side === "LONG" ? "up" : "down"),
                   ...why] };
  };

  // ---- double bottom / double top: two equal extremes with a swing between
  if (L.length >= 2 && H.length >= 1) {
    const l1 = L[L.length-2], l2 = L[L.length-1];
    const mid = H.filter((h) => h.i > l1.i && h.i < l2.i).pop();
    if (mid && wide(l1, l2) && near(l1.price, l2.price) && brokeUp(d, i, mid.price)) {
      const base = Math.min(l1.price, l2.price);
      const r = out("dbot", "LONG", mid.price, base - 0.25*a, mid.price - base,
        ["two lows at " + round(base, px) + " held",
         "broke the high between them"]);
      if (r) return r;
    }
  }
  if (H.length >= 2 && L.length >= 1) {
    const h1 = H[H.length-2], h2 = H[H.length-1];
    const mid = L.filter((l) => l.i > h1.i && l.i < h2.i).pop();
    if (mid && wide(h1, h2) && near(h1.price, h2.price) && brokeDown(d, i, mid.price)) {
      const top = Math.max(h1.price, h2.price);
      const r = out("dtop", "SHORT", mid.price, top + 0.25*a, top - mid.price,
        ["two highs at " + round(top, px) + " rejected",
         "broke the low between them"]);
      if (r) return r;
    }
  }

  // ---- head and shoulders: middle extreme clearly beyond two matching ones
  if (H.length >= 3 && L.length >= 2) {
    const [s1, head, s2] = H.slice(-3);
    const necks = L.filter((l) => l.i > s1.i && l.i < s2.i).slice(-2);
    if (necks.length === 2 && wide(s1, s2) && near(s1.price, s2.price)
        && head.price > Math.max(s1.price, s2.price) * (1 + tol)) {
      const ln = patLine(necks[0], necks[1]);
      const neck = ln ? ln.at(i) : Math.min(necks[0].price, necks[1].price);
      if (brokeDown(d, i, neck)) {
        const r = out("hs", "SHORT", neck, s2.price + 0.25*a, head.price - neck,
          ["head at " + round(head.price, px) + " above both shoulders",
           "neckline broken"]);
        if (r) return r;
      }
    }
  }
  if (L.length >= 3 && H.length >= 2) {
    const [s1, head, s2] = L.slice(-3);
    const necks = H.filter((h) => h.i > s1.i && h.i < s2.i).slice(-2);
    if (necks.length === 2 && wide(s1, s2) && near(s1.price, s2.price)
        && head.price < Math.min(s1.price, s2.price) * (1 - tol)) {
      const ln = patLine(necks[0], necks[1]);
      const neck = ln ? ln.at(i) : Math.max(necks[0].price, necks[1].price);
      if (brokeUp(d, i, neck)) {
        const r = out("ihs", "LONG", neck, s2.price - 0.25*a, neck - head.price,
          ["head at " + round(head.price, px) + " below both shoulders",
           "neckline broken"]);
        if (r) return r;
      }
    }
  }

  // ---- two trendlines: wedges, triangles, rectangles
  if (H.length >= 2 && L.length >= 2) {
    const hA = H[H.length-2], hB = H[H.length-1];
    const lA = L[L.length-2], lB = L[L.length-1];
    const upper = patLine(hA, hB), lower = patLine(lA, lB);
    if (upper && lower) {
      const uNow = upper.at(i), lNow = lower.at(i);
      const span = Math.max(hB.i, lB.i) - Math.min(hA.i, lA.i);
      // Slope as a fraction of price across the whole shape, so "flat" means
      // the same thing on a $0.02 coin as on a $60,000 one.
      const uSlope = upper.m * span / px, lSlope = lower.m * span / px;
      const wA = Math.abs(upper.at(Math.min(hA.i, lA.i)) - lower.at(Math.min(hA.i, lA.i)));
      const wB = Math.abs(uNow - lNow);
      const converging = wB < wA * 0.75 && wB > 0;
      if (span < CFG.patMinSpan) return null;
      const uFlat = Math.abs(uSlope) < flat, lFlat = Math.abs(lSlope) < flat;
      const height = wA;
      const why2 = (t) => [t, "measured from the widest part of the shape"];

      if (converging && uSlope < -flat && lSlope < -flat && brokeUp(d, i, uNow))
        { const r = out("fwedge","LONG",uNow, Math.min(lB.price,lNow) - 0.25*a, height,
            why2("both edges sloping down and closing in")); if (r) return r; }
      if (converging && uSlope > flat && lSlope > flat && brokeDown(d, i, lNow))
        { const r = out("rwedge","SHORT",lNow, Math.max(hB.price,uNow) + 0.25*a, height,
            why2("both edges sloping up and closing in")); if (r) return r; }
      if (uFlat && lSlope > flat && brokeUp(d, i, uNow))
        { const r = out("atri","LONG",uNow, Math.min(lB.price,lNow) - 0.25*a, height,
            why2("flat highs, rising lows")); if (r) return r; }
      if (lFlat && uSlope < -flat && brokeDown(d, i, lNow))
        { const r = out("dtri","SHORT",lNow, Math.max(hB.price,uNow) + 0.25*a, height,
            why2("flat lows, falling highs")); if (r) return r; }
      if (converging && uSlope < -flat && lSlope > flat) {
        if (brokeUp(d, i, uNow))
          { const r = out("stri","LONG",uNow, lNow - 0.25*a, height,
              why2("range squeezing from both sides")); if (r) return r; }
        if (brokeDown(d, i, lNow))
          { const r = out("stri","SHORT",lNow, uNow + 0.25*a, height,
              why2("range squeezing from both sides")); if (r) return r; }
      }
      if (uFlat && lFlat) {
        if (brokeUp(d, i, uNow))
          { const r = out("rect","LONG",uNow, lNow - 0.25*a, height,
              why2("range broken to the upside")); if (r) return r; }
        if (brokeDown(d, i, lNow))
          { const r = out("rect","SHORT",lNow, uNow + 0.25*a, height,
              why2("range broken to the downside")); if (r) return r; }
      }
    }
  }

  // ---- flags and pennants: a hard move, a shallow pause, then the move again
  {
    const cons = CFG.patFlagPause, imp = CFG.patFlagRun;
    const s = i - cons - imp, m = i - cons;
    if (s >= 1) {
      let runLo = Infinity, runHi = -Infinity, poleLo = Infinity, poleHi = -Infinity;
      for (let k = s; k <= m; k++) {
        poleLo = Math.min(poleLo, d.c[k].l); poleHi = Math.max(poleHi, d.c[k].h);
      }
      // The consolidation stops at the bar *before* this one. Including the
      // current bar would mean the price had to break a high it was itself
      // setting, so a flag could never fire.
      for (let k = m; k < i; k++) {
        runLo = Math.min(runLo, d.c[k].l); runHi = Math.max(runHi, d.c[k].h);
      }
      const pole = poleHi - poleLo, pause = runHi - runLo;
      const up = d.close[m] > d.close[s], strong = pole >= CFG.patFlagAtr * a;
      // The pause has to be a pause. A "flag" as tall as its own pole is just
      // a range, and calling it a flag would be the app flattering the chart.
      const shallow = pause > 0 && pause < pole * 0.55;
      if (strong && shallow) {
        const tight = pause < pole * 0.3;               // pennant, not flag
        if (up && brokeUp(d, i, runHi)) {
          const r = out(tight ? "bpen" : "bflag", "LONG", runHi, runLo - 0.25*a, pole,
            ["a " + Math.round(pole / a) + "×ATR run up, then a tight pause",
             "broke out of the pause the same way"]);
          if (r) return r;
        }
        if (!up && brokeDown(d, i, runLo)) {
          const r = out(tight ? "spen" : "sflag", "SHORT", runLo, runHi + 0.25*a, pole,
            ["a " + Math.round(pole / a) + "×ATR run down, then a tight pause",
             "broke out of the pause the same way"]);
          if (r) return r;
        }
      }
    }
  }

  // ---- cup and handle: a rounded base between two matching rims, then a
  //      small pullback, then through the rim
  {
    const W = CFG.patCupBars;
    if (i - W >= 1) {
      let lowI = i - W, lowV = Infinity, rim = -Infinity;
      for (let k = i - W; k <= i; k++) {
        if (d.c[k].l < lowV) { lowV = d.c[k].l; lowI = k; }
      }
      const leftEnd = i - W + Math.floor(W * 0.25);
      const rightStart = i - Math.floor(W * 0.25);
      let leftRim = -Infinity, rightRim = -Infinity;
      for (let k = i - W; k <= leftEnd; k++) leftRim = Math.max(leftRim, d.c[k].h);
      for (let k = rightStart; k <= i; k++) rightRim = Math.max(rightRim, d.c[k].h);
      rim = Math.min(leftRim, rightRim);
      const middle = lowI > i - W + W*0.25 && lowI < i - W*0.2;   // low in the bowl
      const depth = rim - lowV;
      if (middle && near(leftRim, rightRim) && depth > 0 && brokeUp(d, i, rim)) {
        // the handle: the dip after the right rim must be shallow
        let handle = Infinity;
        for (let k = rightStart; k <= i; k++) handle = Math.min(handle, d.c[k].l);
        if (rim - handle < depth * 0.5) {
          const r = out("cup", "LONG", rim, handle - 0.25*a, depth,
            ["rounded base with matching rims", "shallow handle, then through the rim"]);
          if (r) return r;
        }
      }
    }
  }

  return null;
}

/* Walk the candles and record every pattern break, in order. */
function patScan(d) {
  const out = [], c = d.c;
  const all = pivots(c, CFG.patPivot);
  if (all.length < 4 || c.length < 220) return out;
  let p = 0, last = -999;
  for (let i = 210; i < c.length - 1; i++) {
    while (p < all.length && all[p].conf <= i) p++;
    if (i - last < CFG.patCooldown) continue;
    const hi = [], lo = [];
    for (let k = p - 1; k >= 0; k--) {
      if (i - all[k].i > CFG.patMaxAge) break;
      (all[k].type === "H" ? hi : lo).unshift(all[k]);
      if (hi.length >= 4 && lo.length >= 4) break;
    }
    if (hi.length < 2 || lo.length < 2) continue;
    const hit = patAt(d, i, hi, lo);
    if (hit) { out.push(hit); last = i; }
  }
  return out;
}

function patSignal(sym, d, hit) {
  // Targets are measured in the pattern's own height — the classic projection
  // — not in ATR. A shape that promises a 3% move should not be sold with a
  // 12% target just because the coin happens to be volatile today.
  const sig = buildSignal(sym, d, hit.idx, hit.side, PAT_NAMES[hit.kind],
    hit.why, hit.stop, hit.height, CFG.patTargets);
  if (sig) { sig.pattern = hit.kind; sig.patLevel = round(hit.level, sig.entry); }
  return sig;
}

/* =========================================================================
   FOUR MORE STRATEGIES, one shape.

   Each returns a plain list of entries — bar index, side, and optionally its
   own stop. Everything after that (sizing, targets, tracking) is shared, so a
   new strategy is a scan function and nothing else. The four here are the
   standard crypto reads that were missing: breakout, RSI, mean reversion and
   momentum.

   Every one of them is gated on ADX, because the same rule is right or wrong
   depending on whether the market is trending. A breakout in a flat market is
   a fakeout; a fade in a strong trend is standing in front of it. Which side
   of that line you are on is the single most useful thing ADX tells you, and
   it is why the same indicator appears in all four with different signs.
   ========================================================================= */

/* Breakout — Donchian channel. Close above the highest high of N bars is a
   long; below the lowest low is a short. The stop is the other side of the
   channel where that is close enough to be sane, ATR otherwise. */
function brkScan(d) {
  const out = [], c = d.c, n = CFG.brkLen;
  if (c.length < 220) return out;
  for (let i = 210; i < c.length - 1; i++) {
    if (!(d.adx[i] >= CFG.brkMinAdx)) continue;
    let hh = -Infinity, ll = Infinity;
    for (let k = i - n; k < i; k++) { hh = Math.max(hh, c[k].h); ll = Math.min(ll, c[k].l); }
    const px = d.close[i], prev = d.close[i-1], a = d.atr[i];
    if (!(a > 0)) continue;
    if (px > hh && prev <= hh) {
      const stop = (px - ll) < 3.5 * a ? ll : px - CFG.brkAtrStop * a;
      out.push({ idx: i, side: "LONG", stop, tag: "Breakout " + n,
        why: [`closed above the ${n}-bar high`, `ADX ${Math.round(d.adx[i])} — trending`,
              "stop under the channel"] });
    } else if (px < ll && prev >= ll) {
      const stop = (hh - px) < 3.5 * a ? hh : px + CFG.brkAtrStop * a;
      out.push({ idx: i, side: "SHORT", stop, tag: "Breakdown " + n,
        why: [`closed below the ${n}-bar low`, `ADX ${Math.round(d.adx[i])} — trending`,
              "stop above the channel"] });
    }
  }
  return out;
}

/* RSI — the signal is leaving the extreme, not being in it. An oversold coin
   can stay oversold for a week; the turn is the tradable part. */
function rsiScan(d) {
  const out = [], r = d.rsi;
  if (d.c.length < 220) return out;
  for (let i = 210; i < d.c.length - 1; i++) {
    const up = r[i-1] <= CFG.rsiLow && r[i] > CFG.rsiLow;
    const dn = r[i-1] >= CFG.rsiHigh && r[i] < CFG.rsiHigh;
    if (!up && !dn) continue;
    const side = up ? "LONG" : "SHORT";
    if (CFG.rsiWithTrend) {
      const bull = d.ef[i] > d.em[i];
      if ((side === "LONG") !== bull) continue;
    }
    out.push({ idx: i, side, stop: null,
      tag: "RSI " + (up ? "up out of " + CFG.rsiLow : "down out of " + CFG.rsiHigh),
      why: [`RSI(${CFG.rsiLen}) crossed back ${up ? "above " + CFG.rsiLow
                                                : "below " + CFG.rsiHigh}`,
            `RSI now ${Math.round(r[i])}`,
            CFG.rsiWithTrend ? "and the EMA stack agrees" : "trend filter off"] });
  }
  return out;
}

/* Mean reversion — a z-score fade. Only in a quiet market: ADX has to be low,
   because fading a strong trend is the fastest way to lose money politely. */
function mrScan(d) {
  const out = [], n = CFG.mrLen, close = d.close;
  if (close.length < 220) return out;
  for (let i = 210; i < close.length - 1; i++) {
    if (!(d.adx[i] <= CFG.mrMaxAdx)) continue;
    let sum = 0;
    for (let k = i - n; k < i; k++) sum += close[k];
    const mean = sum / n;
    let v = 0;
    for (let k = i - n; k < i; k++) v += (close[k] - mean) ** 2;
    const sd = Math.sqrt(v / n);
    if (!(sd > 0)) continue;
    const z = (close[i] - mean) / sd, zPrev = (close[i-1] - mean) / sd;
    // stretched, and starting to come back
    if (zPrev < -CFG.mrZ && z > zPrev) {
      out.push({ idx: i, side: "LONG", stop: close[i] - Math.abs(z) * sd * 0.6,
        tag: "Mean reversion −" + CFG.mrZ + "σ",
        why: [`${Math.abs(z).toFixed(1)} standard deviations below the ${n}-bar mean`,
              `ADX ${Math.round(d.adx[i])} — no strong trend to fight`,
              "target is the mean"] });
    } else if (zPrev > CFG.mrZ && z < zPrev) {
      out.push({ idx: i, side: "SHORT", stop: close[i] + Math.abs(z) * sd * 0.6,
        tag: "Mean reversion +" + CFG.mrZ + "σ",
        why: [`${z.toFixed(1)} standard deviations above the ${n}-bar mean`,
              `ADX ${Math.round(d.adx[i])} — no strong trend to fight`,
              "target is the mean"] });
    }
  }
  return out;
}

/* Momentum — a real move over N bars, with the MACD histogram still expanding
   so it is continuing rather than exhausting. */
function momScan(d) {
  const out = [], n = CFG.momLen, close = d.close;
  if (close.length < 220) return out;
  let last = -999;
  for (let i = 210; i < close.length - 1; i++) {
    if (i - last < CFG.cooldownBars) continue;
    if (!(d.adx[i] >= CFG.momMinAdx)) continue;
    const roc = (close[i] - close[i-n]) / close[i-n] * 100;
    const h = d.mhist, expanding = Math.abs(h[i]) > Math.abs(h[i-1]);
    if (roc >= CFG.momPct && h[i] > 0 && expanding) {
      out.push({ idx: i, side: "LONG", stop: null, tag: "Momentum +" + roc.toFixed(1) + "%",
        why: [`+${roc.toFixed(1)}% over ${n} bars`, "MACD histogram positive and growing",
              `ADX ${Math.round(d.adx[i])}`] });
      last = i;
    } else if (roc <= -CFG.momPct && h[i] < 0 && expanding) {
      out.push({ idx: i, side: "SHORT", stop: null, tag: "Momentum " + roc.toFixed(1) + "%",
        why: [`${roc.toFixed(1)}% over ${n} bars`, "MACD histogram negative and growing",
              `ADX ${Math.round(d.adx[i])}`] });
      last = i;
    }
  }
  return out;
}

/* One dispatch for all four, so adding the fifth is a scan function and a
   line in this table rather than an edit in six places. */
const SIMPLE_STRATS = { brk: brkScan, rsi: rsiScan, mr: mrScan, mom: momScan };

function simpleSignals(sym, d, hit) {
  return buildSignal(sym, d, hit.idx, hit.side, hit.tag, hit.why, hit.stop);
}

/* Strategy 2: Open/Close Cross.
   The chosen MA is applied to the open series and the close series on a higher
   timeframe (base x multiplier). Close MA crossing above the open MA is a long,
   crossing below is a short. Port of JustUncleL's OCC R5.1. */
/* =========================================================================
   UT BOT  —  port of the v4 script (originally HPotter's ATR trailing stop).

     nLoss = key × ATR(period)
     the stop ratchets: it only ever moves in the direction of the trade
     buy  = close crosses above the stop
     sell = close crosses below the stop

   The stop the script draws is used as the trade's stop too, which is the
   point of it — the exit is the indicator, not a separate ATR guess.
   ========================================================================= */
function utStops(d) {
  const n = d.c.length;
  const a = atr(d.c, CFG.utAtrLen);
  const stop = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    const src = d.close[i];
    const prev = i ? stop[i - 1] : 0;              // Pine: nz(stop[1], 0)
    const prevSrc = i ? d.close[i - 1] : src;
    const nLoss = CFG.utKey * a[i];
    if (src > prev && prevSrc > prev) stop[i] = Math.max(prev, src - nLoss);
    else if (src < prev && prevSrc < prev) stop[i] = Math.min(prev, src + nLoss);
    else if (src > prev) stop[i] = src - nLoss;
    else stop[i] = src + nLoss;
  }
  return stop;
}

function utCrosses(d) {
  const stop = utStops(d);
  const out = [];
  for (let i = 1; i < d.c.length; i++) {
    const c = d.close[i], p = d.close[i - 1];
    if (p <= stop[i - 1] && c > stop[i]) out.push({ idx: i, side: "LONG", stop: stop[i] });
    else if (p >= stop[i - 1] && c < stop[i]) out.push({ idx: i, side: "SHORT", stop: stop[i] });
  }
  return { crosses: out, stop };
}

/* =========================================================================
   TARGET TREND [BigBeluga]  —  port of the v5 indicator.

     band  = SMA(ATR(200), 200) × 0.8
     upper = SMA(high, length) + band      lower = SMA(low, length) − band
     trend turns up when close crosses above upper, down when it crosses
     below lower. The opposite band trails as the stop.
     Targets sit at 5, 10 and 15 × band from entry (the script's three).

   Two extra rungs at 20 and 25 × band are added so the card still shows the
   usual five; the first three are exactly the script's.
   ========================================================================= */
function ttSeries(d) {
  const n = d.c.length;
  const band = sma(atr(d.c, 200), 200).map((x) => x * 0.8);
  const hi = sma(d.c.map((x) => x.h), CFG.ttLen);
  const lo = sma(d.c.map((x) => x.l), CFG.ttLen);
  const upper = hi.map((x, i) => x + band[i]);
  const lower = lo.map((x, i) => x - band[i]);

  const trend = new Array(n).fill(null);
  let t = null;
  for (let i = 1; i < n; i++) {
    const c = d.close[i], p = d.close[i - 1];
    if (isFinite(upper[i]) && isFinite(upper[i - 1]) && p <= upper[i - 1] && c > upper[i]) {
      t = true;
    } else if (isFinite(lower[i]) && isFinite(lower[i - 1]) && p >= lower[i - 1] && c < lower[i]) {
      t = false;
    }
    trend[i] = t;
  }
  return { trend, upper, lower, band };
}

function ttFlips(d) {
  const s = ttSeries(d);
  const out = [];
  for (let i = 1; i < d.c.length; i++) {
    if (s.trend[i] === null || s.trend[i] === s.trend[i - 1]) continue;
    out.push({
      idx: i,
      side: s.trend[i] ? "LONG" : "SHORT",
      stop: s.trend[i] ? s.lower[i] : s.upper[i],
      band: s.band[i],
    });
  }
  return { flips: out, ...s };
}

/** Multiples the script uses, plus two extensions to fill the five rungs. */
const TT_MULTS = [5, 10, 15, 20, 25];

function ttSignal(sym, d, flip) {
  if (!isFinite(flip.band) || flip.band <= 0) return null;
  const why = [
    `Target Trend(${CFG.ttLen}) flipped ${flip.side === "LONG" ? "up" : "down"}`,
    flip.side === "LONG" ? "close crossed above SMA(high) + band"
                         : "close crossed below SMA(low) − band",
    "stop rides the opposite band",
  ];
  const mults = TT_MULTS.map((m) => m + CFG.ttTarget * (TT_MULTS.indexOf(m) + 1));
  return buildSignal(sym, d, flip.idx, flip.side, `TT ${CFG.ttLen}`, why,
                     flip.stop, flip.band, mults);
}


/* =========================================================================
   AGREEMENT — how many independent readings back a signal's direction.

   Four voters, each cheap to compute and each looking at the market a
   different way:

     trend   EMA21 > EMA50 > EMA200 (or the reverse)
     cross   the Open/Close Cross pair, above or below
     stop    price above or below the UT Bot trailing stop
     band    Target Trend's up or down state

   A signal carries the count that agreed with it at its own candle, so the
   number on a card is what was true when it fired, not what is true now.

   This raises precision and lowers count. It cannot make a signal certain —
   all four voters read the same past prices, and they are wrong together
   more often than their independence suggests.
   ========================================================================= */

function voteArrays(d, ltf) {
  const n = d.c.length;
  const trend = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    if (d.ef[i] > d.em[i] && d.em[i] > d.es[i]) trend[i] = 1;
    else if (d.ef[i] < d.em[i] && d.em[i] < d.es[i]) trend[i] = -1;
  }

  const cross = new Array(n).fill(0);
  const s = occSeries(ltf);
  if (s) {
    let k = 0;
    for (let i = 0; i < n; i++) {
      while (k + 1 < s.agg.length && s.agg[k + 1].endIdx <= i) k++;
      const cm = s.closeMa[k], om = s.openMa[k];
      if (isFinite(cm) && isFinite(om) && s.agg[k].endIdx <= i) {
        cross[i] = cm > om ? 1 : cm < om ? -1 : 0;
      }
    }
  }

  const st = utStops(d);
  const stop = d.close.map((c, i) => (c > st[i] ? 1 : c < st[i] ? -1 : 0));

  const tt = ttSeries(d).trend;
  const band = tt.map((t) => (t === true ? 1 : t === false ? -1 : 0));

  return { trend, cross, stop, band };
}

const VOTERS = ["trend", "cross", "stop", "band"];

function agreementAt(votes, i, side) {
  const want = side === "LONG" ? 1 : -1;
  const names = [];
  let n = 0;
  for (const v of VOTERS) {
    if (votes[v] && votes[v][i] === want) { n++; names.push(v); }
  }
  return { n, of: VOTERS.length, names };
}

/* =========================================================================
   AUTO-PILOT — pick the strategy per pair, from that pair's own history.

   Different coins behave differently: a trailing stop suits one that trends,
   a support/resistance read suits one that ranges. Rather than force one
   choice on all of them, this replays every strategy on each pair, scores
   them on candles held back from the choice, and lets each pair use whatever
   actually worked on it.

   It is 5× the work of a normal scan, so the choice is cached per pair and
   only refreshed when you ask for it.
   ========================================================================= */

/* How much per-coin deciding one scan is allowed to do. */
const AUTO = { ttl: 6 * 3600 * 1000, perScan: 6, left: 0, decided: 0, waiting: 0 };

const AUTOPICK = new Map();          // symbol -> {strat, score, at}
const AUTO_STRATS = ["confluence", "occ", "ut", "tt", "sr", "pat",
                     "brk", "rsi", "mr", "mom"];
const STRAT_SHORT = {confluence:"Confluence", occ:"Open/Close", sr:"S&R",
                     ut:"UT Bot", tt:"Target Trend", pat:"Patterns",
                     brk:"Breakout", rsi:"RSI", mr:"Mean rev", mom:"Momentum"};

/** R-multiple expectancy of a set of tracked signals. */
function autoScore(sigs, fromIdx) {
  const closed = sigs.filter((s) => s.closedAt && s.idx >= fromIdx);
  if (closed.length < 4) return { n: closed.length, exp: -Infinity };
  let sum = 0;
  for (const s of closed) {
    const risk = Math.abs(s.entry - s.initialStop) / s.entry * 100;
    const move = s.roi / (s.leverage || 1);
    if (risk > 0) sum += move / risk;
  }
  return { n: closed.length, exp: sum / closed.length };
}

/** Generate every strategy's signals for one pair and keep the best. */
function autoPick(sym, d, h, ltf) {
  const keep = CFG.strategy;
  const hold = Math.floor(d.c.length * 0.65);      // judged on the last 35%
  let best = null;
  try {
    for (const strat of AUTO_STRATS) {
      CFG.strategy = strat;
      let sigs = [];
      try { sigs = autoSignals(sym, d, h, ltf); } catch (e) { continue; }
      const sc = autoScore(sigs, hold);
      // When nothing cleared the minimum trade count, prefer the strategy that
      // at least produced the most - otherwise the first one silently wins.
      const better = !best || sc.exp > best.exp ||
        (!isFinite(sc.exp) && !isFinite(best.exp) && sc.n > best.n);
      if (better) best = { strat, exp: sc.exp, n: sc.n, sigs };
    }
  } finally { CFG.strategy = keep; }
  return best;
}

/** The signal set for whatever CFG.strategy currently is. */
function autoSignals(sym, d, h, ltf) {
  const out = [];
  if (CFG.strategy === "occ") {
    const crosses = occCrosses(ltf);
    for (let k = 0; k < crosses.length; k++) {
      const x = crosses[k];
      if (x.idx < 210 || x.idx > d.c.length - 2) continue;
      const sig = buildSignal(sym, d, x.idx, x.side,
        `${CFG.occMaType}${CFG.occMaLen}×${CFG.occMult}`, ["close/open cross"]);
      if (!sig) continue;
      if (CFG.requireHtf && htfBias(h, d.c[x.idx].t) !== sig.side) continue;
      if (CFG.occExitOnCross && crosses[k + 1]) sig.exitIdx = crosses[k + 1].idx;
      track(sig, d); out.push(sig);
    }
  } else if (CFG.strategy === "ut") {
    for (const x of utCrosses(d).crosses) {
