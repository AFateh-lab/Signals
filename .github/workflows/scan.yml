name: Scan for signals

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan
        env:
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/scan.py

      - name: Publish the results
        run: |
          set -e
          git config user.name  "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"

          cp signals.json   /tmp/run-signals.json
          cp bot/state.json /tmp/run-state.json

          for i in 1 2 3; do
            rm -rf /tmp/pub
            git fetch origin data || true
            if ! git rev-parse --verify --quiet origin/data >/dev/null; then
              echo "creating the data branch"
              git push origin "HEAD:refs/heads/data"
              git fetch origin data
            fi
            git worktree add -f /tmp/pub -B data origin/data

            cp /tmp/pub/signals.json   signals.json   2>/dev/null || true
            cp /tmp/pub/bot/state.json bot/state.json 2>/dev/null || true
            python bot/scan.py --merge /tmp/run-signals.json /tmp/run-state.json
            cp signals.json   /tmp/pub/signals.json
            cp bot/state.json /tmp/pub/bot/state.json

            git -C /tmp/pub add signals.json bot/state.json
            if git -C /tmp/pub diff --staged --quiet; then
              echo "no change"; git worktree remove -f /tmp/pub; exit 0
            fi
            git -C /tmp/pub commit -m "signals $(date -u +%H:%M) UTC"
            if git -C /tmp/pub push origin data; then
              git worktree remove -f /tmp/pub; exit 0
            fi
            echo "someone pushed first — folding their results in and retrying"
            git worktree remove -f /tmp/pub || true
            sleep 3
          done
          echo "could not push after three tries" && exit 1
